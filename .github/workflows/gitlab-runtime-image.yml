name: GitLab Runtime Image

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Additional image tag to publish
        required: false
        default: v1
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: gitlab-runtime-image-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/777genius/review-router-gitlab-runtime

jobs:
  publish:
    name: Publish GitLab runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}

    steps:
      - name: Resolve target commit
        id: target
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::manual runtime image publish is allowed only from main"
            exit 1
          fi

          SHA="${WORKFLOW_RUN_SHA:-$GITHUB_SHA}"
          SHORT_SHA="${SHA:0:12}"
          TAG="${DISPATCH_TAG:-v1}"

          if [[ ! "$TAG" =~ ^[A-Za-z0-9_.-]{1,128}$ ]]; then
            echo "::error::image tag contains unsupported characters"
            exit 1
          fi

          {
            echo "sha=$SHA"
            echo "short_sha=$SHORT_SHA"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/gitlab/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
            IMAGE_REVISION=${{ steps.target.outputs.sha }}
            IMAGE_VERSION=${{ steps.target.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.target.outputs.sha }}
            org.opencontainers.image.version=${{ steps.target.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.target.outputs.tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.target.outputs.short_sha }}

      - name: Verify anonymous pull
        shell: bash
        run: |
          set -euo pipefail

          docker logout ghcr.io >/dev/null 2>&1 || true

          if ! docker pull "${IMAGE_NAME}:${{ steps.target.outputs.tag }}"; then
            echo "::error::published GHCR image is not anonymously pullable. Make the package public in GitHub Packages settings before using it from GitLab CI."
            exit 1
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "Published GitLab runtime image"
            echo ""
            echo "- Stable tag: \`${{ env.IMAGE_NAME }}:${{ steps.target.outputs.tag }}\`"
            echo "- Commit tag: \`${{ env.IMAGE_NAME }}:sha-${{ steps.target.outputs.short_sha }}\`"
            echo "- Source SHA: \`${{ steps.target.outputs.sha }}\`"
            echo "- Anonymous pull verified"
          } >> "$GITHUB_STEP_SUMMARY"
