name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci_test?schema=public
  AUTH_SECRET: ci-auth-secret-not-used-for-production
  AUTH_TRUST_HOST: "true"
  GITHUB_WEBHOOK_SECRET: ci-webhook-secret-not-used-for-production
  REVIEW_ROUTER_WEB_URL: http://localhost:3000
  REVIEW_ROUTER_API_URL: http://localhost:4000
  REVIEW_ROUTER_PUBLIC_API_URL: http://localhost:4000
  REVIEW_ROUTER_ACTION_REF: 777genius/review-router@v1
  REVIEW_ROUTER_ACTION_VERSION: v1
  REVIEW_ROUTER_DEFAULT_MODEL: gpt-5.5
  REVIEW_ROUTER_DEFAULT_EFFORT: medium
  REVIEW_ROUTER_ENABLE_DASHBOARD_MUTATIONS: "0"
  REVIEW_ROUTER_ENABLE_WORKFLOW_PROVISIONING: "0"
  REVIEW_ROUTER_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
  REVIEW_ROUTER_PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE review_router_ci'
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE review_router_ci_test'

      - name: Apply dev database migrations
        run: pnpm db:migrate:deploy

      - name: Apply test database migrations
        run: DATABASE_URL="$TEST_DATABASE_URL" pnpm --dir packages/platform/db db:migrate:deploy

      - name: Migration smoke test
        run: pnpm db:migrate:smoke

      - name: Backup restore smoke test
        run: pnpm db:restore:smoke

      - name: Local readiness
        env:
          REVIEW_ROUTER_SKIP_ENV_FILE: "1"
          REVIEW_ROUTER_ENABLE_WORKFLOW_PROVISIONING: "1"
          GITHUB_APP_CLIENT_ID: ci-client-id
          GITHUB_APP_CLIENT_SECRET: ci-client-secret
          GITHUB_APP_ID: "1"
          GITHUB_APP_SLUG: reviewrouter-ci
          GITHUB_APP_PRIVATE_KEY: |
            -----BEGIN PRIVATE KEY-----
            ci-placeholder
            -----END PRIVATE KEY-----
        run: pnpm local:check

      - name: Unit tests
        run: pnpm test

      - name: Architecture boundaries
        run: pnpm architecture:check

      - name: GitHub/OIDC contract tests
        run: pnpm spike:test

      - name: Webhook lifecycle DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:webhook-lifecycle:e2e

      - name: Outbox maintenance DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:outbox-maintenance:e2e

      - name: Rate limit DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:rate-limit:e2e

      - name: Distributed lock DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:distributed-lock:e2e

      - name: Review config DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:review-config:e2e

      - name: Action control plane DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:action:e2e

      - name: Support diagnostics DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:support-diagnostics:e2e

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Compiled runtime smoke
        run: pnpm runtime:smoke

      - name: Web page smoke
        run: pnpm web:smoke

      - name: Hosted readiness smoke
        run: pnpm hosted:check:smoke

      - name: Public beta readiness smoke
        run: pnpm public-beta:check:smoke

      - name: Whitespace check
        run: git diff --check

      - name: Codex auth seeding shell syntax
        run: bash -n scripts/seed-codex-auth.sh

      - name: Local bootstrap shell syntax
        run: bash -n scripts/bootstrap-local.sh

      - name: Public beta readiness shell syntax
        run: bash -n scripts/check-public-beta-readiness.sh

      - name: GitHub App readiness script syntax
        run: node --check scripts/check-github-app-readiness.mjs
