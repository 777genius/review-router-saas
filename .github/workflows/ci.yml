name: CI

on:
  workflow_dispatch:
    inputs:
      release_authority_pg17_contract:
        description: Run the dedicated Release Authority PG17 contract
        required: false
        type: boolean
        default: false
      private_pg16_to_pg17_rehearsal:
        description: Run the full disposable private PG16 to PG17 rehearsal
        required: false
        type: boolean
        default: false
      activation_catalog_policy_capture:
        description: Capture two byte-identical policies from disposable PG16 to PG17 rehearsals
        required: false
        type: boolean
        default: false
      activation_catalog_policy_capture_base_sha:
        description: Exact reviewed base commit for the activation catalog Git range
        required: false
        type: string
        default: ""
      release_authority_contract_baseline_sha:
        description: Previous protected main SHA used as the immutable migration baseline
        required: false
        type: string
        default: ""
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci_test?schema=public
  REVIEW_ROUTER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci_test?schema=public
  AUTH_SECRET: ci-auth-secret-not-used-for-production
  AUTH_TRUST_HOST: "true"
  GITHUB_WEBHOOK_SECRET: ci-webhook-secret-not-used-for-production
  REVIEW_ROUTER_WEB_URL: http://localhost:3000
  REVIEW_ROUTER_PUBLIC_WEB_URL: https://web.reviewrouter.test
  REVIEW_ROUTER_API_URL: http://localhost:4000
  REVIEW_ROUTER_PUBLIC_API_URL: https://api.reviewrouter.test
  REVIEW_ROUTER_ACTION_REF: 777genius/review-router@main
  REVIEW_ROUTER_ACTION_VERSION: main
  REVIEW_ROUTER_CODEX_ROTATING_ACTION_REF: 777genius/review-router@b951d16fb0a96cc377578a6f69be7112badd8e33
  REVIEW_ROUTER_CODEX_ROTATING_ALLOWED_ACTION_REFS: ""
  # Public test fixture only; production uses one secret-manager value shared
  # by every database writer.
  REVIEW_ROUTER_DATABASE_RECOVERY_WITNESS: ci_database_recovery_witness_not_for_production_000000000000
  REVIEW_ROUTER_DEFAULT_MODEL: gpt-5.5
  REVIEW_ROUTER_DEFAULT_EFFORT: xhigh
  REVIEW_ROUTER_PAIRED_ACTION_REF: b951d16fb0a96cc377578a6f69be7112badd8e33
  REVIEW_ROUTER_HOSTED_POOL_ACTION_TAG: v1.0.156
  REVIEW_ROUTER_HOSTED_POOL_ACTION_SHA: b951d16fb0a96cc377578a6f69be7112badd8e33
  REVIEW_ROUTER_HOSTED_POOL_ACTION_DIST_SHA256: a223c40ed5953428bf1b12c83308d783f3357bc369130b8245310a3aad5aebc5
  REVIEW_ROUTER_ENABLE_DASHBOARD_MUTATIONS: "0"
  REVIEW_ROUTER_ENABLE_WORKFLOW_PROVISIONING: "0"
  REVIEW_ROUTER_PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
  REVIEW_ROUTER_PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore

jobs:
  release-authority-pg17-contract:
    name: Dedicated Release Authority PG17 contract
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.release_authority_pg17_contract) }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      REVIEW_ROUTER_PG17_ADVERSARIAL_IMAGE: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin exact contract baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BASE_SHA: ${{ github.event.before || '' }}
          DISPATCH_BASE_SHA: ${{ inputs.release_authority_contract_baseline_sha || '' }}
        run: |
          case "$EVENT_NAME" in
            pull_request) baseline_sha=$PR_BASE_SHA ;;
            push) baseline_sha=$PUSH_BASE_SHA ;;
            workflow_dispatch) baseline_sha=$DISPATCH_BASE_SHA ;;
            *) exit 1 ;;
          esac
          printf '%s' "$baseline_sha" | grep -Eq '^[a-f0-9]{40}$'
          test "$baseline_sha" != 0000000000000000000000000000000000000000
          test "$baseline_sha" != "$HEAD_SHA"
          git cat-file -e "$baseline_sha^{commit}"
          git merge-base --is-ancestor "$baseline_sha" "$HEAD_SHA"
          echo "REVIEW_ROUTER_RELEASE_AUTHORITY_CONTRACT_BASELINE_REF=$baseline_sha" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: node scripts/install-private-dependencies.mjs --frozen-lockfile
      - name: Generate Prisma client
        env:
          REVIEW_ROUTER_REQUIRE_OFFLINE_PRISMA: "1"
        run: node scripts/generate-prisma-offline.mjs
      - name: Pin PostgreSQL 17 contract image
        run: docker pull "$REVIEW_ROUTER_PG17_ADVERSARIAL_IMAGE"
      - name: Run dedicated authority contract
        run: bash packages/platform/release-authority-db/test-contract.sh
      - name: Run digest-pinned activation adversarial proof
        if: ${{ github.event_name != 'pull_request' }}
        env:
          REVIEW_ROUTER_REQUIRE_PG17_ADVERSARIAL: "1"
        run: pnpm exec vitest run scripts/private-pg17-activation-adversarial.test.ts
      - name: Create exact release-gate evidence
        if: ${{ github.event_name != 'pull_request' }}
        id: evidence
        run: node scripts/release-gate-evidence.mjs write release-authority-pg17-contract >> "$GITHUB_OUTPUT"
      - name: Upload exact release-gate evidence
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: release-gate-evidence.json
          if-no-files-found: error
          retention-days: 14

  private-pg16-to-pg17-rehearsal:
    name: Full private PG16 to PG17 rehearsal
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.private_pg16_to_pg17_rehearsal) || (github.event_name == 'workflow_dispatch' && inputs.activation_catalog_policy_capture) }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: node scripts/install-private-dependencies.mjs --frozen-lockfile
      - name: Generate Prisma client
        env:
          REVIEW_ROUTER_REQUIRE_OFFLINE_PRISMA: "1"
        run: node scripts/generate-prisma-offline.mjs
      - name: Run full disposable cutover rehearsal with pinned images
        if: ${{ !inputs.activation_catalog_policy_capture }}
        env:
          REVIEW_ROUTER_PRIVATE_PG17_REHEARSAL: "1"
          REVIEW_ROUTER_REHEARSAL_PG16_IMAGE: postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
          REVIEW_ROUTER_REHEARSAL_PG17_IMAGE: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        run: pnpm release-rollout:rehearsal
      - name: Capture two reproducible activation catalog policies
        if: ${{ inputs.activation_catalog_policy_capture }}
        env:
          REVIEW_ROUTER_PRIVATE_PG17_REHEARSAL: "1"
          REVIEW_ROUTER_PRIVATE_PG17_ACTIVATION_CATALOG_POLICY_CAPTURE_ONLY: "1"
          REQUESTED_CAPTURE_BASE_COMMIT: ${{ inputs.activation_catalog_policy_capture_base_sha }}
          REVIEW_ROUTER_REHEARSAL_PG16_IMAGE: postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
          REVIEW_ROUTER_REHEARSAL_PG17_IMAGE: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        run: |
          audited_head="$(git rev-parse HEAD)"
          if [[ -z "$REQUESTED_CAPTURE_BASE_COMMIT" ]]; then
            echo "activation catalog capture requires an explicit reviewed base commit" >&2
            exit 1
          fi
          git cat-file -e "$REQUESTED_CAPTURE_BASE_COMMIT^{commit}"
          capture_base="$(git merge-base "$REQUESTED_CAPTURE_BASE_COMMIT" "$audited_head")"
          if [[ "$capture_base" != "$REQUESTED_CAPTURE_BASE_COMMIT" || "$capture_base" == "$audited_head" ]]; then
            echo "activation catalog capture Git review range is invalid" >&2
            exit 1
          fi
          export REVIEW_ROUTER_ACTIVATION_CATALOG_CAPTURE_BASE_COMMIT="$capture_base"
          export REVIEW_ROUTER_ACTIVATION_CATALOG_AUDITED_HEAD="$audited_head"
          export REVIEW_ROUTER_ACTIVATION_CATALOG_DISPOSABLE_DATABASE_IDENTITY="rr-disposable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-a"
          node --import tsx scripts/rehearse-private-pg17-rollout.mjs > activation-catalog-policy-candidate-1.json
          export REVIEW_ROUTER_ACTIVATION_CATALOG_DISPOSABLE_DATABASE_IDENTITY="rr-disposable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-b"
          node --import tsx scripts/rehearse-private-pg17-rollout.mjs > activation-catalog-policy-candidate-2.json
          node scripts/lib/activation-catalog-capture-pair.mjs \
            activation-catalog-policy-candidate-1.json \
            activation-catalog-policy-candidate-2.json
          sha256sum activation-catalog-policy-candidate-1.json activation-catalog-policy-candidate-2.json
      - name: Upload activation catalog policy captures
        if: ${{ inputs.activation_catalog_policy_capture }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: activation-catalog-policy-${{ github.sha }}-${{ github.run_attempt }}
          path: activation-catalog-policy-candidate-*.json
          if-no-files-found: error
          retention-days: 14
      - name: Create exact release-gate evidence
        if: ${{ !inputs.activation_catalog_policy_capture }}
        id: evidence
        run: node scripts/release-gate-evidence.mjs write private-pg16-to-pg17-rehearsal >> "$GITHUB_OUTPUT"
      - name: Upload exact release-gate evidence
        if: ${{ !inputs.activation_catalog_policy_capture }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: release-gate-evidence.json
          if-no-files-found: error
          retention-days: 14

  codex-rotating-installer-portability:
    name: Rotating installer lock (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      - name: Assert native lock implementation
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            PATH=/usr/bin:/bin:/usr/sbin:/sbin command -v flock
          else
            PATH=/usr/bin:/bin:/usr/sbin:/sbin command -v shlock
            if PATH=/usr/bin:/bin:/usr/sbin:/sbin command -v flock >/dev/null 2>&1; then
              echo "macOS system path must exercise native shlock, not flock"
              exit 1
            fi
          fi

      - name: Install dependencies
        run: node scripts/install-private-dependencies.mjs --frozen-lockfile

      - name: Prove live rejection, release, and stale recovery
        env:
          REVIEW_ROUTER_TEST_NATIVE_LOCK_PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: pnpm codex-rotating:installer-portability

  self-hosted-e2e:
    name: Self-hosted E2E
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      - name: Run disposable self-hosted E2E
        run: pnpm self-hosted:e2e

  hosted-runtime-image:
    name: Hosted runtime OCI build
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build hosted runtime image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/render-runtime/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false

  managed-migration-pg17:
    name: Managed migration PG17 (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - lane: prerequisites
            utc: ""
          - lane: recovery-utc-false
            utc: "false"
          - lane: recovery-utc-true
            utc: "true"
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/review_router_ci_test?schema=public
      REVIEW_ROUTER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/review_router_ci_test?schema=public
      REVIEW_ROUTER_REQUIRE_HANDOFF_PG17: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Install dependencies
        run: node scripts/install-private-dependencies.mjs --frozen-lockfile

      - name: Generate Prisma client
        env:
          REVIEW_ROUTER_REQUIRE_OFFLINE_PRISMA: "1"
        run: node scripts/generate-prisma-offline.mjs

      - name: Review Action v2 protocol drift check
        run: pnpm protocol:check

      - name: Pull pinned offline fixture image
        run: docker pull postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317

      - name: Managed migration PG17 prerequisites (no skips)
        if: ${{ matrix.lane == 'prerequisites' }}
        run: pnpm exec vitest run scripts/render-schema-handoff-repair.pg17.real.test.ts scripts/render-retained-exclusion.pg17.real.test.ts scripts/render-managed-workflow-cutover.pg17.real.test.ts scripts/render-historical89-inplace.pg17.real.test.ts scripts/render-historical89-custody.pg17.real.test.ts scripts/render-historical89-prerequisite-capture.pg17.real.test.ts scripts/render-historical89-already96.pg17.real.test.ts

      - name: Historical89 PG17 recovery (no skips)
        if: ${{ matrix.lane != 'prerequisites' }}
        env:
          REVIEW_ROUTER_HANDOFF_RECOVERY_DATABASE_UTC: ${{ matrix.utc }}
        run: pnpm exec vitest run scripts/render-historical89-recovery.pg17.real.test.ts

  quality-gates:
    name: Quality Gates
    needs: [quality, managed-migration-pg17]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce every quality and PG17 lane
        shell: bash
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          MANAGED_PG17_RESULT: ${{ needs.managed-migration-pg17.result }}
        run: |
          set -euo pipefail
          test "$QUALITY_RESULT" = success
          test "$MANAGED_PG17_RESULT" = success

  quality:
    name: Quality Checks
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 75
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/review_router_ci_test?schema=public
      REVIEW_ROUTER_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/review_router_ci_test?schema=public

    services:
      postgres:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres-app-test:
        image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17

      - name: Install dependencies
        run: node scripts/install-private-dependencies.mjs --frozen-lockfile

      # Source/bundle parity needs installed dependencies, not app builds or databases.
      - name: Codex rotating action artifact smoke
        run: pnpm action:artifact:check:smoke

      - name: Generate Prisma client
        env:
          REVIEW_ROUTER_REQUIRE_OFFLINE_PRISMA: "1"
        run: node scripts/generate-prisma-offline.mjs

      - name: Review Action v2 protocol drift check
        run: pnpm protocol:check

      # Later offline role/schema fixtures also require this image on this runner.
      - name: Pull pinned offline fixture image
        run: docker pull postgres:17.10@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317

      - name: Review Action v2 handoff contract tests
        run: pnpm protocol:handoff:test

      - name: Disposable release-role catalog PG17 fixture (no skips)
        env:
          REVIEW_ROUTER_REQUIRE_SELF_HOSTED_ROLE_FIXTURE_PG17: "1"
        run: pnpm exec vitest run scripts/self-hosted-e2e/disposable-release-role-fixture.pg17.real.test.ts

      - name: Create CI databases
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE review_router_ci'
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE review_router_provider_scope_ci_test'
          psql -h 127.0.0.1 -p 5433 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE review_router_ci_test'

      # Application suites need the stock, role-free schema. Keep it in its own
      # cluster because the combined rehearsal provisions release roles globally.
      - name: Apply ordinary test database migrations
        env:
          PGPASSWORD: postgres
        run: |
          test "$(psql -XqAt -h 127.0.0.1 -p 5433 -U postgres -d review_router_ci_test -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_catalog.pg_roles WHERE rolname IN ('reviewrouter_release_migration', 'reviewrouter_release_schema_owner')")" = 0
          DATABASE_URL="$TEST_DATABASE_URL" pnpm --dir packages/platform/db db:migrate:deploy
          test "$(psql -XqAt -h 127.0.0.1 -p 5433 -U postgres -d review_router_ci_test -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_catalog.pg_proc p JOIN pg_catalog.pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname='codex_oauth_provider_identity_guard' AND pg_catalog.pg_get_userbyid(p.proowner)='postgres'")" = 1
          test "$(psql -XqAt -h 127.0.0.1 -p 5433 -U postgres -d review_router_ci_test -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_catalog.pg_roles WHERE rolname='reviewrouter_release_migration'")" = 0

      - name: Rotating Codex PostgreSQL 17 combined migration rehearsal (no skips)
        env:
          REVIEW_ROUTER_MIGRATION_REHEARSAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_ci
        run: pnpm codex-rotating:migration-rehearsal

      - name: Rotating Codex observation-backed rollout verifier
        run: pnpm codex-rotating:rollout-proof

      - name: Apply dev database migrations
        run: pnpm db:migrate:deploy

      # Dev reached 110 without a release pair. The provider fixture shares its
      # cluster; reject its dirty catalog before creating the restricted login.
      - name: Complete disposable CI release-role catalog
        env:
          PGPASSWORD: postgres
        run: |
          set -o pipefail
          for database in review_router_provider_scope_ci_test; do
            node --input-type=module -e 'import { disposableFreshDatabasePreflightSql as sql } from "./scripts/self-hosted-e2e/disposable-release-role-fixture.mjs"; process.stdout.write(sql)' |
              psql -XqAt -h 127.0.0.1 -U postgres -d "$database" -v ON_ERROR_STOP=1
          done
          node scripts/self-hosted-e2e/disposable-release-role-fixture.mjs provision-ci

      - name: SDK authority and outbox PostgreSQL contracts (zero skips)
        env:
          REVIEW_ROUTER_REQUIRE_SDK_GROWTH_SCHEMA_PG17: "1"
        run: |
          export SDK_GROWTH_TEST_DATABASE_URL="$REVIEW_ROUTER_TEST_DATABASE_URL"
          test -n "$SDK_GROWTH_TEST_DATABASE_URL"
          test -n "$REVIEW_ROUTER_TEST_DATABASE_URL"
          results="$RUNNER_TEMP/sdk-growth-authority-outbox-results.json"
          if ! pnpm exec vitest run \
            packages/features/sdk-growth-authority/src/tests/prisma-receipt-repository.test.ts \
            packages/features/sdk-growth-authority/src/tests/prisma-current-authority.test.ts \
            packages/features/sdk-growth-authority/src/tests/prisma-lane-a.test.ts \
            packages/features/sdk-growth-authority/src/tests/prisma-approval-ledger.real.test.ts \
            packages/features/outbox/src/tests/prisma-outbox-event-repository-real.test.ts \
            apps/api/src/sdk-growth-verifier-custody.pg.test.ts \
            apps/api/src/sdk-growth-verifier-producer-identity.pg.test.ts \
            scripts/sdk-growth-application-schema-checkpoint.test.ts \
            --reporter=json --outputFile="$results"; then
            RESULTS_PATH="$results" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(readFileSync(process.env.RESULTS_PATH, "utf8"));
          for (const suite of report.testResults ?? []) {
            if (suite.status === "failed" && !suite.assertionResults?.length) {
              console.error(JSON.stringify({
                suite: suite.name,
                failure: (suite.message ?? "suite failed before assertions")
                  .replaceAll(/postgres(?:ql)?:\/\/[^@\s]+@/giu, "postgresql://[redacted]@")
                  .slice(0, 2000),
              }));
            }
            for (const assertion of suite.assertionResults ?? []) {
              if (assertion.status !== "failed") continue;
              console.error(JSON.stringify({
                suite: suite.name,
                test: assertion.fullName,
                failure: (assertion.failureMessages?.[0] ?? "unknown failure")
                  .replaceAll(/postgres(?:ql)?:\/\/[^@\s]+@/giu, "postgresql://[redacted]@")
                  .slice(0, 2000),
              }));
            }
          }
          NODE
            exit 1
          fi
          RESULTS_PATH="$results" EXPECTED_HEAD="$GITHUB_SHA" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const report = JSON.parse(readFileSync(process.env.RESULTS_PATH, "utf8"));
          const expected = [
            "packages/features/sdk-growth-authority/src/tests/prisma-receipt-repository.test.ts",
            "packages/features/sdk-growth-authority/src/tests/prisma-current-authority.test.ts",
            "packages/features/sdk-growth-authority/src/tests/prisma-lane-a.test.ts",
            "packages/features/sdk-growth-authority/src/tests/prisma-approval-ledger.real.test.ts",
            "packages/features/outbox/src/tests/prisma-outbox-event-repository-real.test.ts",
            "apps/api/src/sdk-growth-verifier-custody.pg.test.ts",
            "apps/api/src/sdk-growth-verifier-producer-identity.pg.test.ts",
            "scripts/sdk-growth-application-schema-checkpoint.test.ts",
          ];
          const suites = report.testResults.map((suite) =>
            suite.name.replaceAll("\\", "/"),
          );
          for (const file of expected) {
            if (!suites.some((suite) => suite.endsWith(file))) {
              throw new Error(`required PostgreSQL suite missing: ${file}`);
            }
          }
          if (
            report.numTotalTests <= 0 ||
            report.numFailedTests !== 0 ||
            report.numPendingTests !== 0 ||
            report.numTodoTests !== 0 ||
            report.numPassedTests !== report.numTotalTests
          ) {
            throw new Error("PostgreSQL contract result counts are not zero-skip");
          }
          console.log(JSON.stringify({
            head: process.env.EXPECTED_HEAD,
            command: "pnpm exec vitest run <seven required PostgreSQL suites> --reporter=json",
            executed: report.numTotalTests,
            passed: report.numPassedTests,
            skipped: report.numPendingTests + report.numTodoTests,
          }));
          NODE

      - name: Build provider-scope migration catalogs
        run: |
          PROVIDER_SCOPE_FIXTURE_ROOT="$RUNNER_TEMP/provider-scope-migrations"
          export PROVIDER_SCOPE_FIXTURE_ROOT
          mkdir -p "$PROVIDER_SCOPE_FIXTURE_ROOT"
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { writeDisposableMigrationCatalog } from "./scripts/self-hosted-e2e/disposable-release-role-fixture.mjs";

          const root = process.env.PROVIDER_SCOPE_FIXTURE_ROOT;
          for (const [phase, label] of [["pre79", "pre-000079"], ["through79", "through-000079"]]) {
            const config = writeDisposableMigrationCatalog(phase, root);
            writeFileSync(join(root, `${label}.config-path`), `${config}\n`);
          }
          NODE

      - name: Apply provider-scope database before 000079
        env:
          REVIEW_ROUTER_PROVIDER_SCOPE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_provider_scope_ci_test?schema=public
        run: |
          DATABASE_URL="$REVIEW_ROUTER_PROVIDER_SCOPE_TEST_DATABASE_URL" \
            pnpm --filter @reviewrouter/platform-db exec prisma migrate deploy \
            --config "$(cat "$RUNNER_TEMP/provider-scope-migrations/pre-000079.config-path")"

      - name: Apply provider-scope database through 000079 and hand off relations
        env:
          PGPASSWORD: postgres
          REVIEW_ROUTER_PROVIDER_SCOPE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_provider_scope_ci_test?schema=public
        run: |
          set -o pipefail
          DATABASE_URL="$REVIEW_ROUTER_PROVIDER_SCOPE_TEST_DATABASE_URL" \
            pnpm --filter @reviewrouter/platform-db exec prisma migrate deploy \
            --config "$(cat "$RUNNER_TEMP/provider-scope-migrations/through-000079.config-path")"
          node --input-type=module -e 'import { disposableProvider79HandoffSql as sql } from "./scripts/self-hosted-e2e/disposable-release-role-fixture.mjs"; process.stdout.write(sql)' |
            psql -XqAt -h 127.0.0.1 -U postgres -d review_router_provider_scope_ci_test -v ON_ERROR_STOP=1
          node --input-type=module -e 'import { disposableProvider79VerificationSql as sql } from "./scripts/self-hosted-e2e/disposable-release-role-fixture.mjs"; process.stdout.write(sql)' |
            psql -XqAt -h 127.0.0.1 -U postgres -d review_router_provider_scope_ci_test -v ON_ERROR_STOP=1

      - name: Provider-scope real database tests
        env:
          REVIEW_ROUTER_PROVIDER_SCOPE_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/review_router_provider_scope_ci_test?schema=public
        run: |
          pnpm exec vitest run \
            packages/features/review-executions/src/tests/prisma-review-execution-store-real.test.ts

      - name: Tear down provider-scope database
        if: always()
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          SELECT pg_terminate_backend(pid)
          FROM pg_stat_activity
          WHERE datname = 'review_router_provider_scope_ci_test'
            AND pid <> pg_backend_pid();
          DROP DATABASE IF EXISTS review_router_provider_scope_ci_test;
          SQL

      - name: Bind hosted certification input bytes
        env:
          REVIEW_ROUTER_HOSTED_CERTIFICATION_WORKSPACE_SNAPSHOT: ${{ runner.temp }}/hosted-certification-workspace.json
        run: pnpm hosted-pool:certification-evidence --capture-workspace

      - name: Hosted pool security certification
        id: hosted_verify
        continue-on-error: true
        env:
          REVIEW_ROUTER_HOSTED_CERTIFICATION_OUTPUT: ${{ runner.temp }}/hosted-certification
        run: |
          mkdir -p "$REVIEW_ROUTER_HOSTED_CERTIFICATION_OUTPUT/logs"
          if ! pnpm hosted-pool:verify >"$REVIEW_ROUTER_HOSTED_CERTIFICATION_OUTPUT/logs/verify.log" 2>&1; then
            echo "::error::Hosted pool verification failed; retained log is withheld pending sensitive-data scan"
            exit 1
          fi

      - name: Hosted pool production and one-shot canary contracts
        run: pnpm hosted-pool:production-contract

      - name: Hosted pool populated migration rehearsal
        id: hosted_migration
        continue-on-error: true
        env:
          REVIEW_ROUTER_HOSTED_CERTIFICATION_OUTPUT: ${{ runner.temp }}/hosted-certification
        run: |
          if ! pnpm hosted-pool:migration-rehearsal >"$REVIEW_ROUTER_HOSTED_CERTIFICATION_OUTPUT/logs/migration.log" 2>&1; then
            echo "::error::Hosted pool migration rehearsal failed; retained log is withheld pending sensitive-data scan"
            exit 1
          fi

      - name: Hosted pool PostgreSQL 17 E2E
        id: hosted_postgres
        continue-on-error: true
        env:
          REVIEW_ROUTER_HOSTED_CERTIFICATION_OUTPUT: ${{ runner.temp }}/hosted-certification
          REVIEW_ROUTER_HOSTED_CERTIFICATION_DB_EXPORT: ${{ runner.temp }}/hosted-certification/logs/relay-effect-rows.jsonl
        run: |
          if ! pnpm hosted-pool:e2e:postgres >"$REVIEW_ROUTER_HOSTED_CERTIFICATION_OUTPUT/logs/postgres-e2e.log" 2>&1; then
            echo "::error::Hosted pool PostgreSQL E2E failed; retained log is withheld pending sensitive-data scan"
            exit 1
          fi

      - name: Seal SHA-bound hosted certification evidence
        if: always()
        env:
          REVIEW_ROUTER_HOSTED_CERTIFICATION_SENTINELS_JSON: '["rr-hosted-certification-sentinel","rr-hosted-auth-body-sentinel"]'
          REVIEW_ROUTER_HOSTED_VERIFY_STATUS: ${{ steps.hosted_verify.outcome }}
          REVIEW_ROUTER_HOSTED_MIGRATION_STATUS: ${{ steps.hosted_migration.outcome }}
          REVIEW_ROUTER_HOSTED_POSTGRES_STATUS: ${{ steps.hosted_postgres.outcome }}
          REVIEW_ROUTER_HOSTED_CERTIFICATION_WORKSPACE_SNAPSHOT: ${{ runner.temp }}/hosted-certification-workspace.json
          REVIEW_ROUTER_HOSTED_CERTIFICATION_OUTPUT: ${{ runner.temp }}/hosted-certification
        run: pnpm hosted-pool:certification-evidence

      - name: Upload hosted certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-security-certification-${{ github.sha }}
          path: ${{ runner.temp }}/hosted-certification/hosted-certification-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce hosted certification gates
        if: always()
        env:
          HOSTED_VERIFY_STATUS: ${{ steps.hosted_verify.outcome }}
          HOSTED_MIGRATION_STATUS: ${{ steps.hosted_migration.outcome }}
          HOSTED_POSTGRES_STATUS: ${{ steps.hosted_postgres.outcome }}
        run: |
          test "$HOSTED_VERIFY_STATUS" = success
          test "$HOSTED_MIGRATION_STATUS" = success
          test "$HOSTED_POSTGRES_STATUS" = success

      - name: Rotating Codex dropped-response loopback proof
        run: pnpm codex-rotating:loopback-proof

      - name: Migration smoke test
        run: pnpm db:migrate:smoke

      - name: Review v2 migration rehearsal
        run: pnpm review-v2:migration-rehearsal

      - name: Review investigation migration rehearsal
        run: pnpm review-investigation:migration-rehearsal

      - name: Review Action v2 production DB E2E
        run: pnpm review-v2:e2e

      - name: Review investigation production DB E2E
        run: pnpm review-investigation:e2e

      - name: Validate paired Action release pin
        run: |
          if ! printf '%s' "$REVIEW_ROUTER_PAIRED_ACTION_REF" | grep -Eq '^[a-f0-9]{40}$'; then
            echo "REVIEW_ROUTER_PAIRED_ACTION_REF must be replaced with the immutable Action commit SHA"
            exit 1
          fi

      - name: Checkout pinned paired Review Action
        uses: actions/checkout@v6
        with:
          repository: 777genius/review-router
          ref: ${{ env.REVIEW_ROUTER_PAIRED_ACTION_REF }}
          path: .paired/review-router-action
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Verify paired Review Action checkout
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git -C .paired/review-router-action rev-parse HEAD)"
          if [[ "$actual_sha" != "$REVIEW_ROUTER_PAIRED_ACTION_REF" ]]; then
            echo "::error::paired Action checkout resolved to $actual_sha, expected $REVIEW_ROUTER_PAIRED_ACTION_REF"
            exit 1
          fi

      - name: Verify hosted pool Action tag, commit, and bundle tuple
        env:
          REVIEW_ROUTER_CODEX_ROTATING_ACTION_REF: 777genius/review-router@${{ env.REVIEW_ROUTER_HOSTED_POOL_ACTION_SHA }}
          REVIEW_ROUTER_HOSTED_POOL_ACTION_CHECKOUT: ${{ github.workspace }}/.paired/review-router-action
        run: pnpm hosted-pool:action-release:verify

      - name: Install paired Review Action dependencies
        run: npm ci --ignore-scripts --prefix .paired/review-router-action

      - name: Paired Review Action lifecycle producer and fixture tests
        run: |
          npm --prefix .paired/review-router-action test -- \
            --runInBand \
            --runTestsByPath \
            __tests__/unit/github/comment-fingerprint-golden.test.ts \
            __tests__/e2e/production-entrypoint-artifact.e2e.test.ts \
            __tests__/unit/review-orchestration/github-review-state-adapter.test.ts \
            __tests__/unit/review-projection/build-current-review-projection.test.ts \
            __tests__/unit/review-projection/review-lifecycle-observation.test.ts

      - name: Paired Review Action projection parser contract
        env:
          REVIEW_ROUTER_PAIRED_ACTION_REPO: ${{ github.workspace }}/.paired/review-router-action
        run: |
          pnpm exec vitest run \
            apps/api/src/review-action-v2-production-composition-snapshot-publication.test.ts \
            packages/features/review-publishing/src/v2/tests/review-finding-marker.test.ts \
            --testNamePattern "accepts the paired Action golden projection target|matches the paired Action golden corpus"

      - name: Paired Review Action to SaaS investigation E2E
        env:
          REVIEW_ROUTER_ACTION_SOURCE_DIR: ${{ github.workspace }}/.paired/review-router-action
        run: pnpm review-investigation:paired-e2e

      - name: Record paired Action release gate
        shell: bash
        run: |
          set -euo pipefail
          action_sha="$(git -C .paired/review-router-action rev-parse HEAD)"
          node - "$RUNNER_TEMP/paired-action-release-gate.json" "$GITHUB_SHA" "$action_sha" <<'NODE'
          const { writeFileSync } = require("node:fs");
          const [outputPath, saasSha, actionSha] = process.argv.slice(2);
          writeFileSync(
            outputPath,
            `${JSON.stringify({
              schemaVersion: "reviewrouter.paired-action-release-gate.v1",
              saasSha,
              actionSha,
            })}\n`,
            "utf8",
          );
          NODE

      - name: Upload paired Action release gate
        uses: actions/upload-artifact@v4
        with:
          name: paired-action-release-gate
          path: ${{ runner.temp }}/paired-action-release-gate.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove paired Review Action checkout
        if: always()
        run: |
          node -e "require('node:fs').rmSync('.paired', { recursive: true, force: true })"

      - name: Backup restore smoke test
        run: pnpm db:restore:smoke

      - name: Local readiness
        env:
          REVIEW_ROUTER_SKIP_ENV_FILE: "1"
          REVIEW_ROUTER_ENABLE_WORKFLOW_PROVISIONING: "1"
          GITHUB_APP_CLIENT_ID: ci-client-id
          GITHUB_APP_CLIENT_SECRET: ci-client-secret
          GITHUB_APP_ID: "1"
          GITHUB_APP_SLUG: reviewrouter-ci
        run: |
          # Construct the deliberately invalid CI fixture, never an App credential.
          export GITHUB_APP_PRIVATE_KEY="$(printf '%s %s\n%s\n%s %s\n' \
            '-----BEGIN' 'PRIVATE KEY-----' 'ci-placeholder' '-----END' 'PRIVATE KEY-----')"
          pnpm local:check

      - name: Unit tests
        run: pnpm test

      - name: EF v3 SDK growth contract
        run: pnpm --filter @reviewrouter/features-sdk-growth-authority test:ef-v3

      - name: Checkout exact EF v3 candidate source
        uses: actions/checkout@v6
        with:
          repository: agent-teams-ai/engineering-foundation
          ref: 243b99abbd89216fca55a1ffe4a1b83a1b7efc2e
          path: .candidate/engineering-foundation
          persist-credentials: false
          fetch-depth: 1

      - name: Qualify source-built EF v3 request decoder fixture
        shell: bash
        run: |
          set -euo pipefail
          candidate=.candidate/engineering-foundation
          test "$(git -C "$candidate" rev-parse HEAD)" = 243b99abbd89216fca55a1ffe4a1b83a1b7efc2e
          source_tree="$(git -C "$candidate" rev-parse 'HEAD^{tree}')"
          printf '%s' "$source_tree" | grep -Eq '^[a-f0-9]{40}$'
          (cd "$candidate" && corepack pnpm install --frozen-lockfile)
          (cd "$candidate" && corepack pnpm --filter @agent-teams/engineering-foundation build)
          archive="$RUNNER_TEMP/agent-teams-engineering-foundation-1.6.1.tgz"
          (cd "$candidate/packages/engineering-foundation" && corepack pnpm pack --pack-destination "$RUNNER_TEMP") >"$RUNNER_TEMP/ef-candidate-pack.log"
          test -s "$archive"
          npm install --prefix "$RUNNER_TEMP/ef-candidate-installed" --ignore-scripts --no-audit --no-fund "$archive"
          EF_V3_CANDIDATE_PACKAGE_ROOT="$RUNNER_TEMP/ef-candidate-installed/node_modules/@agent-teams/engineering-foundation" \
          EF_V3_CANDIDATE_ARCHIVE="$archive" \
          EF_V3_CANDIDATE_SOURCE_COMMIT=243b99abbd89216fca55a1ffe4a1b83a1b7efc2e \
          EF_V3_CANDIDATE_SOURCE_TREE="$source_tree" \
          SDK_GROWTH_TEST_DATABASE_URL="$REVIEW_ROUTER_TEST_DATABASE_URL" \
            node --import tsx --test packages/features/sdk-growth-authority/src/tests/v3-approved-manifest.ef-candidate.node-test.mjs

      - name: Remove EF candidate checkout
        if: always()
        run: |
          node -e "require('node:fs').rmSync('.candidate', { recursive: true, force: true })"

      - name: Architecture boundaries
        run: pnpm architecture:check

      - name: GitHub/OIDC contract tests
        run: pnpm spike:test

      - name: Webhook lifecycle DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:webhook-lifecycle:e2e

      - name: Outbox maintenance DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:outbox-maintenance:e2e

      - name: Rate limit DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:rate-limit:e2e

      - name: Distributed lock DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:distributed-lock:e2e

      - name: Review config DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:review-config:e2e

      - name: Action control plane DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:action:e2e

      - name: Support diagnostics DB E2E
        run: node scripts/run-with-env.mjs pnpm spike:support-diagnostics:e2e

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Codex secret-write boundary
        run: pnpm codex-rotating:secret-write-boundary

      - name: Compiled runtime smoke
        run: pnpm runtime:smoke

      - name: Web page smoke
        run: pnpm web:smoke

      - name: Hosted readiness smoke
        run: pnpm hosted:check:smoke

      - name: Public beta readiness smoke
        run: pnpm public-beta:check:smoke

      - name: Whitespace check
        run: git diff --check

      - name: Codex auth seeding shell syntax
        run: bash -n scripts/seed-codex-auth.sh

      - name: Local bootstrap shell syntax
        run: bash -n scripts/bootstrap-local.sh

      - name: Public beta readiness shell syntax
        run: bash -n scripts/check-public-beta-readiness.sh

      - name: GitHub App readiness script syntax
        run: node --check scripts/check-github-app-readiness.mjs
