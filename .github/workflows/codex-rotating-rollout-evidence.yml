name: Codex rotating trusted rollout evidence

on:
  workflow_dispatch:
    inputs:
      rollout_id:
        description: Exact rollout ID created by the migration workflow
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: codex-rotating-rollout-evidence-production
  cancel-in-progress: false

jobs:
  trusted-rollout-evidence:
    name: trusted-rollout-evidence
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      REVIEW_ROUTER_RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
      REVIEW_ROUTER_RENDER_DATABASE_ID: ${{ vars.REVIEW_ROUTER_RENDER_DATABASE_ID }}
      REVIEW_ROUTER_RENDER_MIGRATION_SERVICE_ID: ${{ vars.REVIEW_ROUTER_RENDER_MIGRATION_SERVICE_ID }}
      REVIEW_ROUTER_RENDER_MIGRATION_DEPLOY_ID: ${{ vars.REVIEW_ROUTER_RENDER_MIGRATION_DEPLOY_ID }}
      REVIEW_ROUTER_RENDER_MIGRATION_JOB_ID: ${{ vars.REVIEW_ROUTER_RENDER_MIGRATION_JOB_ID }}
      REVIEW_ROUTER_RENDER_WITNESS_SERVICE_ID: ${{ vars.REVIEW_ROUTER_RENDER_WITNESS_SERVICE_ID }}
      REVIEW_ROUTER_RENDER_API_SERVICE_ID: ${{ vars.REVIEW_ROUTER_RENDER_API_SERVICE_ID }}
      REVIEW_ROUTER_RENDER_API_DEPLOY_ID: ${{ vars.REVIEW_ROUTER_RENDER_API_DEPLOY_ID }}
      REVIEW_ROUTER_RENDER_WEB_SERVICE_ID: ${{ vars.REVIEW_ROUTER_RENDER_WEB_SERVICE_ID }}
      REVIEW_ROUTER_RENDER_WEB_DEPLOY_ID: ${{ vars.REVIEW_ROUTER_RENDER_WEB_DEPLOY_ID }}
      REVIEW_ROUTER_RENDER_WORKER_SERVICE_ID: ${{ vars.REVIEW_ROUTER_RENDER_WORKER_SERVICE_ID }}
      REVIEW_ROUTER_RENDER_WORKER_DEPLOY_ID: ${{ vars.REVIEW_ROUTER_RENDER_WORKER_DEPLOY_ID }}
      REVIEW_ROUTER_PRODUCTION_WRITER_OBSERVATION: "1"
      REVIEW_ROUTER_PRODUCTION_WRITER_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL }}
      REVIEW_ROUTER_RUNTIME_OBSERVATION_ORIGIN: ${{ vars.REVIEW_ROUTER_RUNTIME_OBSERVATION_ORIGIN }}
      REVIEW_ROUTER_RUNTIME_OBSERVATION_TOKEN: ${{ secrets.REVIEW_ROUTER_RUNTIME_OBSERVATION_TOKEN }}
      REVIEW_ROUTER_ROLLOUT_EVIDENCE_ROLLOUT_ID: ${{ inputs.rollout_id }}
      REVIEW_ROUTER_ROLLOUT_EVIDENCE_ARTIFACT_NAME: reviewrouter-trusted-rollout-${{ github.run_id }}-${{ github.run_attempt }}
      REVIEW_ROUTER_ROLLOUT_ARTIFACT_DIRECTORY: trusted-rollout
      REVIEW_ROUTER_GITHUB_REPOSITORY: ${{ github.repository }}
      REVIEW_ROUTER_GITHUB_WORKFLOW: reviewrouter-codex.yml
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout immutable evidence producer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install exact package manager
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve immutable GitHub job identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p trusted-rollout/artifacts
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/jobs?filter=latest&per_page=100`, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" } });
          if (!response.ok) throw new Error(`job lookup failed: ${response.status}`);
          const value = await response.json();
          const matches = value.jobs.filter((job) => job.name === "trusted-rollout-evidence" && job.run_attempt === Number(process.env.GITHUB_RUN_ATTEMPT));
          if (value.total_count !== value.jobs.length || matches.length !== 1) throw new Error("job identity is not unique and complete");
          appendFileSync(process.env.GITHUB_ENV, `REVIEW_ROUTER_GITHUB_JOB_ID=${matches[0].id}\n`);
          NODE

      - name: Capture authenticated Render observations
        env:
          REVIEW_ROUTER_PROVENANCE_PROVIDER: render
        run: node scripts/codex-rotating-provider-provenance.mjs > trusted-rollout/artifacts/deployments.json

      - name: Capture production writer and drain
        env:
          REVIEW_ROUTER_RENDER_OBSERVATION_PATH: trusted-rollout/artifacts/deployments.json
        run: node scripts/capture-codex-rotating-production-writer.mjs > trusted-rollout/artifacts/database.json

      - name: Capture exact GitHub workflow drain
        env:
          REVIEW_ROUTER_PROVENANCE_PROVIDER: github
        run: node scripts/codex-rotating-provider-provenance.mjs > trusted-rollout/artifacts/workflow-runs.json

      - name: Capture authenticated compatibility, event, and canary observations
        run: |
          REVIEW_ROUTER_RUNTIME_OBSERVATION_KIND=compatibility node scripts/capture-codex-rotating-runtime-observation.mjs > trusted-rollout/artifacts/compatibility-probe.json
          REVIEW_ROUTER_RUNTIME_OBSERVATION_KIND=events node scripts/capture-codex-rotating-runtime-observation.mjs > trusted-rollout/artifacts/events.json
          REVIEW_ROUTER_RUNTIME_OBSERVATION_KIND=canary node scripts/capture-codex-rotating-runtime-observation.mjs > trusted-rollout/artifacts/canary-runtime.json

      - name: Assemble exact trusted archive manifest
        run: node scripts/assemble-codex-rotating-trusted-rollout.mjs > trusted-rollout/reviewrouter-trusted-rollout-evidence.json

      - name: Verify the assembled rollout structurally before upload
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { inspectCodexRotatingRolloutStructure } from "./scripts/verify-codex-rotating-rollout.mjs";
          const manifest = JSON.parse(readFileSync("trusted-rollout/reviewrouter-trusted-rollout-evidence.json", "utf8"));
          const result = inspectCodexRotatingRolloutStructure(manifest.rollout, { evidenceDirectory: "trusted-rollout" });
          if (!result.ok) throw new Error(result.failures.join("; "));
          NODE

      - name: Upload immutable trusted rollout artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.REVIEW_ROUTER_ROLLOUT_EVIDENCE_ARTIFACT_NAME }}
          path: trusted-rollout
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
