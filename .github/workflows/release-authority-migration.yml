name: Trusted Release Authority migration

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected main commit containing the migration chain
        required: true
        type: string
      operation:
        description: Fresh database installation or existing database upgrade
        required: true
        type: choice
        options:
          - incremental-upgrade
          - fresh-install

permissions: {}

concurrency:
  group: release-authority-database-mutation-production
  cancel-in-progress: false

jobs:
  trust-bootstrap:
    name: verify-protected-main-for-authority-migration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      trusted_sha: ${{ steps.trust.outputs.trusted_sha }}
    steps:
      - name: Establish immutable migration trust before repository execution
        id: trust
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          // trust-bootstrap-node:start
          const { appendFileSync } = require("node:fs");
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`authority_migration_trust_missing:${name}`);
            return value;
          };
          const fail = (reason) => {
            throw new Error(`authority_migration_trust_rejected:${reason}`);
          };
          const repository = required("GITHUB_REPOSITORY");
          const sha = required("GITHUB_SHA").toLowerCase();
          const expectedSha = required("EXPECTED_SHA").toLowerCase();
          if (required("GITHUB_EVENT_NAME") !== "workflow_dispatch") fail("event");
          if (required("GITHUB_REF") !== "refs/heads/main") fail("workflow_ref");
          if (!/^[a-f0-9]{40}$/.test(sha) || expectedSha !== sha)
            fail("dispatch_sha");
          const response = await fetch(
            `https://api.github.com/repos/${repository}/branches/main`,
            {
              headers: {
                Authorization: `Bearer ${required("GH_TOKEN")}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
              },
            },
          );
          if (!response.ok) fail(`github_api_${response.status}`);
          const branch = await response.json();
          if (branch.protected !== true || branch.commit?.sha?.toLowerCase() !== sha)
            fail("stale_or_unprotected_main");
          appendFileSync(required("GITHUB_OUTPUT"), `trusted_sha=${sha}\n`, "utf8");
          // trust-bootstrap-node:end
          NODE

  verify-release-gate-evidence:
    name: verify-exact-sha-release-gate-evidence
    needs: trust-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout immutable evidence verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ needs.trust-bootstrap.outputs.trusted_sha }}

      - name: Require exact PostgreSQL release-gate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_ROUTER_RELEASE_GATE_SHA: ${{ needs.trust-bootstrap.outputs.trusted_sha }}
        run: node scripts/release-gate-evidence.mjs verify

  trusted-release-authority-migration:
    name: trusted-release-authority-migration
    needs: [trust-bootstrap, verify-release-gate-evidence]
    environment: production-release-authority-migration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout immutable migration source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ needs.trust-bootstrap.outputs.trusted_sha }}

      - name: Install exact package manager and dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile

      - name: Materialize one-use migration credential
        shell: bash
        env:
          REVIEW_ROUTER_RELEASE_AUTHORITY_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_RELEASE_AUTHORITY_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$REVIEW_ROUTER_RELEASE_AUTHORITY_DATABASE_URL"
          credential_file="$RUNNER_TEMP/release-authority-migration-url"
          umask 077
          printf '%s' "$REVIEW_ROUTER_RELEASE_AUTHORITY_DATABASE_URL" > "$credential_file"
          echo "REVIEW_ROUTER_RELEASE_AUTHORITY_MIGRATION_DATABASE_URL_FILE=$credential_file" >> "$GITHUB_ENV"

      - name: Run fresh installation gate
        if: ${{ inputs.operation == 'fresh-install' }}
        run: pnpm release-authority:fresh-install

      - name: Run incremental upgrade gate
        if: ${{ inputs.operation == 'incremental-upgrade' }}
        run: pnpm release-authority:upgrade

      - name: Remove migration credential
        if: ${{ always() }}
        shell: bash
        run: |
          credential_file="$RUNNER_TEMP/release-authority-migration-url"
          if test -f "$credential_file"; then
            shred -u "$credential_file" 2>/dev/null || rm -f "$credential_file"
          fi
