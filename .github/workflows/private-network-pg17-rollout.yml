name: Private-network PostgreSQL 17 release rollout
run-name: private-pg17:${{ inputs.rollout_id }}

on:
  workflow_dispatch:
    inputs:
      rollout_id:
        description: Globally unique non-reusable rollout identifier
        required: true
        type: string
      expected_sha:
        description: Exact protected main commit
        required: true
        type: string
      release_run_id:
        description: Successful release workflow run that attested the image identity
        required: true
        type: string
      release_artifact_id:
        description: Immutable hosted-runtime-image artifact from that release run
        required: true
        type: string
permissions: {}

concurrency:
  group: private-network-pg17-production
  cancel-in-progress: false

env:
  REVIEW_ROUTER_EXPECTED_SHA: ${{ github.sha }}
  REVIEW_ROUTER_ROLLOUT_ID: ${{ inputs.rollout_id }}
  REVIEW_ROUTER_RELEASE_CONTROL_ORG: ${{ vars.REVIEW_ROUTER_RELEASE_CONTROL_ORG }}
  REVIEW_ROUTER_RELEASE_CONTROL_REPOSITORY: ${{ vars.REVIEW_ROUTER_RELEASE_CONTROL_REPOSITORY }}
  REVIEW_ROUTER_RELEASE_CONTROL_WORKFLOW_PATH: .github/workflows/private-network-pg17-rollout.yml
  REVIEW_ROUTER_RUNNER_GROUP_ID: ${{ vars.REVIEW_ROUTER_RUNNER_GROUP_ID }}
  REVIEW_ROUTER_RUNNER_BASE_SERVICE_ID: ${{ vars.REVIEW_ROUTER_RUNNER_BASE_SERVICE_ID }}
  REVIEW_ROUTER_RUNNER_LEDGER_URL: ${{ vars.REVIEW_ROUTER_RELEASE_CONTROL_URL }}
  REVIEW_ROUTER_PROVIDER_AUTHORITY_URL: ${{ vars.REVIEW_ROUTER_RELEASE_CONTROL_URL }}
  REVIEW_ROUTER_RELEASE_WITNESS_URL: ${{ vars.REVIEW_ROUTER_RELEASE_WITNESS_URL }}
  REVIEW_ROUTER_ROLE_WORKFLOW_JOB_NAME: copy-and-role-bootstrap-private
  REVIEW_ROUTER_CUTOVER_WORKFLOW_JOB_NAME: pg17-cutover-private
  REVIEW_ROUTER_SOURCE_RENDER_DATABASE_ID: ${{ vars.REVIEW_ROUTER_SOURCE_RENDER_DATABASE_ID }}
  REVIEW_ROUTER_TARGET_RENDER_DATABASE_ID: ${{ vars.REVIEW_ROUTER_TARGET_RENDER_DATABASE_ID }}
  REVIEW_ROUTER_SOURCE_INTERNAL_HOSTNAME: ${{ vars.REVIEW_ROUTER_SOURCE_INTERNAL_HOSTNAME }}
  REVIEW_ROUTER_TARGET_INTERNAL_HOSTNAME: ${{ vars.REVIEW_ROUTER_TARGET_INTERNAL_HOSTNAME }}
  REVIEW_ROUTER_SOURCE_DATABASE_NAME: ${{ vars.REVIEW_ROUTER_SOURCE_DATABASE_NAME }}
  REVIEW_ROUTER_TARGET_DATABASE_NAME: ${{ vars.REVIEW_ROUTER_TARGET_DATABASE_NAME }}
  REVIEW_ROUTER_SOURCE_DATABASE_SYSTEM_IDENTIFIER: ${{ vars.REVIEW_ROUTER_SOURCE_DATABASE_SYSTEM_IDENTIFIER }}
  REVIEW_ROUTER_TARGET_DATABASE_SYSTEM_IDENTIFIER: ${{ vars.REVIEW_ROUTER_TARGET_DATABASE_SYSTEM_IDENTIFIER }}
  REVIEW_ROUTER_SOURCE_RECOVERY_WITNESS_SHA256: ${{ vars.REVIEW_ROUTER_SOURCE_RECOVERY_WITNESS_SHA256 }}
  REVIEW_ROUTER_TARGET_RECOVERY_WITNESS_SHA256: ${{ vars.REVIEW_ROUTER_TARGET_RECOVERY_WITNESS_SHA256 }}

jobs:
  trust-bootstrap:
    name: verify-protected-main-dispatch-and-release-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      trusted_sha: ${{ steps.trust.outputs.trusted_sha }}
      release_run_id: ${{ steps.trust.outputs.release_run_id }}
      release_artifact_id: ${{ steps.trust.outputs.release_artifact_id }}
    steps:
      - name: Establish immutable rollout trust before repository execution
        id: trust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_ARTIFACT_ID: ${{ inputs.release_artifact_id }}
          REQUIRED_ENVIRONMENTS_JSON: '["production-release-preflight","production-runner-control","production-role-bootstrap","production-runner-ledger-read","production","production-service-switch"]'
          EXPECTED_ORGANIZATION: ${{ vars.REVIEW_ROUTER_RELEASE_CONTROL_ORG }}
          EXPECTED_REPOSITORY: ${{ vars.REVIEW_ROUTER_RELEASE_CONTROL_REPOSITORY }}
        run: |
          set -euo pipefail
          node <<'NODE'
          // trust-bootstrap-node:start
          const { appendFileSync } = require("node:fs");
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`private_pg17_trust_missing:${name}`);
            return value;
          };
          const fail = (reason) => {
            throw new Error(`private_pg17_trust_rejected:${reason}`);
          };
          const repository = required("GITHUB_REPOSITORY");
          const sha = required("GITHUB_SHA").toLowerCase();
          const expectedSha = required("EXPECTED_SHA").toLowerCase();
          const releaseRunId = required("RELEASE_RUN_ID");
          const releaseArtifactId = required("RELEASE_ARTIFACT_ID");
          if (required("GITHUB_EVENT_NAME") !== "workflow_dispatch") fail("event");
          if (required("GITHUB_RUN_ATTEMPT") !== "1") fail("run_attempt");
          if (required("GITHUB_REF") !== "refs/heads/main") fail("workflow_ref");
          if (!/^[a-f0-9]{40}$/.test(sha) || expectedSha !== sha)
            fail("expected_sha");
          if (!/^[1-9][0-9]*$/.test(releaseRunId) || !/^[1-9][0-9]*$/.test(releaseArtifactId))
            fail("release_coordinates");
          if (
            repository !== required("EXPECTED_REPOSITORY") ||
            repository.split("/")[0] !== required("EXPECTED_ORGANIZATION")
          ) fail("control_repository");
          const headers = {
            Authorization: `Bearer ${required("GH_TOKEN")}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const get = async (path) => {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            if (!response.ok) fail(`github_api_${response.status}`);
            return response.json();
          };
          const branch = await get(`/repos/${repository}/branches/main`);
          if (branch.protected !== true || branch.commit?.sha?.toLowerCase() !== sha)
            fail("stale_or_unprotected_main");
          const releaseRun = await get(`/repos/${repository}/actions/runs/${releaseRunId}`);
          if (
            String(releaseRun.id) !== releaseRunId ||
            releaseRun.event !== "workflow_dispatch" ||
            releaseRun.path !== ".github/workflows/release.yml" ||
            releaseRun.head_branch !== "main" ||
            releaseRun.head_sha?.toLowerCase() !== sha ||
            releaseRun.run_attempt !== 1 ||
            releaseRun.conclusion !== "success"
          ) fail("release_run_identity");
          const artifact = await get(`/repos/${repository}/actions/artifacts/${releaseArtifactId}`);
          if (
            String(artifact.id) !== releaseArtifactId ||
            artifact.expired !== false ||
            !artifact.name?.startsWith("hosted-runtime-image-v") ||
            String(artifact.workflow_run?.id) !== releaseRunId ||
            artifact.workflow_run?.head_sha?.toLowerCase() !== sha
          ) fail("release_artifact_identity");
          const environments = JSON.parse(required("REQUIRED_ENVIRONMENTS_JSON"));
          if (
            !Array.isArray(environments) ||
            environments.length < 1 ||
            environments.some((name) => typeof name !== "string" || !name) ||
            new Set(environments).size !== environments.length
          ) fail("environment_inventory");
          for (const environmentName of environments) {
            const environment = await get(
              `/repos/${repository}/environments/${encodeURIComponent(environmentName)}`,
            );
            const rules = environment.protection_rules;
            const reviewers = Array.isArray(rules)
              ? rules.find((rule) => rule?.type === "required_reviewers")
              : undefined;
            const branchPolicy = Array.isArray(rules)
              ? rules.find((rule) => rule?.type === "branch_policy")
              : undefined;
            if (
              !reviewers ||
              !Array.isArray(reviewers.reviewers) ||
              reviewers.reviewers.length < 1 ||
              reviewers.prevent_self_review !== true ||
              !branchPolicy ||
              environment.deployment_branch_policy?.protected_branches !== true
            ) fail(`environment_unprotected:${environmentName}`);
          }
          appendFileSync(required("GITHUB_OUTPUT"), `trusted_sha=${sha}\n`, "utf8");
          appendFileSync(
            required("GITHUB_OUTPUT"),
            `release_run_id=${releaseRunId}\nrelease_artifact_id=${releaseArtifactId}\n`,
            "utf8",
          );
          // trust-bootstrap-node:end
          NODE

  protected-preflight:
    name: protected-release-preflight
    needs: trust-bootstrap
    environment: production-release-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.trust-bootstrap.outputs.trusted_sha }}
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile
      - name: Download exact attested release image identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.trust-bootstrap.outputs.release_artifact_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ needs.trust-bootstrap.outputs.release_run_id }}
          path: release-image
      - name: Verify release image identity and GitHub artifact attestation
        env:
          GITHUB_CONTROL_READ_TOKEN: ${{ github.token }}
          REVIEW_ROUTER_RELEASE_RUN_ID: ${{ needs.trust-bootstrap.outputs.release_run_id }}
          REVIEW_ROUTER_RELEASE_ARTIFACT_ID: ${{ needs.trust-bootstrap.outputs.release_artifact_id }}
          REVIEW_ROUTER_RELEASE_IMAGE_IDENTITY_FILE: release-image/hosted-runtime-image.json
          REVIEW_ROUTER_RELEASE_IMAGE_PROVENANCE_FILE: verified-release-image-provenance.json
        run: node --import tsx scripts/verify-private-pg17-release-image-provenance.ts
      - name: Observe protected environment and exact release identity
        env:
          GITHUB_CONTROL_READ_TOKEN: ${{ github.token }}
          REVIEW_ROUTER_PRIVILEGED_ENVIRONMENTS_JSON: '["production-release-preflight","production-runner-control","production-role-bootstrap","production-runner-ledger-read","production","production-service-switch"]'
          REVIEW_ROUTER_PROTECTED_ENVIRONMENT_PREFLIGHT_FILE: protected-environment-preflight.json
        run: node --import tsx scripts/observe-private-pg17-protected-environment.ts
      - name: Durably claim rollout and receipt observed preflight policy
        env:
          REVIEW_ROUTER_RUNNER_LEDGER_TOKEN: ${{ secrets.REVIEW_ROUTER_RELEASE_CONTROL_TOKEN }}
          REVIEW_ROUTER_PROTECTED_ENVIRONMENT_PREFLIGHT_FILE: protected-environment-preflight.json
          REVIEW_ROUTER_RELEASE_IMAGE_PROVENANCE_FILE: verified-release-image-provenance.json
          REVIEW_ROUTER_INITIAL_ROLLOUT_FILE: initial-rollout.json
        run: node --import tsx scripts/initialize-private-pg17-rollout.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protected-preflight-${{ inputs.rollout_id }}-${{ github.run_id }}-1
          path: |
            protected-environment-preflight.json
            verified-release-image-provenance.json
            initial-rollout.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  freeze-source-writers:
    name: freeze-source-writers
    needs: [trust-bootstrap, protected-preflight]
    environment: production-runner-control
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      observation: ${{ steps.freeze.outputs.observation }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.trust-bootstrap.outputs.trusted_sha }}
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: protected-preflight-${{ inputs.rollout_id }}-${{ github.run_id }}-1
          path: preflight
      - id: freeze
        name: Suspend and re-observe every source writer
        env:
          RENDER_SERVICE_SUSPENSION_API_KEY: ${{ secrets.RENDER_SERVICE_SUSPENSION_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
          REVIEW_ROUTER_SOURCE_WRITER_SERVICE_IDS: ${{ vars.REVIEW_ROUTER_SOURCE_WRITER_SERVICE_IDS }}
          REVIEW_ROUTER_INITIAL_ROLLOUT_FILE: preflight/initial-rollout.json
          REVIEW_ROUTER_RUNNER_LEDGER_TOKEN: ${{ secrets.REVIEW_ROUTER_RELEASE_CONTROL_TOKEN }}
        run: node --import tsx scripts/release-rollout-render-control.ts freeze

  role-bootstrap-private:
    name: copy-and-role-bootstrap-private
    needs: [trust-bootstrap, freeze-source-writers]
    environment: production-role-bootstrap
    runs-on:
      group: ${{ vars.REVIEW_ROUTER_RUNNER_GROUP_NAME }}
      labels: ${{ format('rr-{0}-role-bootstrap', github.run_id) }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.trust-bootstrap.outputs.trusted_sha }}
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: protected-preflight-${{ inputs.rollout_id }}-${{ github.run_id }}-1
          path: preflight
      - name: Copy, bind the restored generation, prove equivalence, and bootstrap roles
        env:
          REVIEW_ROUTER_PROVIDER_AUTHORITY_TOKEN: ${{ secrets.REVIEW_ROUTER_PROVIDER_AUTHORITY_TOKEN }}
          REVIEW_ROUTER_EXPECTED_WORKFLOW_JOB_NAME: copy-and-role-bootstrap-private
          REVIEW_ROUTER_INITIAL_ROLLOUT_FILE: preflight/initial-rollout.json
          REVIEW_ROUTER_FREEZE_OBSERVATION: ${{ needs.freeze-source-writers.outputs.observation }}
          REVIEW_ROUTER_RUNNER_LEDGER_TOKEN: ${{ secrets.REVIEW_ROUTER_RELEASE_CONTROL_TOKEN }}
          RENDER_PROVENANCE_READ_API_KEY: ${{ secrets.RENDER_PROVENANCE_READ_API_KEY }}
          RENDER_SERVICE_SUSPENSION_API_KEY: ${{ secrets.RENDER_SERVICE_SUSPENSION_API_KEY }}
          REVIEW_ROUTER_SOURCE_WRITER_SERVICE_IDS: ${{ vars.REVIEW_ROUTER_SOURCE_WRITER_SERVICE_IDS }}
          REVIEW_ROUTER_SOURCE_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_COMPENSATION_SOURCE_DATABASE_URL }}
          REVIEW_ROUTER_SOURCE_RECONNECT_URLS_JSON: ${{ secrets.REVIEW_ROUTER_SOURCE_RECONNECT_URLS_JSON }}
          REVIEW_ROUTER_SOURCE_PRINCIPAL_POLICY_JSON: ${{ vars.REVIEW_ROUTER_SOURCE_PRINCIPAL_POLICY_JSON }}
          REVIEW_ROUTER_SOURCE_FENCED_PRINCIPAL_POLICY_JSON: ${{ vars.REVIEW_ROUTER_SOURCE_FENCED_PRINCIPAL_POLICY_JSON }}
          REVIEW_ROUTER_TARGET_EQUIVALENCE_PRINCIPAL_POLICY_JSON: ${{ vars.REVIEW_ROUTER_TARGET_EQUIVALENCE_PRINCIPAL_POLICY_JSON }}
          REVIEW_ROUTER_ROLE_BOOTSTRAP_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_ROLE_BOOTSTRAP_DATABASE_URL }}
          REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL }}
          REVIEW_ROUTER_API_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_API_DATABASE_URL }}
          REVIEW_ROUTER_WEB_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_WEB_DATABASE_URL }}
          REVIEW_ROUTER_WORKER_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_WORKER_DATABASE_URL }}
          REVIEW_ROUTER_CODEX_EFFECT_AUTHORITY_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_CODEX_EFFECT_AUTHORITY_DATABASE_URL }}
          REVIEW_ROUTER_SOURCE_BACKUP_WITNESS_JSON: ${{ secrets.REVIEW_ROUTER_SOURCE_BACKUP_WITNESS_JSON }}
          REVIEW_ROUTER_APPLICATION_SCHEMAS_JSON: ${{ vars.REVIEW_ROUTER_APPLICATION_SCHEMAS_JSON }}
          REVIEW_ROUTER_RELEASE_COMMIT_SHA: ${{ needs.trust-bootstrap.outputs.trusted_sha }}
        run: node --import tsx scripts/run-private-pg17-copy-bootstrap.ts > copy-bootstrap-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: copy-bootstrap-${{ inputs.rollout_id }}-${{ github.run_id }}-1
          path: copy-bootstrap-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  await-role-runner-cleanup:
    name: await-role-runner-cleanup
    needs: [trust-bootstrap, role-bootstrap-private]
    environment: production-runner-ledger-read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          {
            persist-credentials: false,
            ref: "${{ needs.trust-bootstrap.outputs.trusted_sha }}",
          }
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile
      - env:
          REVIEW_ROUTER_RUNNER_LEDGER_TOKEN: ${{ secrets.REVIEW_ROUTER_RELEASE_CONTROL_TOKEN }}
          REVIEW_ROUTER_RUNNER_LIFECYCLE: role
        run: node --import tsx scripts/await-private-runner-cleanup.ts

  pg17-cutover-private:
    name: pg17-cutover-private
    needs: [trust-bootstrap, await-role-runner-cleanup]
    environment: production
    runs-on:
      group: ${{ vars.REVIEW_ROUTER_RUNNER_GROUP_NAME }}
      labels: ${{ format('rr-{0}-cutover', github.run_id) }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          {
            persist-credentials: false,
            ref: "${{ needs.trust-bootstrap.outputs.trusted_sha }}",
          }
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: copy-bootstrap-${{ inputs.rollout_id }}-${{ github.run_id }}-1
          path: copy-bootstrap
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: protected-preflight-${{ inputs.rollout_id }}-${{ github.run_id }}-1
          path: preflight
      - name: Migrate, stage, and cross the transactional activation boundary
        env:
          REVIEW_ROUTER_PROVIDER_AUTHORITY_TOKEN: ${{ secrets.REVIEW_ROUTER_PROVIDER_AUTHORITY_TOKEN }}
          REVIEW_ROUTER_EXPECTED_WORKFLOW_JOB_NAME: pg17-cutover-private
          REVIEW_ROUTER_COPY_BOOTSTRAP_EVIDENCE_FILE: copy-bootstrap/copy-bootstrap-evidence.json
          REVIEW_ROUTER_RELEASE_IMAGE_PROVENANCE_FILE: preflight/verified-release-image-provenance.json
          REVIEW_ROUTER_RUNNER_LEDGER_TOKEN: ${{ secrets.REVIEW_ROUTER_RELEASE_CONTROL_TOKEN }}
          RENDER_SERVICE_SUSPENSION_API_KEY: ${{ secrets.RENDER_SERVICE_SUSPENSION_API_KEY }}
          REVIEW_ROUTER_SOURCE_WRITER_SERVICE_IDS: ${{ vars.REVIEW_ROUTER_SOURCE_WRITER_SERVICE_IDS }}
          REVIEW_ROUTER_SOURCE_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_COMPENSATION_SOURCE_DATABASE_URL }}
          REVIEW_ROUTER_SOURCE_RECONNECT_URLS_JSON: ${{ secrets.REVIEW_ROUTER_SOURCE_RECONNECT_URLS_JSON }}
          REVIEW_ROUTER_SOURCE_PRINCIPAL_POLICY_JSON: ${{ vars.REVIEW_ROUTER_SOURCE_PRINCIPAL_POLICY_JSON }}
          REVIEW_ROUTER_SOURCE_FENCED_PRINCIPAL_POLICY_JSON: ${{ vars.REVIEW_ROUTER_SOURCE_FENCED_PRINCIPAL_POLICY_JSON }}
          RENDER_TARGET_SWITCH_API_KEY: ${{ secrets.RENDER_TARGET_SWITCH_API_KEY }}
          REVIEW_ROUTER_TARGET_DATABASE_URLS_JSON: ${{ secrets.REVIEW_ROUTER_TARGET_DATABASE_URLS_JSON }}
          REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL }}
          REVIEW_ROUTER_API_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_API_DATABASE_URL }}
          REVIEW_ROUTER_WEB_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_WEB_DATABASE_URL }}
          REVIEW_ROUTER_WORKER_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_WORKER_DATABASE_URL }}
          REVIEW_ROUTER_CODEX_EFFECT_AUTHORITY_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_CODEX_EFFECT_AUTHORITY_DATABASE_URL }}
          REVIEW_ROUTER_TARGET_SERVICE_EXPECTATIONS_JSON: ${{ vars.REVIEW_ROUTER_TARGET_SERVICE_EXPECTATIONS_JSON }}
          REVIEW_ROUTER_SOURCE_DATABASE_SYSTEM_IDENTIFIER: ${{ vars.REVIEW_ROUTER_SOURCE_DATABASE_SYSTEM_IDENTIFIER }}
          REVIEW_ROUTER_TARGET_DATABASE_SYSTEM_IDENTIFIER: ${{ vars.REVIEW_ROUTER_TARGET_DATABASE_SYSTEM_IDENTIFIER }}
          REVIEW_ROUTER_TARGET_RECOVERY_WITNESS_SHA256: ${{ vars.REVIEW_ROUTER_TARGET_RECOVERY_WITNESS_SHA256 }}
          REVIEW_ROUTER_SOURCE_RECOVERY_WITNESS_SHA256: ${{ vars.REVIEW_ROUTER_SOURCE_RECOVERY_WITNESS_SHA256 }}
          REVIEW_ROUTER_TARGET_RECOVERY_WITNESS: ${{ secrets.REVIEW_ROUTER_TARGET_RECOVERY_WITNESS }}
          REVIEW_ROUTER_SOURCE_RECOVERY_WITNESS: ${{ secrets.REVIEW_ROUTER_SOURCE_RECOVERY_WITNESS }}
          REVIEW_ROUTER_RELEASE_COMMIT_SHA: ${{ needs.trust-bootstrap.outputs.trusted_sha }}
        run: node --import tsx scripts/run-private-pg17-rollout.ts > private-rollout-body.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: private-rollout-body-${{ inputs.rollout_id }}-${{ github.run_id }}-1
          path: private-rollout-body.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  await-cutover-runner-cleanup:
    name: await-cutover-runner-cleanup
    needs: [trust-bootstrap, pg17-cutover-private]
    environment: production-runner-ledger-read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          {
            persist-credentials: false,
            ref: "${{ needs.trust-bootstrap.outputs.trusted_sha }}",
          }
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile
      - env:
          REVIEW_ROUTER_RUNNER_LEDGER_TOKEN: ${{ secrets.REVIEW_ROUTER_RELEASE_CONTROL_TOKEN }}
          REVIEW_ROUTER_RUNNER_LIFECYCLE: cutover
        run: node --import tsx scripts/await-private-runner-cleanup.ts

  finalize-trusted-rollout:
    name: finalize-target-and-trusted-evidence
    needs: [trust-bootstrap, await-cutover-runner-cleanup]
    environment: production-service-switch
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          {
            persist-credentials: false,
            ref: "${{ needs.trust-bootstrap.outputs.trusted_sha }}",
          }
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          {
            name: "private-rollout-body-${{ inputs.rollout_id }}-${{ github.run_id }}-1",
            path: artifacts/body,
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          {
            name: "protected-preflight-${{ inputs.rollout_id }}-${{ github.run_id }}-1",
            path: artifacts/preflight,
          }
      - name: Resume exact target deploys, run live write/read canary, assemble and verify
        env:
          REVIEW_ROUTER_PROVIDER_AUTHORITY_TOKEN: ${{ secrets.REVIEW_ROUTER_PROVIDER_AUTHORITY_TOKEN }}
          REVIEW_ROUTER_RUNNER_LEDGER_TOKEN: ${{ secrets.REVIEW_ROUTER_RELEASE_CONTROL_TOKEN }}
          RENDER_SERVICE_SUSPENSION_API_KEY: ${{ secrets.RENDER_SERVICE_SUSPENSION_API_KEY }}
          REVIEW_ROUTER_PRIVATE_ROLLOUT_BODY_FILE: artifacts/body/private-rollout-body.json
          REVIEW_ROUTER_RELEASE_WITNESS_TOKEN: ${{ secrets.REVIEW_ROUTER_RELEASE_WITNESS_TOKEN }}
          REVIEW_ROUTER_RELEASE_WITNESS_SIGNING_KEY_ID: ${{ vars.REVIEW_ROUTER_RELEASE_WITNESS_SIGNING_KEY_ID }}
          REVIEW_ROUTER_RELEASE_WITNESS_SIGNING_PUBLIC_KEY_PEM: ${{ vars.REVIEW_ROUTER_RELEASE_WITNESS_SIGNING_PUBLIC_KEY_PEM }}
          REVIEW_ROUTER_RELEASE_WITNESS_MAXIMUM_AGE_MS: ${{ vars.REVIEW_ROUTER_RELEASE_WITNESS_MAXIMUM_AGE_MS }}
          REVIEW_ROUTER_PROTECTED_ENVIRONMENT_PREFLIGHT_FILE: artifacts/preflight/protected-environment-preflight.json
          REVIEW_ROUTER_RELEASE_IMAGE_PROVENANCE_FILE: artifacts/preflight/verified-release-image-provenance.json
          REVIEW_ROUTER_TARGET_SERVICE_EXPECTATIONS_JSON: ${{ vars.REVIEW_ROUTER_TARGET_SERVICE_EXPECTATIONS_JSON }}
          REVIEW_ROUTER_LIVE_CANARY_URL: ${{ vars.REVIEW_ROUTER_LIVE_CANARY_URL }}
          REVIEW_ROUTER_LIVE_CANARY_TOKEN: ${{ secrets.REVIEW_ROUTER_LIVE_CANARY_TOKEN }}
          REVIEW_ROUTER_TARGET_RECOVERY_WITNESS_SHA256: ${{ vars.REVIEW_ROUTER_TARGET_RECOVERY_WITNESS_SHA256 }}
        run: node --import tsx scripts/finalize-private-pg17-rollout.ts > finalized-rollout.json
      - env:
          REVIEW_ROUTER_FINALIZED_ROLLOUT_FILE: finalized-rollout.json
          REVIEW_ROUTER_RELEASE_WITNESS_SIGNING_KEY_ID: ${{ vars.REVIEW_ROUTER_RELEASE_WITNESS_SIGNING_KEY_ID }}
          REVIEW_ROUTER_RELEASE_WITNESS_SIGNING_PUBLIC_KEY_PEM: ${{ vars.REVIEW_ROUTER_RELEASE_WITNESS_SIGNING_PUBLIC_KEY_PEM }}
          REVIEW_ROUTER_RELEASE_WITNESS_MAXIMUM_AGE_MS: ${{ vars.REVIEW_ROUTER_RELEASE_WITNESS_MAXIMUM_AGE_MS }}
        run: node --import tsx scripts/assemble-private-pg17-trusted-evidence.ts > trusted-rollout-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trusted-private-pg17-${{ inputs.rollout_id }}-${{ github.run_id }}-1
          path: trusted-rollout-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  always-reconcile:
    name: always-reconcile-runners-and-compensation
    if: ${{ always() && needs.trust-bootstrap.result == 'success' && needs.protected-preflight.result == 'success' }}
    needs:
      [
        trust-bootstrap,
        protected-preflight,
        freeze-source-writers,
        role-bootstrap-private,
        pg17-cutover-private,
        finalize-trusted-rollout,
      ]
    environment: production-runner-control
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          {
            persist-credentials: false,
            ref: "${{ needs.trust-bootstrap.outputs.trusted_sha }}",
          }
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile
      - name: Idempotently reconcile persisted jobs and rollout boundary
        env:
          GITHUB_CONTROL_READ_TOKEN: ${{ github.token }}
          RENDER_RUNNER_CONTROL_API_KEY: ${{ secrets.RENDER_RUNNER_CONTROL_API_KEY }}
          REVIEW_ROUTER_RUNNER_LEDGER_TOKEN: ${{ secrets.REVIEW_ROUTER_RELEASE_CONTROL_TOKEN }}
          REVIEW_ROUTER_RUNNER_WITNESS_TOKEN: ${{ secrets.REVIEW_ROUTER_RELEASE_WITNESS_TOKEN }}
          REVIEW_ROUTER_RUNNER_WITNESS_URL: ${{ vars.REVIEW_ROUTER_RELEASE_WITNESS_URL }}
          REVIEW_ROUTER_ORPHAN_RECONCILIATION_FILE: orphan-reconciliation.json
          REVIEW_ROUTER_RECONCILIATION_ATTEMPTS: 8
          REVIEW_ROUTER_RECONCILIATION_INITIAL_DELAY_MS: 5000
          REVIEW_ROUTER_RECONCILIATION_MAXIMUM_DELAY_MS: 30000
        run: node --import tsx scripts/release-rollout-render-control.ts cleanup-runners
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: compensation-gate-${{ inputs.rollout_id }}-${{ github.run_id }}-1
          path: orphan-reconciliation.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ always() }}
        with:
          name: "protected-preflight-${{ inputs.rollout_id }}-${{ github.run_id }}-1"
          path: artifacts/preflight
      - name: Complete safe pre-activation compensation, then reconcile
        if: ${{ always() }}
        env:
          REVIEW_ROUTER_PROVIDER_AUTHORITY_TOKEN: ${{ secrets.REVIEW_ROUTER_PROVIDER_AUTHORITY_TOKEN }}
          REVIEW_ROUTER_RUNNER_LEDGER_TOKEN: ${{ secrets.REVIEW_ROUTER_RELEASE_CONTROL_TOKEN }}
          RENDER_SERVICE_SUSPENSION_API_KEY: ${{ secrets.RENDER_SERVICE_SUSPENSION_API_KEY }}
          REVIEW_ROUTER_SOURCE_WRITER_SERVICE_IDS: ${{ vars.REVIEW_ROUTER_SOURCE_WRITER_SERVICE_IDS }}
          REVIEW_ROUTER_SOURCE_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_COMPENSATION_SOURCE_DATABASE_URL }}
          REVIEW_ROUTER_SOURCE_RECONNECT_URLS_JSON: ${{ secrets.REVIEW_ROUTER_SOURCE_RECONNECT_URLS_JSON }}
          REVIEW_ROUTER_SOURCE_PRINCIPAL_POLICY_JSON: ${{ vars.REVIEW_ROUTER_SOURCE_PRINCIPAL_POLICY_JSON }}
          REVIEW_ROUTER_INITIAL_ROLLOUT_FILE: artifacts/preflight/initial-rollout.json
          RENDER_TARGET_SWITCH_API_KEY: ${{ secrets.RENDER_TARGET_SWITCH_API_KEY }}
          REVIEW_ROUTER_SOURCE_RECOVERY_WITNESS: ${{ secrets.REVIEW_ROUTER_SOURCE_RECOVERY_WITNESS }}
          REVIEW_ROUTER_SOURCE_RECOVERY_WITNESS_SHA256: ${{ vars.REVIEW_ROUTER_SOURCE_RECOVERY_WITNESS_SHA256 }}
          REVIEW_ROUTER_TARGET_RECOVERY_WITNESS: ${{ secrets.REVIEW_ROUTER_TARGET_RECOVERY_WITNESS }}
        run: node --import tsx scripts/reconcile-private-pg17-compensation.ts > compensation-reconciliation.json
