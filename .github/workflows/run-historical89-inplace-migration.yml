name: Run historical89 in-place migration

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact protected main commit to run this against
        required: true
        type: string
      runner_label:
        description: Unique label of the isolated single-job runner prepared for this operation
        required: true
        type: string
      verification_operation_id:
        description: Original retained operation ID for already96 verification (blank for a new operation)
        required: false
        type: string
      verification_sha256:
        description: Independent sha256 digest of exact retained verification request bytes
        required: false
        type: string
      resume_existing_operation:
        description: Resume the retained operation after a coordinator crash
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: historical89-inplace-migration-${{ github.repository }}
  cancel-in-progress: false

jobs:
  trust-bootstrap:
    name: verify-protected-main-and-production-environment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      trusted_sha: ${{ steps.trust.outputs.trusted_sha }}
    steps:
      - name: Establish immutable trust before repository execution
        id: trust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_ENVIRONMENT: production
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUNNER_LABEL: ${{ inputs.runner_label }}
          REVIEW_ROUTER_RELEASE_APPROVAL_MODE: ${{ vars.REVIEW_ROUTER_RELEASE_APPROVAL_MODE }}
        run: |
          set -euo pipefail
          node <<'NODE'
          // trust-bootstrap-node:start
          const { appendFileSync } = await import("node:fs");
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`historical89_trust_missing:${name}`);
            return value;
          };
          const fail = (reason) => {
            throw new Error(`historical89_trust_rejected:${reason}`);
          };
          if (!/^rr-h89-[a-f0-9]{32}$/.test(required("RUNNER_LABEL")))
            fail("runner_label");
          const repository = required("GITHUB_REPOSITORY");
          const sha = required("GITHUB_SHA").toLowerCase();
          const expectedSha = required("EXPECTED_SHA").toLowerCase();
          const approvalMode = required("REVIEW_ROUTER_RELEASE_APPROVAL_MODE");
          if (!["solo_owner", "independent"].includes(approvalMode))
            fail("approval_mode");
          if (required("GITHUB_EVENT_NAME") !== "workflow_dispatch") fail("event");
          if (required("GITHUB_REF") !== "refs/heads/main") fail("workflow_ref");
          if (!/^[a-f0-9]{40}$/.test(sha)) fail("dispatch_sha");
          if (sha !== expectedSha) fail("sha_mismatch");
          const headers = {
            Authorization: `Bearer ${required("GH_TOKEN")}`,
            Accept: "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const get = async (path) => {
            const response = await fetch(`https://api.github.com${path}`, { headers });
            if (!response.ok) fail(`github_api_${response.status}`);
            return response.json();
          };
          const branch = await get(`/repos/${repository}/branches/main`);
          if (branch.protected !== true || branch.commit?.sha?.toLowerCase() !== sha)
            fail("stale_or_unprotected_main");
          const environmentName = required("REQUIRED_ENVIRONMENT");
          const environment = await get(
            `/repos/${repository}/environments/${encodeURIComponent(environmentName)}`,
          );
          const rules = environment.protection_rules;
          const reviewers = Array.isArray(rules)
            ? rules.find((rule) => rule?.type === "required_reviewers")
            : undefined;
          const branchPolicy = Array.isArray(rules)
            ? rules.find((rule) => rule?.type === "branch_policy")
            : undefined;
          if (
            !reviewers ||
            !Array.isArray(reviewers.reviewers) ||
            reviewers.reviewers.length < 1 ||
            typeof reviewers.prevent_self_review !== "boolean" ||
            (approvalMode === "independent" && reviewers.prevent_self_review !== true) ||
            !branchPolicy ||
            environment.deployment_branch_policy?.protected_branches !== true
          ) fail("environment_unprotected");
          appendFileSync(required("GITHUB_OUTPUT"), `trusted_sha=${sha}\n`, "utf8");
          // trust-bootstrap-node:end
          NODE

  run-migration:
    name: run-historical89-inplace-operation
    needs: trust-bootstrap
    environment: production
    # A single-job isolated runner mounts a NEW private host directory here.
    runs-on: [self-hosted, linux, x64, "${{ inputs.runner_label }}"]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REVIEW_ROUTER_HISTORICAL89_OPERATION_DIRECTORY: /retained/operation
      REVIEW_ROUTER_HISTORICAL89_SOURCE_COMMIT: ${{ needs.trust-bootstrap.outputs.trusted_sha }}
      # This is the executable being attested, NOT an output report.
      REVIEW_ROUTER_HISTORICAL89_ARTIFACT_PATH: ${{ github.workspace }}/scripts/run-historical89-inplace-operation.mjs
      REVIEW_ROUTER_HISTORICAL89_OPERATION_ID: ${{ inputs.verification_operation_id }}
      REVIEW_ROUTER_HISTORICAL89_VERIFICATION_SHA256: ${{ inputs.verification_sha256 }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.trust-bootstrap.outputs.trusted_sha }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Prepare private evidence and validate retention inputs
        id: evidence
        shell: bash
        env:
          RETENTION_KEY: ${{ secrets.REVIEW_ROUTER_HISTORICAL89_RETENTION_KEY }}
          VERIFICATION_JSON: ${{ secrets.REVIEW_ROUTER_HISTORICAL89_VERIFICATION_JSON }}
          REVIEW_ROUTER_HISTORICAL89_VERIFICATION_PATH: ${{ runner.temp }}/historical89-private/verification.request
        run: |
          set -euo pipefail
          umask 077
          mountpoint -q /retained
          test -w /retained
          if [[ "${{ inputs.resume_existing_operation }}" == "true" ]]; then
            test -d /retained/operation
            test -f /retained/reader-url
          else
            test ! -e /retained/operation
            test ! -e /retained/reader-url
          fi
          command -v pg_dump >/dev/null
          command -v pg_restore >/dev/null
          command -v gpg >/dev/null
          [[ "$RETENTION_KEY" =~ ^[a-fA-F0-9]{64}$ ]]
          mkdir "$RUNNER_TEMP/historical89-private" "$RUNNER_TEMP/historical89-result"
          printf '%s\n' '{"outcome":"fenced-unresolved","reason":"operation_not_completed"}' > "$RUNNER_TEMP/historical89-result/result.json"
          printf '%s' probe | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/historical89-private/probe.gpg" 3<<<"$RETENTION_KEY"
          rm "$RUNNER_TEMP/historical89-private/probe.gpg"
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          const bytes = process.env.VERIFICATION_JSON;
          const id = process.env.REVIEW_ROUTER_HISTORICAL89_OPERATION_ID;
          const pin = process.env.REVIEW_ROUTER_HISTORICAL89_VERIFICATION_SHA256;
          if (bytes || id || pin) {
            if (!bytes || !id || !/^sha256:[a-f0-9]{64}$/.test(pin ?? "") ||
                `sha256:${createHash("sha256").update(bytes).digest("hex")}` !== pin)
              throw new Error("historical89_retained_verification_inputs_invalid");
            writeFileSync(process.env.REVIEW_ROUTER_HISTORICAL89_VERIFICATION_PATH, bytes, { mode: 0o600, flag: "wx" });
          }
          NODE

      - name: Create the operation reader credential
        shell: bash
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import { randomBytes } from "node:crypto";
          import {
            appendFileSync,
            closeSync,
            constants,
            fsyncSync,
            openSync,
            readFileSync,
            writeFileSync,
          } from "node:fs";
          const source = process.env.MIGRATION_DATABASE_URL;
          if (!source) throw new Error("historical89_migration_url_missing");
          if (${{ inputs.resume_existing_operation }}) {
            const value = readFileSync("/retained/reader-url", "utf8");
            process.stdout.write(`::add-mask::${value}\n`);
            appendFileSync(process.env.GITHUB_ENV, `REVIEW_ROUTER_RELEASE_MIGRATION_CUSTODY_READER_DATABASE_URL=${value}\n`, { mode: 0o600 });
            process.exit(0);
          }
          const reader = new URL(source);
          reader.username = "reviewrouter_operation_custody_reader";
          const password = randomBytes(32).toString("base64url");
          reader.password = password;
          const value = reader.toString();
          process.stdout.write(`::add-mask::${password}\n::add-mask::${value}\n`);
          writeFileSync("/retained/reader-url", value, { mode: 0o600, flag: "wx" });
          for (const path of ["/retained/reader-url", "/retained"]) {
            const descriptor = openSync(
              path,
              constants.O_RDONLY | constants.O_NOFOLLOW,
            );
            try {
              fsyncSync(descriptor);
            } finally {
              closeSync(descriptor);
            }
          }
          appendFileSync(
            process.env.GITHUB_ENV,
            `REVIEW_ROUTER_RELEASE_MIGRATION_CUSTODY_READER_DATABASE_URL=${value}\n`,
            { mode: 0o600 },
          );
          NODE

      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile
      - name: Check database host reachability (no credentials printed)
        env:
          REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL }}
        run: node scripts/check-db-reachability.mjs

      - name: Temporarily open Render DB access if IP-restricted
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_POSTGRES_ID: dpg-da32ipmk1f9s73dttm90-a
          RENDER_ALLOWLIST_BACKUP_PATH: /tmp/render-allowlist-backup.json
        run: node scripts/open-render-db-access.mjs

      - name: Diagnose migration role privileges (read-only)
        env:
          REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL }}
          REVIEW_ROUTER_COMMENT_TOKEN_CUSTODY_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_COMMENT_TOKEN_CUSTODY_DATABASE_URL }}
        run: node scripts/diagnose-migration-role.mjs

      # historical89 identity guards require session_user = reviewrouter
      # (the Render database owner). Bind that owner URL into GITHUB_ENV
      # for the next step; do not use the release-migration login secret.
      - name: Bind coordinator owner session (idempotent)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_POSTGRES_ID: dpg-da32ipmk1f9s73dttm90-a
        run: node scripts/ensure-migration-role-privilege.mjs

      - name: Run historical89 in-place operation
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          REVIEW_ROUTER_HISTORICAL89_RETENTION_KEY: ${{ secrets.REVIEW_ROUTER_HISTORICAL89_RETENTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import { openSync, closeSync, readFileSync, writeFileSync } from "node:fs";
          import { spawnSync } from "node:child_process";
          const root = `${process.env.RUNNER_TEMP}/historical89-private`;
          const stdout = openSync(`${root}/stdout`, "wx", 0o600);
          const stderr = openSync(`${root}/stderr`, "wx", 0o600);
          const child = spawnSync(process.execPath, ["--import", "tsx", "scripts/run-historical89-inplace-operation.mjs"], {
            stdio: ["ignore", stdout, stderr],
          });
          closeSync(stdout);
          closeSync(stderr);
          // Public output is an allowlisted projection, never raw logs or journal SQL.
          let result = { outcome: "fenced-unresolved", reason: "operation_unresolved" };
          try {
            const raw = JSON.parse(readFileSync(`${root}/stdout`, "utf8"));
            if (child.status === 0 && ["committed-96", "already-96"].includes(raw.outcome) &&
                /^sha256:[a-f0-9]{64}$/.test(raw.receiptDigest ?? ""))
              result = {
                outcome: raw.outcome, receiptDigest: raw.receiptDigest,
                ...(raw.outcome === "already-96" ? { verification: "read-only-snapshot", authorizesProductionMutation: false } : {}),
              };
          } catch {}
          if (result.outcome === "fenced-unresolved" && result.reason === "operation_unresolved") {
            // Surface only the already-allowlisted reason code the operation
            // itself decided was safe to print (never raw stderr/journal SQL).
            try {
              const errText = readFileSync(`${root}/stderr`, "utf8");
              const match = errText.match(/historical89_inplace_failed:((?:historical89_coordinator|historical89_capture|render_historical89_admission_rejected|render_historical89_operation_rejected|render_historical89_boundary_rejected|render_managed_cutover_rejected|render_managed_catalog_rejected|render_schema_handoff_rejected|operation_unresolved):[a-zA-Z0-9_:.-]+)/u);
              if (match) result = { outcome: "fenced-unresolved", reason: match[1] };
            } catch {}
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/historical89-result/result.json`, `${JSON.stringify(result)}\n`, { mode: 0o600 });
          console.log(JSON.stringify(result));
          process.exitCode = child.status === 0 && result.outcome !== "fenced-unresolved" ? 0 : 1;
          NODE

      - name: Restore original Render DB access list
        if: always()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_POSTGRES_ID: dpg-da32ipmk1f9s73dttm90-a
          RENDER_ALLOWLIST_BACKUP_PATH: /tmp/render-allowlist-backup.json
        run: node scripts/restore-render-db-access.mjs

      # Private diagnostics may contain sensitive transport details.
      # Upload only an encrypted copy, including partial/failing operations.
      # The authoritative journal remains on the host bind mount after runner loss.
      # Do not mount a previous operation into a new public runner job.
      # This optional archive covers diagnostics only, not journal durability.
      - name: Seal private operation evidence
        if: always() && steps.evidence.outcome == 'success'
        shell: bash
        env:
          RETENTION_KEY: ${{ secrets.REVIEW_ROUTER_HISTORICAL89_RETENTION_KEY }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$RETENTION_KEY" ]]; then
            echo "Encrypted diagnostic archive not configured; private journal is not uploaded."
            exit 0
          fi
          tar -C "$RUNNER_TEMP/historical89-private" -czf - . | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/historical89-evidence.gpg" 3<<<"$RETENTION_KEY"
          mv "$RUNNER_TEMP/historical89-evidence.gpg" "$RUNNER_TEMP/historical89-result/evidence.tar.gz.gpg"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: historical89-inplace-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/historical89-result/result.json
            ${{ runner.temp }}/historical89-result/evidence.tar.gz.gpg
          if-no-files-found: error
          retention-days: 90
