name: Activation catalog candidate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/activation-catalog-candidate.yml"
      - "packages/platform/db/prisma/migrations/**"

permissions:
  contents: read

concurrency:
  group: activation-catalog-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  capture:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        env:
          SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64: ${{ secrets.SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64 }}
        run: node scripts/install-private-dependencies.mjs --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Capture disposable production-shaped candidate
        env:
          REVIEW_ROUTER_PRIVATE_PG17_REHEARSAL: "1"
          REVIEW_ROUTER_PRIVATE_PG17_ACTIVATION_CATALOG_POLICY_CAPTURE_ONLY: "1"
          REVIEW_ROUTER_ACTIVATION_CATALOG_DISPOSABLE_DATABASE_IDENTITY: rr-disposable-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          REVIEW_ROUTER_REHEARSAL_PG16_IMAGE: postgres:16.13-bookworm@sha256:472efd9a66f2b2f1a5aeb18b28de74332e6ef88c2b93a1a5d812fb6db67a5f60
          REVIEW_ROUTER_REHEARSAL_PG17_IMAGE: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
        run: pnpm release-rollout:rehearsal > "$RUNNER_TEMP/activation-catalog-candidate.json"
      - name: Upload exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: activation-catalog-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/activation-catalog-candidate.json
          if-no-files-found: error
          retention-days: 3
