name: ReviewRouter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  repository_dispatch:
    types: [reviewrouter_conflict_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number for manual reruns"
        required: false
        type: string

permissions: {}

concurrency:
  group: reviewrouter-conflict-${{ github.repository }}-${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false


jobs:
  review:
    name: review
    if: ${{ github.event_name != 'repository_dispatch' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    uses: 777genius/review-router/.github/workflows/reviewrouter-reusable.yml@c23ae97660c3674a2ebc9076bb5cd4f1bbd85657
    with:
      runtime_ref: c23ae97660c3674a2ebc9076bb5cd4f1bbd85657
      api_url: "https://api.reviewrouter.site"
      runtime_config_mode: oidc
      static_runtime_env_json: |-
        {
          "REVIEWROUTER_CONFIG_SCHEMA_VERSION": "2",
          "REVIEW_AUTH_MODE": "codex-oauth",
          "REVIEW_PROVIDERS": "codex/gpt-5.5,openrouter/openai/gpt-oss-120b:free,openrouter/poolside/laguna-m.1:free,openrouter/openrouter/owl-alpha",
          "REQUIRED_HEALTHY_PROVIDERS": "codex/gpt-5.5",
          "SYNTHESIS_MODEL": "codex/gpt-5.5",
          "PROVIDER_LIMIT": "4",
          "PROVIDER_MAX_PARALLEL": "2",
          "INLINE_MIN_AGREEMENT": "1",
          "INLINE_MAX_COMMENTS": "5",
          "TARGET_TOKENS_PER_BATCH": "50000",
          "FAIL_ON_SEVERITY": "major",
          "CODEX_MODEL": "gpt-5.5",
          "CODEX_REASONING_EFFORT": "high",
          "CODEX_AGENTIC_CONTEXT": "true",
          "CODEX_FAST_MODE": "false"
        }
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
    secrets:
      REVIEW_ROUTER_LEDGER_KEY: ${{ secrets.REVIEW_ROUTER_LEDGER_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      CODEX_CONFIG_TOML: ${{ secrets.CODEX_CONFIG_TOML }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  conflict-review:
    name: conflict review
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'reviewrouter_conflict_review' }}
    permissions:
      contents: read
      id-token: write
    uses: 777genius/review-router/.github/workflows/reviewrouter-conflict-reusable.yml@c23ae97660c3674a2ebc9076bb5cd4f1bbd85657
    with:
      runtime_ref: c23ae97660c3674a2ebc9076bb5cd4f1bbd85657
      api_url: "https://api.reviewrouter.site"
      runtime_config_mode: oidc
      pr_number: ${{ github.event.client_payload.pr_number }}
      review_kind: conflict-head
      conflict_repository_id: ${{ github.event.client_payload.repository_id || '' }}
      conflict_dispatch_event_type: ${{ github.event.client_payload.dispatch_event_type || '' }}
      conflict_dispatch_id: ${{ github.event.client_payload.dispatch_id || '' }}
      conflict_dispatch_nonce: ${{ github.event.client_payload.nonce || '' }}
      conflict_head_sha: ${{ github.event.client_payload.head_sha || '' }}
      conflict_base_ref: ${{ github.event.client_payload.base_ref || '' }}
      conflict_base_sha: ${{ github.event.client_payload.base_sha || '' }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      CODEX_CONFIG_TOML: ${{ secrets.CODEX_CONFIG_TOML }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
