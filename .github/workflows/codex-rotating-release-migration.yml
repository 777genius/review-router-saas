          const work = process.env.WORK;
          const read = name => (name === "recovery-resume-state.json" ? parseRecoveryReplicaResponse : parseRecoveryJson)(readFileSync(`${work}/${name}`, "utf8"));
          const retained = read("recovery-resume-state.json");
          const inventories = {};
          const services = {};
