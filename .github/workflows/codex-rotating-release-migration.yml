          # Every effect intent and exact deployment binding is read back durably.
          assert_recovery_fleet_suspended "$work/pre-deploy-suspension-result.json"
          if jq -e '.phase == "fleet_verified_closed" or .phase == "complete"' "$work/recovery-journal.json" >/dev/null; then
            suspension_guard_armed=0
