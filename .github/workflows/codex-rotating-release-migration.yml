          assert_recovery_admission_closed
          assert_recovery_maintenance true
          assert_worker_effect_fenced
          assert_recovery_target_identity
          assert_recovery_fleet_identity
          DATABASE_URL="$external_url" pnpm db:migrate:deploy
          assert_worker_effect_fenced
          assert_recovery_admission_closed
          WORK="$work" node --import tsx --input-type=module <<'NODE' > "$work/runtime-grants.sql"
          import {readFileSync} from "node:fs";
          import {workerFenceSnapshotSql} from "./scripts/render-recovery-journal.mjs";
          import { runtimeGrantSql } from "./scripts/run-codex-rotating-release-migration.mjs";
          const canonical = runtimeGrantSql({ roles: [
            { role: "api", username: "reviewrouter_api" },
            { role: "web", username: "reviewrouter_web" },
            { role: "worker", username: "reviewrouter_worker" },
            { role: "effect-authority", username: "reviewrouter_codex_effect_authority" },
            { role: "comment-token-custody", username: "reviewrouter_comment_token_custody" },
          ] });
          let removed = 0;
          const compatible = canonical.split("\n").filter((line) => {
            const skip = line.startsWith(
              "ALTER DEFAULT PRIVILEGES FOR ROLE reviewrouter_release_schema_owner IN SCHEMA public",
            );
            if (skip) removed += 1;
            return !skip;
          }).join("\n");
          if (removed !== 6) throw new Error(`unexpected_default_privilege_statement_count:${removed}`);
          const evidence = JSON.parse(readFileSync(`${process.env.WORK}/worker-effect-fence.json`, "utf8"));
          const expected = JSON.stringify(evidence.fenced).replaceAll("'", "''");
          const owner = '"' + evidence.before.owner.replaceAll('"', '""') + '"';
          const fence = `SET LOCAL ROLE ${owner};
          REVOKE UPDATE ON public."OutboxEvent" FROM reviewrouter_worker;
          RESET ROLE;
          DO $closed$ DECLARE observed jsonb; BEGIN
            ${workerFenceSnapshotSql} INTO observed;
            IF observed IS DISTINCT FROM '${expected}'::jsonb THEN RAISE EXCEPTION 'recovery grant refresh changed worker fence'; END IF;
          END $closed$;`;
          if ((compatible.match(/COMMIT;/g) ?? []).length !== 1) throw new Error("recovery_grant_transaction_shape");
          process.stdout.write(compatible.replace("COMMIT;", fence + "\nCOMMIT;"));
          NODE
          assert_recovery_target_identity
          assert_recovery_fleet_identity
          docker run --rm -e DATABASE_URL -v "$work:/work:ro" postgres:17-alpine \
            sh -ceu 'psql "$DATABASE_URL" --no-psqlrc --quiet --file=/work/runtime-grants.sql'

          assert_worker_effect_fenced
          assert_recovery_admission_closed
          assert_recovery_maintenance true

          assert_recovery_database_gates

          persist_recovery_phase "migration_complete"
