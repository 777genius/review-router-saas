              return 1
            fi
            printf '%s\n' "$replicas"
          }
          persist_recovery_journal() {
            local service_id observed
            WORK="$work" node --input-type=module <<'NODE' || return 1
          import {readFileSync} from "node:fs";
          import {parseRecoveryJson, loadRecoveryJournal} from "./scripts/render-recovery-journal.mjs";
          const state = parseRecoveryJson(readFileSync(`${process.env.WORK}/recovery-journal.json`, "utf8"));
          loadRecoveryJournal(state, state.tuple);
          NODE
            jq -c '{value: tojson}' "$work/recovery-journal.json" > "$work/recovery-phase-env.json" || return 1
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              render_inventory_api "$((SECONDS + 30))" -X PUT -H "Content-Type: application/json" \
                --data-binary @"$work/recovery-phase-env.json" \
                "https://api.render.com/v1/services/$service_id/env-vars/$recovery_phase_key" -o /dev/null || return 1
            done
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              observed="$(read_recovery_phase "$service_id")" || return 1
              jq -e --slurpfile expected "$work/recovery-journal.json" \
                '. == $expected[0]' <<<"$observed" >/dev/null || return 1
            done
          }
          persist_recovery_phase() {
