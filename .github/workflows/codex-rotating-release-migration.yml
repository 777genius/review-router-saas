          WORK="$work" node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          import {parseRecoveryJson, attachRecoveryPreparation} from "./scripts/render-recovery-journal.mjs";
          const work = process.env.WORK;
          const read = name => parseRecoveryJson(readFileSync(`${work}/${name}`, "utf8"));
          const state = attachRecoveryPreparation(read("recovery-journal.json"), read("recovery-config-fingerprints.json"), read("worker-effect-fence.json"));
          writeFileSync(`${work}/recovery-journal.json`, JSON.stringify(state) + "\n", {mode: 0o600});
          NODE
          persist_recovery_journal
          fi
          assert_recovery_database_gates
