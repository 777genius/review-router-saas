            case "$service_id" in
              "$API_SERVICE_ID") role=api ;;
              "$WORKER_SERVICE_ID") role=worker ;;
              "$WEB_SERVICE_ID") role=web ;;
            esac
            assert_recovery_retained_inventories
            printf '{}\n' > "$work/journal-transition-evidence.json"
            if [[ "$(journal_service_phase)" == pending ]]; then
