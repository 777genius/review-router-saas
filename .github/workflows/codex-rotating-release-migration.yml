                and .latestDeployId == .deployId
                and .activeDeployIds == [.deployId])
            ' <<<"$observations" >/dev/null || return 1
            jq -n --slurpfile deployments <(printf '%s' "$observations") \
              --slurpfile inventories <(printf '%s' "$inventories") \
