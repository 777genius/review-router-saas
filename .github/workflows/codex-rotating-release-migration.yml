          jq -n --arg value "$(jq -er '.roles.api.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/api-env.json"
          jq -n --arg value "$(jq -er '.roles.web.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/web-env.json"
          jq -n --arg value "$(jq -er '.roles.worker.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/worker-env.json"
          jq -n --arg value "$(jq -er '.roles.effectAuthority.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/effect-env.json"
          jq -n --arg value "$(jq -er '.roles.commentTokenCustody.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/custody-env.json"
          render_api -X PUT -H "Content-Type: application/json" --data-binary @"$work/api-env.json" \
            "https://api.render.com/v1/services/$API_SERVICE_ID/env-vars/DATABASE_URL" -o /dev/null
          render_api -X PUT -H "Content-Type: application/json" --data-binary @"$work/web-env.json" \
            "https://api.render.com/v1/services/$WEB_SERVICE_ID/env-vars/DATABASE_URL" -o /dev/null
          render_api -X PUT -H "Content-Type: application/json" --data-binary @"$work/worker-env.json" \
            "https://api.render.com/v1/services/$WORKER_SERVICE_ID/env-vars/DATABASE_URL" -o /dev/null
          for service_id in "$API_SERVICE_ID" "$WEB_SERVICE_ID"; do
            render_api -X PUT -H "Content-Type: application/json" --data-binary @"$work/effect-env.json" \
              "https://api.render.com/v1/services/$service_id/env-vars/REVIEW_ROUTER_CODEX_EFFECT_AUTHORITY_DATABASE_URL" -o /dev/null
          done
          render_api -X PUT -H "Content-Type: application/json" --data-binary @"$work/custody-env.json" \
            "https://api.render.com/v1/services/$API_SERVICE_ID/env-vars/REVIEW_ROUTER_COMMENT_TOKEN_CUSTODY_DATABASE_URL" -o /dev/null
          # A successful PUT is insufficient: freeze the complete effective
          # configuration only after every staged credential reads back exactly.
          for service_id in "$API_SERVICE_ID" "$WEB_SERVICE_ID" "$WORKER_SERVICE_ID"; do
            render_api "https://api.render.com/v1/services/$service_id/env-vars" \
              > "$work/staged-$service_id-env.json"
          done
          WORK="$work" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { parseRecoveryJson, recoveryConfigFingerprint } from "./scripts/render-recovery-journal.mjs";
          const work = process.env.WORK;
          const urls = parseRecoveryJson(readFileSync(`${work}/runtime-role-urls.json`, "utf8"));
          const fingerprints = {};
          for (const role of ["api", "web", "worker"]) {
            const id = process.env[`${role.toUpperCase()}_SERVICE_ID`];
            const environment = parseRecoveryJson(readFileSync(`${work}/staged-${id}-env.json`, "utf8"));
            const fingerprint = recoveryConfigFingerprint(environment);
            const values = Object.fromEntries(environment.map((entry) => {
              const { key, value } = entry.envVar ?? entry;
              return [key, value];
            }));
            const expected = { DATABASE_URL: urls.roles[role].internal };
            if (role !== "worker") expected.REVIEW_ROUTER_CODEX_EFFECT_AUTHORITY_DATABASE_URL = urls.roles.effectAuthority.internal;
            if (role === "api") expected.REVIEW_ROUTER_COMMENT_TOKEN_CUSTODY_DATABASE_URL = urls.roles.commentTokenCustody.internal;
            for (const [key, value] of Object.entries(expected)) {
              if (values[key] !== value) throw new Error(`recovery_staged_configuration_mismatch:${role}:${key}`);
            }
            const baseline = parseRecoveryJson(readFileSync(`${work}/initial-${id}-env.json`, "utf8"));
            const journal = parseRecoveryJson(readFileSync(`${work}/recovery-journal.json`, "utf8"));
            if (recoveryConfigFingerprint(baseline) !== journal.tuple.services[role].configFingerprint) {
              throw new Error("recovery_bootstrap_baseline_mismatch");
            }
            const nonOwned = entries => entries.map(entry => entry.envVar ?? entry)
              .filter(entry => !Object.hasOwn(expected, entry.key));
            if (recoveryConfigFingerprint(nonOwned(environment)) !== recoveryConfigFingerprint(nonOwned(baseline))) {
              throw new Error("recovery_non_owned_configuration_drift");
            }
            fingerprints[role] = { serviceId: id, fingerprint };
          }
