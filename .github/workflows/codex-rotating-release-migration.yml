name: Codex rotating trusted release migration

on:
  workflow_dispatch:
    inputs:
      rollout_id:
        description: Unique non-reusable rollout identifier
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: codex-rotating-release-migration-production
  cancel-in-progress: false

jobs:
  trusted-release-migration:
    name: trusted-release-migration
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
      RENDER_PROJECT_ID: ${{ vars.RENDER_PROJECT_ID }}
      RENDER_ENVIRONMENT_ID: ${{ vars.RENDER_ENVIRONMENT_ID }}
      REVIEW_ROUTER_RENDER_DATABASE_ID: ${{ vars.REVIEW_ROUTER_RENDER_DATABASE_ID }}
      REVIEW_ROUTER_RENDER_DATABASE_IDENTITY: ${{ vars.REVIEW_ROUTER_RENDER_DATABASE_IDENTITY }}
      REVIEW_ROUTER_RENDER_MIGRATION_SERVICE_ID: ${{ vars.REVIEW_ROUTER_RENDER_MIGRATION_SERVICE_ID }}
      REVIEW_ROUTER_RENDER_MIGRATION_DEPLOY_ID: ${{ vars.REVIEW_ROUTER_RENDER_MIGRATION_DEPLOY_ID }}
      REVIEW_ROUTER_RENDER_COMMIT_SHA: ${{ github.sha }}
      REVIEW_ROUTER_RENDER_IMAGE_DIGEST: ${{ vars.REVIEW_ROUTER_RENDER_IMAGE_DIGEST }}
      REVIEW_ROUTER_ROLE_BOOTSTRAP_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_ROLE_BOOTSTRAP_DATABASE_URL }}
      REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL }}
      REVIEW_ROUTER_API_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_API_DATABASE_URL }}
      REVIEW_ROUTER_WEB_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_WEB_DATABASE_URL }}
      REVIEW_ROUTER_WORKER_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_WORKER_DATABASE_URL }}
      REVIEW_ROUTER_CODEX_EFFECT_AUTHORITY_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_CODEX_EFFECT_AUTHORITY_DATABASE_URL }}
      REVIEW_ROUTER_ROLLOUT_EVIDENCE_ROLLOUT_ID: ${{ inputs.rollout_id }}
      REVIEW_ROUTER_ROLLOUT_EVIDENCE_ARTIFACT_NAME: reviewrouter-trusted-rollout-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install exact package manager
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve immutable GitHub job identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const response = await fetch(
            `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/jobs?filter=latest&per_page=100`,
            { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: "application/vnd.github+json" } },
          );
          if (!response.ok) throw new Error(`job identity lookup failed: ${response.status}`);
          const value = await response.json();
          const jobs = value.jobs.filter((job) =>
            job.name === "trusted-release-migration" &&
            job.run_attempt === Number(process.env.GITHUB_RUN_ATTEMPT),
          );
          if (value.total_count !== value.jobs.length || jobs.length !== 1)
            throw new Error("job identity is not unique and complete");
          appendFileSync(process.env.GITHUB_ENV, `REVIEW_ROUTER_GITHUB_JOB_ID=${jobs[0].id}\n`);
          NODE

      - name: Run the exclusive canonical Render migration caller
        run: |
          node scripts/run-render-codex-rotating-migration-job.mjs > migration-job.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const value = JSON.parse(readFileSync("migration-job.json", "utf8"));
          if (value.status !== "succeeded") throw new Error("migration job did not succeed");
          appendFileSync(process.env.GITHUB_ENV, `REVIEW_ROUTER_RENDER_MIGRATION_JOB_ID=${value.jobId}\n`);
          NODE

      - name: Capture authenticated Render job, logs, image, and database identity
        env:
          REVIEW_ROUTER_PROVENANCE_PROVIDER: render-migration
        run: node scripts/codex-rotating-provider-provenance.mjs > render-migration-observation.json

      - name: Assemble provider-bound migration evidence
        env:
          REVIEW_ROUTER_RENDER_PROVIDER_OBSERVATION_FILE: render-migration-observation.json
        run: |
          mkdir trusted-evidence
          node scripts/assemble-codex-rotating-trusted-evidence.mjs > trusted-evidence/reviewrouter-trusted-rollout-evidence.json

      - name: Upload immutable trusted evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.REVIEW_ROUTER_ROLLOUT_EVIDENCE_ARTIFACT_NAME }}
          path: trusted-evidence/reviewrouter-trusted-rollout-evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
