name: PG17 maintenance migration

on:
  workflow_dispatch:
    inputs:
      source_db_id:
        description: Exact Render PostgreSQL 16 source database ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: reviewrouter-pg17-maintenance-migration
  cancel-in-progress: false

jobs:
  verified-backup:
    name: Create verified encrypted PG16 backup
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      PG17_MIGRATION_BACKUP_KEY: ${{ secrets.PG17_MIGRATION_BACKUP_KEY }}
      SOURCE_DB_ID: ${{ inputs.source_db_id }}
    steps:
      - name: Checkout immutable migration tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Create, validate, and encrypt logical backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${RENDER_API_KEY:-}"
          test -n "${PG17_MIGRATION_BACKUP_KEY:-}"
          [[ "$SOURCE_DB_ID" =~ ^dpg-[a-z0-9-]+$ ]]

          work="$RUNNER_TEMP/reviewrouter-pg17-backup"
          mkdir -p "$work"
          connection_info="$work/connection-info.json"
          export_list="$work/exports.json"
          plain_backup="$work/reviewrouter-pg16.dir.tar.gz"
          encrypted_backup="$work/reviewrouter-pg16.dir.tar.gz.enc"
          trap 'rm -f "$connection_info" "$plain_backup"' EXIT

          render_api() {
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 90 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }

          render_api \
            "https://api.render.com/v1/postgres/$SOURCE_DB_ID/connection-info" \
            > "$connection_info"
          export DATABASE_URL
          DATABASE_URL="$(jq -er '.externalConnectionString' "$connection_info")"

          docker pull postgres:16-alpine >/dev/null
          docker run --rm -e DATABASE_URL postgres:16-alpine \
            sh -ceu 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
              SELECT json_build_object(
                '\''serverVersion'\'', current_setting('\''server_version'\''),
                '\''serverMajor'\'', current_setting('\''server_version_num'\'')::integer / 10000,
                '\''databaseSizeBytes'\'', pg_database_size(current_database()),
                '\''publicTableCount'\'', (
                  SELECT count(*) FROM information_schema.tables
                  WHERE table_schema = '\''public'\'' AND table_type = '\''BASE TABLE'\''
                ),
                '\''appliedMigrationCount'\'', (
                  SELECT count(*) FROM \"_prisma_migrations\"
                  WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL
                )
              );
            "' > "$work/source-stats.json"
          jq -e '.serverMajor == 16' "$work/source-stats.json" >/dev/null

          started_at="$(date -u -d '2 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          render_api -X POST \
            "https://api.render.com/v1/postgres/$SOURCE_DB_ID/export" \
            -o "$work/export-start.json"

          export_id=""
          export_created_at=""
          export_url=""
          for _ in $(seq 1 100); do
            render_api \
              "https://api.render.com/v1/postgres/$SOURCE_DB_ID/export" \
              > "$export_list"
            export_id="$(
              jq -er --arg started "$started_at" '
                [.[] | select(.url != null and .createdAt >= $started)]
                | sort_by(.createdAt) | last | .id // empty
              ' "$export_list" 2>/dev/null || true
            )"
            if [[ -n "$export_id" ]]; then
              export_created_at="$(
                jq -er --arg id "$export_id" '.[] | select(.id == $id) | .createdAt' "$export_list"
              )"
              export_url="$(
                jq -er --arg id "$export_id" '.[] | select(.id == $id) | .url' "$export_list"
              )"
              break
            fi
            sleep 12
          done
          test -n "$export_id"
          test -n "$export_url"

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 1200 \
            "$export_url" -o "$plain_backup"
          test -s "$plain_backup"
          gzip -t "$plain_backup"
          tar -tzf "$plain_backup" > "$work/archive-list.txt"
          test -s "$work/archive-list.txt"
          if awk '
            /^\// { bad=1 }
            /(^|\/)\.\.(\/|$)/ { bad=1 }
            END { exit bad ? 0 : 1 }
          ' "$work/archive-list.txt"; then
            echo "::error::backup archive contains an unsafe path"
            exit 1
          fi

          plain_sha256="$(sha256sum "$plain_backup" | cut -d' ' -f1)"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$plain_backup" -out "$encrypted_backup" \
            -pass env:PG17_MIGRATION_BACKUP_KEY
          encrypted_sha256="$(sha256sum "$encrypted_backup" | cut -d' ' -f1)"
          rm -f "$plain_backup" "$connection_info"
          unset DATABASE_URL export_url

          jq -n \
            --arg sourceDbId "$SOURCE_DB_ID" \
            --arg exportId "$export_id" \
            --arg exportCreatedAt "$export_created_at" \
            --arg plainSha256 "$plain_sha256" \
            --arg encryptedSha256 "$encrypted_sha256" \
            --arg runId "$GITHUB_RUN_ID" \
            --slurpfile sourceStats "$work/source-stats.json" \
            '{
              formatVersion: 1,
              sourceDbId: $sourceDbId,
              exportId: $exportId,
              exportCreatedAt: $exportCreatedAt,
              plainSha256: $plainSha256,
              encryptedSha256: $encryptedSha256,
              githubRunId: $runId,
              sourceStats: $sourceStats[0]
            }' > "$work/manifest.json"

          echo "artifact_name=reviewrouter-pg16-backup-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified encrypted PG16 backup"
            echo
            echo "- Source database: \`$SOURCE_DB_ID\`"
            echo "- Export: \`$export_id\`"
            echo "- Encrypted SHA-256: \`$encrypted_sha256\`"
            echo "- Source facts: \`$(jq -c . "$work/source-stats.json")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/reviewrouter-pg17-backup/reviewrouter-pg16.dir.tar.gz.enc
            ${{ runner.temp }}/reviewrouter-pg17-backup/manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
