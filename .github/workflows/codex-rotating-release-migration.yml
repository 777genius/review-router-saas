name: PG17 cutover recovery

on:
  workflow_dispatch:
    inputs:
      target_db_id:
        description: Existing restored Render PostgreSQL 17 database ID
        required: true
        type: string
      owner_id:
        description: Exact Render workspace owner ID
        required: true
        type: string
      environment_id:
        description: Exact Render environment ID
        required: true
        type: string
      release_commit_sha:
        description: Exact review-router-saas main commit
        required: true
        type: string
      action_commit_sha:
        description: Exact review-router Action commit to register
        required: false
        type: string
      open_global_emergency:
        description: Open the Review v2 global kill switch after verified registration
        required: false
        default: false
        type: boolean
      operator_repository:
        description: Optional OWNER/REPO whose repository kill switch is opened after the global switch
        required: false
        type: string
      operator_workspace_id:
        description: Optional ReviewRouter workspace whose kill switch is opened after the global switch
        required: false
        type: string
      investigation_rollout_profile:
        description: Deterministic Review Investigation capability profile to persist before deployment
        required: false
        default: preserve
        type: choice
        options:
          - preserve
          - shadow
          - production
      investigation_repository_connection_id:
        description: Exact repository connection ID required by the production investigation cohort
        required: false
        type: string
      investigation_producer_release_id:
        description: Exact producer release ID required by the production investigation cohort
        required: false
        type: string
      api_service_id:
        description: Exact Render API service ID
        required: true
        type: string
      worker_service_id:
        description: Exact Render worker service ID
        required: true
        type: string
      web_service_id:
        description: Exact Render web service ID
        required: true
        type: string
      confirmation:
        description: Type the confirmation required by the selected operation
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: reviewrouter-pg17-maintenance-migration
  cancel-in-progress: false

jobs:
  disposable-render-suspended-deploy-probe:
    name: Disposable Render suspended deploy probe
    if: ${{ inputs.confirmation == 'PROBE_DISPOSABLE_RENDER_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
    steps:
      - name: Prove exact suspended deploy and resume behavior
        shell: bash
        run: |
          set -euo pipefail
          service_id=srv-dadmkmon74is73an837g
          owner_id=tea-d11m6c0dl3ps73cuh2gg
          service_name=rr-render-recovery-e2e-20260905
          initial_commit=0d4ea22dbb92ce1c9ad1b5ed8083409b5f44a5e5
          candidate_commit=f0bea0b542fc370bd380bd8b07dae97426dc389b
          service_url=https://rr-render-recovery-e2e-20260905.onrender.com
          expected_ref=refs/heads/test/render-suspended-deploy-e2e-20260905
          [[ "$GITHUB_REPOSITORY" == "777genius/review-router-saas" ]]
          [[ "$GITHUB_REF" == "$expected_ref" ]]
          [[ "$service_id" == srv-dadmkmon74is73an837g ]]
          [[ "$candidate_commit" =~ ^[a-f0-9]{40}$ ]]
          test -n "$RENDER_API_KEY"

          render_read() {
            curl --fail --silent --show-error \
              --connect-timeout 5 --max-time 20 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          render_mutation() {
            curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 60 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          touched=0
          complete=0
          cleanup() {
            status=$?
            trap - EXIT
            set +e
            if [[ "$touched" -eq 1 ]]; then
              render_mutation -X POST \
                "https://api.render.com/v1/services/$service_id/suspend" \
                -o /dev/null
            fi
            exit "$status"
          }
          trap cleanup EXIT

          service="$(render_read "https://api.render.com/v1/services/$service_id")"
          jq -e \
            --arg id "$service_id" \
            --arg owner "$owner_id" \
            --arg name "$service_name" '
              (.service // .)
              | .id == $id
                and (.ownerId // .owner.id) == $owner
                and .name == $name
                and .type == "web_service"
                and .suspended == "not_suspended"
            ' <<<"$service" >/dev/null
          inventory="$(render_read "https://api.render.com/v1/services/$service_id/deploys?limit=20")"
          jq -e --arg sha "$initial_commit" '
            (if type == "array" then . else .deploys end)
            | map(.deploy // .)
            | length >= 1
              and .[0].status == "live"
              and (.[0].commit.id // .[0].commit.sha // .[0].commitId) == $sha
              and ([.[] | select(.status != "live" and (.status | endswith("_failed") | not) and .status != "canceled" and .status != "deactivated")] | length) == 0
            ' <<<"$inventory" >/dev/null

          touched=1
          render_mutation -X POST \
            "https://api.render.com/v1/services/$service_id/suspend" \
            -o /dev/null
          suspension_deadline=$((SECONDS + 300))
          while (( SECONDS < suspension_deadline )); do
            service="$(render_read "https://api.render.com/v1/services/$service_id")"
            if jq -e --arg id "$service_id" '
              (.service // .) | .id == $id and .suspended == "suspended"
            ' <<<"$service" >/dev/null; then
              break
            fi
            sleep 5
          done
          jq -e --arg id "$service_id" '
            (.service // .) | .id == $id and .suspended == "suspended"
          ' <<<"$service" >/dev/null

          request="$(jq -nc --arg commitId "$candidate_commit" '{clearCache:"do_not_clear", commitId:$commitId}')"
          response="$(render_mutation -X POST -H "Content-Type: application/json" \
            --data-binary "$request" \
            "https://api.render.com/v1/services/$service_id/deploys")"
          deploy_id="$(jq -er --arg service "$service_id" --arg sha "$candidate_commit" '
            (.deploy // .) as $deploy
            | select(($deploy.serviceId // $service) == $service)
            | select(($deploy.commit.id // $deploy.commit.sha // $deploy.commitId) == $sha)
            | $deploy.id
            | select(type == "string" and test("^dep-[a-z0-9-]+$"))
          ' <<<"$response")"

          deploy_deadline=$((SECONDS + 900))
          while (( SECONDS < deploy_deadline )); do
            service="$(render_read "https://api.render.com/v1/services/$service_id")"
            jq -e --arg id "$service_id" '
              (.service // .) | .id == $id and .suspended == "suspended"
            ' <<<"$service" >/dev/null
            deploy="$(render_read "https://api.render.com/v1/services/$service_id/deploys/$deploy_id")"
            status="$(jq -er '(.deploy // .).status' <<<"$deploy")"
            if [[ "$status" == "live" ]]; then
              break
            fi
            if [[ "$status" == *_failed || "$status" == "failed" || "$status" == "canceled" || "$status" == "deactivated" ]]; then
              jq -c . <<<"$deploy"
              exit 1
            fi
            sleep 10
          done
          jq -e --arg id "$deploy_id" --arg service "$service_id" --arg sha "$candidate_commit" '
            (.deploy // .) as $deploy
            | $deploy.id == $id
              and ($deploy.serviceId // $service) == $service
              and $deploy.status == "live"
              and ($deploy.commit.id // $deploy.commit.sha // $deploy.commitId) == $sha
          ' <<<"$deploy" >/dev/null
          service="$(render_read "https://api.render.com/v1/services/$service_id")"
          jq -e --arg id "$service_id" '
            (.service // .) | .id == $id and .suspended == "suspended"
          ' <<<"$service" >/dev/null

          render_mutation -X POST \
            "https://api.render.com/v1/services/$service_id/resume" \
            -o /dev/null
          resume_deadline=$((SECONDS + 300))
          while (( SECONDS < resume_deadline )); do
            service="$(render_read "https://api.render.com/v1/services/$service_id")"
            if jq -e --arg id "$service_id" '
              (.service // .) | .id == $id and .suspended == "not_suspended"
            ' <<<"$service" >/dev/null; then
              break
            fi
            sleep 5
          done
          jq -e --arg id "$service_id" '
            (.service // .) | .id == $id and .suspended == "not_suspended"
          ' <<<"$service" >/dev/null

          health_deadline=$((SECONDS + 300))
          while (( SECONDS < health_deadline )); do
            health="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 20 "$service_url/health" || true)"
            if jq -e '.ok == true and .marker == "candidate"' <<<"$health" >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done
          jq -e '.ok == true and .marker == "candidate"' <<<"$health" >/dev/null
          printf '%s\n' "$deploy" | jq -c '{deploy: (.deploy // .) | {id, serviceId, status, commit}}'
          printf '%s\n' "$health" | jq -c .

          render_mutation -X POST \
            "https://api.render.com/v1/services/$service_id/suspend" \
            -o /dev/null
          final_deadline=$((SECONDS + 300))
          while (( SECONDS < final_deadline )); do
            service="$(render_read "https://api.render.com/v1/services/$service_id")"
            if jq -e --arg id "$service_id" '
              (.service // .) | .id == $id and .suspended == "suspended"
            ' <<<"$service" >/dev/null; then
              complete=1
              break
            fi
            sleep 5
          done
          [[ "$complete" -eq 1 ]]
          trap - EXIT

  trust-bootstrap:
    name: Verify protected main dispatch
    if: ${{ inputs.confirmation != 'PROBE_DISPOSABLE_RENDER_ONLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      trusted_main_sha: ${{ steps.trust.outputs.trusted_main_sha }}
    steps:
      - name: Establish immutable workflow trust before repository execution
        id: trust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync } = await import("node:fs");
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`registration_trust_missing:${name}`);
            return value;
          };
          const fail = (reason) => {
            throw new Error(`registration_trust_rejected:${reason}`);
          };
          const repository = required("GITHUB_REPOSITORY");
          const dispatchSha = required("GITHUB_SHA").toLowerCase();
          if (required("GITHUB_EVENT_NAME") !== "workflow_dispatch") fail("event");
          if (required("GITHUB_REF") !== "refs/heads/main") fail("workflow_ref");
          if (!/^[a-f0-9]{40}$/.test(dispatchSha)) fail("dispatch_sha");
          const response = await fetch(
            `https://api.github.com/repos/${repository}/branches/main`,
            {
              headers: {
                Authorization: `Bearer ${required("GH_TOKEN")}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
              },
              signal: AbortSignal.timeout(20000),
            },
          );
          if (!response.ok) fail(`github_api_${response.status}`);
          const branch = await response.json();
          if (
            branch.protected !== true ||
            branch.commit?.sha?.toLowerCase() !== dispatchSha
          ) {
            fail("stale_or_unprotected_main");
          }
          const environmentResponse = await fetch(
            `https://api.github.com/repos/${repository}/environments/production-release`,
            {
              headers: {
                Authorization: `Bearer ${required("GH_TOKEN")}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
              },
              signal: AbortSignal.timeout(20000),
            },
          );
          if (!environmentResponse.ok) fail(`environment_api_${environmentResponse.status}`);
          const environment = await environmentResponse.json();
          const reviewers = environment.protection_rules?.find(
            (rule) => rule.type === "required_reviewers",
          );
          if (
            !Array.isArray(reviewers?.reviewers) ||
            reviewers.reviewers.length === 0 ||
            reviewers.prevent_self_review !== true ||
            environment.deployment_branch_policy?.protected_branches !== true ||
            environment.deployment_branch_policy?.custom_branch_policies !== false
          ) fail("environment_unprotected");
          appendFileSync(
            required("GITHUB_OUTPUT"),
            `trusted_main_sha=${dispatchSha}\n`,
            "utf8",
          );
          NODE

  release-evidence:
    name: Verify exact recovery release evidence
    needs: trust-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout immutable release verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.trust-bootstrap.outputs.trusted_main_sha }}
      - name: Require exact PostgreSQL release-gate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_ROUTER_RELEASE_GATE_SHA: ${{ inputs.release_commit_sha }}
        run: |
          set -euo pipefail
          node scripts/release-gate-evidence.mjs verify

  recover:
    name: Complete restored PG17 cutover
    needs: [trust-bootstrap, release-evidence]
    environment: production-release
    if: ${{ inputs.confirmation == 'RECOVER_EXISTING_PG17' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64: ${{ secrets.SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64 }}
      TARGET_DB_ID: ${{ inputs.target_db_id }}
      RENDER_OWNER_ID: ${{ inputs.owner_id }}
      RENDER_ENVIRONMENT_ID: ${{ inputs.environment_id }}
      RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
      API_SERVICE_ID: ${{ inputs.api_service_id }}
      WORKER_SERVICE_ID: ${{ inputs.worker_service_id }}
      WEB_SERVICE_ID: ${{ inputs.web_service_id }}
      MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout immutable recovery tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.trust-bootstrap.outputs.trusted_main_sha }}

      - name: Install and validate recovery tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$MIGRATION_CONFIRMATION" = "RECOVER_EXISTING_PG17"
          [[ "$TARGET_DB_ID" =~ ^dpg-[a-z0-9-]+$ ]]
          [[ "$RENDER_OWNER_ID" =~ ^tea-[a-z0-9-]+$ ]]
          [[ "$RENDER_ENVIRONMENT_ID" =~ ^evm-[a-z0-9-]+$ ]]
          [[ "$RELEASE_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          TRUSTED_MAIN_SHA="${{ needs.trust-bootstrap.outputs.trusted_main_sha }}"
          [[ "$TRUSTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git cat-file -t "$RELEASE_COMMIT_SHA")" == "commit" ]]
          [[ "$(git cat-file -t "$TRUSTED_MAIN_SHA")" == "commit" ]]
          git merge-base --is-ancestor "$RELEASE_COMMIT_SHA" "$TRUSTED_MAIN_SHA"
          git switch --detach "$RELEASE_COMMIT_SHA"
          observed_source_sha="$(git rev-parse HEAD)"
          [[ "$observed_source_sha" == "$RELEASE_COMMIT_SHA" ]]
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            [[ "$service_id" =~ ^srv-[a-z0-9-]+$ ]]
          done
          [[ "$API_SERVICE_ID" != "$WORKER_SERVICE_ID" ]]
          [[ "$API_SERVICE_ID" != "$WEB_SERVICE_ID" ]]
          [[ "$WORKER_SERVICE_ID" != "$WEB_SERVICE_ID" ]]
          corepack enable
          node scripts/install-private-dependencies.mjs --frozen-lockfile
          pnpm db:generate
          docker pull postgres:17-alpine >/dev/null

      - name: Provision roles, migrate, switch services, and resume
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/reviewrouter-pg17-recovery"
          mkdir -p "$work"
          firewall_open=0
          render_api() {
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 120 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          # A deploy creation has an uncertain side-effect boundary. Never retry
          # this POST; reconcile an accepted-but-unobserved response instead.
          render_deploy_mutation() {
            curl --fail --silent --show-error \
              --connect-timeout 15 --max-time 120 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          # Activation-sensitive reads must honor the caller's absolute
          # deadline. Retrying a page here could make an outer deadline
          # meaningless while the fleet is suspended or partly resumed.
          render_inventory_api() {
            local absolute_deadline="$1"
            local remaining request_timeout
            shift
            remaining=$((absolute_deadline - SECONDS))
            if (( remaining <= 0 )); then
              echo "::error::Render inventory deadline expired before request" >&2
              return 124
            fi
            request_timeout="$remaining"
            if (( request_timeout > 20 )); then
              request_timeout=20
            fi
            curl --fail --silent --show-error \
              --connect-timeout 5 --max-time "$request_timeout" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          suspension_guard_armed=0
          recovery_complete=0
          recovery_suspension_set_filter='
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and ([.[].observedServiceId] | unique | length == 3)
            and all(
              .serviceId == .observedServiceId
              and .suspended == "suspended"
            )
          '
          close_firewall() {
            if [[ "$firewall_open" -eq 1 ]]; then
              render_api -X PATCH \
                -H "Content-Type: application/json" \
                --data-binary '{"ipAllowList":[]}' \
                "https://api.render.com/v1/postgres/$TARGET_DB_ID" \
                -o /dev/null || return 1
              render_api "https://api.render.com/v1/postgres/$TARGET_DB_ID" \
                | jq -e --arg targetDbId "$TARGET_DB_ID" '
                    .id == $targetDbId and .ipAllowList == []
                  ' >/dev/null || return 1
              firewall_open=0
            fi
          }
          compensate_recovery_fleet() {
            local deadline observations observed_service_id service service_id state
            deadline=$((SECONDS + ${RECOVERY_COMPENSATION_TIMEOUT_SECONDS:-300}))
            observations='[]'
            while (( SECONDS < deadline )); do
              for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
                # A resume response may be uncertain or not visible yet. Retry
                # the idempotent suspend for every exact ID within one absolute
                # deadline, including one that still reads as suspended.
                render_inventory_api "$deadline" -X POST \
                  "https://api.render.com/v1/services/$service_id/suspend" \
                  -o /dev/null || true
              done
              observations='[]'
              for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
                service="$(
                  render_inventory_api "$deadline" \
                    "https://api.render.com/v1/services/$service_id" \
                    2>/dev/null || true
                )"
                observed_service_id="$(
                  jq -er '(.service // .).id' <<<"$service" 2>/dev/null || true
                )"
                state="$(
                  jq -er '(.service // .).suspended' \
                    <<<"$service" 2>/dev/null || true
                )"
                observations="$(
                  jq -c \
                    --arg serviceId "$service_id" \
                    --arg observedServiceId "$observed_service_id" \
                    --arg suspended "$state" '
                      . + [{
                        serviceId: $serviceId,
                        observedServiceId: $observedServiceId,
                        suspended: $suspended
                      }]
                    ' \
                    <<<"$observations"
                )"
              done
              if jq -e "$recovery_suspension_set_filter" \
                <<<"$observations" >/dev/null; then
                break
              fi
              sleep 10
            done
            printf '%s\n' "$observations" \
              > "$work/compensation-suspension-result.json"
            jq -e "$recovery_suspension_set_filter" \
              <<<"$observations" >/dev/null
          }
          cleanup() {
            local cleanup_status=$?
            trap - EXIT
            trap '' HUP INT TERM
            set +e
            if [[ "$suspension_guard_armed" -eq 1 && "$recovery_complete" -eq 0 ]]; then
              echo "::warning::Recovery exited after the suspension barrier; converging all runtime services back to suspended."
              if ! compensate_recovery_fleet; then
                echo "::error::Recovery compensation could not prove all runtime services suspended."
                if [[ "$cleanup_status" -eq 0 ]]; then
                  cleanup_status=1
                fi
              fi
            fi
            if ! close_firewall; then
              echo "::error::Recovery could not prove the database firewall closed."
              cleanup_status=1
            fi
            rm -f "$work"/*secret* "$work"/*url* "$work"/*env.json "$work/connection-info.json"
            exit "$cleanup_status"
          }
          terminate_recovery() {
            local signal_status="$1"
            # Convert runner cancellation signals to a normal shell exit so
            # the EXIT trap can converge the exact fleet back to suspended.
            trap '' HUP INT TERM
            exit "$signal_status"
          }
          trap cleanup EXIT
          trap 'terminate_recovery 129' HUP
          trap 'terminate_recovery 130' INT
          trap 'terminate_recovery 143' TERM

          # Validate the complete fleet before the first provider mutation.
          service_scope_filter='
            (.service // .)
            | .id == $serviceId
              and (.ownerId // .owner.id) == $ownerId
              and .environmentId == $environmentId
              and .type == $serviceType
              and (.suspended == "suspended" or .suspended == "not_suspended")
          '
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            service_type=web_service
            if [[ "$service_id" == "$WORKER_SERVICE_ID" ]]; then
              service_type=background_worker
            fi
            render_api "https://api.render.com/v1/services/$service_id" \
              | jq -e --arg serviceId "$service_id" \
                --arg ownerId "$RENDER_OWNER_ID" \
                --arg environmentId "$RENDER_ENVIRONMENT_ID" \
                --arg serviceType "$service_type" \
                "$service_scope_filter" >/dev/null
          done

          # Converge both an initially live set and a partially suspended set
          # to the same fail-closed barrier. No database or credential mutation
          # is permitted above the proof that all three exact IDs are stopped.
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            service="$(render_api "https://api.render.com/v1/services/$service_id")"
            state="$(
              jq -er --arg serviceId "$service_id" '
                (.service // .)
                | select(.id == $serviceId)
                | .suspended
              ' <<<"$service"
            )"
            if [[ "$state" != "suspended" ]]; then
              render_api -X POST \
                "https://api.render.com/v1/services/$service_id/suspend" \
                -o /dev/null
            fi
          done
          suspension_deadline=$((SECONDS + 600))
          while (( SECONDS < suspension_deadline )); do
            suspension_observations='[]'
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              service="$(render_api "https://api.render.com/v1/services/$service_id")"
              suspension_observations="$(
                jq -c \
                  --arg serviceId "$service_id" \
                  --arg observedServiceId "$(
                    jq -er '(.service // .).id' <<<"$service"
                  )" \
                  --arg suspended "$(
                    jq -er '(.service // .).suspended' <<<"$service"
                  )" '
                    . + [{
                      serviceId: $serviceId,
                      observedServiceId: $observedServiceId,
                      suspended: $suspended
                    }]
                  ' \
                  <<<"$suspension_observations"
              )"
            done
            if jq -e "$recovery_suspension_set_filter" \
              <<<"$suspension_observations" >/dev/null; then
              break
            fi
            sleep 10
          done
          jq -e "$recovery_suspension_set_filter" \
            <<<"$suspension_observations" >/dev/null
          suspension_guard_armed=1
          recovery_phase_key="REVIEW_ROUTER_PG17_RECOVERY_PHASE"
          read_recovery_phase() {
            local service_id="$1"
            render_api "https://api.render.com/v1/services/$service_id/env-vars" \
              | jq -er --arg key "$recovery_phase_key" '
                  map(.envVar // .)
                  | (map(select(.key == $key))[0].value // "{}")
                  | try fromjson catch {}
                  | if type == "object" then . else {} end
                '
          }
          prior_recovery_phases='[]'
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            prior_recovery_phases="$(
              jq -c --arg serviceId "$service_id" \
                --argjson state "$(read_recovery_phase "$service_id")" \
                '. + [{serviceId: $serviceId, state: $state}]' \
                <<<"$prior_recovery_phases"
            )"
          done
          printf '%s\n' "$prior_recovery_phases" > "$work/recovery-resume-state.json"
          persist_recovery_phase() {
            local phase="$1"
            jq -n \
              --arg phase "$phase" \
              --arg targetDbId "$TARGET_DB_ID" \
              --arg releaseCommitSha "$RELEASE_COMMIT_SHA" '
                {value: ({
                  schemaVersion: 1,
                  phase: $phase,
                  targetDbId: $targetDbId,
                  releaseCommitSha: $releaseCommitSha
                } | tojson)}
              ' \
              > "$work/recovery-phase-env.json"
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              render_api -X PUT -H "Content-Type: application/json" \
                --data-binary @"$work/recovery-phase-env.json" \
                "https://api.render.com/v1/services/$service_id/env-vars/$recovery_phase_key" \
                -o /dev/null
            done
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              read_recovery_phase "$service_id" | jq -e \
                --arg phase "$phase" \
                --arg targetDbId "$TARGET_DB_ID" \
                --arg releaseCommitSha "$RELEASE_COMMIT_SHA" '
                  .schemaVersion == 1
                  and .phase == $phase
                  and .targetDbId == $targetDbId
                  and .releaseCommitSha == $releaseCommitSha
                ' >/dev/null
            done
          }
          persist_recovery_phase "services_suspended"
          jq -n \
            --arg phase "services_suspended" \
            --arg runId "$GITHUB_RUN_ID" \
            --argjson services "$suspension_observations" \
            '{phase: $phase, runId: $runId, services: $services}' \
            > "$work/recovery-phase.json"

          render_api "https://api.render.com/v1/postgres/$TARGET_DB_ID" > "$work/target.json"
          jq -e \
            --arg ownerId "$RENDER_OWNER_ID" \
            --arg environmentId "$RENDER_ENVIRONMENT_ID" '
              .version == "17"
              and .status == "available"
              and .name == "reviewrouter-db"
              and .environmentId == $environmentId
              and ((.ownerId // .owner.id) == $ownerId)
            ' "$work/target.json" >/dev/null

          runner_ip="$(curl --fail --silent --show-error --max-time 30 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          jq -n --arg cidr "$runner_ip/32" '{ipAllowList: [{
            cidrBlock: $cidr,
            description: "temporary GitHub PG17 cutover recovery"
          }]}' > "$work/firewall.json"
          # Arm cleanup before the PATCH: an accepted request can lose its response.
          firewall_open=1
          render_api -X PATCH -H "Content-Type: application/json" \
            --data-binary @"$work/firewall.json" \
            "https://api.render.com/v1/postgres/$TARGET_DB_ID" -o /dev/null

          render_api "https://api.render.com/v1/postgres/$TARGET_DB_ID/connection-info" \
            > "$work/connection-info.json"
          WORK="$work" node --input-type=module <<'NODE'
          import { randomBytes } from "node:crypto";
          import { chmodSync, readFileSync, writeFileSync } from "node:fs";

          const work = process.env.WORK;
          const connection = JSON.parse(readFileSync(`${work}/connection-info.json`, "utf8"));
          const credential = () => randomBytes(32).toString("base64url");
          const roles = {
            api: { username: "reviewrouter_api", password: credential() },
            web: { username: "reviewrouter_web", password: credential() },
            worker: { username: "reviewrouter_worker", password: credential() },
            effectAuthority: {
              username: "reviewrouter_codex_effect_authority",
              password: credential(),
            },
            commentTokenCustody: {
              username: "reviewrouter_comment_token_custody",
              password: credential(),
            },
          };
          const project = (base, role) => {
            const url = new URL(base);
            url.username = role.username;
            url.password = role.password;
            return url.toString();
          };
          const urls = { roles: {} };
          for (const [name, role] of Object.entries(roles)) {
            urls.roles[name] = {
              external: project(connection.externalConnectionString, role),
              internal: project(connection.internalConnectionString, role),
            };
          }
          writeFileSync(`${work}/runtime-role-secrets.json`, `${JSON.stringify({ roles })}\n`, { mode: 0o600 });
          writeFileSync(`${work}/runtime-role-urls.json`, `${JSON.stringify(urls)}\n`, { mode: 0o600 });
          chmodSync(`${work}/runtime-role-secrets.json`, 0o600);
          chmodSync(`${work}/runtime-role-urls.json`, 0o600);
          NODE

          external_url="$(jq -er '.externalConnectionString' "$work/connection-info.json")"
          if [[ "$external_url" == *\?* ]]; then
            external_url="$external_url&sslmode=require&connect_timeout=15"
          else
            external_url="$external_url?sslmode=require&connect_timeout=15"
          fi
          export DATABASE_URL="$external_url"
          docker run --rm -e DATABASE_URL postgres:17-alpine \
            sh -ceu 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
              SELECT json_build_object(
                '\''serverMajor'\'', current_setting('\''server_version_num'\'')::integer / 10000,
                '\''publicTableCount'\'', (SELECT count(*) FROM information_schema.tables WHERE table_schema='\''public'\'' AND table_type='\''BASE TABLE'\''),
                '\''appliedMigrationCount'\'', (SELECT count(*) FROM \"_prisma_migrations\" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL)
              );
            "' > "$work/database-preflight.json"
          jq -c . "$work/database-preflight.json"
          jq -e '
            .serverMajor == 17
            and .publicTableCount >= 98
            and .appliedMigrationCount >= 74
          ' "$work/database-preflight.json" >/dev/null

          cat > "$work/create-runtime-roles.sql" <<'SQL'
          \set ON_ERROR_STOP on
          \getenv api_password RR_API_PASSWORD
          \getenv web_password RR_WEB_PASSWORD
          \getenv worker_password RR_WORKER_PASSWORD
          \getenv effect_password RR_EFFECT_PASSWORD
          \getenv custody_password RR_CUSTODY_PASSWORD
          BEGIN;
          SELECT 'CREATE ROLE reviewrouter_release_schema_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS'
            WHERE to_regrole('reviewrouter_release_schema_owner') IS NULL \gexec
          SELECT format('CREATE ROLE reviewrouter_api LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'api_password')
            WHERE to_regrole('reviewrouter_api') IS NULL \gexec
          SELECT format('CREATE ROLE reviewrouter_web LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'web_password')
            WHERE to_regrole('reviewrouter_web') IS NULL \gexec
          SELECT format('CREATE ROLE reviewrouter_worker LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'worker_password')
            WHERE to_regrole('reviewrouter_worker') IS NULL \gexec
          SELECT format('CREATE ROLE reviewrouter_codex_effect_authority LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'effect_password')
            WHERE to_regrole('reviewrouter_codex_effect_authority') IS NULL \gexec
          SELECT format('CREATE ROLE reviewrouter_comment_token_custody LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD %L', :'custody_password')
            WHERE to_regrole('reviewrouter_comment_token_custody') IS NULL \gexec
          ALTER ROLE reviewrouter_api LOGIN NOCREATEROLE PASSWORD :'api_password';
          ALTER ROLE reviewrouter_web LOGIN NOCREATEROLE PASSWORD :'web_password';
          ALTER ROLE reviewrouter_worker LOGIN NOCREATEROLE PASSWORD :'worker_password';
          ALTER ROLE reviewrouter_codex_effect_authority LOGIN NOCREATEROLE PASSWORD :'effect_password';
          ALTER ROLE reviewrouter_comment_token_custody NOLOGIN;
          -- Commit the login fence before terminating existing sessions so an
          -- old credential cannot race a reconnect during password rotation.
          COMMIT;
          SELECT pg_terminate_backend(pid) FROM pg_stat_activity
            WHERE usename = 'reviewrouter_comment_token_custody'
              AND pid <> pg_backend_pid();
          DO $custody_sessions$
          BEGIN
            IF EXISTS (
              SELECT 1 FROM pg_stat_activity
              WHERE usename = 'reviewrouter_comment_token_custody'
            ) THEN
              RAISE EXCEPTION 'custody credential rotation retained an old backend';
            END IF;
          END
          $custody_sessions$;
          BEGIN;
          ALTER ROLE reviewrouter_comment_token_custody LOGIN NOCREATEROLE PASSWORD :'custody_password';
          DO $membership$
          BEGIN
            IF NOT pg_has_role(current_user, 'reviewrouter_release_schema_owner', 'MEMBER') THEN
              RAISE EXCEPTION 'database owner lacks schema-owner membership';
            END IF;
          END
          $membership$;
          COMMIT;
          SQL
          chmod 600 "$work/create-runtime-roles.sql"
          export RR_API_PASSWORD RR_WEB_PASSWORD RR_WORKER_PASSWORD RR_EFFECT_PASSWORD RR_CUSTODY_PASSWORD
          RR_API_PASSWORD="$(jq -er '.roles.api.password' "$work/runtime-role-secrets.json")"
          RR_WEB_PASSWORD="$(jq -er '.roles.web.password' "$work/runtime-role-secrets.json")"
          RR_WORKER_PASSWORD="$(jq -er '.roles.worker.password' "$work/runtime-role-secrets.json")"
          RR_EFFECT_PASSWORD="$(jq -er '.roles.effectAuthority.password' "$work/runtime-role-secrets.json")"
          RR_CUSTODY_PASSWORD="$(jq -er '.roles.commentTokenCustody.password' "$work/runtime-role-secrets.json")"
          docker run --rm \
            -e DATABASE_URL \
            -e RR_API_PASSWORD -e RR_WEB_PASSWORD -e RR_WORKER_PASSWORD -e RR_EFFECT_PASSWORD -e RR_CUSTODY_PASSWORD \
            -v "$work:/work:ro" postgres:17-alpine \
            sh -ceu 'psql "$DATABASE_URL" --no-psqlrc --quiet --file=/work/create-runtime-roles.sql'
          unset RR_API_PASSWORD RR_WEB_PASSWORD RR_WORKER_PASSWORD RR_EFFECT_PASSWORD RR_CUSTODY_PASSWORD

          persist_recovery_phase "credentials_rotated"
          jq -n --arg phase "credentials_rotated" --arg runId "$GITHUB_RUN_ID" \
            '{phase: $phase, runId: $runId}' > "$work/recovery-phase.json"

          DATABASE_URL="$external_url" pnpm db:migrate:deploy
          node --import tsx --input-type=module <<'NODE' > "$work/runtime-grants.sql"
          import { runtimeGrantSql } from "./scripts/run-codex-rotating-release-migration.mjs";
          const canonical = runtimeGrantSql({ roles: [
            { role: "api", username: "reviewrouter_api" },
            { role: "web", username: "reviewrouter_web" },
            { role: "worker", username: "reviewrouter_worker" },
            { role: "effect-authority", username: "reviewrouter_codex_effect_authority" },
            { role: "comment-token-custody", username: "reviewrouter_comment_token_custody" },
          ] });
          let removed = 0;
          const compatible = canonical.split("\n").filter((line) => {
            const skip = line.startsWith(
              "ALTER DEFAULT PRIVILEGES FOR ROLE reviewrouter_release_schema_owner IN SCHEMA public",
            );
            if (skip) removed += 1;
            return !skip;
          }).join("\n");
          if (removed !== 6) throw new Error(`unexpected_default_privilege_statement_count:${removed}`);
          process.stdout.write(compatible);
          NODE
          docker run --rm -e DATABASE_URL -v "$work:/work:ro" postgres:17-alpine \
            sh -ceu 'psql "$DATABASE_URL" --no-psqlrc --quiet --file=/work/runtime-grants.sql'

          node --input-type=module <<'NODE' > "$work/canonical-migration-catalog.json"
          import { canonicalPrismaMigrationCatalog } from "./scripts/lib/canonical-prisma-migration-catalog.mjs";
          process.stdout.write(`${JSON.stringify(canonicalPrismaMigrationCatalog)}\n`);
          NODE

          docker run --rm -e DATABASE_URL postgres:17-alpine \
            sh -ceu 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
              SELECT json_build_object(
                '\''serverMajor'\'', current_setting('\''server_version_num'\'')::integer / 10000,
                '\''publicTableCount'\'', (SELECT count(*) FROM information_schema.tables WHERE table_schema='\''public'\'' AND table_type='\''BASE TABLE'\''),
                '\''appliedMigrationCount'\'', (SELECT count(*) FROM \"_prisma_migrations\" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL),
                '\''runtimeRoleCount'\'', (SELECT count(*) FROM pg_roles WHERE rolname IN ('\''reviewrouter_api'\'','\''reviewrouter_web'\'','\''reviewrouter_worker'\'','\''reviewrouter_codex_effect_authority'\'','\''reviewrouter_comment_token_custody'\'')),
                '\''latestMigration'\'', (SELECT migration_name FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY finished_at DESC, migration_name DESC LIMIT 1),
                '\''publicConnect'\'', has_database_privilege('\''public'\'', current_database(), '\''CONNECT'\''),
                '\''apiConnect'\'', has_database_privilege('\''reviewrouter_api'\'', current_database(), '\''CONNECT'\''),
                '\''effectFunction'\'', has_function_privilege('\''reviewrouter_codex_effect_authority'\'', '\''public.codex_oauth_sign_database_authority(text)'\'', '\''EXECUTE'\''),
                '\''custodyFunction'\'', has_function_privilege('\''reviewrouter_comment_token_custody'\'', '\''public.hosted_codex_mutate_comment_token_mint(text,jsonb)'\'', '\''EXECUTE'\'')
              );
            "' > "$work/target-stats.json"
          jq -e --slurpfile canonical "$work/canonical-migration-catalog.json" '
            .serverMajor == 17
            and .publicTableCount >= 110
            and .appliedMigrationCount == $canonical[0].appliedMigrationCount
            and .runtimeRoleCount == 5
            and .latestMigration == $canonical[0].latestMigration
            and .publicConnect == false
            and .apiConnect == true
            and .effectFunction == true
            and .custodyFunction == true
          ' "$work/target-stats.json" >/dev/null

          persist_recovery_phase "migration_complete"
          jq -n --arg phase "migration_complete" --arg runId "$GITHUB_RUN_ID" \
            '{phase: $phase, runId: $runId}' > "$work/recovery-phase.json"

          jq -n --arg value "$(jq -er '.roles.api.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/api-env.json"
          jq -n --arg value "$(jq -er '.roles.web.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/web-env.json"
          jq -n --arg value "$(jq -er '.roles.worker.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/worker-env.json"
          jq -n --arg value "$(jq -er '.roles.effectAuthority.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/effect-env.json"
          jq -n --arg value "$(jq -er '.roles.commentTokenCustody.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/custody-env.json"
          render_api -X PUT -H "Content-Type: application/json" --data-binary @"$work/api-env.json" \
            "https://api.render.com/v1/services/$API_SERVICE_ID/env-vars/DATABASE_URL" -o /dev/null
          render_api -X PUT -H "Content-Type: application/json" --data-binary @"$work/web-env.json" \
            "https://api.render.com/v1/services/$WEB_SERVICE_ID/env-vars/DATABASE_URL" -o /dev/null
          render_api -X PUT -H "Content-Type: application/json" --data-binary @"$work/worker-env.json" \
            "https://api.render.com/v1/services/$WORKER_SERVICE_ID/env-vars/DATABASE_URL" -o /dev/null
          for service_id in "$API_SERVICE_ID" "$WEB_SERVICE_ID"; do
            render_api -X PUT -H "Content-Type: application/json" --data-binary @"$work/effect-env.json" \
              "https://api.render.com/v1/services/$service_id/env-vars/REVIEW_ROUTER_CODEX_EFFECT_AUTHORITY_DATABASE_URL" -o /dev/null
          done
          render_api -X PUT -H "Content-Type: application/json" --data-binary @"$work/custody-env.json" \
            "https://api.render.com/v1/services/$API_SERVICE_ID/env-vars/REVIEW_ROUTER_COMMENT_TOKEN_CUSTODY_DATABASE_URL" -o /dev/null
          persist_recovery_phase "service_credentials_staged"
          jq -n --arg phase "service_credentials_staged" --arg runId "$GITHUB_RUN_ID" \
            '{phase: $phase, runId: $runId}' > "$work/recovery-phase.json"

          close_firewall
          firewall_open=0

          recovery_deployment_inventory_filter='
            def recovery_deployment_identity($deploy):
              ([
                  $deploy.commit.id?,
                  $deploy.commit.sha?,
                  $deploy.commitId?
                ] | map(select(. != null))) as $commitCandidates
              | ([
                  $deploy.image.sha?,
                  $deploy.image.digest?,
                  $deploy.imageDigest?
                ] | map(select(. != null))) as $imageCandidates
              | if (
                  ($commitCandidates | length) >= 1
                  and all(
                    $commitCandidates[];
                    type == "string" and test("^[a-f0-9]{40}$")
                  )
                  and (($commitCandidates | unique | length) == 1)
                  and (($imageCandidates | length) == 0)
                ) then {
                  kind: "git",
                  commitSha: $commitCandidates[0]
                }
                elif (
                  ($commitCandidates | length) == 0
                  and ($imageCandidates | length) >= 1
                  and all(
                    $imageCandidates[];
                    type == "string" and test("^sha256:[a-f0-9]{64}$")
                  )
                  and (($imageCandidates | unique | length) == 1)
                ) then {
                  kind: "image",
                  imageDigest: $imageCandidates[0]
                }
                elif (
                  ($commitCandidates | length) == 0
                  and ($imageCandidates | length) == 0
                ) then {kind: "missing"}
                else {kind: "invalid"}
                end;
            def recovery_deployment_status_class($status):
              if ([
                "created",
                "queued",
                "build_in_progress",
                "pre_deploy_in_progress",
                "update_in_progress",
                "live"
              ] | index($status)) != null then "active"
              elif ([
                "build_failed",
                "pre_deploy_failed",
                "update_failed",
                "canceled",
                "deactivated",
                "failed"
              ] | index($status)) != null or ($status | endswith("_failed"))
              then "terminal"
              else "unknown"
              end;
            (if type == "array" then .
             elif ((.deploys? | type) == "array") then .deploys
             elif type == "object" then [.]
             else error("recovery_deployment_shape")
             end)
            | map(.deploy // .)
            | map(
                . as $deploy
                | recovery_deployment_identity($deploy) as $identity
                | ($deploy.status
                    | if type == "string" and length > 0 then .
                      else error("recovery_deployment_status")
                      end) as $status
                | {
                    serviceId: (
                      ($deploy.serviceId // $serviceId) as $observedServiceId
                      | if (
                          ($observedServiceId | type) == "string"
                          and $observedServiceId == $serviceId
                        ) then $observedServiceId
                        else error("recovery_deployment_service_identity")
                        end
                    ),
                    deployId: (
                      $deploy.id
                      | if type == "string" and test("^dep-[a-z0-9-]+$")
                        then .
                        else error("recovery_deployment_id")
                        end
                    ),
                    observedStatus: $status,
                    statusClass: recovery_deployment_status_class($status),
                    createdAt: (
                      ($deploy.createdAt // null)
                      | if . == null or type == "string" then .
                        else error("recovery_deployment_created_at")
                        end
                    ),
                    deploymentIdentityKind: $identity.kind,
                    observedCommitSha: ($identity.commitSha // null),
                    observedImageDigest: ($identity.imageDigest // null)
                  }
              )
          '
          recovery_deployment_set_filter='
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and ([.[].deployId] | unique | length == 3)
            and all(.observedStatus == "live")
            and all(
              .deploymentIdentityKind == "git"
              and .observedCommitSha == $releaseCommitSha
              and .observedImageDigest == null
            )
          '
          recovery_predeploy_inventory_filter='
            length >= 1
            and (([.[].deployId] | length) == ([.[].deployId] | unique | length))
            and all(.serviceId == $serviceId)
            and all(.statusClass != "unknown")
            and .[0].deploymentIdentityKind == "git"
            and .[0].observedImageDigest == null
            and ([.[] | select(
              .statusClass == "active" and .observedStatus != "live"
            )] | length) == 0
            and ([.[] | select(.observedStatus == "live")] | length) <= 1
          '
          recovery_reconciliation_filter='
            [
              .[]
              | select(
                  (.deployId as $deployId
                    | ($beforeDeployIds | index($deployId)) == null)
                  and .serviceId == $serviceId
                  and .deploymentIdentityKind == "git"
                  and .observedCommitSha == $releaseCommitSha
                  and .observedImageDigest == null
                  and .statusClass != "unknown"
                  and (.createdAt | type) == "string"
                  and (try (
                    (.createdAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)
                    >= ($intentEpoch - 5)
                    and
                    (.createdAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)
                    <= ($observationEpoch + 5)
                  ) catch false)
                )
            ]
          '
          recovery_pending_deployment_filter='
            length == 1
            and .[0].serviceId == $serviceId
            and .[0].deployId == $expectedDeployId
            and (.[0].observedStatus as $observedStatus
              | ([
                  "created",
                  "queued",
                  "build_in_progress",
                  "pre_deploy_in_progress",
                  "update_in_progress"
                ] | index($observedStatus)) != null)
            and (
              .[0].deploymentIdentityKind == "missing"
              or (
                .[0].deploymentIdentityKind == "git"
                and .[0].observedCommitSha == $releaseCommitSha
                and .[0].observedImageDigest == null
              )
            )
          '
          recovery_exact_deployment_filter='
            length == 1
            and .[0].serviceId == $serviceId
            and .[0].deployId == $expectedDeployId
            and .[0].observedStatus == "live"
            and .[0].deploymentIdentityKind == "git"
            and .[0].observedCommitSha == $releaseCommitSha
            and .[0].observedImageDigest == null
          '
          recovery_bound_inventory_filter='
            length >= 1
            and (([.[].deployId] | length) == ([.[].deployId] | unique | length))
            and all(.serviceId == $serviceId)
            and all(.statusClass != "unknown")
            and .[0].deployId == $expectedDeployId
            and .[0].observedStatus == "live"
            and .[0].deploymentIdentityKind == "git"
            and .[0].observedCommitSha == $releaseCommitSha
            and .[0].observedImageDigest == null
            and ([.[] | select(.statusClass == "active") | .deployId]
              == [$expectedDeployId])
          '
          recovery_service_observation_filter='
            (.service // .) as $service
            | {
                role: $role,
                serviceId: (
                  $service.id
                  | if type == "string" and . == $serviceId then .
                    else error("recovery_service_identity")
                    end
                ),
                suspended: (
                  $service.suspended
                  | if type == "string" then .
                    else error("recovery_service_suspension")
                    end
                ),
                type: (
                  $service.type
                  | if type == "string" then .
                    else error("recovery_service_type")
                    end
                ),
                url: ($service.serviceDetails.url // null)
              }
          '
          recovery_service_set_filter='
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and ([.[].role] | sort == ["api", "web", "worker"])
            and all(.suspended == "not_suspended")
            and (map(select(.role == "api" or .role == "web"))
              | all(
                  .type == "web_service"
                  and (.url | type) == "string"
                  and (.url | test("^https://[^/]+/?$"))
                ))
            and (map(select(.role == "worker"))
              | length == 1 and .[0].type == "background_worker")
          '
          observe_recovery_services() {
            local absolute_deadline observation observations output_path
            local role service service_id
            output_path="$1"
            absolute_deadline="${2:-}"
            observations='[]'
            while IFS=$'\t' read -r role service_id; do
              if [[ -n "$absolute_deadline" ]]; then
                service="$(
                  render_inventory_api "$absolute_deadline" \
                    "https://api.render.com/v1/services/$service_id"
                )" || return 1
              else
                service="$(
                  render_api \
                    "https://api.render.com/v1/services/$service_id"
                )" || return 1
              fi
              observation="$(
                jq -ce --arg role "$role" --arg serviceId "$service_id" \
                  "$recovery_service_observation_filter" <<<"$service"
              )" || return 1
              observations="$(
                jq -c --argjson observation "$observation" \
                  '. + [$observation]' <<<"$observations"
              )" || return 1
            done < <(
              jq -nr \
                --arg api "$API_SERVICE_ID" \
                --arg worker "$WORKER_SERVICE_ID" \
                --arg web "$WEB_SERVICE_ID" '
                  ["api", $api], ["worker", $worker], ["web", $web] | @tsv
                '
            )
            printf '%s\n' "$observations" > "$output_path"
            jq -e "$recovery_service_set_filter" \
              <<<"$observations" >/dev/null
          }
          assert_recovery_fleet_suspended() {
            local absolute_deadline observations observed_service_id output_path
            local service service_id
            output_path="$1"
            absolute_deadline="${2:-}"
            observations='[]'
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              if [[ -n "$absolute_deadline" ]]; then
                service="$(
                  render_inventory_api "$absolute_deadline" \
                    "https://api.render.com/v1/services/$service_id"
                )"
              else
                service="$(
                  render_api "https://api.render.com/v1/services/$service_id"
                )"
              fi
              observed_service_id="$(
                jq -er '(.service // .).id' <<<"$service"
              )"
              observations="$(
                jq -c --arg serviceId "$service_id" \
                  --arg observedServiceId "$observed_service_id" \
                  --arg suspended "$(
                    jq -er '(.service // .).suspended' <<<"$service"
                  )" '
                    . + [{
                      serviceId: $serviceId,
                      observedServiceId: $observedServiceId,
                      suspended: $suspended
                    }]
                  ' \
                  <<<"$observations"
              )"
            done
            printf '%s\n' "$observations" > "$output_path"
            jq -e "$recovery_suspension_set_filter" \
              <<<"$observations" >/dev/null
          }
          assert_recovery_service_suspended() {
            local absolute_deadline response service_id
            service_id="$1"
            absolute_deadline="${2:-}"
            if [[ -n "$absolute_deadline" ]]; then
              response="$(
                render_inventory_api "$absolute_deadline" \
                  "https://api.render.com/v1/services/$service_id"
              )"
            else
              response="$(
                render_api "https://api.render.com/v1/services/$service_id"
              )"
            fi
            jq -e --arg serviceId "$service_id" '
              (.service // .)
              | .id == $serviceId and .suspended == "suspended"
            ' <<<"$response" >/dev/null
          }
          fetch_recovery_deployment_inventory() {
            local absolute_deadline all_deployments cursor encoded_cursor entries
            local entry_count final_entries final_inventory final_snapshot
            local first_page_snapshot next_cursor page page_inventory raw_page
            local seen_cursors service_id url
            service_id="$1"
            absolute_deadline="$2"
            all_deployments='[]'
            cursor=""
            page=0
            seen_cursors='[]'
            while true; do
              page=$((page + 1))
              if (( page > 50 )); then
                echo "::error::Render deployment inventory exceeded 50 pages for $service_id" >&2
                return 1
              fi
              url="https://api.render.com/v1/services/$service_id/deploys?limit=100"
              if [[ -n "$cursor" ]]; then
                encoded_cursor="$(
                  node -e '
                    process.stdout.write(encodeURIComponent(process.argv[1]));
                  ' "$cursor"
                )"
                url="$url&cursor=$encoded_cursor"
              fi
              raw_page="$(render_inventory_api "$absolute_deadline" "$url")"
              entries="$(
                jq -ce '
                  if type == "array" then .
                  elif ((.deploys? | type) == "array") then .deploys
                  else error("recovery_deployment_page_shape")
                  end
                ' <<<"$raw_page"
              )"
              entry_count="$(jq -er 'length' <<<"$entries")"
              page_inventory="$(
                jq -ce --arg serviceId "$service_id" \
                  "$recovery_deployment_inventory_filter" <<<"$entries"
              )"
              if (( page == 1 )); then
                first_page_snapshot="$(
                  jq -c '
                    map({
                      serviceId,
                      deployId,
                      observedStatus,
                      statusClass,
                      createdAt,
                      deploymentIdentityKind,
                      observedCommitSha,
                      observedImageDigest
                    })
                  ' <<<"$page_inventory"
                )"
              fi
              all_deployments="$(
                jq -c --argjson page "$page_inventory" '. + $page' \
                  <<<"$all_deployments"
              )"
              if (( entry_count < 100 )); then
                break
              fi
              next_cursor="$(
                jq -er '
                  if type == "array" then .[-1].cursor
                  elif ((.nextCursor? | type) == "string") then .nextCursor
                  elif ((.cursor? | type) == "string") then .cursor
                  else .deploys[-1].cursor
                  end
                  | select(type == "string" and length > 0)
                ' <<<"$raw_page"
              )"
              if jq -e --arg cursor "$next_cursor" \
                'index($cursor) != null' <<<"$seen_cursors" >/dev/null; then
                echo "::error::Render deployment inventory repeated cursor for $service_id" >&2
                return 1
              fi
              seen_cursors="$(
                jq -c --arg cursor "$next_cursor" '. + [$cursor]' \
                  <<<"$seen_cursors"
              )"
              cursor="$next_cursor"
            done
            # Cursor pagination is not a point-in-time snapshot. A concurrent
            # deployment would be inserted at the head, so require the entire
            # normalized first page to remain byte-for-byte stable around the
            # exhaustive traversal before trusting its active-deploy set.
            raw_page="$(
              render_inventory_api "$absolute_deadline" \
                "https://api.render.com/v1/services/$service_id/deploys?limit=100"
            )"
            final_entries="$(
              jq -ce '
                if type == "array" then .
                elif ((.deploys? | type) == "array") then .deploys
                else error("recovery_deployment_page_shape")
                end
              ' <<<"$raw_page"
            )"
            final_inventory="$(
              jq -ce --arg serviceId "$service_id" \
                "$recovery_deployment_inventory_filter" <<<"$final_entries"
            )"
            final_snapshot="$(
              jq -c '
                map({
                  serviceId,
                  deployId,
                  observedStatus,
                  statusClass,
                  createdAt,
                  deploymentIdentityKind,
                  observedCommitSha,
                  observedImageDigest
                })
              ' <<<"$final_inventory"
            )"
            if [[ "$final_snapshot" != "$first_page_snapshot" ]]; then
              echo "::error::Render deployment inventory head changed during pagination for $service_id" >&2
              return 1
            fi
            jq -e '
              ([.[].deployId] | length) == ([.[].deployId] | unique | length)
            ' <<<"$all_deployments" >/dev/null
            printf '%s\n' "$all_deployments"
          }
          observe_bound_recovery_deployment() {
            local absolute_deadline exact exact_observations expected_deploy_id
            local inventory service_id
            service_id="$1"
            expected_deploy_id="$2"
            absolute_deadline="$3"
            exact="$(
              render_inventory_api "$absolute_deadline" \
                "https://api.render.com/v1/services/$service_id/deploys/$expected_deploy_id"
            )"
            exact_observations="$(
              jq -ce --arg serviceId "$service_id" \
                "$recovery_deployment_inventory_filter" <<<"$exact"
            )"
            jq -e \
              --arg serviceId "$service_id" \
              --arg expectedDeployId "$expected_deploy_id" \
              --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
              "$recovery_exact_deployment_filter" \
              <<<"$exact_observations" >/dev/null
            inventory="$(
              fetch_recovery_deployment_inventory \
                "$service_id" "$absolute_deadline"
            )"
            jq -e \
              --arg serviceId "$service_id" \
              --arg expectedDeployId "$expected_deploy_id" \
              --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
              "$recovery_bound_inventory_filter" \
              <<<"$inventory" >/dev/null
            jq -nc \
              --argjson exact "$(jq -c '.[0]' <<<"$exact_observations")" \
              --argjson inventory "$inventory" '
                {
                  deployment: ($exact + {
                    latestDeployId: $inventory[0].deployId,
                    activeDeployIds: [
                      $inventory[]
                      | select(.statusClass == "active")
                      | .deployId
                    ]
                  }),
                  inventory: $inventory
                }
              '
          }
          observe_bound_recovery_deployments() {
            local absolute_deadline binding_observation bindings_json
            local expected_deploy_id inventories inventory observation
            local observations output_path service_id
            bindings_json="$1"
            output_path="$2"
            absolute_deadline="$3"
            observations='[]'
            inventories='[]'
            while IFS=$'\t' read -r service_id expected_deploy_id; do
              binding_observation="$(
                observe_bound_recovery_deployment \
                  "$service_id" "$expected_deploy_id" "$absolute_deadline"
              )"
              observation="$(jq -c '.deployment' <<<"$binding_observation")"
              inventory="$(jq -c '.inventory' <<<"$binding_observation")"
              observations="$(
                jq -c --argjson observation "$observation" \
                  '. + [$observation]' <<<"$observations"
              )"
              inventories="$(
                jq -c --arg serviceId "$service_id" \
                  --argjson deployments "$inventory" \
                  '. + [{serviceId: $serviceId, deployments: $deployments}]' \
                  <<<"$inventories"
              )"
            done < <(jq -r '.[] | [.serviceId, .deployId] | @tsv' <<<"$bindings_json")
            jq -e --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
              "$recovery_deployment_set_filter" <<<"$observations" >/dev/null
            jq -n --argjson deployments "$observations" \
              --argjson inventories "$inventories" \
              '{deployments: $deployments, inventories: $inventories}' \
              > "$output_path"
          }

          # This is the last environment mutation. The exact pinned deployment
          # below must consume it; no environment value may change afterwards.
          persist_recovery_phase "target_deploy_intent"
          jq -n --arg phase "target_deploy_intent" --arg runId "$GITHUB_RUN_ID" \
            '{phase: $phase, runId: $runId}' > "$work/recovery-phase.json"
          assert_recovery_fleet_suspended "$work/pre-deploy-suspension-result.json"
          deploy_bindings='[]'
          deploy_creation_evidence='[]'
          printf '%s\n' "$deploy_creation_evidence" \
            > "$work/deploy-creation-evidence.json"
          jq -n --arg commitId "$RELEASE_COMMIT_SHA" \
            '{clearCache: "do_not_clear", commitId: $commitId}' \
            > "$work/deploy-request.json"
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            assert_recovery_service_suspended "$service_id"
            predeploy_inventory_deadline=$((SECONDS + 120))
            before_inventory="$(
              fetch_recovery_deployment_inventory \
                "$service_id" "$predeploy_inventory_deadline"
            )"
            jq -e --arg serviceId "$service_id" \
              "$recovery_predeploy_inventory_filter" \
              <<<"$before_inventory" >/dev/null
            printf '%s\n' "$before_inventory" \
              > "$work/deploy-preintent-$service_id.json"
            before_deploy_ids="$(jq -c '[.[].deployId]' <<<"$before_inventory")"
            deploy_intent_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
            deploy_intent_epoch="$(date -u -d "$deploy_intent_at" +%s)"
            set +e
            deploy_response="$(
              render_deploy_mutation -X POST -H "Content-Type: application/json" \
                --data-binary @"$work/deploy-request.json" \
                "https://api.render.com/v1/services/$service_id/deploys"
            )"
            deploy_mutation_status=$?
            set -e
            deploy_id=""
            direct_observations=""
            if [[ "$deploy_mutation_status" -eq 0 ]]; then
              direct_observations="$(
                jq -ce --arg serviceId "$service_id" \
                  "$recovery_deployment_inventory_filter" \
                  <<<"$deploy_response" 2>/dev/null || true
              )"
              deploy_id="$(
                jq -r 'if length == 1 then .[0].deployId else empty end' \
                  <<<"$direct_observations" 2>/dev/null || true
              )"
              if [[ -n "$deploy_id" ]]; then
                if ! jq -e \
                  --arg serviceId "$service_id" \
                  --arg expectedDeployId "$deploy_id" \
                  --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
                  "($recovery_pending_deployment_filter) or ($recovery_exact_deployment_filter)" \
                  <<<"$direct_observations" >/dev/null; then
                  echo "::error::Render returned an invalid deployment identity for $service_id"
                  exit 1
                fi
                jq -e --arg deployId "$deploy_id" \
                  --argjson beforeDeployIds "$before_deploy_ids" \
                  '($beforeDeployIds | index($deployId)) == null' \
                  <<<"{}" >/dev/null
              fi
            fi
            reconciled=false
            if [[ -z "$deploy_id" ]]; then
              reconciled=true
              reconciliation_deadline=$((SECONDS + 120))
              reconciliation_candidates='[]'
              stable_candidate_id=""
              stable_candidate_observations=0
              while (( SECONDS < reconciliation_deadline )); do
                assert_recovery_service_suspended \
                  "$service_id" "$reconciliation_deadline"
                observation_epoch="$(date -u +%s)"
                recent_inventory="$(
                  fetch_recovery_deployment_inventory \
                    "$service_id" "$reconciliation_deadline"
                )"
                jq -e '
                  ([.[].deployId] | length) == ([.[].deployId] | unique | length)
                ' <<<"$recent_inventory" >/dev/null
                reconciliation_candidates="$(
                  jq -ce \
                    --arg serviceId "$service_id" \
                    --argjson beforeDeployIds "$before_deploy_ids" \
                    --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
                    --argjson intentEpoch "$deploy_intent_epoch" \
                    --argjson observationEpoch "$observation_epoch" \
                    "$recovery_reconciliation_filter" \
                    <<<"$recent_inventory"
                )"
                jq -n \
                  --arg serviceId "$service_id" \
                  --arg intentAt "$deploy_intent_at" \
                  --argjson mutationExitStatus "$deploy_mutation_status" \
                  --argjson beforeDeployIds "$before_deploy_ids" \
                  --argjson candidates "$reconciliation_candidates" '
                    {
                      serviceId: $serviceId,
                      intentAt: $intentAt,
                      mutationExitStatus: $mutationExitStatus,
                      beforeDeployIds: $beforeDeployIds,
                      candidates: $candidates
                    }
                  ' > "$work/deploy-reconciliation-$service_id.json"
                candidate_count="$(jq -r 'length' <<<"$reconciliation_candidates")"
                if (( candidate_count > 1 )); then
                  echo "::error::Render deploy reconciliation is ambiguous for $service_id"
                  exit 1
                fi
                if (( candidate_count == 1 )); then
                  observed_candidate_id="$(
                    jq -er '.[0].deployId' <<<"$reconciliation_candidates"
                  )"
                  if [[ "$observed_candidate_id" == "$stable_candidate_id" ]]; then
                    stable_candidate_observations=$((stable_candidate_observations + 1))
                  else
                    stable_candidate_id="$observed_candidate_id"
                    stable_candidate_observations=1
                  fi
                  if (( stable_candidate_observations >= 2 )); then
                    deploy_id="$observed_candidate_id"
                    break
                  fi
                else
                  stable_candidate_id=""
                  stable_candidate_observations=0
                fi
                sleep 5
              done
              if [[ -z "$deploy_id" ]]; then
                echo "::error::Render deploy mutation could not be reconciled for $service_id"
                exit 1
              fi
            fi
            [[ "$deploy_id" =~ ^dep-[a-z0-9-]+$ ]]
            jq -e --arg deployId "$deploy_id" \
              --argjson beforeDeployIds "$before_deploy_ids" \
              '($beforeDeployIds | index($deployId)) == null' \
              <<<"{}" >/dev/null
            deploy_bindings="$(
              jq -c --arg serviceId "$service_id" --arg deployId "$deploy_id" \
                '. + [{serviceId: $serviceId, deployId: $deployId}]' \
                <<<"$deploy_bindings"
            )"
            deploy_creation_evidence="$(
              jq -c \
                --arg serviceId "$service_id" \
                --argjson beforeDeployIds "$before_deploy_ids" \
                --arg deployId "$deploy_id" \
                --arg intentAt "$deploy_intent_at" \
                --argjson mutationExitStatus "$deploy_mutation_status" \
                --argjson reconciled "$reconciled" '
                  . + [{
                    serviceId: $serviceId,
                    beforeDeployIds: $beforeDeployIds,
                    deployId: $deployId,
                    intentAt: $intentAt,
                    mutationExitStatus: $mutationExitStatus,
                    reconciled: $reconciled
                  }]
                ' <<<"$deploy_creation_evidence"
            )"
            printf '%s\n' "$deploy_creation_evidence" \
              > "$work/deploy-creation-evidence.json"
          done
          jq -e '
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and ([.[].deployId] | unique | length == 3)
          ' <<<"$deploy_bindings" >/dev/null
          jq -n --arg phase "target_deploys_created" --arg runId "$GITHUB_RUN_ID" \
            --argjson deploys "$deploy_bindings" \
            '{phase: $phase, runId: $runId, deploys: $deploys}' \
            > "$work/recovery-phase.json"

          deployment_deadline=$((SECONDS + 900))
          while (( SECONDS < deployment_deadline )); do
            assert_recovery_fleet_suspended \
              "$work/deploy-wait-suspension-result.json" \
              "$deployment_deadline"
            pending=0
            failed=0
            deployment_observations='[]'
            while IFS=$'\t' read -r service_id deploy_id; do
              deploy_response="$(
                render_inventory_api "$deployment_deadline" \
                  "https://api.render.com/v1/services/$service_id/deploys/$deploy_id"
              )"
              observations="$(
                jq -ce --arg serviceId "$service_id" \
                  "$recovery_deployment_inventory_filter" <<<"$deploy_response"
              )"
              observation="$(jq -ce 'if length == 1 then .[0] else error("recovery_exact_deploy_shape") end' <<<"$observations")"
              deployment_observations="$(
                jq -c --argjson observation "$observation" \
                  '. + [$observation]' <<<"$deployment_observations"
              )"
              if jq -e \
                --arg serviceId "$service_id" \
                --arg expectedDeployId "$deploy_id" \
                --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
                "$recovery_exact_deployment_filter" \
                <<<"$observations" >/dev/null; then
                continue
              fi
              if jq -e \
                --arg serviceId "$service_id" \
                --arg expectedDeployId "$deploy_id" \
                --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
                "$recovery_pending_deployment_filter" \
                <<<"$observations" >/dev/null; then
                pending=1
              else
                failed=1
              fi
            done < <(jq -r '.[] | [.serviceId, .deployId] | @tsv' <<<"$deploy_bindings")
            printf '%s\n' "$deployment_observations" \
              > "$work/deployment-result.json"
            if (( failed == 1 )); then
              jq -c . "$work/deployment-result.json"
              exit 1
            fi
            if (( pending == 0 )); then
              break
            fi
            sleep 10
          done
          jq -e --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
            "$recovery_deployment_set_filter" \
            "$work/deployment-result.json" >/dev/null
          jq -n --arg phase "target_deploys_live" --arg runId "$GITHUB_RUN_ID" \
            --slurpfile deploys "$work/deployment-result.json" \
            '{phase: $phase, runId: $runId, deploys: $deploys[0]}' \
            > "$work/recovery-phase.json"

          pre_resume_observation_deadline=$((SECONDS + 240))
          assert_recovery_fleet_suspended \
            "$work/pre-resume-suspension-result.json" \
            "$pre_resume_observation_deadline"
          observe_bound_recovery_deployments "$deploy_bindings" \
            "$work/pre-resume-deployment-result.json" \
            "$pre_resume_observation_deadline"
          jq -n --arg phase "ready_to_resume" --arg runId "$GITHUB_RUN_ID" \
            --slurpfile deployment "$work/pre-resume-deployment-result.json" \
            '{phase: $phase, runId: $runId, deployment: $deployment[0]}' \
            > "$work/recovery-phase.json"

          resume_result='[]'
          while IFS=$'\t' read -r service_id deploy_id; do
            service_resume_observation_deadline=$((SECONDS + 90))
            assert_recovery_service_suspended \
              "$service_id" "$service_resume_observation_deadline"
            observe_bound_recovery_deployment \
              "$service_id" "$deploy_id" \
              "$service_resume_observation_deadline" \
              > "$work/pre-resume-deployment-$service_id.json"
            render_api -X POST \
              "https://api.render.com/v1/services/$service_id/resume" -o /dev/null
            resume_result="$(
              jq -c --arg serviceId "$service_id" --arg deployId "$deploy_id" \
                --arg requestedAt "$(node -e 'process.stdout.write(new Date().toISOString())')" '
                  . + [{
                    serviceId: $serviceId,
                    deployId: $deployId,
                    requestedAt: $requestedAt
                  }]
                ' <<<"$resume_result"
            )"
            printf '%s\n' "$resume_result" > "$work/resume-result.json"
          done < <(jq -r '.[] | [.serviceId, .deployId] | @tsv' <<<"$deploy_bindings")

          online_deadline=$((SECONDS + 600))
          online_ready=0
          while (( SECONDS < online_deadline )); do
            if observe_recovery_services \
              "$work/post-resume-service-result.json" \
              "$online_deadline"; then
              online_ready=1
              break
            fi
            sleep 10
          done
          [[ "$online_ready" -eq 1 ]]

          api_origin="$(
            jq -er '.[] | select(.role == "api") | .url | rtrimstr("/")' \
              "$work/post-resume-service-result.json"
          )"
          web_origin="$(
            jq -er '.[] | select(.role == "web") | .url | rtrimstr("/")' \
              "$work/post-resume-service-result.json"
          )"
          health_deadline=$((SECONDS + 300))
          health_ready=0
          while (( SECONDS < health_deadline )); do
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 "$api_origin/health" \
                -o /dev/null \
              && curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 "$web_origin/" \
                -o /dev/null; then
              health_ready=1
              break
            fi
            sleep 10
          done
          [[ "$health_ready" -eq 1 ]]
          jq -n \
            --arg apiUrl "$api_origin/health" \
            --arg webUrl "$web_origin/" \
            --arg workerServiceId "$WORKER_SERVICE_ID" '
              {
                api: {url: $apiUrl, healthy: true},
                web: {url: $webUrl, healthy: true},
                worker: {
                  serviceId: $workerServiceId,
                  healthSignal: "render_not_suspended_and_exact_live_deploy"
                }
              }
            ' > "$work/health-result.json"
          post_resume_observation_deadline=$((SECONDS + 240))
          observe_bound_recovery_deployments "$deploy_bindings" \
            "$work/post-resume-deployment-result.json" \
            "$post_resume_observation_deadline"
          # Bind service identity and online state again after the final
          # deployment inventory proof, immediately before committing success.
          final_service_observation_deadline=$((SECONDS + 90))
          observe_recovery_services \
            "$work/post-resume-service-result.json" \
            "$final_service_observation_deadline"
          jq -n --arg phase "recovery_complete" --arg runId "$GITHUB_RUN_ID" \
            --slurpfile services "$work/post-resume-service-result.json" \
            --slurpfile deployment "$work/post-resume-deployment-result.json" \
            --slurpfile health "$work/health-result.json" '
              {
                phase: $phase,
                runId: $runId,
                services: $services[0],
                deployment: $deployment[0],
                health: $health[0]
              }
            ' > "$work/recovery-phase.json"

          jq -n \
            --arg targetDbId "$TARGET_DB_ID" \
            --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
            --arg recoveryRunId "$GITHUB_RUN_ID" \
            --arg observedSourceCommitSha "$(git rev-parse HEAD)" \
            --slurpfile deployCreation "$work/deploy-creation-evidence.json" \
            --slurpfile serviceRevisions "$work/post-resume-deployment-result.json" \
            --slurpfile resumedServices "$work/post-resume-service-result.json" \
            --slurpfile health "$work/health-result.json" \
            --slurpfile targetStats "$work/target-stats.json" \
            '{
              targetDbId: $targetDbId,
              targetVersion: 17,
              releaseCommitSha: $observedSourceCommitSha,
              recoveryRunId: $recoveryRunId,
              deployCreation: $deployCreation[0],
              serviceRevisions: $serviceRevisions[0].deployments,
              resumedServices: $resumedServices[0],
              health: $health[0],
              targetStats: $targetStats[0]
            }' > "$work/recovery-manifest.json"
          recovery_complete=1
          unset DATABASE_URL external_url

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewrouter-pg17-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reviewrouter-pg17-recovery/recovery-manifest.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/recovery-phase.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/*suspension-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/deploy-creation-evidence.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/deploy-preintent-*.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/deploy-reconciliation-*.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/deployment-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/pre-resume-deployment-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/resume-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/post-resume-service-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/post-resume-deployment-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/health-result.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  register-release:
    name: Register verified Review Action release
    needs: [trust-bootstrap, release-evidence]
    environment: production-release
    if: ${{ inputs.confirmation == 'REGISTER_VERIFIED_REVIEW_ACTION_RELEASE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64: ${{ secrets.SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64 }}
      TARGET_DB_ID: ${{ inputs.target_db_id }}
      RENDER_OWNER_ID: ${{ inputs.owner_id }}
      RENDER_ENVIRONMENT_ID: ${{ inputs.environment_id }}
      RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
      ACTION_COMMIT_SHA: ${{ inputs.action_commit_sha }}
      OPEN_GLOBAL_EMERGENCY: ${{ inputs.open_global_emergency }}
      OPERATOR_REPOSITORY: ${{ inputs.operator_repository }}
      OPERATOR_WORKSPACE_ID: ${{ inputs.operator_workspace_id }}
      INVESTIGATION_ROLLOUT_PROFILE: ${{ inputs.investigation_rollout_profile }}
      INVESTIGATION_REPOSITORY_CONNECTION_ID: ${{ inputs.investigation_repository_connection_id }}
      INVESTIGATION_PRODUCER_RELEASE_ID: ${{ inputs.investigation_producer_release_id }}
      API_SERVICE_ID: ${{ inputs.api_service_id }}
      WORKER_SERVICE_ID: ${{ inputs.worker_service_id }}
      WEB_SERVICE_ID: ${{ inputs.web_service_id }}
    steps:
      - name: Checkout immutable registration tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.trust-bootstrap.outputs.trusted_main_sha }}

      - name: Install registration tooling
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DB_ID" =~ ^dpg-[a-z0-9-]+$ ]]
          [[ "$RENDER_OWNER_ID" =~ ^tea-[a-z0-9-]+$ ]]
          [[ "$RENDER_ENVIRONMENT_ID" =~ ^evm-[a-z0-9-]+$ ]]
          [[ "$RELEASE_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          TRUSTED_MAIN_SHA="${{ needs.trust-bootstrap.outputs.trusted_main_sha }}"
          [[ "$TRUSTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git cat-file -t "$RELEASE_COMMIT_SHA")" == "commit" ]]
          [[ "$(git cat-file -t "$TRUSTED_MAIN_SHA")" == "commit" ]]
          git merge-base --is-ancestor "$RELEASE_COMMIT_SHA" "$TRUSTED_MAIN_SHA"
          git switch --detach "$RELEASE_COMMIT_SHA"
          observed_source_sha="$(git rev-parse HEAD)"
          [[ "$observed_source_sha" == "$RELEASE_COMMIT_SHA" ]]
          [[ "$ACTION_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$API_SERVICE_ID" =~ ^srv-[a-z0-9-]+$ ]]
          [[ "$WORKER_SERVICE_ID" =~ ^srv-[a-z0-9-]+$ ]]
          [[ "$WEB_SERVICE_ID" =~ ^srv-[a-z0-9-]+$ ]]
          [[ "$API_SERVICE_ID" != "$WORKER_SERVICE_ID" ]]
          [[ "$API_SERVICE_ID" != "$WEB_SERVICE_ID" ]]
          [[ "$WORKER_SERVICE_ID" != "$WEB_SERVICE_ID" ]]
          if [[ -n "$OPERATOR_REPOSITORY" ]]; then
            [[ "$OPEN_GLOBAL_EMERGENCY" == "true" ]]
            [[ -n "$OPERATOR_WORKSPACE_ID" ]]
            [[ "$OPERATOR_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          fi
          if [[ -n "$OPERATOR_WORKSPACE_ID" ]]; then
            [[ "$OPEN_GLOBAL_EMERGENCY" == "true" ]]
            [[ "$OPERATOR_WORKSPACE_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          fi
          case "$INVESTIGATION_ROLLOUT_PROFILE" in
            preserve) ;;
            shadow)
              [[ "$OPEN_GLOBAL_EMERGENCY" == "true" ]]
              [[ -n "$OPERATOR_REPOSITORY" ]]
              [[ -n "$OPERATOR_WORKSPACE_ID" ]]
              ;;
            production)
              [[ "$OPEN_GLOBAL_EMERGENCY" == "true" ]]
              [[ -n "$OPERATOR_REPOSITORY" ]]
              [[ -n "$OPERATOR_WORKSPACE_ID" ]]
              [[ "$INVESTIGATION_REPOSITORY_CONNECTION_ID" =~ ^[A-Za-z0-9_-]+$ ]]
              [[ "$INVESTIGATION_PRODUCER_RELEASE_ID" =~ ^[A-Za-z0-9._-]+$ ]]
              ;;
            *) exit 2 ;;
          esac
          corepack enable
          node scripts/install-private-dependencies.mjs --frozen-lockfile
          pnpm db:generate
          pnpm --filter @reviewrouter/api... build
          node scripts/rewrite-dist-esm-imports.mjs
          docker pull postgres:17-alpine >/dev/null

      - name: Verify and register release
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/reviewrouter-release-registration"
          mkdir -p "$work"
          firewall_open=0
          render_api() {
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 120 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          render_deploy_mutation() {
            curl --fail --silent --show-error \
              --connect-timeout 15 --max-time 120 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          render_inventory_api() {
            local absolute_deadline="$1"
            local remaining request_timeout
            shift
            remaining=$((absolute_deadline - SECONDS))
            if (( remaining <= 0 )); then
              echo "::error::Render inventory deadline expired before request" >&2
              return 124
            fi
            request_timeout="$remaining"
            if (( request_timeout > 20 )); then
              request_timeout=20
            fi
            curl --fail --silent --show-error \
              --connect-timeout 5 --max-time "$request_timeout" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          recovery_deployment_inventory_filter='
            def recovery_deployment_identity($deploy):
              ([
                  $deploy.commit.id?,
                  $deploy.commit.sha?,
                  $deploy.commitId?
                ] | map(select(. != null))) as $commitCandidates
              | ([
                  $deploy.image.sha?,
                  $deploy.image.digest?,
                  $deploy.imageDigest?
                ] | map(select(. != null))) as $imageCandidates
              | if (
                  ($commitCandidates | length) >= 1
                  and all(
                    $commitCandidates[];
                    type == "string" and test("^[a-f0-9]{40}$")
                  )
                  and (($commitCandidates | unique | length) == 1)
                  and (($imageCandidates | length) == 0)
                ) then {
                  kind: "git",
                  commitSha: $commitCandidates[0]
                }
                elif (
                  ($commitCandidates | length) == 0
                  and ($imageCandidates | length) >= 1
                  and all(
                    $imageCandidates[];
                    type == "string" and test("^sha256:[a-f0-9]{64}$")
                  )
                  and (($imageCandidates | unique | length) == 1)
                ) then {
                  kind: "image",
                  imageDigest: $imageCandidates[0]
                }
                elif (
                  ($commitCandidates | length) == 0
                  and ($imageCandidates | length) == 0
                ) then {kind: "missing"}
                else {kind: "invalid"}
                end;
            def recovery_deployment_status_class($status):
              if ([
                "created",
                "queued",
                "build_in_progress",
                "pre_deploy_in_progress",
                "update_in_progress",
                "live"
              ] | index($status)) != null then "active"
              elif ([
                "build_failed",
                "pre_deploy_failed",
                "update_failed",
                "canceled",
                "deactivated",
                "failed"
              ] | index($status)) != null or ($status | endswith("_failed"))
              then "terminal"
              else "unknown"
              end;
            (if type == "array" then .
             elif ((.deploys? | type) == "array") then .deploys
             elif type == "object" then [.]
             else error("recovery_deployment_shape")
             end)
            | map(.deploy // .)
            | map(
                . as $deploy
                | recovery_deployment_identity($deploy) as $identity
                | ($deploy.status
                    | if type == "string" and length > 0 then .
                      else error("recovery_deployment_status")
                      end) as $status
                | {
                    serviceId: (
                      ($deploy.serviceId // $serviceId) as $observedServiceId
                      | if (
                          ($observedServiceId | type) == "string"
                          and $observedServiceId == $serviceId
                        ) then $observedServiceId
                        else error("recovery_deployment_service_identity")
                        end
                    ),
                    deployId: (
                      $deploy.id
                      | if type == "string" and test("^dep-[a-z0-9-]+$")
                        then .
                        else error("recovery_deployment_id")
                        end
                    ),
                    observedStatus: $status,
                    statusClass: recovery_deployment_status_class($status),
                    createdAt: (
                      ($deploy.createdAt // null)
                      | if . == null or type == "string" then .
                        else error("recovery_deployment_created_at")
                        end
                    ),
                    deploymentIdentityKind: $identity.kind,
                    observedCommitSha: ($identity.commitSha // null),
                    observedImageDigest: ($identity.imageDigest // null)
                  }
              )
          '
          fetch_recovery_deployment_inventory() {
            local absolute_deadline all_deployments cursor encoded_cursor entries
            local entry_count final_entries final_inventory final_snapshot
            local first_page_snapshot next_cursor page page_inventory raw_page
            local seen_cursors service_id url
            service_id="$1"
            absolute_deadline="$2"
            all_deployments='[]'
            cursor=""
            page=0
            seen_cursors='[]'
            while true; do
              page=$((page + 1))
              if (( page > 50 )); then
                echo "::error::Render deployment inventory exceeded 50 pages for $service_id" >&2
                return 1
              fi
              url="https://api.render.com/v1/services/$service_id/deploys?limit=100"
              if [[ -n "$cursor" ]]; then
                encoded_cursor="$(
                  node -e '
                    process.stdout.write(encodeURIComponent(process.argv[1]));
                  ' "$cursor"
                )"
                url="$url&cursor=$encoded_cursor"
              fi
              raw_page="$(render_inventory_api "$absolute_deadline" "$url")"
              entries="$(
                jq -ce '
                  if type == "array" then .
                  elif ((.deploys? | type) == "array") then .deploys
                  else error("recovery_deployment_page_shape")
                  end
                ' <<<"$raw_page"
              )"
              entry_count="$(jq -er 'length' <<<"$entries")"
              page_inventory="$(
                jq -ce --arg serviceId "$service_id" \
                  "$recovery_deployment_inventory_filter" <<<"$entries"
              )"
              if (( page == 1 )); then
                first_page_snapshot="$(
                  jq -c '
                    map({
                      serviceId,
                      deployId,
                      observedStatus,
                      statusClass,
                      createdAt,
                      deploymentIdentityKind,
                      observedCommitSha,
                      observedImageDigest
                    })
                  ' <<<"$page_inventory"
                )"
              fi
              all_deployments="$(
                jq -c --argjson page "$page_inventory" '. + $page' \
                  <<<"$all_deployments"
              )"
              if (( entry_count < 100 )); then
                break
              fi
              next_cursor="$(
                jq -er '
                  if type == "array" then .[-1].cursor
                  elif ((.nextCursor? | type) == "string") then .nextCursor
                  elif ((.cursor? | type) == "string") then .cursor
                  else .deploys[-1].cursor
                  end
                  | select(type == "string" and length > 0)
                ' <<<"$raw_page"
              )"
              if jq -e --arg cursor "$next_cursor" \
                'index($cursor) != null' <<<"$seen_cursors" >/dev/null; then
                echo "::error::Render deployment inventory repeated cursor for $service_id" >&2
                return 1
              fi
              seen_cursors="$(
                jq -c --arg cursor "$next_cursor" '. + [$cursor]' \
                  <<<"$seen_cursors"
              )"
              cursor="$next_cursor"
            done
            # Cursor pagination is not a point-in-time snapshot. A concurrent
            # deployment would be inserted at the head, so require the entire
            # normalized first page to remain byte-for-byte stable around the
            # exhaustive traversal before trusting its active-deploy set.
            raw_page="$(
              render_inventory_api "$absolute_deadline" \
                "https://api.render.com/v1/services/$service_id/deploys?limit=100"
            )"
            final_entries="$(
              jq -ce '
                if type == "array" then .
                elif ((.deploys? | type) == "array") then .deploys
                else error("recovery_deployment_page_shape")
                end
              ' <<<"$raw_page"
            )"
            final_inventory="$(
              jq -ce --arg serviceId "$service_id" \
                "$recovery_deployment_inventory_filter" <<<"$final_entries"
            )"
            final_snapshot="$(
              jq -c '
                map({
                  serviceId,
                  deployId,
                  observedStatus,
                  statusClass,
                  createdAt,
                  deploymentIdentityKind,
                  observedCommitSha,
                  observedImageDigest
                })
              ' <<<"$final_inventory"
            )"
            if [[ "$final_snapshot" != "$first_page_snapshot" ]]; then
              echo "::error::Render deployment inventory head changed during pagination for $service_id" >&2
              return 1
            fi
            jq -e '
              ([.[].deployId] | length) == ([.[].deployId] | unique | length)
            ' <<<"$all_deployments" >/dev/null
            printf '%s\n' "$all_deployments"
          }
          fetch_registration_deployment_inventory() {
            local service_id="$1" absolute_deadline="$2" inventory
            inventory="$(fetch_recovery_deployment_inventory "$service_id" "$absolute_deadline")" || return 1
            jq -ce '
              if all(.deploymentIdentityKind == "git" or .deploymentIdentityKind == "missing") then
                map({
                  id: .deployId,
                  serviceId,
                  status: .observedStatus,
                  commitId: .observedCommitSha,
                  createdAt
                })
              else error("registration_deployment_provenance") end
            ' <<<"$inventory"
          }

          close_firewall() {
            if [[ "$firewall_open" -eq 1 ]]; then
              render_api -X PATCH \
                -H "Content-Type: application/json" \
                --data-binary '{"ipAllowList":[]}' \
                "https://api.render.com/v1/postgres/$TARGET_DB_ID" \
                -o /dev/null || return 1
              render_api "https://api.render.com/v1/postgres/$TARGET_DB_ID" \
                | jq -e --arg targetDbId "$TARGET_DB_ID" '
                    .id == $targetDbId and .ipAllowList == []
                  ' >/dev/null || return 1
              firewall_open=0
            fi
          }
          cleanup() {
            local cleanup_status=$?
            trap - EXIT
            set +e
            if ! close_firewall; then
              echo "::error::Registration could not prove the database firewall closed."
              cleanup_status=1
            fi
            rm -f "$work/api-env.json" "$work/api-env-object.json" \
              "$work/connection-info.json" "$work/operator-input.json" \
              "$work/investigation-env-value.json" \
              "$work"/investigation-service-env-*.json
            exit "$cleanup_status"
          }
          trap cleanup EXIT

          # Validate the complete fleet before the first provider mutation.
          service_scope_filter='
            (.service // .)
            | .id == $serviceId
              and (.ownerId // .owner.id) == $ownerId
              and .environmentId == $environmentId
              and .type == $serviceType
              and (.suspended == "suspended" or .suspended == "not_suspended")
          '
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            service_type=web_service
            if [[ "$service_id" == "$WORKER_SERVICE_ID" ]]; then
              service_type=background_worker
            fi
            render_api "https://api.render.com/v1/services/$service_id" \
              | jq -e --arg serviceId "$service_id" \
                --arg ownerId "$RENDER_OWNER_ID" \
                --arg environmentId "$RENDER_ENVIRONMENT_ID" \
                --arg serviceType "$service_type" \
                "$service_scope_filter" >/dev/null
          done

          render_api "https://api.render.com/v1/postgres/$TARGET_DB_ID" > "$work/target.json"
          jq -e \
            --arg ownerId "$RENDER_OWNER_ID" \
            --arg environmentId "$RENDER_ENVIRONMENT_ID" '
              .version == "17"
              and .status == "available"
              and .environmentId == $environmentId
              and ((.ownerId // .owner.id) == $ownerId)
            ' "$work/target.json" >/dev/null

          live_service_preflight='[]'
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            deploys="$(render_api "https://api.render.com/v1/services/$service_id/deploys?limit=1")"
            observation="$(
              jq -ce --arg serviceId "$service_id" '
                (if type == "array" then .[0] else (.deploys[0] // .[0]) end)
                | (.deploy // .) as $deploy
                | {
                    serviceId: $serviceId,
                    deployId: ($deploy.id | select(type == "string" and length > 0)),
                    observedStatus: ($deploy.status | select(type == "string")),
                    observedCommitSha: (
                      ($deploy.commit.id // $deploy.commit.sha // $deploy.commitId)
                      | select(type == "string" and test("^[a-f0-9]{40}$"))
                    )
                  }
              ' <<<"$deploys"
            )"
            live_service_preflight="$(
              jq -c --argjson observation "$observation" '. + [$observation]' \
                <<<"$live_service_preflight"
            )"
          done
          printf '%s\n' "$live_service_preflight" \
            > "$work/live-service-preflight.json"
          jq -e --arg releaseCommitSha "$RELEASE_COMMIT_SHA" '
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and all(.observedStatus == "live")
            and all(.observedCommitSha == $releaseCommitSha)
          ' "$work/live-service-preflight.json" >/dev/null

          render_api "https://api.render.com/v1/services/$API_SERVICE_ID/env-vars" \
            > "$work/api-env.json"
          jq -e '
            map(.envVar // .)
            | map(select((.key | type) == "string" and (.value | type) == "string"))
            | map({key, value})
            | from_entries
          ' "$work/api-env.json" > "$work/api-env-object.json"

          if [[ "$INVESTIGATION_ROLLOUT_PROFILE" != "preserve" ]]; then
            production_effects=0
            selectors_json='{}'
            if [[ "$INVESTIGATION_ROLLOUT_PROFILE" == "production" ]]; then
              attested_producer_release_id="$(
                jq -er --arg sha "$ACTION_COMMIT_SHA" '
                  ((.REVIEW_ROUTER_REVIEW_V2_PRODUCER_RELEASE_ATTESTATIONS_JSON // "[]") | fromjson)
                  | map(select(.actionCommitSha == $sha))
                  | if length > 1 then error("verified_release_attestation_count")
                    elif length == 1 then
                      .[0].producerReleaseId
                      | select(type == "string" and length > 0)
                    else "reviewrouter-action.\($sha[0:12])"
                    end
                ' "$work/api-env-object.json"
              )"
              [[ "$INVESTIGATION_PRODUCER_RELEASE_ID" == "$attested_producer_release_id" ]]
              production_effects=1
              selectors_json="$(
                jq -cn \
                  --arg workspaceId "$OPERATOR_WORKSPACE_ID" \
                  --arg repositoryConnectionId "$INVESTIGATION_REPOSITORY_CONNECTION_ID" \
                  --arg producerReleaseId "$INVESTIGATION_PRODUCER_RELEASE_ID" '
                    {production_effects: [{
                      workspaceIds: [$workspaceId],
                      repositoryConnectionIds: [$repositoryConnectionId],
                      providers: ["codex"],
                      trustDomains: ["trusted_managed"],
                      producerReleaseIds: [$producerReleaseId]
                    }]}
                  '
              )"
            fi
            put_investigation_env() {
              local service_id="$1"
              local key="$2"
              local value="$3"
              jq -n --arg value "$value" '{value: $value}' \
                > "$work/investigation-env-value.json"
              render_api -X PUT -H "Content-Type: application/json" \
                --data-binary @"$work/investigation-env-value.json" \
                "https://api.render.com/v1/services/$service_id/env-vars/$key" \
                -o /dev/null
            }
            investigation_env_keys=(
              REVIEW_ROUTER_REVIEW_INVESTIGATION_RECORDING_ENABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_SHADOW_ENABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_CONTEXT_CRITIC_ENABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_VERIFIED_CLEAN_ENABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_CROSS_REVISION_REPLAY_ENABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_PRODUCTION_EFFECTS_ENABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_EMERGENCY_DISABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_SELECTORS_JSON
            )
            investigation_env_values=(
              1
              1
              1
              0
              0
              "$production_effects"
              0
              "$selectors_json"
            )
            investigation_env_proof='[]'
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              for index in "${!investigation_env_keys[@]}"; do
                put_investigation_env \
                  "$service_id" \
                  "${investigation_env_keys[$index]}" \
                  "${investigation_env_values[$index]}"
              done
              render_api "https://api.render.com/v1/services/$service_id/env-vars" \
                > "$work/investigation-service-env-$service_id.json"
              jq -e \
                --arg productionEffects "$production_effects" \
                --arg selectors "$selectors_json" '
                  map(.envVar // .)
                  | map(select((.key | type) == "string" and (.value | type) == "string"))
                  | map({key, value})
                  | from_entries
                  | .REVIEW_ROUTER_REVIEW_INVESTIGATION_RECORDING_ENABLED == "1"
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_SHADOW_ENABLED == "1"
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_CONTEXT_CRITIC_ENABLED == "1"
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_VERIFIED_CLEAN_ENABLED == "0"
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_CROSS_REVISION_REPLAY_ENABLED == "0"
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_PRODUCTION_EFFECTS_ENABLED == $productionEffects
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_EMERGENCY_DISABLED == "0"
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_SELECTORS_JSON == $selectors
                ' "$work/investigation-service-env-$service_id.json" >/dev/null
              investigation_env_proof="$(
                jq -c \
                  --arg serviceId "$service_id" \
                  --arg profile "$INVESTIGATION_ROLLOUT_PROFILE" \
                  '. + [{serviceId: $serviceId, profile: $profile, verified: true}]' \
                  <<<"$investigation_env_proof"
              )"
            done
            printf '%s\n' "$investigation_env_proof" \
              > "$work/investigation-env-proof.json"
          fi

          render_api "https://api.render.com/v1/services/$API_SERVICE_ID/env-vars" \
            > "$work/api-env.json"
          jq -e '
            map(.envVar // .)
            | map(select((.key | type) == "string" and (.value | type) == "string"))
            | map({key, value})
            | from_entries
          ' "$work/api-env.json" > "$work/api-env-object.json"

          git clone --filter=blob:none https://github.com/777genius/review-router.git "$work/action"
          git -C "$work/action" fetch origin "$ACTION_COMMIT_SHA"
          git -C "$work/action" switch -c verified-release "$ACTION_COMMIT_SHA"
          saas_source_commit="$(jq -er '.saasSourceCommit' \
            "$work/action/src/control-plane/generated/review-action-v2/handoff-manifest.json")"
          [[ "$saas_source_commit" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin "$saas_source_commit" --depth=1
          pnpm protocol:release-manifest \
            --action-repo "$work/action" \
            --target-branch verified-release \
            --expected-head "$ACTION_COMMIT_SHA" \
            --output "$work/release-manifest.json" >/dev/null
          pnpm protocol:release-manifest:check \
            --manifest "$work/release-manifest.json" \
            --action-repo "$work/action" >/dev/null

          runner_ip="$(curl --fail --silent --show-error --max-time 30 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          jq -n --arg cidr "$runner_ip/32" '{ipAllowList: [{
            cidrBlock: $cidr,
            description: "temporary verified release registration"
          }]}' > "$work/firewall.json"
          # Arm cleanup before the PATCH: an accepted request can lose its response.
          firewall_open=1
          render_api -X PATCH -H "Content-Type: application/json" \
            --data-binary @"$work/firewall.json" \
            "https://api.render.com/v1/postgres/$TARGET_DB_ID" -o /dev/null
          render_api "https://api.render.com/v1/postgres/$TARGET_DB_ID/connection-info" \
            > "$work/connection-info.json"

          WORK="$work" ACTION_COMMIT_SHA="$ACTION_COMMIT_SHA" node --input-type=module <<'NODE'
          import { createHash, randomBytes } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { spawnSync } from "node:child_process";

          const work = process.env.WORK;
          const actionCommitSha = process.env.ACTION_COMMIT_SHA;
          const apiEnv = JSON.parse(readFileSync(`${work}/api-env-object.json`, "utf8"));
          const manifest = JSON.parse(readFileSync(`${work}/release-manifest.json`, "utf8"));
          const connection = JSON.parse(readFileSync(`${work}/connection-info.json`, "utf8"));
          const attestations = JSON.parse(
            apiEnv.REVIEW_ROUTER_REVIEW_V2_PRODUCER_RELEASE_ATTESTATIONS_JSON ?? "[]",
          );
          const limits = {
            maxWorkSlots: 200,
            maxAttemptsPerSlot: 4,
            maxObservationBytes: 1_000_000,
            maxObservationFindings: 1_000,
            maxProjectionBytes: 2_000_000,
            maxProjectionFindings: 2_000,
            maxPublicationOperations: 500,
            maxPublicationChunks: 500,
            maxPublicationBodyBytes: 2_000_000,
            maxRequestBatchSize: 100,
            maxLeaseDurationMs: 600_000,
            maxResultReportDurationMs: 1_200_000,
            maxReconciliationDurationMs: 3_600_000,
          };
          const thresholds = {
            integrationEventDeliveryMs: 60_000,
            outboxClaimAgeMs: 120_000,
            missingCompletionProcessMs: 300_000,
            dueCompletionProcessMs: 300_000,
            publicationReconciliationMs: 600_000,
            v1DrainMs: 3_600_000,
            admissionMs: 30_000,
            pruningBacklogAgeMs: 86_400_000,
          };
          const ownerRefs = ["team-reviewrouter"];
          const runbookRefs = ["docs/operations/review-action-v2-cutover.md"];
          const releaseKey = `reviewrouter-action.${actionCommitSha.slice(0, 12)}`;
          const contentId = (value) =>
            createHash("sha256").update(JSON.stringify(value), "utf8").digest("hex").slice(0, 16);
          const diagnosticCodes = (stdout, stderr) => {
            const output = `${stdout ?? ""}\n${stderr ?? ""}`;
            const codes = [
              ...(output.match(
                /\b(?:review_v2|review|producer|protocol|operational|database|prisma|context|invalid)_[a-z0-9_]{2,120}\b/gi,
              ) ?? []),
              ...(output.match(/\bP\d{4}\b/g) ?? []),
              ...[...output.matchAll(/\bSQLSTATE(?:\s+(?:code)?)?[:=]?\s*([0-9A-Z]{5})\b/gi)].map(
                (match) => `sqlstate_${match[1].toLowerCase()}`,
              ),
            ];
            if (/permission denied/i.test(output)) codes.push("database_permission_denied");
            if (
              /(?:can't reach database server|connection (?:refused|terminated|failed)|ECONNREFUSED|timeout expired|database .* unavailable|SSL\/TLS required)/i.test(
                output,
              )
            ) {
              codes.push("database_connection_failed");
            }
            if (
              /(?:review_safety_control_conflict|version conflict|serialization conflict|\bP2034\b)/i.test(
                output,
              )
            ) {
              codes.push("review_safety_control_conflict");
            }
            return [...new Set(codes.map((code) => code.toLowerCase()))].slice(0, 12);
          };
          const protocolLimitsProfileId = `${releaseKey}.limits-${contentId(limits)}`;
          const operationalSloProfileId = `${releaseKey}.slo-${contentId({
            thresholds,
            ownerRefs,
            runbookRefs,
          })}`;
          let matches = attestations.filter(
            (attestation) => attestation?.actionCommitSha === actionCommitSha,
          );
          if (matches.length > 1) {
            throw new Error(`verified_release_attestation_count:${matches.length}`);
          }
          if (matches.length === 0) {
            matches = [{
              producerReleaseId: releaseKey,
              distributionKind: "public_reusable",
              actionCommitSha: manifest.actionCommitSha,
              runtimeCommitSha: manifest.runtimeCommitSha,
              wrapperEntrypointDigest: null,
              runtimeEntrypointDigest: manifest.runtimeEntrypointDigest,
              contextGatewayPolicyVersion: manifest.contextGatewayPolicyVersion,
              contextGatewayEntrypointDigest: manifest.contextGatewayEntrypointDigest,
              reviewInvestigationCapability: manifest.reviewInvestigationCapability,
              reviewInvestigationCoverageProfileHash:
                manifest.reviewInvestigationCoverageProfileHash,
              reviewInvestigationPolicyHash: manifest.reviewInvestigationPolicyHash,
              schemaDigest: manifest.schemaDigest,
              canonicalizerDigest: manifest.canonicalizerDigest,
              capabilityProfile: "exact_revision_v2",
              protocolLimitsProfileId,
              operationalSloProfileId,
            }];
          }
          const attestation = {
            ...matches[0],
            protocolLimitsProfileId,
            operationalSloProfileId,
          };
          if (
            manifest.distributionKind !== "PublicReusable" ||
            attestation.distributionKind !== "public_reusable" ||
            attestation.wrapperEntrypointDigest !== null
          ) {
            throw new Error("verified_release_distribution_shape_mismatch");
          }
          const exactFields = [
            "actionCommitSha",
            "runtimeCommitSha",
            "runtimeEntrypointDigest",
            "contextGatewayPolicyVersion",
            "contextGatewayEntrypointDigest",
            "schemaDigest",
            "canonicalizerDigest",
          ];
          for (const field of exactFields) {
            if (attestation[field] !== manifest[field]) {
              throw new Error(`verified_release_manifest_mismatch:${field}`);
            }
          }
          const investigationFields = [
            ["reviewInvestigationCapability", "reviewInvestigationCapability"],
            ["reviewInvestigationCoverageProfileHash", "reviewInvestigationCoverageProfileHash"],
            ["reviewInvestigationPolicyHash", "reviewInvestigationPolicyHash"],
          ];
          for (const [attestationField, manifestField] of investigationFields) {
            if (attestation[attestationField] !== manifest[manifestField]) {
              throw new Error(`verified_release_manifest_mismatch:${attestationField}`);
            }
          }
          const bundle = {
            protocolLimitsProfileId: attestation.protocolLimitsProfileId,
            limits,
            operationalSloProfileId: attestation.operationalSloProfileId,
            thresholds,
            ownerRefs,
            runbookRefs,
            candidate: {
              producerReleaseId: attestation.producerReleaseId,
              distributionKind: attestation.distributionKind,
              actionCommitSha: manifest.actionCommitSha,
              runtimeCommitSha: manifest.runtimeCommitSha,
              wrapperEntrypointDigest: null,
              runtimeEntrypointDigest: manifest.runtimeEntrypointDigest,
              contextGatewayPolicyVersion: manifest.contextGatewayPolicyVersion,
              contextGatewayEntrypointDigest: manifest.contextGatewayEntrypointDigest,
              reviewInvestigationProfile: {
                capability: manifest.reviewInvestigationCapability,
                coverageProfileHash: manifest.reviewInvestigationCoverageProfileHash,
                policyHash: manifest.reviewInvestigationPolicyHash,
              },
              schemaDigest: manifest.schemaDigest,
              capabilityProfile: attestation.capabilityProfile,
            },
          };
          writeFileSync(`${work}/release-bundle.json`, `${JSON.stringify(bundle)}\n`, { mode: 0o600 });

          const databaseUrl = new URL(connection.externalConnectionString);
          databaseUrl.searchParams.set("sslmode", "require");
          databaseUrl.searchParams.set("connect_timeout", "15");
          const credential = randomBytes(32).toString("base64url");
          const operatorEnv = {
            ...process.env,
            ...apiEnv,
            NODE_ENV: "production",
            DATABASE_URL: databaseUrl.toString(),
            REVIEW_ROUTER_REVIEW_V2_OPERATOR_CREDENTIAL: credential,
            REVIEW_ROUTER_REVIEW_V2_OPERATOR_CREDENTIAL_SHA256: createHash("sha256")
              .update(credential, "utf8")
              .digest("hex"),
          };
          const preflight = spawnSync(
            "node",
            [
              "--conditions=production",
              "apps/api/dist/review-action-v2-operator-cli.js",
              "release",
              "env-preflight",
            ],
            { cwd: process.cwd(), env: operatorEnv, encoding: "utf8" },
          );
          if (preflight.status !== 0) {
            throw new Error(`verified_release_environment_preflight_exit:${preflight.status ?? "unknown"}`);
          }
          const preflightResult = JSON.parse(preflight.stdout);
          writeFileSync(
            `${work}/environment-preflight.json`,
            `${JSON.stringify(preflightResult)}\n`,
            { mode: 0o644 },
          );
          if (preflightResult.ready !== true) {
            throw new Error(
              `verified_release_environment_not_ready:missing=${preflightResult.missing.join(",")}:invalid=${preflightResult.invalid.join(",")}`,
            );
          }
          const result = spawnSync(
            "node",
            [
              "--conditions=production",
              "apps/api/dist/review-action-v2-operator-cli.js",
              "release",
              "register",
              "--bundle",
              `${work}/release-bundle.json`,
              "--confirm",
              "release",
            ],
            { cwd: process.cwd(), env: operatorEnv, encoding: "utf8" },
          );
          if (result.status !== 0) {
            writeFileSync(`${work}/registration-error.log`, result.stderr, { mode: 0o600 });
            const diagnostic = {
              exitStatus: result.status,
              diagnosticCodes: diagnosticCodes(result.stdout, result.stderr),
              stderrSha256: createHash("sha256").update(result.stderr, "utf8").digest("hex"),
            };
            writeFileSync(
              `${work}/registration-diagnostic.json`,
              `${JSON.stringify(diagnostic)}\n`,
              { mode: 0o644 },
            );
            console.error(JSON.stringify(diagnostic));
            throw new Error(`verified_release_registration_failed:exit_${result.status ?? "unknown"}`);
          }
          const registration = JSON.parse(result.stdout);
          const convergedAttestation = {
            ...attestation,
            protocolLimitsProfileId: registration.resolvedProtocolLimitsProfileId,
            operationalSloProfileId: registration.resolvedOperationalSloProfileId,
          };
          const updatedAttestations = [
            ...attestations.filter(
              (candidate) => candidate?.actionCommitSha !== actionCommitSha,
            ),
            convergedAttestation,
          ].sort((left, right) =>
            left.producerReleaseId.localeCompare(right.producerReleaseId),
          );
          writeFileSync(
            `${work}/updated-attestations.json`,
            `${JSON.stringify(updatedAttestations)}\n`,
            { mode: 0o600 },
          );
          writeFileSync(
            `${work}/registration-result.json`,
            `${JSON.stringify({
              actionCommitSha,
              producerReleaseId: attestation.producerReleaseId,
              limitsStatus: registration.limitsResult?.status,
              sloStatus: registration.sloResult?.status,
              releaseStatus: registration.releaseResult?.status,
            })}\n`,
            { mode: 0o644 },
          );
          if (process.env.OPEN_GLOBAL_EMERGENCY === "true") {
            const emergency = spawnSync(
              "node",
              [
                "--conditions=production",
                "apps/api/dist/review-action-v2-operator-cli.js",
                "emergency",
                "global",
                "open",
                "--confirm",
                "global",
              ],
              { cwd: process.cwd(), env: operatorEnv, encoding: "utf8" },
            );
            if (emergency.status !== 0) {
              const diagnostic = {
                exitStatus: emergency.status,
                diagnosticCodes: diagnosticCodes(emergency.stdout, emergency.stderr),
                stderrSha256: createHash("sha256")
                  .update(emergency.stderr, "utf8")
                  .digest("hex"),
              };
              writeFileSync(
                `${work}/emergency-control-diagnostic.json`,
                `${JSON.stringify(diagnostic)}\n`,
                { mode: 0o644 },
              );
              throw new Error(
                `review_v2_global_emergency_open_failed:exit_${emergency.status ?? "unknown"}`,
              );
            }
            const emergencyResult = JSON.parse(emergency.stdout);
            if (emergencyResult.control?.stopped !== false) {
              throw new Error("review_v2_global_emergency_open_not_confirmed");
            }
            writeFileSync(
              `${work}/emergency-control-result.json`,
              `${JSON.stringify({
                requestedState: "open",
                writeStatus: emergencyResult.status,
                stopped: emergencyResult.control.stopped,
              })}\n`,
              { mode: 0o644 },
            );
            const operatorWorkspaceId = process.env.OPERATOR_WORKSPACE_ID;
            if (operatorWorkspaceId) {
              const workspaceEmergency = spawnSync(
                "node",
                [
                  "--conditions=production",
                  "apps/api/dist/review-action-v2-operator-cli.js",
                  "emergency",
                  "workspace",
                  "open",
                  "--workspace",
                  operatorWorkspaceId,
                  "--confirm",
                  operatorWorkspaceId,
                ],
                { cwd: process.cwd(), env: operatorEnv, encoding: "utf8" },
              );
              if (workspaceEmergency.status !== 0) {
                const diagnostic = {
                  workspaceId: operatorWorkspaceId,
                  exitStatus: workspaceEmergency.status,
                  diagnosticCodes: diagnosticCodes(
                    workspaceEmergency.stdout,
                    workspaceEmergency.stderr,
                  ),
                  stderrSha256: createHash("sha256")
                    .update(workspaceEmergency.stderr, "utf8")
                    .digest("hex"),
                };
                writeFileSync(
                  `${work}/workspace-emergency-control-diagnostic.json`,
                  `${JSON.stringify(diagnostic)}\n`,
                  { mode: 0o644 },
                );
                throw new Error(
                  `review_v2_workspace_emergency_open_failed:exit_${workspaceEmergency.status ?? "unknown"}`,
                );
              }
              const workspaceEmergencyResult = JSON.parse(
                workspaceEmergency.stdout,
              );
              if (
                workspaceEmergencyResult.workspaceId !== operatorWorkspaceId ||
                workspaceEmergencyResult.control?.stopped !== false
              ) {
                throw new Error(
                  "review_v2_workspace_emergency_open_not_confirmed",
                );
              }
              writeFileSync(
                `${work}/workspace-emergency-control-result.json`,
                `${JSON.stringify({
                  workspaceId: operatorWorkspaceId,
                  requestedState: "open",
                  writeStatus: workspaceEmergencyResult.status,
                  stopped: workspaceEmergencyResult.control.stopped,
                })}\n`,
                { mode: 0o644 },
              );
            }
            const operatorRepository = process.env.OPERATOR_REPOSITORY;
            if (operatorRepository) {
              const repositoryEmergency = spawnSync(
                "node",
                [
                  "--conditions=production",
                  "apps/api/dist/review-action-v2-operator-cli.js",
                  "emergency",
                  "repository",
                  "open",
                  "--repo",
                  operatorRepository,
                  "--confirm",
                  operatorRepository,
                ],
                { cwd: process.cwd(), env: operatorEnv, encoding: "utf8" },
              );
              if (repositoryEmergency.status !== 0) {
                const diagnostic = {
                  repository: operatorRepository,
                  exitStatus: repositoryEmergency.status,
                  diagnosticCodes: diagnosticCodes(
                    repositoryEmergency.stdout,
                    repositoryEmergency.stderr,
                  ),
                  stderrSha256: createHash("sha256")
                    .update(repositoryEmergency.stderr, "utf8")
                    .digest("hex"),
                };
                writeFileSync(
                  `${work}/repository-emergency-control-diagnostic.json`,
                  `${JSON.stringify(diagnostic)}\n`,
                  { mode: 0o644 },
                );
                throw new Error(
                  `review_v2_repository_emergency_open_failed:exit_${repositoryEmergency.status ?? "unknown"}`,
                );
              }
              const repositoryEmergencyResult = JSON.parse(
                repositoryEmergency.stdout,
              );
              if (
                repositoryEmergencyResult.repository !== operatorRepository ||
                repositoryEmergencyResult.control?.stopped !== false
              ) {
                throw new Error(
                  "review_v2_repository_emergency_open_not_confirmed",
                );
              }
              writeFileSync(
                `${work}/repository-emergency-control-result.json`,
                `${JSON.stringify({
                  repository: operatorRepository,
                  requestedState: "open",
                  writeStatus: repositoryEmergencyResult.status,
                  stopped: repositoryEmergencyResult.control.stopped,
                })}\n`,
                { mode: 0o644 },
              );
              const rolloutStatus = spawnSync(
                "node",
                [
                  "--conditions=production",
                  "apps/api/dist/review-action-v2-operator-cli.js",
                  "investigation",
                  "rollout-status",
                  "--repo",
                  operatorRepository,
                  "--release",
                  attestation.producerReleaseId,
                  "--provider",
                  "codex",
                ],
                { cwd: process.cwd(), env: operatorEnv, encoding: "utf8" },
              );
              if (rolloutStatus.status !== 0) {
                const diagnostic = {
                  repository: operatorRepository,
                  exitStatus: rolloutStatus.status,
                  diagnosticCodes: diagnosticCodes(
                    rolloutStatus.stdout,
                    rolloutStatus.stderr,
                  ),
                  stderrSha256: createHash("sha256")
                    .update(rolloutStatus.stderr, "utf8")
                    .digest("hex"),
                };
                writeFileSync(
                  `${work}/investigation-rollout-status-diagnostic.json`,
                  `${JSON.stringify(diagnostic)}\n`,
                  { mode: 0o644 },
                );
                throw new Error(
                  `review_v2_investigation_rollout_status_failed:exit_${rolloutStatus.status ?? "unknown"}`,
                );
              }
              const rolloutStatusResult = JSON.parse(rolloutStatus.stdout);
              writeFileSync(
                `${work}/investigation-rollout-status-result.json`,
                `${JSON.stringify(rolloutStatusResult)}\n`,
                { mode: 0o644 },
              );
              const rolloutProfile =
                process.env.INVESTIGATION_ROLLOUT_PROFILE ?? "preserve";
              if (
                rolloutProfile === "production" &&
                process.env.INVESTIGATION_PRODUCER_RELEASE_ID !==
                  attestation.producerReleaseId
              ) {
                throw new Error(
                  "review_v2_investigation_producer_release_mismatch",
                );
              }
              const requiredCapabilities =
                rolloutProfile === "production"
                  ? ["recording", "shadow", "context_critic", "production_effects"]
                  : rolloutProfile === "shadow"
                    ? ["recording", "shadow", "context_critic"]
                    : ["recording"];
              if (
                requiredCapabilities.some(
                  (capability) =>
                    rolloutStatusResult.decisions?.[capability] !== "allowed",
                )
              ) {
                throw new Error(
                  "review_v2_investigation_profile_not_allowed",
                );
              }
            }
          }
          NODE

          jq -e \
            --arg sha "$ACTION_COMMIT_SHA" '
              .actionCommitSha == $sha
              and (.producerReleaseId | type == "string" and length > 0)
              and (.releaseStatus == "created" or .releaseStatus == "restored")
            ' "$work/registration-result.json" >/dev/null
          jq -c . "$work/registration-result.json"

          jq -n --rawfile value "$work/updated-attestations.json" \
            '{value: ($value | rtrimstr("\n"))}' > "$work/attestations-env.json"
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            render_api -X PUT -H "Content-Type: application/json" \
              --data-binary @"$work/attestations-env.json" \
              "https://api.render.com/v1/services/$service_id/env-vars/REVIEW_ROUTER_REVIEW_V2_PRODUCER_RELEASE_ATTESTATIONS_JSON" \
              -o /dev/null
          done

          deploys='[]'
          deploy_creation_evidence='[]'
          printf '%s\n' "$deploy_creation_evidence" \
            > "$work/deploy-creation-evidence.json"
          jq -n --arg commitId "$RELEASE_COMMIT_SHA" \
            '{clearCache: "do_not_clear", commitId: $commitId}' \
            > "$work/deploy-request.json"
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            before_deploy_id="$(
              jq -er --arg serviceId "$service_id" '
                map(select(.serviceId == $serviceId))
                | if length == 1 then .[0].deployId
                  else error("registration_deploy_preflight_identity")
                  end
              ' "$work/live-service-preflight.json"
            )"
            before_deploys="$(
              fetch_registration_deployment_inventory "$service_id" "$((SECONDS + 120))"
            )"
            before_deploy_snapshot="$(
              jq -ce --arg serviceId "$service_id" '
                (if type == "array" then .
                 elif (.deploys | type) == "array" then .deploys
                 else error("registration_deploy_list_shape")
                 end)
                | map(.deploy // .)
                | map({
                    deployId: (
                      .id
                      | select(type == "string" and test("^dep-[a-z0-9-]+$"))
                    ),
                    serviceId: (.serviceId // $serviceId),
                    status,
                    observedCommitSha: (
                      .commit.id // .commit.sha // .commitId // ""
                    ),
                    createdAt
                  })
              ' <<<"$before_deploys"
            )"
            jq -e \
              --arg serviceId "$service_id" \
              --arg beforeDeployId "$before_deploy_id" \
              --arg releaseCommitSha "$RELEASE_COMMIT_SHA" '
                length >= 1
                and (([.[].deployId] | length) == ([.[].deployId] | unique | length))
                and all(.serviceId == $serviceId)
                and .[0].deployId == $beforeDeployId
                and .[0].status == "live"
                and .[0].observedCommitSha == $releaseCommitSha
              ' <<<"$before_deploy_snapshot" >/dev/null
            before_deploy_ids="$(
              jq -c '[.[].deployId]' <<<"$before_deploy_snapshot"
            )"
            deploy_intent_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
            deploy_intent_epoch="$(date -u -d "$deploy_intent_at" +%s)"
            set +e
            deploy="$(
              render_deploy_mutation -X POST -H "Content-Type: application/json" \
                --data-binary @"$work/deploy-request.json" \
                "https://api.render.com/v1/services/$service_id/deploys"
            )"
            deploy_mutation_status=$?
            set -e
            deploy_id=""
            if [[ "$deploy_mutation_status" -eq 0 ]]; then
              deploy_id="$(
                jq -r '
                  if type == "object" then (.id // .deploy.id // empty)
                  else empty
                  end
                ' <<<"$deploy" 2>/dev/null || true
              )"
              if [[ ! "$deploy_id" =~ ^dep-[a-z0-9-]+$ ]]; then
                deploy_id=""
              fi
            fi
            reconciled=false
            if [[ -z "$deploy_id" ]]; then
              reconciled=true
              reconciliation_deadline=$((SECONDS + 120))
              reconciliation_candidates='[]'
              while (( SECONDS < reconciliation_deadline )); do
                recent_deploys="$(
                  fetch_registration_deployment_inventory "$service_id" "$reconciliation_deadline"
                )"
                reconciliation_candidates="$(
                  jq -ce \
                    --arg serviceId "$service_id" \
                    --argjson beforeDeployIds "$before_deploy_ids" \
                    --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
                    --argjson intentEpoch "$deploy_intent_epoch" '
                      (if type == "array" then .
                       elif (.deploys | type) == "array" then .deploys
                       else error("registration_deploy_list_shape")
                       end)
                      | map(.deploy // .)
                      | map(select(
                          (.id | type) == "string"
                          and (.id | test("^dep-[a-z0-9-]+$"))
                          and (.id as $id | ($beforeDeployIds | index($id)) == null)
                          and ((.serviceId // $serviceId) == $serviceId)
                          and (
                            (.commit.id // .commit.sha // .commitId // "")
                            == $releaseCommitSha
                          )
                          and ((.createdAt | type) == "string")
                          and (
                            try (
                              (.createdAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)
                              >= ($intentEpoch - 5)
                            ) catch false
                          )
                        ))
                      | map({
                          deployId: .id,
                          status,
                          createdAt,
                          observedCommitSha: (
                            .commit.id // .commit.sha // .commitId
                          )
                        })
                    ' <<<"$recent_deploys"
                )"
                jq -n \
                  --arg serviceId "$service_id" \
                  --arg beforeDeployId "$before_deploy_id" \
                  --arg intentAt "$deploy_intent_at" \
                  --argjson mutationExitStatus "$deploy_mutation_status" \
                  --argjson candidates "$reconciliation_candidates" '
                    {
                      serviceId: $serviceId,
                      beforeDeployId: $beforeDeployId,
                      intentAt: $intentAt,
                      mutationExitStatus: $mutationExitStatus,
                      candidates: $candidates
                    }
                  ' > "$work/deploy-reconciliation-$service_id.json"
                candidate_count="$(jq -r 'length' <<<"$reconciliation_candidates")"
                if (( candidate_count > 1 )); then
                  echo "::error::Render deploy reconciliation is ambiguous for $service_id"
                  exit 1
                fi
                if (( candidate_count == 1 )); then
                  deploy_id="$(jq -er '.[0].deployId' <<<"$reconciliation_candidates")"
                  break
                fi
                sleep 5
              done
              if [[ -z "$deploy_id" ]]; then
                echo "::error::Render deploy mutation could not be reconciled for $service_id"
                exit 1
              fi
            fi
            [[ "$deploy_id" =~ ^dep-[a-z0-9-]+$ ]]
            [[ "$deploy_id" != "$before_deploy_id" ]]
            deploys="$(
              jq -c \
                --arg serviceId "$service_id" \
                --arg deployId "$deploy_id" \
                '. + [{serviceId: $serviceId, deployId: $deployId}]' \
                <<<"$deploys"
            )"
            deploy_creation_evidence="$(
              jq -c \
                --arg serviceId "$service_id" \
                --arg beforeDeployId "$before_deploy_id" \
                --argjson beforeDeployIds "$before_deploy_ids" \
                --arg deployId "$deploy_id" \
                --arg intentAt "$deploy_intent_at" \
                --argjson mutationExitStatus "$deploy_mutation_status" \
                --argjson reconciled "$reconciled" '
                  . + [{
                    serviceId: $serviceId,
                    beforeDeployId: $beforeDeployId,
                    beforeDeployIds: $beforeDeployIds,
                    deployId: $deployId,
                    intentAt: $intentAt,
                    mutationExitStatus: $mutationExitStatus,
                    reconciled: $reconciled
                  }]
                ' <<<"$deploy_creation_evidence"
            )"
            printf '%s\n' "$deploy_creation_evidence" \
              > "$work/deploy-creation-evidence.json"
          done

          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            pending=0
            failed=0
            statuses='[]'
            while IFS=$'\t' read -r service_id deploy_id; do
              deploy="$(
                render_api \
                  "https://api.render.com/v1/services/$service_id/deploys/$deploy_id"
              )"
              status="$(jq -er '(.deploy // .).status' <<<"$deploy")"
              observed_commit_sha="$(
                jq -er '
                  (.deploy // .)
                  | (.commit.id // .commit.sha // .commitId // "")
                  | select(
                      type == "string"
                      and (. == "" or test("^[a-f0-9]{40}$"))
                    )
                ' <<<"$deploy"
              )"
              statuses="$(
                jq -c \
                  --arg serviceId "$service_id" \
                  --arg deployId "$deploy_id" \
                  --arg status "$status" \
                  --arg observedCommitSha "$observed_commit_sha" \
                  '. + [{
                    serviceId: $serviceId,
                    deployId: $deployId,
                    status: $status,
                    observedCommitSha: $observedCommitSha
                  }]' \
                  <<<"$statuses"
              )"
              if [[ -n "$observed_commit_sha" && "$observed_commit_sha" != "$RELEASE_COMMIT_SHA" ]]; then
                failed=1
              fi
              case "$status" in
                live)
                  if [[ "$observed_commit_sha" != "$RELEASE_COMMIT_SHA" ]]; then
                    failed=1
                  fi
                  ;;
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated|failed|*_failed)
                  failed=1
                  ;;
                *) pending=1 ;;
              esac
            done < <(jq -r '.[] | [.serviceId, .deployId] | @tsv' <<<"$deploys")
            printf '%s\n' "$statuses" > "$work/deployment-result.json"
            if (( failed == 1 )); then
              jq -c . "$work/deployment-result.json"
              exit 1
            fi
            if (( pending == 0 )); then
              break
            fi
            sleep 10
          done
          jq -e --arg releaseCommitSha "$RELEASE_COMMIT_SHA" '
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and all(.status == "live")
            and all(.observedCommitSha == $releaseCommitSha)
          ' \
            "$work/deployment-result.json" >/dev/null

          current_deployments='[]'
          while IFS=$'\t' read -r service_id expected_deploy_id; do
            latest_deploys="$(
              render_api \
                "https://api.render.com/v1/services/$service_id/deploys?limit=1"
            )"
            current_deployment="$(
              jq -ce --arg serviceId "$service_id" '
                (if type == "array" then .[0] else (.deploys[0] // .[0]) end)
                | (.deploy // .) as $deploy
                | {
                    serviceId: $serviceId,
                    deployId: ($deploy.id | select(type == "string" and length > 0)),
                    status: ($deploy.status | select(type == "string")),
                    observedCommitSha: (
                      ($deploy.commit.id // $deploy.commit.sha // $deploy.commitId // "")
                      | select(
                          type == "string"
                          and (. == "" or test("^[a-f0-9]{40}$"))
                        )
                    )
                  }
              ' <<<"$latest_deploys"
            )"
            current_deployments="$(
              jq -c --argjson observation "$current_deployment" \
                '. + [$observation]' <<<"$current_deployments"
            )"
            printf '%s\n' "$current_deployments" \
              > "$work/current-deployment-result.json"
            jq -e \
              --arg expectedDeployId "$expected_deploy_id" \
              --arg releaseCommitSha "$RELEASE_COMMIT_SHA" '
                .deployId == $expectedDeployId
                and .status == "live"
                and .observedCommitSha == $releaseCommitSha
              ' <<<"$current_deployment" >/dev/null
          done < <(jq -r '.[] | [.serviceId, .deployId] | @tsv' <<<"$deploys")
          jq -e '
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and ([.[].deployId] | unique | length == 3)
          ' "$work/current-deployment-result.json" >/dev/null
          close_firewall
          firewall_open=0

      - name: Upload release registration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewrouter-release-registration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reviewrouter-release-registration/release-manifest.json
            ${{ runner.temp }}/reviewrouter-release-registration/environment-preflight.json
            ${{ runner.temp }}/reviewrouter-release-registration/registration-result.json
            ${{ runner.temp }}/reviewrouter-release-registration/registration-diagnostic.json
            ${{ runner.temp }}/reviewrouter-release-registration/emergency-control-result.json
            ${{ runner.temp }}/reviewrouter-release-registration/emergency-control-diagnostic.json
            ${{ runner.temp }}/reviewrouter-release-registration/workspace-emergency-control-result.json
            ${{ runner.temp }}/reviewrouter-release-registration/workspace-emergency-control-diagnostic.json
            ${{ runner.temp }}/reviewrouter-release-registration/repository-emergency-control-result.json
            ${{ runner.temp }}/reviewrouter-release-registration/repository-emergency-control-diagnostic.json
            ${{ runner.temp }}/reviewrouter-release-registration/investigation-rollout-status-result.json
            ${{ runner.temp }}/reviewrouter-release-registration/investigation-rollout-status-diagnostic.json
            ${{ runner.temp }}/reviewrouter-release-registration/investigation-env-proof.json
            ${{ runner.temp }}/reviewrouter-release-registration/live-service-preflight.json
            ${{ runner.temp }}/reviewrouter-release-registration/deploy-creation-evidence.json
            ${{ runner.temp }}/reviewrouter-release-registration/deploy-reconciliation-*.json
            ${{ runner.temp }}/reviewrouter-release-registration/deployment-result.json
            ${{ runner.temp }}/reviewrouter-release-registration/current-deployment-result.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
