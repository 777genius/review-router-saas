name: PG17 cutover recovery

on:
  workflow_dispatch:
    inputs:
      target_db_id:
        description: Existing restored Render PostgreSQL 17 database ID
        required: true
        type: string
      owner_id:
        description: Exact Render workspace owner ID
        required: true
        type: string
      environment_id:
        description: Exact Render environment ID
        required: true
        type: string
      release_commit_sha:
        description: Exact review-router-saas main commit
        required: true
        type: string
      action_commit_sha:
        description: Exact review-router Action commit to register
        required: false
        type: string
      operator_repository:
        description: Optional OWNER/REPO for closed-gate rollout diagnostics
        required: false
        type: string
      operator_workspace_id:
        description: Optional ReviewRouter workspace for staged rollout configuration
        required: false
        type: string
      investigation_rollout_profile:
        description: Deterministic Review Investigation capability profile to persist before deployment
        required: false
        default: preserve
        type: choice
        options:
          - preserve
          - shadow
          - production
      investigation_repository_connection_id:
        description: Exact repository connection ID required by the production investigation cohort
        required: false
        type: string
      investigation_producer_release_id:
        description: Exact producer release ID required by the production investigation cohort
        required: false
        type: string
      api_service_id:
        description: Exact Render API service ID
        required: true
        type: string
      worker_service_id:
        description: Exact Render worker service ID
        required: true
        type: string
      web_service_id:
        description: Exact Render web service ID
        required: true
        type: string
      confirmation:
        description: Type the confirmation required by the selected operation
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: reviewrouter-pg17-maintenance-migration
  cancel-in-progress: false

jobs:
  trust-bootstrap:
    name: Verify protected main dispatch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      trusted_main_sha: ${{ steps.trust.outputs.trusted_main_sha }}
    steps:
      - name: Establish immutable workflow trust before repository execution
        id: trust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync } = await import("node:fs");
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`registration_trust_missing:${name}`);
            return value;
          };
          const fail = (reason) => {
            throw new Error(`registration_trust_rejected:${reason}`);
          };
          const repository = required("GITHUB_REPOSITORY");
          const dispatchSha = required("GITHUB_SHA").toLowerCase();
          if (required("GITHUB_EVENT_NAME") !== "workflow_dispatch") fail("event");
          if (required("GITHUB_REF") !== "refs/heads/main") fail("workflow_ref");
          if (!/^[a-f0-9]{40}$/.test(dispatchSha)) fail("dispatch_sha");
          const response = await fetch(
            `https://api.github.com/repos/${repository}/branches/main`,
            {
              headers: {
                Authorization: `Bearer ${required("GH_TOKEN")}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
              },
              signal: AbortSignal.timeout(20000),
            },
          );
          if (!response.ok) fail(`github_api_${response.status}`);
          const branch = await response.json();
          if (
            branch.protected !== true ||
            branch.commit?.sha?.toLowerCase() !== dispatchSha
          ) {
            fail("stale_or_unprotected_main");
          }
          const environmentResponse = await fetch(
            `https://api.github.com/repos/${repository}/environments/production-release`,
            {
              headers: {
                Authorization: `Bearer ${required("GH_TOKEN")}`,
                Accept: "application/vnd.github+json",
                "X-GitHub-Api-Version": "2022-11-28",
              },
              signal: AbortSignal.timeout(20000),
            },
          );
          if (!environmentResponse.ok) fail(`environment_api_${environmentResponse.status}`);
          const environment = await environmentResponse.json();
          const reviewers = environment.protection_rules?.find(
            (rule) => rule.type === "required_reviewers",
          );
          if (
            !Array.isArray(reviewers?.reviewers) ||
            reviewers.reviewers.length === 0 ||
            reviewers.prevent_self_review !== true ||
            environment.deployment_branch_policy?.protected_branches !== true ||
            environment.deployment_branch_policy?.custom_branch_policies !== false
          ) fail("environment_unprotected");
          appendFileSync(
            required("GITHUB_OUTPUT"),
            `trusted_main_sha=${dispatchSha}\n`,
            "utf8",
          );
          NODE

  release-evidence:
    name: Verify exact recovery release evidence
    needs: trust-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout immutable release verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ needs.trust-bootstrap.outputs.trusted_main_sha }}
      - name: Require exact PostgreSQL release-gate evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_ROUTER_RELEASE_GATE_SHA: ${{ inputs.release_commit_sha }}
        run: |
          set -euo pipefail
          node scripts/release-gate-evidence.mjs verify

  recover:
    name: Complete restored PG17 cutover
    needs: [trust-bootstrap, release-evidence]
    environment: production-release
    if: ${{ inputs.confirmation == 'RECOVER_EXISTING_PG17' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64: ${{ secrets.SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64 }}
      TARGET_DB_ID: ${{ inputs.target_db_id }}
      RENDER_OWNER_ID: ${{ inputs.owner_id }}
      RENDER_ENVIRONMENT_ID: ${{ inputs.environment_id }}
      RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
      API_SERVICE_ID: ${{ inputs.api_service_id }}
      WORKER_SERVICE_ID: ${{ inputs.worker_service_id }}
      WEB_SERVICE_ID: ${{ inputs.web_service_id }}
      MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout immutable recovery tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.trust-bootstrap.outputs.trusted_main_sha }}

      - name: Install and validate recovery tooling
        shell: bash
        run: |
          set -euo pipefail
          test "$MIGRATION_CONFIRMATION" = "RECOVER_EXISTING_PG17"
          [[ "$TARGET_DB_ID" =~ ^dpg-[a-z0-9-]+$ ]]
          [[ "$RENDER_OWNER_ID" =~ ^tea-[a-z0-9-]+$ ]]
          [[ "$RENDER_ENVIRONMENT_ID" =~ ^evm-[a-z0-9-]+$ ]]
          [[ "$RELEASE_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          TRUSTED_MAIN_SHA="${{ needs.trust-bootstrap.outputs.trusted_main_sha }}"
          [[ "$TRUSTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git cat-file -t "$RELEASE_COMMIT_SHA")" == "commit" ]]
          [[ "$(git cat-file -t "$TRUSTED_MAIN_SHA")" == "commit" ]]
          git merge-base --is-ancestor "$RELEASE_COMMIT_SHA" "$TRUSTED_MAIN_SHA"
          git switch --detach "$RELEASE_COMMIT_SHA"
          observed_source_sha="$(git rev-parse HEAD)"
          [[ "$observed_source_sha" == "$RELEASE_COMMIT_SHA" ]]
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            [[ "$service_id" =~ ^srv-[a-z0-9-]+$ ]]
          done
          [[ "$API_SERVICE_ID" != "$WORKER_SERVICE_ID" ]]
          [[ "$API_SERVICE_ID" != "$WEB_SERVICE_ID" ]]
          [[ "$WORKER_SERVICE_ID" != "$WEB_SERVICE_ID" ]]
          corepack enable
          node scripts/install-private-dependencies.mjs --frozen-lockfile
          pnpm db:generate
          docker pull postgres:17-alpine >/dev/null

      - name: Authenticate existing production topology
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_MAIN_SHA: ${{ needs.trust-bootstrap.outputs.trusted_main_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reviewrouter-pg17-recovery"
          node --input-type=module <<'NODE'
          import {writeFileSync} from "node:fs";
          import {authenticateRecoveryTopology} from "./scripts/render-recovery-journal.mjs";
          const topology = await authenticateRecoveryTopology(process.env.GH_TOKEN, process.env.TRUSTED_MAIN_SHA);
          writeFileSync(`${process.env.RUNNER_TEMP}/reviewrouter-pg17-recovery/trusted-topology.json`, JSON.stringify(topology) + "\n", {mode:0o600});
          NODE

      - name: Provision roles, migrate, switch services, and resume
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/reviewrouter-pg17-recovery"
          mkdir -p "$work"
          rm -f "$work/worker-effect-fence.json"
          firewall_open=0
          render_api() {
            if [[ " $* " == *" -X "* ]]; then
              assert_recovery_target_identity || return 1
              assert_recovery_fleet_identity || return 1
            fi
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 120 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          # A deploy creation has an uncertain side-effect boundary. Never retry
          # this POST; reconcile an accepted-but-unobserved response instead.
          render_deploy_mutation() {
            if [[ " $* " == *" -X "* ]]; then
              assert_recovery_target_identity || return 1
              assert_recovery_fleet_identity || return 1
            fi
            curl --fail --silent --show-error \
              --connect-timeout 15 --max-time 120 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          # Activation-sensitive reads must honor the caller's absolute
          # deadline. Retrying a page here could make an outer deadline
          # meaningless while the fleet is suspended or partly resumed.
          render_inventory_api() {
            local absolute_deadline="$1"
            local remaining request_timeout
            shift
            if [[ " $* " == *" -X "* ]]; then
              assert_recovery_target_identity "$absolute_deadline" || return 1
              assert_recovery_fleet_identity "$absolute_deadline" || return 1
            fi
            remaining=$((absolute_deadline - SECONDS))
            if (( remaining <= 0 )); then
              echo "::error::Render inventory deadline expired before request" >&2
              return 124
            fi
            request_timeout="$remaining"
            if (( request_timeout > 20 )); then
              request_timeout=20
            fi
            curl --fail --silent --show-error \
              --connect-timeout 5 --max-time "$request_timeout" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          suspension_guard_armed=0
          recovery_complete=0
          recovery_suspension_set_filter='
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and ([.[].observedServiceId] | unique | length == 3)
            and all(
              .serviceId == .observedServiceId
              and .suspended == "suspended"
            )
          '
          assert_recovery_admission_closed() {
            local observation
            observation="$(docker run --rm -i -e DATABASE_URL postgres:17-alpine \
              sh -ceu 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At' <<'SQL'
          SELECT json_build_object(
            'review', (SELECT json_agg(row_to_json(c)) FROM (
              SELECT "policyScope", "workspaceId", "repositoryConnectionId",
                "scmRepositoryIdentityId", stopped, version
              FROM "ReviewSafetyEmergencyControl" WHERE "policyScope" = 'global'
            ) c),
            'hosted', (SELECT json_agg(row_to_json(g)) FROM (
              SELECT id, status, "authzEpoch"::text, revision::text
              FROM "HostedCodexRuntimeGate" WHERE id = 'global'
            ) g)
          );
          SQL
            )" || return 1
            observation="$(jq -cse '
              if length == 1 and (.[0] | type) == "object" then .[0]
              else error("recovery_admission_response_ambiguous") end
            ' <<<"$observation")" || return 1
            jq -e '
              (.review | type == "array" and length == 1)
              and .review[0].policyScope == "global"
              and .review[0].workspaceId == null
              and .review[0].repositoryConnectionId == null
              and .review[0].scmRepositoryIdentityId == null
              and .review[0].stopped == true
              and (.review[0].version | type == "number" and . >= 1 and floor == .)
              and (.hosted | type == "array" and length == 1)
              and .hosted[0].id == "global"
              and .hosted[0].status == "closed"
              and (.hosted[0].authzEpoch | type == "string" and test("^[1-9][0-9]*$"))
              and (.hosted[0].revision | type == "string" and test("^[1-9][0-9]*$"))
            ' <<<"$observation" >/dev/null || return 1
            printf '%s\n' "$observation" > "$work/admission-closed-result.json" || return 1
          }
          close_recovery_admission() {
            assert_recovery_target_identity || return 1
            assert_recovery_fleet_identity || return 1
            docker run --rm -i -e DATABASE_URL postgres:17-alpine \
              sh -ceu 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -q' <<'SQL' || return 1
          BEGIN;
          SET LOCAL lock_timeout = '10s';
          SET LOCAL statement_timeout = '30s';
          LOCK TABLE "ReviewSafetyEmergencyControl", "HostedCodexRuntimeGate" IN EXCLUSIVE MODE;
          DO $closed$ BEGIN
            IF (SELECT count(*) FROM "ReviewSafetyEmergencyControl" WHERE "policyScope" = 'global') <> 1
              OR (SELECT count(*) FROM "HostedCodexRuntimeGate" WHERE id = 'global') <> 1 THEN
              RAISE EXCEPTION 'recovery admission singleton missing or ambiguous';
            END IF;
          END $closed$;
          UPDATE "ReviewSafetyEmergencyControl" SET stopped = true, version = version + 1,
            reason = 'PG17 recovery', "updatedBy" = 'pg17-recovery', "updatedAt" = clock_timestamp()
            WHERE "policyScope" = 'global' AND stopped IS DISTINCT FROM true;
          UPDATE "HostedCodexRuntimeGate" SET status = 'closed', "authzEpoch" = "authzEpoch" + 1,
            revision = revision + 1, "reasonCode" = 'pg17_recovery',
            "changedAt" = GREATEST(clock_timestamp(), "changedAt" + INTERVAL '1 millisecond'),
            "changedByHash" = encode(sha256(convert_to('pg17-recovery', 'UTF8')), 'hex') WHERE id = 'global' AND status <> 'closed';
          COMMIT;
          SQL
            assert_recovery_admission_closed || return 1
          }
          capture_worker_effect_fence() {
            local purpose="${1:-bootstrap}"
            node --input-type=module <<'NODE' > "$work/worker-fence-observe.sql" || return 1
          import { workerFenceSnapshotSql } from "./scripts/render-recovery-journal.mjs";
          process.stdout.write(workerFenceSnapshotSql + ";");
          NODE
            docker run --rm -e DATABASE_URL -v "$work:/work:ro" postgres:17-alpine \
              sh -ceu 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atf /work/worker-fence-observe.sql' \
              > "$work/worker-fence-before.json" || return 1
            WORK="$work" PURPOSE="$purpose" node --input-type=module <<'NODE' || return 1
          import { readFileSync, writeFileSync } from "node:fs";
          import { planWorkerEffectFence, planWorkerCompensationFence } from "./scripts/render-recovery-journal.mjs";
          const work = process.env.WORK;
          const evidence = (process.env.PURPOSE === "compensation" ? planWorkerCompensationFence : planWorkerEffectFence)(JSON.parse(readFileSync(`${work}/worker-fence-before.json`, "utf8")));
          writeFileSync(`${work}/worker-effect-fence.json`, JSON.stringify(evidence) + "\n", { mode: 0o600 });
          NODE
          }
          establish_recovery_barriers() {
            close_recovery_admission || return 1
            persist_recovery_phase admission_closed || return 1
            set_recovery_maintenance true || return 1
            persist_recovery_phase maintenance_enabled || return 1
            capture_worker_effect_fence || return 1
            jq --slurpfile fence "$work/worker-effect-fence.json" \
              '.workerFence = $fence[0] | .revision += 1' "$work/recovery-journal.json" > "$work/journal-next.json" || return 1
            mv "$work/journal-next.json" "$work/recovery-journal.json" || return 1
            persist_recovery_phase worker_fence_intent || return 1
            worker_fence_sql fence > "$work/worker-fence.sql" || return 1
            docker run --rm -e DATABASE_URL -v "$work:/work:ro" postgres:17-alpine \
              sh -ceu 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -qf /work/worker-fence.sql' || return 1
            assert_worker_effect_fenced || return 1
            assert_recovery_admission_closed || return 1
            assert_recovery_maintenance true || return 1
            persist_recovery_phase barriers_verified || return 1
          }
          assert_recovery_maintenance() {
            local enabled="$1" deadline="${2:-$((SECONDS + 90))}" service_id observation
            for service_id in "$API_SERVICE_ID" "$WEB_SERVICE_ID"; do
              observation="$(render_inventory_api "$deadline" \
                "https://api.render.com/v1/services/$service_id")" || return 1
              jq -e --arg id "$service_id" --argjson enabled "$enabled" '
                (.service // .) | .id == $id
                and .serviceDetails.maintenanceMode.enabled == $enabled
                and .serviceDetails.maintenanceMode.uri == ""
              ' <<<"$observation" >/dev/null || return 1
            done
          }
          set_recovery_maintenance() {
            local enabled="$1" deadline="${2:-$((SECONDS + 90))}" service_id failed=0
            local recovery_closure=0
            [[ "$enabled" != true ]] || recovery_closure=1
            local body
            body="$(jq -nc --argjson enabled "$enabled" \
              '{serviceDetails:{maintenanceMode:{enabled:$enabled,uri:""}}}')" || return 1
            # Try both exact services even if the first PATCH loses its response.
            for service_id in "$API_SERVICE_ID" "$WEB_SERVICE_ID"; do
              render_inventory_api "$deadline" -X PATCH -H "Content-Type: application/json" \
                --data-binary "$body" "https://api.render.com/v1/services/$service_id" \
                -o /dev/null || failed=1
            done
            assert_recovery_maintenance "$enabled" "$deadline" || return 1
            [[ "$failed" -eq 0 ]]
          }
          worker_fence_sql() {
            local operation="$1"
            assert_recovery_target_identity || return 1
            assert_recovery_fleet_identity || return 1
            WORK="$work" OPERATION="$operation" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { workerEffectFenceSql } from "./scripts/render-recovery-journal.mjs";
          const evidence = JSON.parse(readFileSync(`${process.env.WORK}/worker-effect-fence.json`, "utf8"));
          process.stdout.write(workerEffectFenceSql(evidence, process.env.OPERATION === "restore"));
          NODE
          }
          assert_worker_effect_fenced() {
            WORK="$work" node --input-type=module <<'NODE' > "$work/worker-fence-observe.sql" || return 1
          import { workerFenceSnapshotSql } from "./scripts/render-recovery-journal.mjs";
          process.stdout.write(workerFenceSnapshotSql + ";");
          NODE
            docker run --rm -e DATABASE_URL -v "$work:/work:ro" postgres:17-alpine \
              sh -ceu 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atf /work/worker-fence-observe.sql' \
              > "$work/worker-fence-observed.json" || return 1
            jq -e --slurpfile expected "$work/worker-effect-fence.json" \
              '. == $expected[0].fenced' "$work/worker-fence-observed.json" >/dev/null
          }
          assert_recovery_config_unchanged() {
            local service_id
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              render_inventory_api "$((SECONDS + 30))" \
                "https://api.render.com/v1/services/$service_id/env-vars" \
                > "$work/current-$service_id-env.json" || return 1
            done
            WORK="$work" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { recoveryConfigFingerprint } from "./scripts/render-recovery-journal.mjs";
          const work = process.env.WORK;
          const expected = JSON.parse(readFileSync(`${work}/recovery-config-fingerprints.json`, "utf8"));
          for (const { serviceId, fingerprint } of Object.values(expected)) {
            if (recoveryConfigFingerprint(readFileSync(`${work}/current-${serviceId}-env.json`, "utf8")) !== fingerprint) {
              throw new Error("recovery_configuration_drift");
            }
          }
          NODE
          }
          open_recovery_database() {
            local deadline=$((SECONDS + 120)) runner_ip
            runner_ip="$(curl --fail --silent --show-error --max-time 20 https://api.ipify.org)" || return 1
            [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || return 1
            jq -n --arg cidr "$runner_ip/32" '{ipAllowList: [{
              cidrBlock: $cidr, description: "temporary GitHub PG17 cutover recovery"
            }]}' > "$work/firewall.json" || return 1
            # Reopening is also required after an accepted-but-unobserved close.
            firewall_open=1
            render_inventory_api "$deadline" -X PATCH -H "Content-Type: application/json" \
              --data-binary @"$work/firewall.json" \
              "https://api.render.com/v1/postgres/$TARGET_DB_ID" -o /dev/null || return 1
            render_inventory_api "$deadline" "https://api.render.com/v1/postgres/$TARGET_DB_ID/connection-info" \
              > "$work/connection-info.json" || return 1
            external_url="$(jq -er '.externalConnectionString' "$work/connection-info.json")" || return 1
            if [[ "$external_url" == *\?* ]]; then
              external_url="$external_url&sslmode=require&connect_timeout=15"
            else
              external_url="$external_url?sslmode=require&connect_timeout=15"
            fi
            export DATABASE_URL="$external_url"
          }
          compensate_worker_effect_fence() {
            local recovery_closure=1
            # Evidence is staged before rejecting torn phase replicas. It conveys
            # exact REVOKE authority only; recovery itself remains rejected.
            open_recovery_database || return 1
            close_recovery_admission || return 1
            if [[ ! -f "$work/worker-effect-fence.json" ]]; then
              capture_worker_effect_fence compensation || return 1
            fi
            worker_fence_sql fence > "$work/worker-refence.sql" || return 1
            docker run --rm -e DATABASE_URL -v "$work:/work:ro" postgres:17-alpine \
              sh -ceu 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -qf /work/worker-refence.sql' || return 1
            assert_worker_effect_fenced || return 1
            assert_recovery_admission_closed || return 1
          }
          close_firewall() {
            local recovery_closure=1
            if [[ "$firewall_open" -eq 1 ]]; then
              render_api -X PATCH \
                -H "Content-Type: application/json" \
                --data-binary '{"ipAllowList":[]}' \
                "https://api.render.com/v1/postgres/$TARGET_DB_ID" \
                -o /dev/null || return 1
              render_api "https://api.render.com/v1/postgres/$TARGET_DB_ID" \
                | jq -e --arg targetDbId "$TARGET_DB_ID" '
                    .id == $targetDbId and .ipAllowList == []
                  ' >/dev/null || return 1
              firewall_open=0
            fi
          }
          compensate_recovery_fleet() {
            local recovery_closure=1
            local deadline observations observed_service_id service service_id state
            deadline=$((SECONDS + ${RECOVERY_COMPENSATION_TIMEOUT_SECONDS:-300}))
            observations='[]'
            while (( SECONDS < deadline )); do
              for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
                # A resume response may be uncertain or not visible yet. Retry
                # the idempotent suspend for every exact ID within one absolute
                # deadline, including one that still reads as suspended.
                render_inventory_api "$deadline" -X POST \
                  "https://api.render.com/v1/services/$service_id/suspend" \
                  -o /dev/null || true
              done
              observations='[]'
              for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
                service="$(
                  render_inventory_api "$deadline" \
                    "https://api.render.com/v1/services/$service_id" \
                    2>/dev/null || true
                )"
                observed_service_id="$(
                  jq -er '(.service // .).id' <<<"$service" 2>/dev/null || true
                )"
                state="$(
                  jq -er '(.service // .).suspended' \
                    <<<"$service" 2>/dev/null || true
                )"
                observations="$(
                  jq -c \
                    --arg serviceId "$service_id" \
                    --arg observedServiceId "$observed_service_id" \
                    --arg suspended "$state" '
                      . + [{
                        serviceId: $serviceId,
                        observedServiceId: $observedServiceId,
                        suspended: $suspended
                      }]
                    ' \
                    <<<"$observations"
                )"
              done
              if jq -e "$recovery_suspension_set_filter" \
                <<<"$observations" >/dev/null; then
                break
              fi
              sleep 10
            done
            printf '%s\n' "$observations" \
              > "$work/compensation-suspension-result.json"
            jq -e "$recovery_suspension_set_filter" \
              <<<"$observations" >/dev/null
          }
          cleanup() {
            local cleanup_status=$?
            trap - EXIT
            trap '' HUP INT TERM
            set +e
            if [[ "$suspension_guard_armed" -eq 1 && "$recovery_complete" -eq 0 ]]; then
              echo "::warning::Recovery exited after the suspension barrier; converging all runtime services back to suspended."
              if ! set_recovery_maintenance true; then
                echo "::error::Recovery could not prove API/web maintenance enabled."
                cleanup_status=1
              fi
              if ! compensate_recovery_fleet; then
                echo "::error::Recovery compensation could not prove all runtime services suspended."
                if [[ "$cleanup_status" -eq 0 ]]; then
                  cleanup_status=1
                fi
              fi
              if ! compensate_worker_effect_fence; then
                echo "::error::Recovery could not prove the worker effect fence and closed admission."
                cleanup_status=1
              fi
            fi
            if ! close_firewall; then
              echo "::error::Recovery could not prove the database firewall closed."
              cleanup_status=1
            fi
            rm -f "$work"/*secret* "$work"/*url* "$work"/*env.json "$work/connection-info.json"
            exit "$cleanup_status"
          }
          terminate_recovery() {
            local signal_status="$1"
            # Convert runner cancellation signals to a normal shell exit so
            # the EXIT trap can converge the exact fleet back to suspended.
            trap '' HUP INT TERM
            exit "$signal_status"
          }
          trap cleanup EXIT
          trap 'terminate_recovery 129' HUP
          trap 'terminate_recovery 130' INT
          trap 'terminate_recovery 143' TERM

          # Canonical names and git topology bind the verified production roles.
          # Read the whole identity set before any suspension or credential effect.
          service_scope_filter='
            (.service // .)
            | .id == $serviceId
              and .name == $serviceName
              and (.ownerId // .owner.id) == $ownerId
              and (.owner.id == null or .owner.id == $ownerId)
              and .environmentId == $environmentId
              and .type == $serviceType
              and .repo == "https://github.com/777genius/review-router-saas"
              and .branch == "main"
              and .autoDeploy == "no"
              and (.suspended == "suspended" or .suspended == "not_suspended")
          '
          assert_recovery_trusted_topology() {
            WORK="$work" node --input-type=module <<'NODE' || return 1
          import {readFileSync} from "node:fs";
          import {recoveryProductionScope, recoveryRoles, recoveryTopologyAuthorityValid} from "./scripts/render-recovery-journal.mjs";
          const trusted = JSON.parse(readFileSync(`${process.env.WORK}/trusted-topology.json`, "utf8"));
          if (trusted.ownerId !== recoveryProductionScope.ownerId || trusted.environmentId !== recoveryProductionScope.environmentId ||
            trusted.repository !== recoveryProductionScope.repository || !recoveryTopologyAuthorityValid(trusted, process.env.GITHUB_SHA) ||
            process.env.TARGET_DB_ID !== trusted.targetDbId ||
            process.env.RENDER_OWNER_ID !== trusted.ownerId || process.env.RENDER_ENVIRONMENT_ID !== trusted.environmentId ||
            JSON.stringify(Object.keys(trusted.services ?? {}).sort()) !== JSON.stringify([...recoveryRoles].sort()) ||
            recoveryRoles.some(role => process.env[`${role.toUpperCase()}_SERVICE_ID`] !== trusted.services[role]?.id)) {
            throw new Error("recovery_untrusted_topology");
          }
          NODE
          }
          assert_recovery_target_identity() {
            assert_recovery_trusted_topology || return 1
            local target deadline="${1:-$((SECONDS + 90))}"
            target="$(render_inventory_api "$deadline" "https://api.render.com/v1/postgres/$TARGET_DB_ID")" || return 1
            target="$(jq -cse '
              if length == 1 and (.[0] | type) == "object" then .[0]
              else error("recovery_target_response_ambiguous") end
            ' <<<"$target")" || return 1
            jq -e --arg targetDbId "$TARGET_DB_ID" \
              --arg ownerId "$RENDER_OWNER_ID" \
              --arg environmentId "$RENDER_ENVIRONMENT_ID" --argjson closing "${recovery_closure:-0}" '
                .id == $targetDbId
                and .version == "17"
                and ($closing == 1 or .status == "available")
                and .name == "reviewrouter-db"
                and .environmentId == $environmentId
                and (.ownerId // .owner.id) == $ownerId
                and (.owner.id == null or .owner.id == $ownerId)
              ' <<<"$target" >/dev/null || return 1
            printf '%s\n' "$target" > "$work/target.json" || return 1
          }
          assert_recovery_fleet_identity() {
            assert_recovery_trusted_topology || return 1
            local service_id service_type service_name service deadline="${1:-$((SECONDS + 90))}"
            local scope_filter="$service_scope_filter"
            if [[ "${recovery_closure:-0}" == 1 ]]; then
              scope_filter='
                (.service // .) | .id == $serviceId and .name == $serviceName
                and (.ownerId // .owner.id) == $ownerId
                and (.owner.id == null or .owner.id == $ownerId)
                and .environmentId == $environmentId and .type == $serviceType
              '
            fi
            [[ -n "$API_SERVICE_ID" && -n "$WORKER_SERVICE_ID" && -n "$WEB_SERVICE_ID" ]] || return 1
            [[ "$API_SERVICE_ID" != "$WORKER_SERVICE_ID" && "$API_SERVICE_ID" != "$WEB_SERVICE_ID" && "$WORKER_SERVICE_ID" != "$WEB_SERVICE_ID" ]] || return 1
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              service_type=web_service
              case "$service_id" in
                "$API_SERVICE_ID") service_name=reviewrouter-api ;;
                "$WORKER_SERVICE_ID") service_name=reviewrouter-worker; service_type=background_worker ;;
                "$WEB_SERVICE_ID") service_name=reviewrouter-web ;;
              esac
              service="$(render_inventory_api "$deadline" "https://api.render.com/v1/services/$service_id")" || return 1
              service="$(jq -cse '
                if length == 1 and (.[0] | type) == "object" then .[0]
                else error("recovery_service_response_ambiguous") end
              ' <<<"$service")" || return 1
              jq -e --arg serviceId "$service_id" \
                --arg serviceName "$service_name" \
                --arg ownerId "$RENDER_OWNER_ID" \
                --arg environmentId "$RENDER_ENVIRONMENT_ID" \
                --arg serviceType "$service_type" \
                "$scope_filter" <<<"$service" >/dev/null || return 1
            done
          }
          recovery_deployment_inventory_filter='
            def recovery_deployment_identity($deploy):
              ([
                  $deploy.commit.id?,
                  $deploy.commit.sha?,
                  $deploy.commitId?
                ] | map(select(. != null))) as $commitCandidates
              | ([
                  $deploy.image.sha?,
                  $deploy.image.digest?,
                  $deploy.imageDigest?
                ] | map(select(. != null))) as $imageCandidates
              | if (($deploy.commit? != null and ($deploy.commit | type) != "object")
                  or ($deploy.image? != null and ($deploy.image | type) != "object")) then {kind:"invalid"}
                elif (
                  ($commitCandidates | length) >= 1
                  and all(
                    $commitCandidates[];
                    type == "string" and test("^[a-f0-9]{40}$")
                  )
                  and (($commitCandidates | unique | length) == 1)
                  and (($imageCandidates | length) == 0)
                ) then {
                  kind: "git",
                  commitSha: $commitCandidates[0]
                }
                elif (
                  ($commitCandidates | length) == 0
                  and ($imageCandidates | length) >= 1
                  and all(
                    $imageCandidates[];
                    type == "string" and test("^sha256:[a-f0-9]{64}$")
                  )
                  and (($imageCandidates | unique | length) == 1)
                ) then {
                  kind: "image",
                  imageDigest: $imageCandidates[0]
                }
                elif (
                  ($commitCandidates | length) == 0
                  and ($imageCandidates | length) == 0
                ) then {kind: "missing"}
                else {kind: "invalid"}
                end;
            def recovery_deployment_status_class($status):
              if ([
                "created",
                "queued",
                "build_in_progress",
                "pre_deploy_in_progress",
                "update_in_progress",
                "live"
              ] | index($status)) != null then "active"
              elif ([
                "build_failed",
                "pre_deploy_failed",
                "update_failed",
                "canceled",
                "deactivated",
                "failed"
              ] | index($status)) != null
              then "terminal"
              else "unknown"
              end;
            (if type == "array" then .
             elif ((.deploys? | type) == "array") then .deploys
             elif type == "object" then [.]
             else error("recovery_deployment_shape")
             end)
            | map(.deploy // .)
            | map(
                . as $deploy
                | recovery_deployment_identity($deploy) as $identity
                | ($deploy.status
                    | if type == "string" and length > 0 then .
                      else error("recovery_deployment_status")
                      end) as $status
                | {
                    serviceId: (
                      ($deploy.serviceId // $serviceId) as $observedServiceId
                      | if (
                          ($observedServiceId | type) == "string"
                          and $observedServiceId == $serviceId
                        ) then $observedServiceId
                        else error("recovery_deployment_service_identity")
                        end
                    ),
                    deployId: (
                      $deploy.id
                      | if type == "string" and test("^dep-[a-z0-9-]+$")
                        then .
                        else error("recovery_deployment_id")
                        end
                    ),
                    observedStatus: $status,
                    statusClass: recovery_deployment_status_class($status),
                    createdAt: (
                      $deploy.createdAt
                      | if type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?Z$") then .
                        else error("recovery_deployment_created_at") end
                      | . as $created
                      | sub("\\.[0-9]+Z$"; "Z") as $seconds
                      | if (try ($seconds | fromdateiso8601 | strftime("%Y-%m-%dT%H:%M:%SZ")) catch null) == $seconds
                        then $created else error("recovery_deployment_created_at") end
                    ),
                    deploymentIdentityKind: $identity.kind,
                    observedCommitSha: ($identity.commitSha // null),
                    observedImageDigest: ($identity.imageDigest // null)
                  }
              )
          '
          recovery_deployment_set_filter='
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and ([.[].deployId] | unique | length == 3)
            and all(.observedStatus == "live")
            and all(
              .deploymentIdentityKind == "git"
              and .observedCommitSha == $releaseCommitSha
              and .observedImageDigest == null
            )
          '
          recovery_predeploy_inventory_filter='
            length >= 1
            and (([.[].deployId] | length) == ([.[].deployId] | unique | length))
            and all(.serviceId == $serviceId)
            and all(.statusClass != "unknown" and .deploymentIdentityKind != "invalid"
                and (.deploymentIdentityKind != "missing" or (.statusClass == "active" and .observedStatus != "live")))
            and .[0].deploymentIdentityKind == "git"
            and .[0].observedImageDigest == null
            and ([.[] | select(
              .statusClass == "active" and .observedStatus != "live"
            )] | length) == 0
            and ([.[] | select(.observedStatus == "live")] | length) <= 1
          '
          recovery_reconciliation_filter='
            . as $inventory
            | def identity: {serviceId,deployId,createdAt,deploymentIdentityKind,observedCommitSha,observedImageDigest};
            def in_window($start; $end): capture("^(?<whole>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})(?<fraction>\\.[0-9]+)?Z$")
              | (.whole + "Z" | fromdateiso8601) as $epoch
              | $epoch >= $start and (($epoch + ((.fraction // "0") | tonumber)) <= $end)
                and ($epoch != $end or ((.fraction // "0") | test("[1-9]") | not));
            if (all(.[]; .serviceId == $serviceId and .statusClass != "unknown"
                and .deploymentIdentityKind != "invalid")
              and (map(.deployId) | unique | length) == length
              and all($beforeInventory[]; . as $before
                | any($inventory[]; identity == ($before | identity))))
            then [.[] | select(.deployId as $id | ($beforeDeployIds | index($id)) == null)]
            else error("recovery_reconciliation_missing_or_changed_history") end
            | if length == 0 then []
              elif length != 1 then error("recovery_reconciliation_ambiguous")
              elif (.[0] | .serviceId == $serviceId
                and .deploymentIdentityKind == "git"
                and .observedCommitSha == $releaseCommitSha
                and .observedImageDigest == null
                and .statusClass == "active"
                and (.createdAt | type) == "string"
                and (try (
                  .createdAt | in_window($intentEpoch; ([$observationEpoch, $intentDeadlineEpoch] | min))
                ) catch false)) then .
              else error("recovery_reconciliation_candidate") end
          '
          recovery_pending_deployment_filter='
            length == 1
            and .[0].serviceId == $serviceId
            and .[0].deployId == $expectedDeployId
            and (.[0].observedStatus as $observedStatus
              | ([
                  "created",
                  "queued",
                  "build_in_progress",
                  "pre_deploy_in_progress",
                  "update_in_progress"
                ] | index($observedStatus)) != null)
            and (
              .[0].deploymentIdentityKind == "missing"
              or (
                .[0].deploymentIdentityKind == "git"
                and .[0].observedCommitSha == $releaseCommitSha
                and .[0].observedImageDigest == null
              )
            )
          '
          recovery_exact_deployment_filter='
            length == 1
            and .[0].serviceId == $serviceId
            and .[0].deployId == $expectedDeployId
            and .[0].observedStatus == "live"
            and .[0].deploymentIdentityKind == "git"
            and .[0].observedCommitSha == $releaseCommitSha
            and .[0].observedImageDigest == null
          '
          recovery_bound_inventory_filter='
            length >= 1
            and (([.[].deployId] | length) == ([.[].deployId] | unique | length))
            and all(.serviceId == $serviceId)
            and all(.statusClass != "unknown" and .deploymentIdentityKind != "invalid"
                and (.deploymentIdentityKind != "missing" or (.statusClass == "active" and .observedStatus != "live")))
            and .[0].deployId == $expectedDeployId
            and .[0].observedStatus == "live"
            and .[0].deploymentIdentityKind == "git"
            and .[0].observedCommitSha == $releaseCommitSha
            and .[0].observedImageDigest == null
            and ([.[] | select(.statusClass == "active") | .deployId]
              == [$expectedDeployId])
          '
          recovery_service_observation_filter='
            (.service // .) as $service
            | {
                role: $role,
                serviceId: (
                  $service.id
                  | if type == "string" and . == $serviceId then .
                    else error("recovery_service_identity")
                    end
                ),
                suspended: (
                  $service.suspended
                  | if type == "string" then .
                    else error("recovery_service_suspension")
                    end
                ),
                type: (
                  $service.type
                  | if type == "string" then .
                    else error("recovery_service_type")
                    end
                ),
                url: ($service.serviceDetails.url // null)
              }
          '
          recovery_service_set_filter='
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and ([.[].role] | sort == ["api", "web", "worker"])
            and all(.suspended == "not_suspended")
            and (map(select(.role == "api" or .role == "web"))
              | all(
                  .type == "web_service"
                  and (.url | type) == "string"
                  and (.url | test("^https://[^/]+/?$"))
                ))
            and (map(select(.role == "worker"))
              | length == 1 and .[0].type == "background_worker")
          '
          assert_recovery_fleet_readiness() {
            local bindings="$1" deadline="$2" service_id path service
            (( SECONDS < deadline )) || return 124
            assert_recovery_target_identity "$deadline" || return 1
            assert_recovery_fleet_identity "$deadline" || return 1
            assert_recovery_admission_closed || return 1
            assert_worker_effect_fenced || return 1
            assert_recovery_config_unchanged || return 1
            assert_recovery_maintenance true "$deadline" || return 1
            for service_id in "$API_SERVICE_ID" "$WEB_SERVICE_ID"; do
              path=/health
              [[ "$service_id" != "$WEB_SERVICE_ID" ]] || path=/
              service="$(render_inventory_api "$deadline" "https://api.render.com/v1/services/$service_id")" || return 1
              jq -e --arg id "$service_id" --arg path "$path" '
                (.service // .) | .id == $id and .suspended == "not_suspended"
                and .serviceDetails.healthCheckPath == $path
              ' <<<"$service" >/dev/null || return 1
            done
            # Render promotes these exact IDs to live only after their configured
            # health checks pass. Edge maintenance remains enabled throughout.
            observe_bound_recovery_deployments "$bindings" "$work/readiness-deployment-result.json" "$deadline" || return 1
            observe_recovery_services "$work/readiness-service-result.json" "$deadline" || return 1
            (( SECONDS < deadline )) || return 124
          }
          observe_recovery_services() {
            local absolute_deadline observation observations output_path
            local role service service_id role_rows
            output_path="$1"
            absolute_deadline="${2:-}"
            observations='[]'
            role_rows="$(jq -nr \
              --arg api "$API_SERVICE_ID" \
              --arg worker "$WORKER_SERVICE_ID" \
              --arg web "$WEB_SERVICE_ID" '
                ["api", $api], ["worker", $worker], ["web", $web] | @tsv
              ')" || return 1
            while IFS=$'\t' read -r role service_id; do
              if [[ -n "$absolute_deadline" ]]; then
                service="$(
                  render_inventory_api "$absolute_deadline" \
                    "https://api.render.com/v1/services/$service_id"
                )" || return 1
              else
                service="$(
                  render_api \
                    "https://api.render.com/v1/services/$service_id"
                )" || return 1
              fi
              observation="$(
                jq -ce --arg role "$role" --arg serviceId "$service_id" \
                  "$recovery_service_observation_filter" <<<"$service"
              )" || return 1
              observations="$(
                jq -c --slurpfile observation <(printf '%s' "$observation") \
                  '$observation[0] as $observation | . + [$observation]' <<<"$observations"
              )" || return 1
            done <<<"$role_rows"
            printf '%s\n' "$observations" > "$output_path" || return 1
            jq -e "$recovery_service_set_filter" \
              <<<"$observations" >/dev/null
          }
          assert_recovery_fleet_suspended() {
            local absolute_deadline observations observed_service_id output_path
            local service service_id suspended
            output_path="$1"
            absolute_deadline="${2:-}"
            observations='[]'
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              if [[ -n "$absolute_deadline" ]]; then
                service="$(
                  render_inventory_api "$absolute_deadline" \
                    "https://api.render.com/v1/services/$service_id"
                )" || return 1
              else
                service="$(
                  render_api "https://api.render.com/v1/services/$service_id"
                )" || return 1
              fi
              observed_service_id="$(
                jq -er '(.service // .).id' <<<"$service"
              )" || return 1
              suspended="$(jq -er '(.service // .).suspended' <<<"$service")" || return 1
              observations="$(
                jq -c --arg serviceId "$service_id" \
                  --arg observedServiceId "$observed_service_id" \
                  --arg suspended "$suspended" '
                    . + [{
                      serviceId: $serviceId,
                      observedServiceId: $observedServiceId,
                      suspended: $suspended
                    }]
                  ' \
                  <<<"$observations"
              )" || return 1
            done
            printf '%s\n' "$observations" > "$output_path" || return 1
            jq -e "$recovery_suspension_set_filter" \
              <<<"$observations" >/dev/null
          }
          assert_recovery_service_suspended() {
            local absolute_deadline response service_id
            service_id="$1"
            absolute_deadline="${2:-}"
            if [[ -n "$absolute_deadline" ]]; then
              response="$(
                render_inventory_api "$absolute_deadline" \
                  "https://api.render.com/v1/services/$service_id"
              )" || return 1
            else
              response="$(
                render_api "https://api.render.com/v1/services/$service_id"
              )" || return 1
            fi
            jq -e --arg serviceId "$service_id" '
              (.service // .)
              | .id == $serviceId and .suspended == "suspended"
            ' <<<"$response" >/dev/null
          }
          assert_recovery_service_online() {
            local service_id="$1" deadline="${2:-$((SECONDS + 90))}" response
            response="$(render_inventory_api "$deadline" \
              "https://api.render.com/v1/services/$service_id")" || return 1
            jq -e --arg id "$service_id" '
              (.service // .) | .id == $id and .suspended == "not_suspended"
            ' <<<"$response" >/dev/null
          }
          fetch_recovery_deployment_inventory() {
            local absolute_deadline all_deployments cursor encoded_cursor entries
            local entry_count final_entries final_inventory final_snapshot
            local first_page_snapshot next_cursor page page_inventory raw_page
            local seen_cursors service_id url
            service_id="$1"
            absolute_deadline="$2"
            all_deployments='[]'
            cursor=""
            page=0
            seen_cursors='[]'
            while true; do
              page=$((page + 1))
              if (( page > 50 )); then
                echo "::error::Render deployment inventory exceeded 50 pages for $service_id" >&2
                return 1
              fi
              url="https://api.render.com/v1/services/$service_id/deploys?limit=100"
              if [[ -n "$cursor" ]]; then
                encoded_cursor="$(
                  node -e '
                    process.stdout.write(encodeURIComponent(process.argv[1]));
                  ' "$cursor"
                )" || return 1
                url="$url&cursor=$encoded_cursor"
              fi
              raw_page="$(render_inventory_api "$absolute_deadline" "$url")" || return 1
              printf '%s' "$raw_page" | node scripts/render-recovery-journal.mjs validate-json || return 1
              entries="$(
                jq -ce '
                  if type == "array" then .
                  elif ((.deploys? | type) == "array") then .deploys
                  else error("recovery_deployment_page_shape")
                  end
                ' <<<"$raw_page"
              )" || return 1
              entry_count="$(jq -er 'length' <<<"$entries")" || return 1
              page_inventory="$(
                jq -ce --arg serviceId "$service_id" \
                  "$recovery_deployment_inventory_filter" <<<"$entries"
              )" || return 1
              if (( page == 1 )); then
                first_page_snapshot="$(
                  jq -c '
                    map({
                      serviceId,
                      deployId,
                      observedStatus,
                      statusClass,
                      createdAt,
                      deploymentIdentityKind,
                      observedCommitSha,
                      observedImageDigest
                    })
                  ' <<<"$page_inventory"
                )" || return 1
              fi
              all_deployments="$(
                jq -c --slurpfile page <(printf '%s' "$page_inventory") '$page[0] as $page | . + $page' \
                  <<<"$all_deployments"
              )" || return 1
              printf '%s' "$all_deployments" | node scripts/render-recovery-journal.mjs validate-json || return 1
              if (( entry_count < 100 )); then
                break
              fi
              next_cursor="$(
                jq -er '
                  if type == "array" then .[-1].cursor
                  elif ((.nextCursor? | type) == "string") then .nextCursor
                  elif ((.cursor? | type) == "string") then .cursor
                  else .deploys[-1].cursor
                  end
                  | select(type == "string" and length > 0)
                ' <<<"$raw_page"
              )" || return 1
              (( ${#next_cursor} <= 4096 )) || return 1
              if jq -e --arg cursor "$next_cursor" \
                'index($cursor) != null' <<<"$seen_cursors" >/dev/null; then
                echo "::error::Render deployment inventory repeated cursor for $service_id" >&2
                return 1
              fi
              seen_cursors="$(
                jq -c --arg cursor "$next_cursor" '. + [$cursor]' \
                  <<<"$seen_cursors"
              )" || return 1
              cursor="$next_cursor"
            done
            # Cursor pagination is not a point-in-time snapshot. A concurrent
            # deployment would be inserted at the head, so require the entire
            # normalized first page to remain byte-for-byte stable around the
            # exhaustive traversal before trusting its active-deploy set.
            raw_page="$(
              render_inventory_api "$absolute_deadline" \
                "https://api.render.com/v1/services/$service_id/deploys?limit=100"
            )" || return 1
