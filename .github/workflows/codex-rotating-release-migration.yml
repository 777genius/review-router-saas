            fi
            assert_recovery_service_suspended "$service_id"
            assert_recovery_maintenance true
            assert_recovery_admission_closed
            assert_worker_effect_fenced
            assert_recovery_config_unchanged
            render_deploy_mutation -X POST \
              "https://api.render.com/v1/services/$service_id/resume" -o /dev/null
            resume_deadline=$((SECONDS + 90))
            until assert_recovery_service_online "$service_id" "$resume_deadline"; do
              (( SECONDS < resume_deadline )) || exit 1
              sleep 3
            done
            assert_recovery_maintenance true
            assert_recovery_admission_closed
            if [[ "$(journal_service_phase)" == resume_intent ]]; then
              advance_recovery_service resumed
            fi
            if [[ "$(journal_service_phase)" == resumed ]]; then
            predeploy_inventory_deadline=$((SECONDS + 120))
            before_inventory="$(
              fetch_recovery_deployment_inventory \
                "$service_id" "$predeploy_inventory_deadline"
            )"
            jq -e --arg serviceId "$service_id" \
              "$recovery_predeploy_inventory_filter" \
              <<<"$before_inventory" >/dev/null
            printf '%s\n' "$before_inventory" \
              > "$work/deploy-preintent-$service_id.json"
            before_deploy_ids="$(jq -c '[.[].deployId]' <<<"$before_inventory")"
            deploy_intent_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
            deploy_intent_epoch="$(date -u -d "$deploy_intent_at" +%s)"
            jq -nc --slurpfile inventory <(printf '%s' "$before_inventory") --argjson intentEpoch "$deploy_intent_epoch" \
              '$inventory[0] as $inventory | {inventory:$inventory,intentEpoch:$intentEpoch}' > "$work/journal-transition-evidence.json"
            advance_recovery_service deploy_intent
            assert_recovery_admission_closed
            assert_worker_effect_fenced
            assert_recovery_config_unchanged
            assert_recovery_service_online "$service_id"
            (( $(date -u +%s) <= deploy_intent_epoch + 120 ))
            set +e
            deploy_response="$(
              render_deploy_mutation -X POST -H "Content-Type: application/json" \
                --data-binary @"$work/deploy-request.json" \
                "https://api.render.com/v1/services/$service_id/deploys"
            )"
            deploy_mutation_status=$?
            set -e
            else
              deploy_response=""
              deploy_mutation_status=125
              before_inventory="$(jq -ce --arg role "$role" '.services[$role].deployBeforeInventory' "$work/recovery-journal.json")"
              before_deploy_ids="$(jq -c '[.[].deployId]' <<<"$before_inventory")"
              deploy_intent_epoch="$(jq -er --arg role "$role" '.services[$role].intentEpoch' "$work/recovery-journal.json")"
              deploy_intent_at="$(date -u -d "@$deploy_intent_epoch" +%Y-%m-%dT%H:%M:%SZ)"
            fi
            deploy_id="$(jq -r --arg role "$role" '.services[$role].deployId // ""' "$work/recovery-journal.json")"
            direct_observations=""
            if [[ "$deploy_mutation_status" -eq 0 ]]; then
              printf '%s' "$deploy_response" | node scripts/render-recovery-journal.mjs validate-json
              direct_observations="$(
                jq -ce --arg serviceId "$service_id" \
                  "$recovery_deployment_inventory_filter" \
                  <<<"$deploy_response" 2>/dev/null || true
              )"
              deploy_id="$(
                jq -r 'if length == 1 then .[0].deployId else empty end' \
                  <<<"$direct_observations" 2>/dev/null || true
              )"
              if [[ -n "$deploy_id" ]]; then
                if ! jq -e \
                  --arg serviceId "$service_id" \
