                  --slurpfile beforeDeployIds <(printf '%s' "$before_deploy_ids") \
                  --slurpfile candidates <(printf '%s' "$reconciliation_candidates") '$beforeDeployIds[0] as $beforeDeployIds | $candidates[0] as $candidates |
                    {
