            )" || return 1
            printf '%s\n' "$inventory" > "$work/bound-$service_id-inventory.json" || return 1
            printf '%s\n' "$exact_observations" > "$work/bound-$service_id-exact.json" || return 1
            WORK="$work" SERVICE_ID="$service_id" node --input-type=module <<'NODE' || return 1
          import {readFileSync} from "node:fs";
          import {parseRecoveryJson, assertRecoveryDeploymentInventory, recoveryRoles} from "./scripts/render-recovery-journal.mjs";
          const work = process.env.WORK;
          const state = parseRecoveryJson(readFileSync(`${work}/recovery-journal.json`, "utf8"));
          const role = recoveryRoles.find(role => state.tuple.services[role].id === process.env.SERVICE_ID);
          const target = assertRecoveryDeploymentInventory(state, role, parseRecoveryJson(readFileSync(`${work}/bound-${process.env.SERVICE_ID}-inventory.json`, "utf8")));
          const exact = parseRecoveryJson(readFileSync(`${work}/bound-${process.env.SERVICE_ID}-exact.json`, "utf8"));
          if (exact.length !== 1 || exact[0].createdAt !== target.createdAt) throw new Error("recovery_exact_deployment_timestamp_disagreement");
          NODE
            jq -e \
              --arg serviceId "$service_id" \
              --arg expectedDeployId "$expected_deploy_id" \
              --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
              "$recovery_bound_inventory_filter" \
              <<<"$inventory" >/dev/null || return 1
            exact_deployment="$(jq -ce '.[0]' <<<"$exact_observations")" || return 1
            jq -nc \
              --slurpfile exact <(printf '%s' "$exact_deployment") \
              --slurpfile inventory <(printf '%s' "$inventory") '$exact[0] as $exact | $inventory[0] as $inventory |
                {
                  deployment: ($exact + {
                    latestDeployId: $inventory[0].deployId,
                    activeDeployIds: [
                      $inventory[]
                      | select(.statusClass == "active")
                      | .deployId
                    ]
                  }),
                  inventory: $inventory
                }
              '
          }
          observe_bound_recovery_deployments() {
            local absolute_deadline binding_observation bindings_json
            local expected_deploy_id inventories inventory observation
            local observations output_path service_id binding_rows
            bindings_json="$1"
            output_path="$2"
            absolute_deadline="$3"
            observations='[]'
            inventories='[]'
            binding_rows="$(jq -er '
              if type == "array" and length == 3
                and ([.[].serviceId] | unique | length == 3)
                and ([.[].deployId] | unique | length == 3)
                and all((.serviceId | test("^srv-[a-z0-9-]+$"))
                  and (.deployId | test("^dep-[a-z0-9-]+$")))
              then .[] | [.serviceId, .deployId] | @tsv
              else error("recovery_binding_set") end
            ' <<<"$bindings_json")" || return 1
            while IFS=$'\t' read -r service_id expected_deploy_id; do
