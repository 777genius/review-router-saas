                --argjson reconciled "$reconciled" '$beforeDeployIds[0] as $beforeDeployIds |
                  . + [{
                    serviceId: $serviceId,
                    beforeDeployIds: $beforeDeployIds,
                    deployId: $deployId,
                    intentAt: $intentAt,
                    mutationExitStatus: $mutationExitStatus,
                    reconciled: $reconciled
                  }]
                ' <<<"$deploy_creation_evidence"
            )"
            printf '%s\n' "$deploy_creation_evidence" \
              > "$work/deploy-creation-evidence.json"
            deployment_deadline=$((SECONDS + 900))
            while (( SECONDS < deployment_deadline )); do
              assert_recovery_service_online "$service_id" "$deployment_deadline"
              assert_recovery_maintenance true "$deployment_deadline"
              assert_recovery_admission_closed
              pending=0
              failed=0
              deployment_observations='[]'
              for exact_service in "$service_id"; do
                [[ "$exact_service" == "$service_id" ]]
                deploy_response="$(
                  render_inventory_api "$deployment_deadline" \
                    "https://api.render.com/v1/services/$service_id/deploys/$deploy_id"
                )"
                printf '%s' "$deploy_response" | node scripts/render-recovery-journal.mjs validate-json
                observations="$(
                  jq -ce --arg serviceId "$service_id" \
                    "$recovery_deployment_inventory_filter" <<<"$deploy_response"
                )"
                observation="$(jq -ce 'if length == 1 then .[0] else error("recovery_exact_deploy_shape") end' <<<"$observations")"
                deployment_observations="$(
                  jq -c --slurpfile observation <(printf '%s' "$observation") \
                    '$observation[0] as $observation | . + [$observation]' <<<"$deployment_observations"
                )"
                if jq -e \
                  --arg serviceId "$service_id" \
                  --arg expectedDeployId "$deploy_id" \
                  --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
                  "$recovery_exact_deployment_filter" \
                  <<<"$observations" >/dev/null; then
                  continue
                fi
                if jq -e \
                  --arg serviceId "$service_id" \
                  --arg expectedDeployId "$deploy_id" \
                  --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
                  "$recovery_pending_deployment_filter" \
                  <<<"$observations" >/dev/null; then
                  pending=1
                else
                  failed=1
                fi
              done
              printf '%s\n' "$deployment_observations" \
                > "$work/deployment-result.json"
              if (( failed == 1 )); then
                jq -c . "$work/deployment-result.json"
                exit 1
              fi
              if (( pending == 0 )); then
                break
              fi
              sleep 10
            done
            jq -e --arg serviceId "$service_id" --arg expectedDeployId "$deploy_id" \
              --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
              "$recovery_exact_deployment_filter" "$work/deployment-result.json" >/dev/null
            observe_bound_recovery_deployment "$service_id" "$deploy_id" "$((SECONDS + 120))" \
              > "$work/verified-deployment-$service_id.json"
            if [[ "$(journal_service_phase)" == deploy_bound ]]; then
              jq '{inventory:.inventory}' "$work/verified-deployment-$service_id.json" > "$work/journal-transition-evidence.json"
              advance_recovery_service verified
            fi
            resume_result="$(jq -c --arg serviceId "$service_id" --arg deployId "$deploy_id" \
              '. + [{serviceId:$serviceId,deployId:$deployId,verified:true}]' <<<"$resume_result")"
            printf '%s\n' "$resume_result" > "$work/resume-result.json"
          done
          jq -e '
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and ([.[].deployId] | unique | length == 3)
          ' <<<"$deploy_bindings" >/dev/null
          jq -n --arg phase "target_deploys_created" --arg runId "$GITHUB_RUN_ID" \
            --slurpfile deploys <(printf '%s' "$deploy_bindings") \
            '$deploys[0] as $deploys | {phase: $phase, runId: $runId, deploys: $deploys}' \
            > "$work/recovery-phase.json"

          online_deadline=$((SECONDS + 600))
          online_ready=0
          while (( SECONDS < online_deadline )); do
            if observe_recovery_services \
              "$work/post-resume-service-result.json" \
              "$online_deadline"; then
              online_ready=1
              break
            fi
            sleep 10
          done
          [[ "$online_ready" -eq 1 ]]

          api_origin="$(
            jq -er '.[] | select(.role == "api") | .url | rtrimstr("/")' \
              "$work/post-resume-service-result.json"
          )"
          web_origin="$(
            jq -er '.[] | select(.role == "web") | .url | rtrimstr("/")' \
              "$work/post-resume-service-result.json"
          )"
          observe_bound_recovery_deployments "$deploy_bindings" \
            "$work/pre-maintenance-removal-deployment-result.json" "$((SECONDS + 240))"
          assert_recovery_admission_closed
          assert_recovery_maintenance true
          assert_worker_effect_fenced
          assert_recovery_config_unchanged
          assert_recovery_database_gates
          health_deadline=$((SECONDS + 300))
          health_ready=0
          while (( SECONDS < health_deadline )); do
            if assert_recovery_fleet_readiness "$deploy_bindings" "$health_deadline"; then
              health_ready=1
              break
            fi
            sleep 10
          done
          [[ "$health_ready" -eq 1 ]]
          jq -n \
            --arg apiUrl "$api_origin/health" \
            --arg webUrl "$web_origin/" \
            --arg workerServiceId "$WORKER_SERVICE_ID" '
              {
                api: {url: $apiUrl, healthy: true, healthSignal: "render_exact_live_deploy_with_configured_health_check"},
                web: {url: $webUrl, healthy: true, healthSignal: "render_exact_live_deploy_with_configured_health_check"},
                worker: {
                  serviceId: $workerServiceId,
                  healthSignal: "render_not_suspended_and_exact_live_deploy"
                }
              }
            ' > "$work/health-result.json"
          assert_recovery_admission_closed
          assert_recovery_maintenance true
          assert_worker_effect_fenced
          assert_recovery_config_unchanged
          # Native configured HTTP probes bypass Render edge maintenance. The
          # bounded readiness observation above proves their exact live deploys;
          # public traffic stays closed through every pre-opening proof.
          assert_recovery_target_identity
          assert_recovery_fleet_identity
          observe_bound_recovery_deployments "$deploy_bindings" "$work/pre-open-deployment-result.json" "$((SECONDS + 240))"
          assert_recovery_config_unchanged
          assert_recovery_admission_closed
          assert_worker_effect_fenced
          assert_recovery_maintenance true
          set_recovery_maintenance false
          assert_recovery_maintenance false
          assert_recovery_target_identity
          assert_recovery_fleet_identity
          assert_recovery_admission_closed
          assert_recovery_config_unchanged
          observe_bound_recovery_deployments "$deploy_bindings" "$work/pre-restore-deployment-result.json" "$((SECONDS + 240))"
          worker_fence_sql restore > "$work/worker-restore.sql"
          # EXIT compensation stays armed across an uncertain transaction response.
          docker run --rm -e DATABASE_URL -v "$work:/work:ro" postgres:17-alpine \
            sh -ceu 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -qf /work/worker-restore.sql'
          post_resume_observation_deadline=$((SECONDS + 240))
          observe_bound_recovery_deployments "$deploy_bindings" \
            "$work/post-resume-deployment-result.json" \
            "$post_resume_observation_deadline"
          # Bind service identity and online state again after the final
          # deployment inventory proof, immediately before committing success.
          final_service_observation_deadline=$((SECONDS + 90))
          observe_recovery_services \
            "$work/post-resume-service-result.json" \
            "$final_service_observation_deadline"
          jq -n --arg phase "recovery_complete" --arg runId "$GITHUB_RUN_ID" \
            --slurpfile services "$work/post-resume-service-result.json" \
            --slurpfile deployment "$work/post-resume-deployment-result.json" \
            --slurpfile health "$work/health-result.json" '
              {
                phase: $phase,
                runId: $runId,
                services: $services[0],
                deployment: $deployment[0],
                health: $health[0]
              }
            ' > "$work/recovery-phase.json"

          jq -n \
            --arg targetDbId "$TARGET_DB_ID" \
            --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
            --arg recoveryRunId "$GITHUB_RUN_ID" \
            --arg observedSourceCommitSha "$(git rev-parse HEAD)" \
            --slurpfile deployCreation "$work/deploy-creation-evidence.json" \
            --slurpfile serviceRevisions "$work/post-resume-deployment-result.json" \
            --slurpfile resumedServices "$work/post-resume-service-result.json" \
            --slurpfile health "$work/health-result.json" \
            --slurpfile targetStats "$work/target-stats.json" \
            '{
              targetDbId: $targetDbId,
              targetVersion: 17,
              releaseCommitSha: $observedSourceCommitSha,
              recoveryRunId: $recoveryRunId,
              deployCreation: $deployCreation[0],
              serviceRevisions: $serviceRevisions[0].deployments,
              resumedServices: $resumedServices[0],
              health: $health[0],
              targetStats: $targetStats[0]
            }' > "$work/recovery-manifest.json"
          assert_recovery_admission_closed
          assert_recovery_target_identity
          assert_recovery_fleet_identity
          assert_recovery_config_unchanged
          assert_recovery_maintenance false
          # Last compensated effect: close and read back the DB firewall. No
          # terminal replica exists yet, including on a lost close response.
          close_firewall
          # Commit point: safe/live state and closed admission/firewall are
          # proven. A failed or lost terminal metadata write must never refence
          # this committed fleet. Torn terminal replicas authorize no replay.
          recovery_complete=1
          WORK="$work" node --input-type=module <<'NODE'
          import {readFileSync, writeFileSync} from "node:fs";
          import {parseRecoveryJson, advanceRecoveryPhase} from "./scripts/render-recovery-journal.mjs";
          const path = `${process.env.WORK}/recovery-journal.json`;
          const retained = parseRecoveryJson(readFileSync(path, "utf8"));
          const closed = advanceRecoveryPhase(retained, "fleet_verified_closed");
          const state = advanceRecoveryPhase(closed, "complete");
          writeFileSync(path, JSON.stringify(state) + "\n", {mode: 0o600});
          NODE
          persist_recovery_journal
          unset DATABASE_URL external_url

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewrouter-pg17-recovery-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reviewrouter-pg17-recovery/trusted-topology.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/readiness-deployment-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/readiness-service-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/pre-restore-deployment-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/recovery-journal.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/worker-effect-fence.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/admission-closed-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/recovery-manifest.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/recovery-phase.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/recovery-config-fingerprints.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/*suspension-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/deploy-creation-evidence.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/deploy-preintent-*.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/deploy-reconciliation-*.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/deployment-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/pre-resume-deployment-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/resume-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/post-resume-service-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/post-resume-deployment-result.json
            ${{ runner.temp }}/reviewrouter-pg17-recovery/health-result.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

  register-release:
    name: Register verified Review Action release
    needs: [trust-bootstrap, release-evidence]
    environment: production-release
    if: ${{ inputs.confirmation == 'REGISTER_VERIFIED_REVIEW_ACTION_RELEASE' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64: ${{ secrets.SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64 }}
      TARGET_DB_ID: ${{ inputs.target_db_id }}
      RENDER_OWNER_ID: ${{ inputs.owner_id }}
      RENDER_ENVIRONMENT_ID: ${{ inputs.environment_id }}
      RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
      ACTION_COMMIT_SHA: ${{ inputs.action_commit_sha }}
      OPERATOR_REPOSITORY: ${{ inputs.operator_repository }}
      OPERATOR_WORKSPACE_ID: ${{ inputs.operator_workspace_id }}
      INVESTIGATION_ROLLOUT_PROFILE: ${{ inputs.investigation_rollout_profile }}
      INVESTIGATION_REPOSITORY_CONNECTION_ID: ${{ inputs.investigation_repository_connection_id }}
      INVESTIGATION_PRODUCER_RELEASE_ID: ${{ inputs.investigation_producer_release_id }}
      API_SERVICE_ID: ${{ inputs.api_service_id }}
      WORKER_SERVICE_ID: ${{ inputs.worker_service_id }}
      WEB_SERVICE_ID: ${{ inputs.web_service_id }}
    steps:
      - name: Checkout immutable registration tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.trust-bootstrap.outputs.trusted_main_sha }}

      - name: Install registration tooling
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DB_ID" =~ ^dpg-[a-z0-9-]+$ ]]
          [[ "$RENDER_OWNER_ID" =~ ^tea-[a-z0-9-]+$ ]]
          [[ "$RENDER_ENVIRONMENT_ID" =~ ^evm-[a-z0-9-]+$ ]]
          [[ "$RELEASE_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          TRUSTED_MAIN_SHA="${{ needs.trust-bootstrap.outputs.trusted_main_sha }}"
          [[ "$TRUSTED_MAIN_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(git cat-file -t "$RELEASE_COMMIT_SHA")" == "commit" ]]
          [[ "$(git cat-file -t "$TRUSTED_MAIN_SHA")" == "commit" ]]
          git merge-base --is-ancestor "$RELEASE_COMMIT_SHA" "$TRUSTED_MAIN_SHA"
          git switch --detach "$RELEASE_COMMIT_SHA"
          observed_source_sha="$(git rev-parse HEAD)"
          [[ "$observed_source_sha" == "$RELEASE_COMMIT_SHA" ]]
          [[ "$ACTION_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$API_SERVICE_ID" =~ ^srv-[a-z0-9-]+$ ]]
          [[ "$WORKER_SERVICE_ID" =~ ^srv-[a-z0-9-]+$ ]]
          [[ "$WEB_SERVICE_ID" =~ ^srv-[a-z0-9-]+$ ]]
          [[ "$API_SERVICE_ID" != "$WORKER_SERVICE_ID" ]]
          [[ "$API_SERVICE_ID" != "$WEB_SERVICE_ID" ]]
          [[ "$WORKER_SERVICE_ID" != "$WEB_SERVICE_ID" ]]
          if [[ -n "$OPERATOR_REPOSITORY" ]]; then
            [[ -n "$OPERATOR_WORKSPACE_ID" ]]
            [[ "$OPERATOR_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          fi
          if [[ -n "$OPERATOR_WORKSPACE_ID" ]]; then
            [[ "$OPERATOR_WORKSPACE_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          fi
          case "$INVESTIGATION_ROLLOUT_PROFILE" in
            preserve) ;;
            shadow)
              [[ -n "$OPERATOR_REPOSITORY" ]]
              [[ -n "$OPERATOR_WORKSPACE_ID" ]]
              ;;
            production)
              [[ -n "$OPERATOR_REPOSITORY" ]]
              [[ -n "$OPERATOR_WORKSPACE_ID" ]]
              [[ "$INVESTIGATION_REPOSITORY_CONNECTION_ID" =~ ^[A-Za-z0-9_-]+$ ]]
              [[ "$INVESTIGATION_PRODUCER_RELEASE_ID" =~ ^[A-Za-z0-9._-]+$ ]]
              ;;
            *) exit 2 ;;
          esac
          corepack enable
          node scripts/install-private-dependencies.mjs --frozen-lockfile
          pnpm db:generate
          pnpm --filter @reviewrouter/api... build
          node scripts/rewrite-dist-esm-imports.mjs
          docker pull postgres:17-alpine >/dev/null

      - name: Authenticate existing production topology
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_MAIN_SHA: ${{ needs.trust-bootstrap.outputs.trusted_main_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reviewrouter-release-registration"
          node --input-type=module <<'NODE'
          import {writeFileSync} from "node:fs";
          import {authenticateRecoveryTopology} from "./scripts/render-recovery-journal.mjs";
          const topology = await authenticateRecoveryTopology(process.env.GH_TOKEN, process.env.TRUSTED_MAIN_SHA);
          writeFileSync(`${process.env.RUNNER_TEMP}/reviewrouter-release-registration/trusted-topology.json`, JSON.stringify(topology) + "\n", {mode:0o600});
          NODE

      - name: Verify and register release
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/reviewrouter-release-registration"
          mkdir -p "$work"
          firewall_open=0
          render_api() {
            if [[ " $* " == *" -X "* ]]; then
              assert_recovery_target_identity || return 1
              assert_recovery_fleet_identity || return 1
            fi
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 120 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          render_deploy_mutation() {
            if [[ " $* " == *" -X "* ]]; then
              assert_recovery_target_identity || return 1
              assert_recovery_fleet_identity || return 1
            fi
            curl --fail --silent --show-error \
              --connect-timeout 15 --max-time 120 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          render_inventory_api() {
            local absolute_deadline="$1"
            local remaining request_timeout
            shift
            if [[ " $* " == *" -X "* ]]; then
              assert_recovery_target_identity "$absolute_deadline" || return 1
              assert_recovery_fleet_identity "$absolute_deadline" || return 1
            fi
            remaining=$((absolute_deadline - SECONDS))
            if (( remaining <= 0 )); then
              echo "::error::Render inventory deadline expired before request" >&2
              return 124
            fi
            request_timeout="$remaining"
            if (( request_timeout > 20 )); then
              request_timeout=20
            fi
            curl --fail --silent --show-error \
              --connect-timeout 5 --max-time "$request_timeout" \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          recovery_deployment_inventory_filter='
            def recovery_deployment_identity($deploy):
              ([
                  $deploy.commit.id?,
                  $deploy.commit.sha?,
                  $deploy.commitId?
                ] | map(select(. != null))) as $commitCandidates
              | ([
                  $deploy.image.sha?,
                  $deploy.image.digest?,
                  $deploy.imageDigest?
                ] | map(select(. != null))) as $imageCandidates
              | if (($deploy.commit? != null and ($deploy.commit | type) != "object")
                  or ($deploy.image? != null and ($deploy.image | type) != "object")) then {kind:"invalid"}
                elif (
                  ($commitCandidates | length) >= 1
                  and all(
                    $commitCandidates[];
                    type == "string" and test("^[a-f0-9]{40}$")
                  )
                  and (($commitCandidates | unique | length) == 1)
                  and (($imageCandidates | length) == 0)
                ) then {
                  kind: "git",
                  commitSha: $commitCandidates[0]
                }
                elif (
                  ($commitCandidates | length) == 0
                  and ($imageCandidates | length) >= 1
                  and all(
                    $imageCandidates[];
                    type == "string" and test("^sha256:[a-f0-9]{64}$")
                  )
                  and (($imageCandidates | unique | length) == 1)
                ) then {
                  kind: "image",
                  imageDigest: $imageCandidates[0]
                }
                elif (
                  ($commitCandidates | length) == 0
                  and ($imageCandidates | length) == 0
                ) then {kind: "missing"}
                else {kind: "invalid"}
                end;
            def recovery_deployment_status_class($status):
              if ([
                "created",
                "queued",
                "build_in_progress",
                "pre_deploy_in_progress",
                "update_in_progress",
                "live"
              ] | index($status)) != null then "active"
              elif ([
                "build_failed",
                "pre_deploy_failed",
                "update_failed",
                "canceled",
                "deactivated",
                "failed"
              ] | index($status)) != null
              then "terminal"
              else "unknown"
              end;
            (if type == "array" then .
             elif ((.deploys? | type) == "array") then .deploys
             elif type == "object" then [.]
             else error("recovery_deployment_shape")
             end)
            | map(.deploy // .)
            | map(
                . as $deploy
                | recovery_deployment_identity($deploy) as $identity
                | ($deploy.status
                    | if type == "string" and length > 0 then .
                      else error("recovery_deployment_status")
                      end) as $status
                | {
                    serviceId: (
                      ($deploy.serviceId // $serviceId) as $observedServiceId
                      | if (
                          ($observedServiceId | type) == "string"
                          and $observedServiceId == $serviceId
                        ) then $observedServiceId
                        else error("recovery_deployment_service_identity")
                        end
                    ),
                    deployId: (
                      $deploy.id
                      | if type == "string" and test("^dep-[a-z0-9-]+$")
                        then .
                        else error("recovery_deployment_id")
                        end
                    ),
                    observedStatus: $status,
                    statusClass: recovery_deployment_status_class($status),
                    createdAt: (
                      $deploy.createdAt
                      | if type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{1,9})?Z$") then .
                        else error("recovery_deployment_created_at") end
                      | . as $created
                      | sub("\\.[0-9]+Z$"; "Z") as $seconds
                      | if (try ($seconds | fromdateiso8601 | strftime("%Y-%m-%dT%H:%M:%SZ")) catch null) == $seconds
                        then $created else error("recovery_deployment_created_at") end
                    ),
                    deploymentIdentityKind: $identity.kind,
                    observedCommitSha: ($identity.commitSha // null),
                    observedImageDigest: ($identity.imageDigest // null)
                  }
              )
          '
          fetch_recovery_deployment_inventory() {
            local absolute_deadline all_deployments cursor encoded_cursor entries
            local entry_count final_entries final_inventory final_snapshot
            local first_page_snapshot next_cursor page page_inventory raw_page
            local seen_cursors service_id url
            service_id="$1"
            absolute_deadline="$2"
            all_deployments='[]'
            cursor=""
            page=0
            seen_cursors='[]'
            while true; do
              page=$((page + 1))
              if (( page > 50 )); then
                echo "::error::Render deployment inventory exceeded 50 pages for $service_id" >&2
                return 1
              fi
              url="https://api.render.com/v1/services/$service_id/deploys?limit=100"
              if [[ -n "$cursor" ]]; then
                encoded_cursor="$(
                  node -e '
                    process.stdout.write(encodeURIComponent(process.argv[1]));
                  ' "$cursor"
                )" || return 1
                url="$url&cursor=$encoded_cursor"
              fi
              raw_page="$(render_inventory_api "$absolute_deadline" "$url")" || return 1
              printf '%s' "$raw_page" | node scripts/render-recovery-journal.mjs validate-json || return 1
              entries="$(
                jq -ce '
                  if type == "array" then .
                  elif ((.deploys? | type) == "array") then .deploys
                  else error("recovery_deployment_page_shape")
                  end
                ' <<<"$raw_page"
              )" || return 1
              entry_count="$(jq -er 'length' <<<"$entries")" || return 1
              page_inventory="$(
                jq -ce --arg serviceId "$service_id" \
                  "$recovery_deployment_inventory_filter" <<<"$entries"
              )" || return 1
              if (( page == 1 )); then
                first_page_snapshot="$(
                  jq -c '
                    map({
                      serviceId,
                      deployId,
                      observedStatus,
                      statusClass,
                      createdAt,
                      deploymentIdentityKind,
                      observedCommitSha,
                      observedImageDigest
                    })
                  ' <<<"$page_inventory"
                )" || return 1
              fi
              all_deployments="$(
                jq -c --slurpfile page <(printf '%s' "$page_inventory") '$page[0] as $page | . + $page' \
                  <<<"$all_deployments"
              )" || return 1
              printf '%s' "$all_deployments" | node scripts/render-recovery-journal.mjs validate-json || return 1
              if (( entry_count < 100 )); then
                break
              fi
              next_cursor="$(
                jq -er '
                  if type == "array" then .[-1].cursor
                  elif ((.nextCursor? | type) == "string") then .nextCursor
                  elif ((.cursor? | type) == "string") then .cursor
                  else .deploys[-1].cursor
                  end
                  | select(type == "string" and length > 0)
                ' <<<"$raw_page"
              )" || return 1
              (( ${#next_cursor} <= 4096 )) || return 1
              if jq -e --arg cursor "$next_cursor" \
                'index($cursor) != null' <<<"$seen_cursors" >/dev/null; then
                echo "::error::Render deployment inventory repeated cursor for $service_id" >&2
                return 1
              fi
              seen_cursors="$(
                jq -c --arg cursor "$next_cursor" '. + [$cursor]' \
                  <<<"$seen_cursors"
              )" || return 1
              cursor="$next_cursor"
            done
            # Cursor pagination is not a point-in-time snapshot. A concurrent
            # deployment would be inserted at the head, so require the entire
            # normalized first page to remain byte-for-byte stable around the
            # exhaustive traversal before trusting its active-deploy set.
            raw_page="$(
              render_inventory_api "$absolute_deadline" \
                "https://api.render.com/v1/services/$service_id/deploys?limit=100"
            )" || return 1
            printf '%s' "$raw_page" | node scripts/render-recovery-journal.mjs validate-json || return 1
            final_entries="$(
              jq -ce '
                if type == "array" then .
                elif ((.deploys? | type) == "array") then .deploys
                else error("recovery_deployment_page_shape")
                end
              ' <<<"$raw_page"
            )" || return 1
            final_inventory="$(
              jq -ce --arg serviceId "$service_id" \
                "$recovery_deployment_inventory_filter" <<<"$final_entries"
            )" || return 1
            final_snapshot="$(
              jq -c '
                map({
                  serviceId,
                  deployId,
                  observedStatus,
                  statusClass,
                  createdAt,
                  deploymentIdentityKind,
                  observedCommitSha,
                  observedImageDigest
                })
              ' <<<"$final_inventory"
            )" || return 1
            if [[ "$final_snapshot" != "$first_page_snapshot" ]]; then
              echo "::error::Render deployment inventory head changed during pagination for $service_id" >&2
              return 1
            fi
            jq -e '
              ([.[].deployId] | length) == ([.[].deployId] | unique | length)
              and all(.statusClass != "unknown" and .deploymentIdentityKind != "invalid"
                and (.deploymentIdentityKind != "missing" or (.statusClass == "active" and .observedStatus != "live")))
            ' <<<"$all_deployments" >/dev/null || return 1
            printf '%s\n' "$all_deployments"
          }
          recovery_reconciliation_filter='
            . as $inventory
            | def identity: {serviceId,deployId,createdAt,deploymentIdentityKind,observedCommitSha,observedImageDigest};
            def in_window($start; $end): capture("^(?<whole>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})(?<fraction>\\.[0-9]+)?Z$")
              | (.whole + "Z" | fromdateiso8601) as $epoch
              | $epoch >= $start and (($epoch + ((.fraction // "0") | tonumber)) <= $end)
                and ($epoch != $end or ((.fraction // "0") | test("[1-9]") | not));
            if (all(.[]; .serviceId == $serviceId and .statusClass != "unknown"
                and .deploymentIdentityKind != "invalid")
              and (map(.deployId) | unique | length) == length
              and all($beforeInventory[]; . as $before
                | any($inventory[]; identity == ($before | identity))))
            then [.[] | select(.deployId as $id | ($beforeDeployIds | index($id)) == null)]
            else error("recovery_reconciliation_missing_or_changed_history") end
            | if length == 0 then []
              elif length != 1 then error("recovery_reconciliation_ambiguous")
              elif (.[0] | .serviceId == $serviceId
                and .deploymentIdentityKind == "git"
                and .observedCommitSha == $releaseCommitSha
                and .observedImageDigest == null
                and .statusClass == "active"
                and (.createdAt | type) == "string"
                and (try (
                  .createdAt | in_window($intentEpoch; ([$observationEpoch, $intentDeadlineEpoch] | min))
                ) catch false)) then .
              else error("recovery_reconciliation_candidate") end
          '
          fetch_registration_deployment_inventory() {
            local service_id="$1" absolute_deadline="$2" inventory
            inventory="$(fetch_recovery_deployment_inventory "$service_id" "$absolute_deadline")" || return 1
            jq -ce '
              if all(.deploymentIdentityKind == "git" or .deploymentIdentityKind == "missing") then
                map({
                  id: .deployId,
                  serviceId,
                  status: .observedStatus,
                  commitId: .observedCommitSha,
                  createdAt
                })
              else error("registration_deployment_provenance") end
            ' <<<"$inventory"
          }

          assert_recovery_admission_closed() {
            local observation
            observation="$(docker run --rm -i -e DATABASE_URL postgres:17-alpine \
              sh -ceu 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -At' <<'SQL'
          SELECT json_build_object(
            'review', (SELECT json_agg(row_to_json(c)) FROM (
              SELECT "policyScope", "workspaceId", "repositoryConnectionId",
                "scmRepositoryIdentityId", stopped, version
              FROM "ReviewSafetyEmergencyControl" WHERE "policyScope" = 'global'
            ) c),
            'hosted', (SELECT json_agg(row_to_json(g)) FROM (
              SELECT id, status, "authzEpoch"::text, revision::text
              FROM "HostedCodexRuntimeGate" WHERE id = 'global'
            ) g)
          );
          SQL
            )" || return 1
            observation="$(jq -cse '
              if length == 1 and (.[0] | type) == "object" then .[0]
              else error("recovery_admission_response_ambiguous") end
            ' <<<"$observation")" || return 1
            jq -e '
              (.review | type == "array" and length == 1)
              and .review[0].policyScope == "global"
              and .review[0].workspaceId == null
              and .review[0].repositoryConnectionId == null
              and .review[0].scmRepositoryIdentityId == null
              and .review[0].stopped == true
              and (.review[0].version | type == "number" and . >= 1 and floor == .)
              and (.hosted | type == "array" and length == 1)
              and .hosted[0].id == "global"
              and .hosted[0].status == "closed"
              and (.hosted[0].authzEpoch | type == "string" and test("^[1-9][0-9]*$"))
              and (.hosted[0].revision | type == "string" and test("^[1-9][0-9]*$"))
            ' <<<"$observation" >/dev/null || return 1
            printf '%s\n' "$observation" > "$work/admission-closed-result.json" || return 1
          }
          close_firewall() {
            local recovery_closure=1
            if [[ "$firewall_open" -eq 1 ]]; then
              render_api -X PATCH \
                -H "Content-Type: application/json" \
                --data-binary '{"ipAllowList":[]}' \
                "https://api.render.com/v1/postgres/$TARGET_DB_ID" \
                -o /dev/null || return 1
              render_api "https://api.render.com/v1/postgres/$TARGET_DB_ID" \
                | jq -e --arg targetDbId "$TARGET_DB_ID" '
                    .id == $targetDbId and .ipAllowList == []
                  ' >/dev/null || return 1
              firewall_open=0
            fi
          }
          cleanup() {
            local cleanup_status=$?
            trap - EXIT
            set +e
            if ! close_firewall; then
              echo "::error::Registration could not prove the database firewall closed."
              cleanup_status=1
            fi
            rm -f "$work/api-env.json" "$work/api-env-object.json" \
              "$work/connection-info.json" "$work/operator-input.json" \
              "$work/investigation-env-value.json" \
              "$work"/investigation-service-env-*.json
            exit "$cleanup_status"
          }
          trap cleanup EXIT

          # Canonical names and git topology bind the verified production roles.
          # Read the whole identity set before any suspension or credential effect.
          service_scope_filter='
            (.service // .)
            | .id == $serviceId
              and .name == $serviceName
              and (.ownerId // .owner.id) == $ownerId
              and (.owner.id == null or .owner.id == $ownerId)
              and .environmentId == $environmentId
              and .type == $serviceType
              and .repo == "https://github.com/777genius/review-router-saas"
              and .branch == "main"
              and .autoDeploy == "no"
              and (.suspended == "suspended" or .suspended == "not_suspended")
          '
          assert_recovery_trusted_topology() {
            WORK="$work" node --input-type=module <<'NODE' || return 1
          import {readFileSync} from "node:fs";
          import {recoveryProductionScope, recoveryRoles, recoveryTopologyAuthorityValid} from "./scripts/render-recovery-journal.mjs";
          const trusted = JSON.parse(readFileSync(`${process.env.WORK}/trusted-topology.json`, "utf8"));
          if (trusted.ownerId !== recoveryProductionScope.ownerId || trusted.environmentId !== recoveryProductionScope.environmentId ||
            trusted.repository !== recoveryProductionScope.repository || !recoveryTopologyAuthorityValid(trusted, process.env.GITHUB_SHA) ||
            process.env.TARGET_DB_ID !== trusted.targetDbId ||
            process.env.RENDER_OWNER_ID !== trusted.ownerId || process.env.RENDER_ENVIRONMENT_ID !== trusted.environmentId ||
            JSON.stringify(Object.keys(trusted.services ?? {}).sort()) !== JSON.stringify([...recoveryRoles].sort()) ||
            recoveryRoles.some(role => process.env[`${role.toUpperCase()}_SERVICE_ID`] !== trusted.services[role]?.id)) {
            throw new Error("recovery_untrusted_topology");
          }
          NODE
          }
          assert_recovery_target_identity() {
            assert_recovery_trusted_topology || return 1
            local target deadline="${1:-$((SECONDS + 90))}"
            target="$(render_inventory_api "$deadline" "https://api.render.com/v1/postgres/$TARGET_DB_ID")" || return 1
            target="$(jq -cse '
              if length == 1 and (.[0] | type) == "object" then .[0]
              else error("recovery_target_response_ambiguous") end
            ' <<<"$target")" || return 1
            jq -e --arg targetDbId "$TARGET_DB_ID" \
              --arg ownerId "$RENDER_OWNER_ID" \
              --arg environmentId "$RENDER_ENVIRONMENT_ID" --argjson closing "${recovery_closure:-0}" '
                .id == $targetDbId
                and .version == "17"
                and ($closing == 1 or .status == "available")
                and .name == "reviewrouter-db"
                and .environmentId == $environmentId
                and (.ownerId // .owner.id) == $ownerId
                and (.owner.id == null or .owner.id == $ownerId)
              ' <<<"$target" >/dev/null || return 1
            printf '%s\n' "$target" > "$work/target.json" || return 1
          }
          assert_recovery_fleet_identity() {
            assert_recovery_trusted_topology || return 1
            local service_id service_type service_name service deadline="${1:-$((SECONDS + 90))}"
            local scope_filter="$service_scope_filter"
            if [[ "${recovery_closure:-0}" == 1 ]]; then
              scope_filter='
                (.service // .) | .id == $serviceId and .name == $serviceName
                and (.ownerId // .owner.id) == $ownerId
                and (.owner.id == null or .owner.id == $ownerId)
                and .environmentId == $environmentId and .type == $serviceType
              '
            fi
            [[ -n "$API_SERVICE_ID" && -n "$WORKER_SERVICE_ID" && -n "$WEB_SERVICE_ID" ]] || return 1
            [[ "$API_SERVICE_ID" != "$WORKER_SERVICE_ID" && "$API_SERVICE_ID" != "$WEB_SERVICE_ID" && "$WORKER_SERVICE_ID" != "$WEB_SERVICE_ID" ]] || return 1
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              service_type=web_service
              case "$service_id" in
                "$API_SERVICE_ID") service_name=reviewrouter-api ;;
                "$WORKER_SERVICE_ID") service_name=reviewrouter-worker; service_type=background_worker ;;
                "$WEB_SERVICE_ID") service_name=reviewrouter-web ;;
              esac
              service="$(render_inventory_api "$deadline" "https://api.render.com/v1/services/$service_id")" || return 1
              service="$(jq -cse '
                if length == 1 and (.[0] | type) == "object" then .[0]
                else error("recovery_service_response_ambiguous") end
              ' <<<"$service")" || return 1
              jq -e --arg serviceId "$service_id" \
                --arg serviceName "$service_name" \
                --arg ownerId "$RENDER_OWNER_ID" \
                --arg environmentId "$RENDER_ENVIRONMENT_ID" \
                --arg serviceType "$service_type" \
                "$scope_filter" <<<"$service" >/dev/null || return 1
            done
          }
          # Establish immutable closure scope before reading terminal authority.
          recovery_closure=1 assert_recovery_target_identity
          recovery_closure=1 assert_recovery_fleet_identity


          recovery_phase_key="REVIEW_ROUTER_PG17_RECOVERY_PHASE"
          read_recovery_phase() {
            local service_id="$1" response
            response="$(render_inventory_api "$((SECONDS + 30))" "https://api.render.com/v1/services/$service_id/env-vars")" || return $?
            printf '%s' "$response" | node scripts/render-recovery-journal.mjs read-phase
          }
          read_recovery_replicas() {
            local service_id observed replicas='[]'
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              observed="$(read_recovery_phase "$service_id")" || return $?
              replicas="$(printf '%s\n%s\n' "$replicas" "$observed" | jq -cs '.[0] + [.[1]]')" || return $?
            done
            printf '%s\n' "$replicas"
          }
          assert_recovery_nonterminal() {
            local replicas
            replicas="$(read_recovery_replicas)" || return 1
            if jq -e 'any(.[]; .phase == "fleet_verified_closed" or .phase == "complete")' <<<"$replicas" >/dev/null; then
              echo "::error::Recovery is already complete or fleet_verified_closed; terminal receipts authorize no effects." >&2
              return 1
            fi
            printf '%s\n' "$replicas"
          }
          assert_recovery_nonterminal > /dev/null
          assert_recovery_target_identity
          assert_recovery_fleet_identity

          live_service_preflight='[]'
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            deploys="$(render_api "https://api.render.com/v1/services/$service_id/deploys?limit=1")"
            printf '%s' "$deploys" | node scripts/render-recovery-journal.mjs validate-json
            observation="$(
              jq -ce --arg serviceId "$service_id" '
                (if type == "array" then .[0] else (.deploys[0] // .[0]) end)
                | (.deploy // .) as $deploy
                | {
                    serviceId: $serviceId,
                    deployId: ($deploy.id | select(type == "string" and length > 0)),
                    observedStatus: ($deploy.status | select(type == "string")),
                    observedCommitSha: (
                      ($deploy.commit.id // $deploy.commit.sha // $deploy.commitId)
                      | select(type == "string" and test("^[a-f0-9]{40}$"))
                    )
                  }
              ' <<<"$deploys"
            )"
            live_service_preflight="$(
              jq -c --slurpfile observation <(printf '%s' "$observation") '$observation[0] as $observation | . + [$observation]' \
                <<<"$live_service_preflight"
            )"
          done
          printf '%s\n' "$live_service_preflight" \
            > "$work/live-service-preflight.json"
          jq -e --arg releaseCommitSha "$RELEASE_COMMIT_SHA" '
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and all(.observedStatus == "live")
            and all(.observedCommitSha == $releaseCommitSha)
          ' "$work/live-service-preflight.json" >/dev/null

          render_api "https://api.render.com/v1/services/$API_SERVICE_ID/env-vars" \
            > "$work/api-env.json"
          jq -e '
            map(.envVar // .)
            | map(select((.key | type) == "string" and (.value | type) == "string"))
            | map({key, value})
            | from_entries
          ' "$work/api-env.json" > "$work/api-env-object.json"

          if [[ "$INVESTIGATION_ROLLOUT_PROFILE" != "preserve" ]]; then
            production_effects=0
            selectors_json='{}'
            if [[ "$INVESTIGATION_ROLLOUT_PROFILE" == "production" ]]; then
              attested_producer_release_id="$(
                jq -er --arg sha "$ACTION_COMMIT_SHA" '
                  ((.REVIEW_ROUTER_REVIEW_V2_PRODUCER_RELEASE_ATTESTATIONS_JSON // "[]") | fromjson)
                  | map(select(.actionCommitSha == $sha))
                  | if length > 1 then error("verified_release_attestation_count")
                    elif length == 1 then
                      .[0].producerReleaseId
                      | select(type == "string" and length > 0)
                    else "reviewrouter-action.\($sha[0:12])"
                    end
                ' "$work/api-env-object.json"
              )"
              [[ "$INVESTIGATION_PRODUCER_RELEASE_ID" == "$attested_producer_release_id" ]]
              production_effects=1
              selectors_json="$(
                jq -cn \
                  --arg workspaceId "$OPERATOR_WORKSPACE_ID" \
                  --arg repositoryConnectionId "$INVESTIGATION_REPOSITORY_CONNECTION_ID" \
                  --arg producerReleaseId "$INVESTIGATION_PRODUCER_RELEASE_ID" '
                    {production_effects: [{
                      workspaceIds: [$workspaceId],
                      repositoryConnectionIds: [$repositoryConnectionId],
                      providers: ["codex"],
                      trustDomains: ["trusted_managed"],
                      producerReleaseIds: [$producerReleaseId]
                    }]}
                  '
              )"
            fi
            put_investigation_env() {
              local service_id="$1"
              local key="$2"
              local value="$3"
              jq -n --arg value "$value" '{value: $value}' \
                > "$work/investigation-env-value.json"
              render_api -X PUT -H "Content-Type: application/json" \
                --data-binary @"$work/investigation-env-value.json" \
                "https://api.render.com/v1/services/$service_id/env-vars/$key" \
                -o /dev/null
            }
            investigation_env_keys=(
              REVIEW_ROUTER_REVIEW_INVESTIGATION_RECORDING_ENABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_SHADOW_ENABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_CONTEXT_CRITIC_ENABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_VERIFIED_CLEAN_ENABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_CROSS_REVISION_REPLAY_ENABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_PRODUCTION_EFFECTS_ENABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_EMERGENCY_DISABLED
              REVIEW_ROUTER_REVIEW_INVESTIGATION_SELECTORS_JSON
            )
            investigation_env_values=(
              1
              1
              1
              0
              0
              "$production_effects"
              0
              "$selectors_json"
            )
            investigation_env_proof='[]'
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              for index in "${!investigation_env_keys[@]}"; do
                put_investigation_env \
                  "$service_id" \
                  "${investigation_env_keys[$index]}" \
                  "${investigation_env_values[$index]}"
              done
              render_api "https://api.render.com/v1/services/$service_id/env-vars" \
                > "$work/investigation-service-env-$service_id.json"
              jq -e \
                --arg productionEffects "$production_effects" \
                --arg selectors "$selectors_json" '
                  map(.envVar // .)
                  | map(select((.key | type) == "string" and (.value | type) == "string"))
                  | map({key, value})
                  | from_entries
                  | .REVIEW_ROUTER_REVIEW_INVESTIGATION_RECORDING_ENABLED == "1"
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_SHADOW_ENABLED == "1"
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_CONTEXT_CRITIC_ENABLED == "1"
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_VERIFIED_CLEAN_ENABLED == "0"
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_CROSS_REVISION_REPLAY_ENABLED == "0"
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_PRODUCTION_EFFECTS_ENABLED == $productionEffects
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_EMERGENCY_DISABLED == "0"
                    and .REVIEW_ROUTER_REVIEW_INVESTIGATION_SELECTORS_JSON == $selectors
                ' "$work/investigation-service-env-$service_id.json" >/dev/null
              investigation_env_proof="$(
                jq -c \
                  --arg serviceId "$service_id" \
                  --arg profile "$INVESTIGATION_ROLLOUT_PROFILE" \
                  '. + [{serviceId: $serviceId, profile: $profile, verified: true}]' \
                  <<<"$investigation_env_proof"
              )"
            done
            printf '%s\n' "$investigation_env_proof" \
              > "$work/investigation-env-proof.json"
          fi

          render_api "https://api.render.com/v1/services/$API_SERVICE_ID/env-vars" \
            > "$work/api-env.json"
          jq -e '
            map(.envVar // .)
            | map(select((.key | type) == "string" and (.value | type) == "string"))
            | map({key, value})
            | from_entries
          ' "$work/api-env.json" > "$work/api-env-object.json"

          git clone --filter=blob:none https://github.com/777genius/review-router.git "$work/action"
          git -C "$work/action" fetch origin "$ACTION_COMMIT_SHA"
          git -C "$work/action" switch -c verified-release "$ACTION_COMMIT_SHA"
          saas_source_commit="$(jq -er '.saasSourceCommit' \
            "$work/action/src/control-plane/generated/review-action-v2/handoff-manifest.json")"
          [[ "$saas_source_commit" =~ ^[a-f0-9]{40}$ ]]
          git fetch origin "$saas_source_commit" --depth=1
          pnpm protocol:release-manifest \
            --action-repo "$work/action" \
            --target-branch verified-release \
            --expected-head "$ACTION_COMMIT_SHA" \
            --output "$work/release-manifest.json" >/dev/null
          pnpm protocol:release-manifest:check \
            --manifest "$work/release-manifest.json" \
            --action-repo "$work/action" >/dev/null

          runner_ip="$(curl --fail --silent --show-error --max-time 30 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          jq -n --arg cidr "$runner_ip/32" '{ipAllowList: [{
            cidrBlock: $cidr,
            description: "temporary verified release registration"
          }]}' > "$work/firewall.json"
          # Arm cleanup before the PATCH: an accepted request can lose its response.
          firewall_open=1
          render_api -X PATCH -H "Content-Type: application/json" \
            --data-binary @"$work/firewall.json" \
            "https://api.render.com/v1/postgres/$TARGET_DB_ID" -o /dev/null
          render_api "https://api.render.com/v1/postgres/$TARGET_DB_ID/connection-info" \
            > "$work/connection-info.json"

          DATABASE_URL="$(jq -er '.externalConnectionString' "$work/connection-info.json")"
          export DATABASE_URL
          assert_recovery_admission_closed

          assert_recovery_target_identity
          assert_recovery_fleet_identity
          WORK="$work" ACTION_COMMIT_SHA="$ACTION_COMMIT_SHA" node --input-type=module <<'NODE'
          import { createHash, randomBytes } from "node:crypto";
          import { readFileSync, writeFileSync } from "node:fs";
          import { spawnSync } from "node:child_process";

          const work = process.env.WORK;
          const actionCommitSha = process.env.ACTION_COMMIT_SHA;
          const apiEnv = JSON.parse(readFileSync(`${work}/api-env-object.json`, "utf8"));
          const manifest = JSON.parse(readFileSync(`${work}/release-manifest.json`, "utf8"));
          const connection = JSON.parse(readFileSync(`${work}/connection-info.json`, "utf8"));
          const attestations = JSON.parse(
            apiEnv.REVIEW_ROUTER_REVIEW_V2_PRODUCER_RELEASE_ATTESTATIONS_JSON ?? "[]",
          );
          const limits = {
            maxWorkSlots: 200,
            maxAttemptsPerSlot: 4,
            maxObservationBytes: 1_000_000,
            maxObservationFindings: 1_000,
            maxProjectionBytes: 2_000_000,
            maxProjectionFindings: 2_000,
            maxPublicationOperations: 500,
            maxPublicationChunks: 500,
            maxPublicationBodyBytes: 2_000_000,
            maxRequestBatchSize: 100,
            maxLeaseDurationMs: 600_000,
            maxResultReportDurationMs: 1_200_000,
            maxReconciliationDurationMs: 3_600_000,
          };
          const thresholds = {
            integrationEventDeliveryMs: 60_000,
            outboxClaimAgeMs: 120_000,
            missingCompletionProcessMs: 300_000,
            dueCompletionProcessMs: 300_000,
            publicationReconciliationMs: 600_000,
            v1DrainMs: 3_600_000,
            admissionMs: 30_000,
            pruningBacklogAgeMs: 86_400_000,
          };
          const ownerRefs = ["team-reviewrouter"];
          const runbookRefs = ["docs/operations/review-action-v2-cutover.md"];
          const releaseKey = `reviewrouter-action.${actionCommitSha.slice(0, 12)}`;
          const contentId = (value) =>
            createHash("sha256").update(JSON.stringify(value), "utf8").digest("hex").slice(0, 16);
          const diagnosticCodes = (stdout, stderr) => {
            const output = `${stdout ?? ""}\n${stderr ?? ""}`;
            const codes = [
              ...(output.match(
                /\b(?:review_v2|review|producer|protocol|operational|database|prisma|context|invalid)_[a-z0-9_]{2,120}\b/gi,
              ) ?? []),
              ...(output.match(/\bP\d{4}\b/g) ?? []),
              ...[...output.matchAll(/\bSQLSTATE(?:\s+(?:code)?)?[:=]?\s*([0-9A-Z]{5})\b/gi)].map(
                (match) => `sqlstate_${match[1].toLowerCase()}`,
              ),
            ];
            if (/permission denied/i.test(output)) codes.push("database_permission_denied");
            if (
              /(?:can't reach database server|connection (?:refused|terminated|failed)|ECONNREFUSED|timeout expired|database .* unavailable|SSL\/TLS required)/i.test(
                output,
              )
            ) {
              codes.push("database_connection_failed");
            }
            if (
              /(?:review_safety_control_conflict|version conflict|serialization conflict|\bP2034\b)/i.test(
                output,
              )
            ) {
              codes.push("review_safety_control_conflict");
            }
            return [...new Set(codes.map((code) => code.toLowerCase()))].slice(0, 12);
          };
          const protocolLimitsProfileId = `${releaseKey}.limits-${contentId(limits)}`;
          const operationalSloProfileId = `${releaseKey}.slo-${contentId({
            thresholds,
            ownerRefs,
            runbookRefs,
          })}`;
          let matches = attestations.filter(
            (attestation) => attestation?.actionCommitSha === actionCommitSha,
          );
          if (matches.length > 1) {
            throw new Error(`verified_release_attestation_count:${matches.length}`);
          }
          if (matches.length === 0) {
            matches = [{
              producerReleaseId: releaseKey,
              distributionKind: "public_reusable",
              actionCommitSha: manifest.actionCommitSha,
              runtimeCommitSha: manifest.runtimeCommitSha,
              wrapperEntrypointDigest: null,
              runtimeEntrypointDigest: manifest.runtimeEntrypointDigest,
              contextGatewayPolicyVersion: manifest.contextGatewayPolicyVersion,
              contextGatewayEntrypointDigest: manifest.contextGatewayEntrypointDigest,
              reviewInvestigationCapability: manifest.reviewInvestigationCapability,
              reviewInvestigationCoverageProfileHash:
                manifest.reviewInvestigationCoverageProfileHash,
              reviewInvestigationPolicyHash: manifest.reviewInvestigationPolicyHash,
              schemaDigest: manifest.schemaDigest,
              canonicalizerDigest: manifest.canonicalizerDigest,
              capabilityProfile: "exact_revision_v2",
              protocolLimitsProfileId,
              operationalSloProfileId,
            }];
          }
          const attestation = {
            ...matches[0],
            protocolLimitsProfileId,
            operationalSloProfileId,
          };
          if (
            manifest.distributionKind !== "PublicReusable" ||
            attestation.distributionKind !== "public_reusable" ||
            attestation.wrapperEntrypointDigest !== null
          ) {
            throw new Error("verified_release_distribution_shape_mismatch");
          }
          const exactFields = [
            "actionCommitSha",
            "runtimeCommitSha",
            "runtimeEntrypointDigest",
            "contextGatewayPolicyVersion",
            "contextGatewayEntrypointDigest",
            "schemaDigest",
            "canonicalizerDigest",
          ];
          for (const field of exactFields) {
            if (attestation[field] !== manifest[field]) {
              throw new Error(`verified_release_manifest_mismatch:${field}`);
            }
          }
          const investigationFields = [
            ["reviewInvestigationCapability", "reviewInvestigationCapability"],
            ["reviewInvestigationCoverageProfileHash", "reviewInvestigationCoverageProfileHash"],
            ["reviewInvestigationPolicyHash", "reviewInvestigationPolicyHash"],
          ];
          for (const [attestationField, manifestField] of investigationFields) {
            if (attestation[attestationField] !== manifest[manifestField]) {
              throw new Error(`verified_release_manifest_mismatch:${attestationField}`);
            }
          }
          const bundle = {
            protocolLimitsProfileId: attestation.protocolLimitsProfileId,
            limits,
            operationalSloProfileId: attestation.operationalSloProfileId,
            thresholds,
            ownerRefs,
            runbookRefs,
            candidate: {
              producerReleaseId: attestation.producerReleaseId,
              distributionKind: attestation.distributionKind,
              actionCommitSha: manifest.actionCommitSha,
              runtimeCommitSha: manifest.runtimeCommitSha,
              wrapperEntrypointDigest: null,
              runtimeEntrypointDigest: manifest.runtimeEntrypointDigest,
              contextGatewayPolicyVersion: manifest.contextGatewayPolicyVersion,
              contextGatewayEntrypointDigest: manifest.contextGatewayEntrypointDigest,
              reviewInvestigationProfile: {
                capability: manifest.reviewInvestigationCapability,
                coverageProfileHash: manifest.reviewInvestigationCoverageProfileHash,
                policyHash: manifest.reviewInvestigationPolicyHash,
              },
              schemaDigest: manifest.schemaDigest,
              capabilityProfile: attestation.capabilityProfile,
            },
          };
          writeFileSync(`${work}/release-bundle.json`, `${JSON.stringify(bundle)}\n`, { mode: 0o600 });

          const databaseUrl = new URL(connection.externalConnectionString);
          databaseUrl.searchParams.set("sslmode", "require");
          databaseUrl.searchParams.set("connect_timeout", "15");
          const credential = randomBytes(32).toString("base64url");
          const operatorEnv = {
            ...process.env,
            ...apiEnv,
            NODE_ENV: "production",
            DATABASE_URL: databaseUrl.toString(),
            REVIEW_ROUTER_REVIEW_V2_OPERATOR_CREDENTIAL: credential,
            REVIEW_ROUTER_REVIEW_V2_OPERATOR_CREDENTIAL_SHA256: createHash("sha256")
              .update(credential, "utf8")
              .digest("hex"),
          };
          // Retained fleet history is save-only metadata, never process config.
          // A valid journal can exceed the kernel's per-environment-entry limit.
          delete operatorEnv.REVIEW_ROUTER_PG17_RECOVERY_PHASE;
          const preflight = spawnSync(
            "node",
            [
              "--conditions=production",
              "apps/api/dist/review-action-v2-operator-cli.js",
              "release",
              "env-preflight",
            ],
            { cwd: process.cwd(), env: operatorEnv, encoding: "utf8" },
          );
          if (preflight.status !== 0) {
            throw new Error(`verified_release_environment_preflight_exit:${preflight.status ?? "unknown"}`);
          }
          const preflightResult = JSON.parse(preflight.stdout);
          writeFileSync(
            `${work}/environment-preflight.json`,
            `${JSON.stringify(preflightResult)}\n`,
            { mode: 0o644 },
          );
          if (preflightResult.ready !== true) {
            throw new Error(
              `verified_release_environment_not_ready:missing=${preflightResult.missing.join(",")}:invalid=${preflightResult.invalid.join(",")}`,
            );
          }
          const result = spawnSync(
            "node",
            [
              "--conditions=production",
              "apps/api/dist/review-action-v2-operator-cli.js",
              "release",
              "register",
              "--bundle",
              `${work}/release-bundle.json`,
              "--confirm",
              "release",
            ],
            { cwd: process.cwd(), env: operatorEnv, encoding: "utf8" },
          );
          if (result.status !== 0) {
            writeFileSync(`${work}/registration-error.log`, result.stderr, { mode: 0o600 });
            const diagnostic = {
              exitStatus: result.status,
              diagnosticCodes: diagnosticCodes(result.stdout, result.stderr),
              stderrSha256: createHash("sha256").update(result.stderr, "utf8").digest("hex"),
            };
            writeFileSync(
              `${work}/registration-diagnostic.json`,
              `${JSON.stringify(diagnostic)}\n`,
              { mode: 0o644 },
            );
            console.error(JSON.stringify(diagnostic));
            throw new Error(`verified_release_registration_failed:exit_${result.status ?? "unknown"}`);
          }
          const registration = JSON.parse(result.stdout);
          const convergedAttestation = {
            ...attestation,
            protocolLimitsProfileId: registration.resolvedProtocolLimitsProfileId,
            operationalSloProfileId: registration.resolvedOperationalSloProfileId,
          };
          const updatedAttestations = [
            ...attestations.filter(
              (candidate) => candidate?.actionCommitSha !== actionCommitSha,
            ),
            convergedAttestation,
          ].sort((left, right) =>
            left.producerReleaseId.localeCompare(right.producerReleaseId),
          );
          writeFileSync(
            `${work}/updated-attestations.json`,
            `${JSON.stringify(updatedAttestations)}\n`,
            { mode: 0o600 },
          );
          writeFileSync(
            `${work}/registration-result.json`,
            `${JSON.stringify({
              actionCommitSha,
              producerReleaseId: attestation.producerReleaseId,
              limitsStatus: registration.limitsResult?.status,
              sloStatus: registration.sloResult?.status,
              releaseStatus: registration.releaseResult?.status,
            })}\n`,
            { mode: 0o644 },
          );
          // Recovery stages configuration only. Explicit activation workflows
          // own opening Review v2 and Hosted Codex admission after recovery.
          const operatorRepository = process.env.OPERATOR_REPOSITORY;
          if (operatorRepository) {
              const rolloutStatus = spawnSync(
                "node",
                [
                  "--conditions=production",
                  "apps/api/dist/review-action-v2-operator-cli.js",
                  "investigation",
                  "rollout-status",
                  "--repo",
                  operatorRepository,
                  "--release",
                  attestation.producerReleaseId,
                  "--provider",
                  "codex",
                ],
                { cwd: process.cwd(), env: operatorEnv, encoding: "utf8" },
              );
              if (rolloutStatus.status !== 0) {
                const diagnostic = {
                  repository: operatorRepository,
                  exitStatus: rolloutStatus.status,
                  diagnosticCodes: diagnosticCodes(
                    rolloutStatus.stdout,
                    rolloutStatus.stderr,
                  ),
                  stderrSha256: createHash("sha256")
                    .update(rolloutStatus.stderr, "utf8")
                    .digest("hex"),
                };
                writeFileSync(
                  `${work}/investigation-rollout-status-diagnostic.json`,
                  `${JSON.stringify(diagnostic)}\n`,
                  { mode: 0o644 },
                );
                throw new Error(
                  `review_v2_investigation_rollout_status_failed:exit_${rolloutStatus.status ?? "unknown"}`,
                );
              }
              const rolloutStatusResult = JSON.parse(rolloutStatus.stdout);
              writeFileSync(
                `${work}/investigation-rollout-status-result.json`,
                `${JSON.stringify(rolloutStatusResult)}\n`,
                { mode: 0o644 },
              );
              const rolloutProfile =
                process.env.INVESTIGATION_ROLLOUT_PROFILE ?? "preserve";
              if (
                rolloutProfile === "production" &&
                process.env.INVESTIGATION_PRODUCER_RELEASE_ID !==
                  attestation.producerReleaseId
              ) {
                throw new Error(
                  "review_v2_investigation_producer_release_mismatch",
                );
              }
          }
          NODE

          jq -e \
            --arg sha "$ACTION_COMMIT_SHA" '
              .actionCommitSha == $sha
              and (.producerReleaseId | type == "string" and length > 0)
              and (.releaseStatus == "created" or .releaseStatus == "restored")
            ' "$work/registration-result.json" >/dev/null
          jq -c . "$work/registration-result.json"

          jq -n --rawfile value "$work/updated-attestations.json" \
            '{value: ($value | rtrimstr("\n"))}' > "$work/attestations-env.json"
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            render_api -X PUT -H "Content-Type: application/json" \
              --data-binary @"$work/attestations-env.json" \
              "https://api.render.com/v1/services/$service_id/env-vars/REVIEW_ROUTER_REVIEW_V2_PRODUCER_RELEASE_ATTESTATIONS_JSON" \
              -o /dev/null
          done

          deploys='[]'
          deploy_creation_evidence='[]'
          printf '%s\n' "$deploy_creation_evidence" \
            > "$work/deploy-creation-evidence.json"
          jq -n --arg commitId "$RELEASE_COMMIT_SHA" \
            '{clearCache: "do_not_clear", commitId: $commitId}' \
            > "$work/deploy-request.json"
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            before_deploy_id="$(
              jq -er --arg serviceId "$service_id" '
                map(select(.serviceId == $serviceId))
                | if length == 1 then .[0].deployId
                  else error("registration_deploy_preflight_identity")
                  end
              ' "$work/live-service-preflight.json"
            )"
            before_deploys="$(
              fetch_registration_deployment_inventory "$service_id" "$((SECONDS + 120))"
            )"
            before_deploy_snapshot="$(
              jq -ce --arg serviceId "$service_id" '
                (if type == "array" then .
                 elif (.deploys | type) == "array" then .deploys
                 else error("registration_deploy_list_shape")
                 end)
                | map(.deploy // .)
                | map({
                    deployId: (
                      .id
                      | select(type == "string" and test("^dep-[a-z0-9-]+$"))
                    ),
                    serviceId: (.serviceId // $serviceId),
                    status,
                    observedCommitSha: (
                      .commit.id // .commit.sha // .commitId // ""
                    ),
                    createdAt
                  })
              ' <<<"$before_deploys"
            )"
            jq -e \
              --arg serviceId "$service_id" \
              --arg beforeDeployId "$before_deploy_id" \
              --arg releaseCommitSha "$RELEASE_COMMIT_SHA" '
                length >= 1
                and (([.[].deployId] | length) == ([.[].deployId] | unique | length))
                and all(.serviceId == $serviceId)
                and .[0].deployId == $beforeDeployId
                and .[0].status == "live"
                and .[0].observedCommitSha == $releaseCommitSha
              ' <<<"$before_deploy_snapshot" >/dev/null
            before_deploy_ids="$(
              jq -c '[.[].deployId]' <<<"$before_deploy_snapshot"
            )"
            deploy_intent_at="$(node -e 'process.stdout.write(new Date().toISOString())')"
            deploy_intent_epoch="$(date -u -d "$deploy_intent_at" +%s)"
            before_inventory="$(jq -ce --arg serviceId "$service_id" "$recovery_deployment_inventory_filter" <<<"$before_deploys")"
            jq -e --arg id "$before_deploy_id" \
              '[.[] | select(.statusClass == "active") | .deployId] == [$id]' <<<"$before_inventory" >/dev/null
            jq -nc --slurpfile inventory <(printf '%s' "$before_inventory") --argjson epoch "$deploy_intent_epoch" \
              '$inventory[0] as $inventory | {beforeInventory:$inventory,intentEpoch:$epoch,intentDeadlineEpoch:($epoch+120)}' > "$work/registration-intent-$service_id.json"
            assert_recovery_admission_closed
            set +e
            deploy="$(
              render_deploy_mutation -X POST -H "Content-Type: application/json" \
                --data-binary @"$work/deploy-request.json" \
                "https://api.render.com/v1/services/$service_id/deploys"
            )"
            deploy_mutation_status=$?
            set -e
            deploy_id=""
            if [[ "$deploy_mutation_status" -eq 0 ]]; then
              printf '%s' "$deploy" | node scripts/render-recovery-journal.mjs validate-json
              deploy_id="$(
                jq -r '
                  if type == "object" then (.id // .deploy.id // empty)
                  else empty
                  end
                ' <<<"$deploy" 2>/dev/null || true
              )"
              if [[ ! "$deploy_id" =~ ^dep-[a-z0-9-]+$ ]]; then
                deploy_id=""
              fi
            fi
            reconciled=true
            response_deploy_id="$deploy_id"
            deploy_id=""
            if [[ -z "$deploy_id" ]]; then
              stable_candidate_id=""
              stable_candidate_observations=0
              reconciliation_deadline=$((SECONDS + 120))
              reconciliation_candidates='[]'
              while (( SECONDS < reconciliation_deadline )); do
                recent_deploys="$(
                  fetch_registration_deployment_inventory "$service_id" "$reconciliation_deadline"
                )"
                recent_inventory="$(jq -ce --arg serviceId "$service_id" "$recovery_deployment_inventory_filter" <<<"$recent_deploys")"
                observation_epoch="$(date -u +%s.%N)"
                reconciliation_candidates="$(jq -ce --arg serviceId "$service_id" \
                  --slurpfile beforeDeployIds <(printf '%s' "$before_deploy_ids") --slurpfile beforeInventory <(printf '%s' "$before_inventory") \
                  --arg releaseCommitSha "$RELEASE_COMMIT_SHA" --argjson intentEpoch "$deploy_intent_epoch" \
                  --argjson intentDeadlineEpoch "$((deploy_intent_epoch + 120))" --argjson observationEpoch "$observation_epoch" \
                  "\$beforeDeployIds[0] as \$beforeDeployIds | \$beforeInventory[0] as \$beforeInventory | $recovery_reconciliation_filter" <<<"$recent_inventory")"
                jq -n \
                  --arg serviceId "$service_id" \
                  --arg beforeDeployId "$before_deploy_id" \
                  --arg intentAt "$deploy_intent_at" \
                  --argjson mutationExitStatus "$deploy_mutation_status" \
                  --slurpfile candidates <(printf '%s' "$reconciliation_candidates") '$candidates[0] as $candidates |
                    {
                      serviceId: $serviceId,
                      beforeDeployId: $beforeDeployId,
                      intentAt: $intentAt,
                      mutationExitStatus: $mutationExitStatus,
                      candidates: $candidates
                    }
                  ' > "$work/deploy-reconciliation-$service_id.json"
                candidate_count="$(jq -r 'length' <<<"$reconciliation_candidates")"
                if (( candidate_count > 1 )); then
                  echo "::error::Render deploy reconciliation is ambiguous for $service_id"
                  exit 1
                fi
                if (( candidate_count == 1 )); then
                  observed_candidate_id="$(jq -er '.[0].deployId' <<<"$reconciliation_candidates")"
                  if [[ "$observed_candidate_id" == "$stable_candidate_id" ]]; then
                    stable_candidate_observations=$((stable_candidate_observations + 1))
                  else
                    stable_candidate_id="$observed_candidate_id"
                    stable_candidate_observations=1
                  fi
                  if (( stable_candidate_observations >= 2 )); then
                    [[ -z "$response_deploy_id" || "$response_deploy_id" == "$observed_candidate_id" ]]
                    deploy_id="$observed_candidate_id"
                    break
                  fi
                else
                  stable_candidate_id=""
                  stable_candidate_observations=0
                fi
                sleep 5
              done
              if [[ -z "$deploy_id" ]]; then
                echo "::error::Render deploy mutation could not be reconciled for $service_id"
                exit 1
              fi
            fi
            [[ "$deploy_id" =~ ^dep-[a-z0-9-]+$ ]]
            [[ "$deploy_id" != "$before_deploy_id" ]]
            deploys="$(
              jq -c \
                --arg serviceId "$service_id" \
                --arg deployId "$deploy_id" \
                '. + [{serviceId: $serviceId, deployId: $deployId}]' \
                <<<"$deploys"
            )"
            deploy_creation_evidence="$(
              jq -c \
                --arg serviceId "$service_id" \
                --arg beforeDeployId "$before_deploy_id" \
                --slurpfile beforeDeployIds <(printf '%s' "$before_deploy_ids") \
                --arg deployId "$deploy_id" \
                --arg intentAt "$deploy_intent_at" \
                --argjson mutationExitStatus "$deploy_mutation_status" \
                --argjson reconciled "$reconciled" '$beforeDeployIds[0] as $beforeDeployIds |
                  . + [{
                    serviceId: $serviceId,
                    beforeDeployId: $beforeDeployId,
                    beforeDeployIds: $beforeDeployIds,
                    deployId: $deployId,
                    intentAt: $intentAt,
                    mutationExitStatus: $mutationExitStatus,
                    reconciled: $reconciled
                  }]
                ' <<<"$deploy_creation_evidence"
            )"
            printf '%s\n' "$deploy_creation_evidence" \
              > "$work/deploy-creation-evidence.json"
          done

          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            pending=0
            failed=0
            statuses='[]'
            while IFS=$'\t' read -r service_id deploy_id; do
              deploy="$(
                render_api \
                  "https://api.render.com/v1/services/$service_id/deploys/$deploy_id"
              )"
              printf '%s' "$deploy" | node scripts/render-recovery-journal.mjs validate-json
              status="$(jq -er '(.deploy // .).status' <<<"$deploy")"
              observed_commit_sha="$(
                jq -er '
                  (.deploy // .)
                  | (.commit.id // .commit.sha // .commitId // "")
                  | select(
                      type == "string"
                      and (. == "" or test("^[a-f0-9]{40}$"))
                    )
                ' <<<"$deploy"
              )"
              statuses="$(
                jq -c \
                  --arg serviceId "$service_id" \
                  --arg deployId "$deploy_id" \
                  --arg status "$status" \
                  --arg observedCommitSha "$observed_commit_sha" \
                  '. + [{
                    serviceId: $serviceId,
                    deployId: $deployId,
                    status: $status,
                    observedCommitSha: $observedCommitSha
                  }]' \
                  <<<"$statuses"
              )"
              if [[ -n "$observed_commit_sha" && "$observed_commit_sha" != "$RELEASE_COMMIT_SHA" ]]; then
                failed=1
              fi
              case "$status" in
                live)
                  if [[ "$observed_commit_sha" != "$RELEASE_COMMIT_SHA" ]]; then
                    failed=1
                  fi
                  ;;
                build_failed|update_failed|pre_deploy_failed|canceled|deactivated|failed|*_failed)
                  failed=1
                  ;;
                *) pending=1 ;;
              esac
            done < <(jq -r '.[] | [.serviceId, .deployId] | @tsv' <<<"$deploys")
            printf '%s\n' "$statuses" > "$work/deployment-result.json"
            if (( failed == 1 )); then
              jq -c . "$work/deployment-result.json"
              exit 1
            fi
            if (( pending == 0 )); then
              break
            fi
            sleep 10
          done
          jq -e --arg releaseCommitSha "$RELEASE_COMMIT_SHA" '
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and all(.status == "live")
            and all(.observedCommitSha == $releaseCommitSha)
          ' \
            "$work/deployment-result.json" >/dev/null

          current_deployments='[]'
          while IFS=$'\t' read -r service_id expected_deploy_id; do
            latest_deploys="$(
              fetch_registration_deployment_inventory "$service_id" "$((SECONDS + 120))"
            )"
            before_inventory="$(jq -ce '.beforeInventory' "$work/registration-intent-$service_id.json")"
            before_deploy_ids="$(jq -c '[.[].deployId]' <<<"$before_inventory")"
            deploy_intent_epoch="$(jq -er '.intentEpoch' "$work/registration-intent-$service_id.json")"
            intent_deadline_epoch="$(jq -er '.intentDeadlineEpoch' "$work/registration-intent-$service_id.json")"
            recent_inventory="$(jq -ce --arg serviceId "$service_id" "$recovery_deployment_inventory_filter" <<<"$latest_deploys")"
            candidates="$(jq -ce --arg serviceId "$service_id" --slurpfile beforeInventory <(printf '%s' "$before_inventory") \
              --slurpfile beforeDeployIds <(printf '%s' "$before_deploy_ids") --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
              --argjson intentEpoch "$deploy_intent_epoch" --argjson intentDeadlineEpoch "$intent_deadline_epoch" \
              --argjson observationEpoch "$(date -u +%s.%N)" "\$beforeInventory[0] as \$beforeInventory | \$beforeDeployIds[0] as \$beforeDeployIds | $recovery_reconciliation_filter" <<<"$recent_inventory")"
            jq -e --arg id "$expected_deploy_id" 'length == 1 and .[0].deployId == $id' <<<"$candidates" >/dev/null
            jq -e --arg id "$expected_deploy_id" \
              '[.[] | select(.statusClass == "active") | .deployId] == [$id]' <<<"$recent_inventory" >/dev/null
            current_deployment="$(
              jq -ce --arg serviceId "$service_id" '
                (if type == "array" then .[0] else (.deploys[0] // .[0]) end)
                | (.deploy // .) as $deploy
                | {
                    serviceId: $serviceId,
                    deployId: ($deploy.id | select(type == "string" and length > 0)),
                    status: ($deploy.status | select(type == "string")),
                    observedCommitSha: (
                      ($deploy.commit.id // $deploy.commit.sha // $deploy.commitId // "")
                      | select(
                          type == "string"
                          and (. == "" or test("^[a-f0-9]{40}$"))
                        )
                    )
                  }
              ' <<<"$latest_deploys"
            )"
            current_deployments="$(
              jq -c --slurpfile observation <(printf '%s' "$current_deployment") \
                '$observation[0] as $observation | . + [$observation]' <<<"$current_deployments"
            )"
            printf '%s\n' "$current_deployments" \
              > "$work/current-deployment-result.json"
            jq -e \
              --arg expectedDeployId "$expected_deploy_id" \
              --arg releaseCommitSha "$RELEASE_COMMIT_SHA" '
                .deployId == $expectedDeployId
                and .status == "live"
                and .observedCommitSha == $releaseCommitSha
              ' <<<"$current_deployment" >/dev/null
          done < <(jq -r '.[] | [.serviceId, .deployId] | @tsv' <<<"$deploys")
          jq -e '
            length == 3
            and ([.[].serviceId] | unique | length == 3)
            and ([.[].deployId] | unique | length == 3)
          ' "$work/current-deployment-result.json" >/dev/null
          assert_recovery_admission_closed
          close_firewall
          firewall_open=0
          unset DATABASE_URL

      - name: Upload release registration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewrouter-release-registration-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reviewrouter-release-registration/admission-closed-result.json
            ${{ runner.temp }}/reviewrouter-release-registration/release-manifest.json
            ${{ runner.temp }}/reviewrouter-release-registration/environment-preflight.json
            ${{ runner.temp }}/reviewrouter-release-registration/registration-result.json
            ${{ runner.temp }}/reviewrouter-release-registration/registration-diagnostic.json
            ${{ runner.temp }}/reviewrouter-release-registration/investigation-rollout-status-result.json
            ${{ runner.temp }}/reviewrouter-release-registration/investigation-rollout-status-diagnostic.json
            ${{ runner.temp }}/reviewrouter-release-registration/investigation-env-proof.json
            ${{ runner.temp }}/reviewrouter-release-registration/live-service-preflight.json
            ${{ runner.temp }}/reviewrouter-release-registration/deploy-creation-evidence.json
            ${{ runner.temp }}/reviewrouter-release-registration/deploy-reconciliation-*.json
            ${{ runner.temp }}/reviewrouter-release-registration/deployment-result.json
            ${{ runner.temp }}/reviewrouter-release-registration/current-deployment-result.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
