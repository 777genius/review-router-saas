            WORK="$work" PHASE="$phase" node --input-type=module <<'NODE' || return 1
          import {readFileSync, writeFileSync} from "node:fs";
          import {parseRecoveryJson, loadRecoveryJournal, advanceRecoveryPhase} from "./scripts/render-recovery-journal.mjs";
          const path = `${process.env.WORK}/recovery-journal.json`;
