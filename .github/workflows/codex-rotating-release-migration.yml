name: PG17 maintenance migration

on:
  workflow_dispatch:
    inputs:
      source_db_id:
        description: Exact Render PostgreSQL 16 source database ID
        required: true
        type: string
      owner_id:
        description: Exact Render workspace owner ID
        required: true
        type: string
      environment_id:
        description: Exact Render environment ID
        required: true
        type: string
      release_commit_sha:
        description: Exact review-router-saas main commit to deploy
        required: true
        type: string
      api_service_id:
        description: Exact Render API service ID
        required: true
        type: string
      worker_service_id:
        description: Exact Render worker service ID
        required: true
        type: string
      web_service_id:
        description: Exact Render web service ID
        required: true
        type: string
      confirmation:
        description: Type REPLACE_PG16_WITH_PG17
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: reviewrouter-pg17-maintenance-migration
  cancel-in-progress: false

jobs:
  verified-backup:
    name: Create verified encrypted PG16 backup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      PG17_MIGRATION_BACKUP_KEY: ${{ secrets.PG17_MIGRATION_BACKUP_KEY }}
      SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64: ${{ secrets.SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64 }}
      SOURCE_DB_ID: ${{ inputs.source_db_id }}
      RENDER_OWNER_ID: ${{ inputs.owner_id }}
      RENDER_ENVIRONMENT_ID: ${{ inputs.environment_id }}
      RELEASE_COMMIT_SHA: ${{ inputs.release_commit_sha }}
      API_SERVICE_ID: ${{ inputs.api_service_id }}
      WORKER_SERVICE_ID: ${{ inputs.worker_service_id }}
      WEB_SERVICE_ID: ${{ inputs.web_service_id }}
      MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Checkout immutable migration tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install immutable migration tooling
        run: |
          set -euo pipefail
          test "$MIGRATION_CONFIRMATION" = "REPLACE_PG16_WITH_PG17"
          [[ "$RENDER_OWNER_ID" =~ ^tea-[a-z0-9-]+$ ]]
          [[ "$RENDER_ENVIRONMENT_ID" =~ ^evm-[a-z0-9-]+$ ]]
          [[ "$RELEASE_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            [[ "$service_id" =~ ^srv-[a-z0-9-]+$ ]]
          done
          corepack enable
          node scripts/install-private-dependencies.mjs --frozen-lockfile
          pnpm db:generate
          docker pull postgres:17-alpine >/dev/null

      - name: Validate source database identity and stage runtime roles
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/reviewrouter-pg17-backup"
          mkdir -p "$work"
          render_api() {
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 90 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          render_api "https://api.render.com/v1/services/$API_SERVICE_ID/env-vars?limit=100" \
            > "$work/api-env.json"
          render_api "https://api.render.com/v1/services/$WEB_SERVICE_ID/env-vars?limit=100" \
            > "$work/web-env.json"
          render_api "https://api.render.com/v1/services/$WORKER_SERVICE_ID/env-vars?limit=100" \
            > "$work/worker-env.json"
          WORK="$work" node --input-type=module <<'NODE'
          import { randomBytes } from "node:crypto";
          import { chmodSync, readFileSync, writeFileSync } from "node:fs";

          const readEnv = (name) => {
            const value = JSON.parse(readFileSync(`${process.env.WORK}/${name}-env.json`, "utf8"));
            if (!Array.isArray(value)) throw new Error(`${name}_environment_invalid`);
            return Object.fromEntries(value.map((item) => {
              const envVar = item?.envVar ?? item;
              return [envVar?.key, String(envVar?.value ?? envVar?.envVarValue?.value ?? "")];
            }));
          };
          const parseDatabaseIdentity = (value, label) => {
            const url = new URL(value);
            if (!["postgres:", "postgresql:"].includes(url.protocol)) {
              throw new Error(`${label}_protocol_invalid`);
            }
            if (!url.username || !url.password || !url.pathname || url.pathname === "/") {
              throw new Error(`${label}_credential_invalid`);
            }
            return `${url.hostname.toLowerCase()}:${url.port || "5432"}${url.pathname}`;
          };
          const api = readEnv("api");
          const web = readEnv("web");
          const worker = readEnv("worker");
          const identities = new Set([
            parseDatabaseIdentity(api.DATABASE_URL, "api_database"),
            parseDatabaseIdentity(web.DATABASE_URL, "web_database"),
            parseDatabaseIdentity(worker.DATABASE_URL, "worker_database"),
          ]);
          if (identities.size !== 1) throw new Error("runtime_database_generation_mismatch");
          const credential = () => randomBytes(32).toString("base64url");
          const roles = {
            api: { username: "reviewrouter_api", password: credential() },
            web: { username: "reviewrouter_web", password: credential() },
            worker: { username: "reviewrouter_worker", password: credential() },
            effectAuthority: {
              username: "reviewrouter_codex_effect_authority",
              password: credential(),
            },
          };
          const target = `${process.env.WORK}/runtime-role-secrets.json`;
          writeFileSync(target, `${JSON.stringify({ roles })}\n`, { mode: 0o600 });
          chmodSync(target, 0o600);
          NODE
          rm -f "$work/api-env.json" "$work/web-env.json" "$work/worker-env.json"

      - name: Suspend production writers
        shell: bash
        run: |
          set -euo pipefail
          render_api() {
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 90 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            render_api -X POST \
              "https://api.render.com/v1/services/$service_id/suspend" \
              -o /dev/null
          done
          for _ in $(seq 1 60); do
            suspended=0
            for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
              state="$(render_api "https://api.render.com/v1/services/$service_id" | jq -r '.suspended')"
              [[ "$state" == "suspended" ]] && suspended=$((suspended + 1))
            done
            [[ "$suspended" -eq 3 ]] && exit 0
            sleep 5
          done
          echo "::error::production writers did not suspend in time"
          exit 1

      - name: Create, validate, and encrypt logical backup
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "${RENDER_API_KEY:-}"
          test -n "${PG17_MIGRATION_BACKUP_KEY:-}"
          [[ "$SOURCE_DB_ID" =~ ^dpg-[a-z0-9-]+$ ]]

          work="$RUNNER_TEMP/reviewrouter-pg17-backup"
          mkdir -p "$work"
          source_db_info="$work/source-db.json"
          export_list="$work/exports.json"
          plain_backup="$work/reviewrouter-pg16.dir.tar.gz"
          encrypted_backup="$work/reviewrouter-pg16.dir.tar.gz.enc"
          trap 'rm -f "$plain_backup"' EXIT

          render_api() {
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 90 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }

          render_api \
            "https://api.render.com/v1/postgres/$SOURCE_DB_ID" \
            > "$source_db_info"
          jq '{
            serverMajor: (.version | tonumber),
            diskSizeGB,
            plan,
            region,
            status
          }' "$source_db_info" > "$work/source-stats.json"
          jq -e '.serverMajor == 16' "$work/source-stats.json" >/dev/null

          started_at="$(date -u -d '2 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"
          curl --silent --show-error \
            --connect-timeout 15 --max-time 90 \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -X POST \
            --output "$work/export-start.json" \
            "https://api.render.com/v1/postgres/$SOURCE_DB_ID/export" || true

          export_id=""
          export_created_at=""
          export_url=""
          for _ in $(seq 1 100); do
            render_api \
              "https://api.render.com/v1/postgres/$SOURCE_DB_ID/export" \
              > "$export_list"
            export_id="$(
              jq -er --arg started "$started_at" '
                [.[] | select(.url != null and .createdAt >= $started)]
                | sort_by(.createdAt) | last | .id // empty
              ' "$export_list" 2>/dev/null || true
            )"
            if [[ -n "$export_id" ]]; then
              export_created_at="$(
                jq -er --arg id "$export_id" '.[] | select(.id == $id) | .createdAt' "$export_list"
              )"
              export_url="$(
                jq -er --arg id "$export_id" '.[] | select(.id == $id) | .url' "$export_list"
              )"
              break
            fi
            sleep 12
          done
          test -n "$export_id"
          test -n "$export_url"

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 1200 \
            "$export_url" -o "$plain_backup"
          test -s "$plain_backup"
          gzip -t "$plain_backup"
          tar -tzf "$plain_backup" > "$work/archive-list.txt"
          test -s "$work/archive-list.txt"
          if awk '
            /^\// { bad=1 }
            /(^|\/)\.\.(\/|$)/ { bad=1 }
            END { exit bad ? 0 : 1 }
          ' "$work/archive-list.txt"; then
            echo "::error::backup archive contains an unsafe path"
            exit 1
          fi

          plain_sha256="$(sha256sum "$plain_backup" | cut -d' ' -f1)"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$plain_backup" -out "$encrypted_backup" \
            -pass env:PG17_MIGRATION_BACKUP_KEY
          encrypted_sha256="$(sha256sum "$encrypted_backup" | cut -d' ' -f1)"
          rm -f "$plain_backup"
          unset export_url

          jq -n \
            --arg sourceDbId "$SOURCE_DB_ID" \
            --arg exportId "$export_id" \
            --arg exportCreatedAt "$export_created_at" \
            --arg plainSha256 "$plain_sha256" \
            --arg encryptedSha256 "$encrypted_sha256" \
            --arg runId "$GITHUB_RUN_ID" \
            --slurpfile sourceStats "$work/source-stats.json" \
            '{
              formatVersion: 1,
              sourceDbId: $sourceDbId,
              exportId: $exportId,
              exportCreatedAt: $exportCreatedAt,
              plainSha256: $plainSha256,
              encryptedSha256: $encryptedSha256,
              githubRunId: $runId,
              sourceStats: $sourceStats[0]
            }' > "$work/manifest.json"

          echo "artifact_name=reviewrouter-pg16-backup-$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          {
            echo "### Verified encrypted PG16 backup"
            echo
            echo "- Source database: \`$SOURCE_DB_ID\`"
            echo "- Export: \`$export_id\`"
            echo "- Encrypted SHA-256: \`$encrypted_sha256\`"
            echo "- Source facts: \`$(jq -c . "$work/source-stats.json")\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/reviewrouter-pg17-backup/reviewrouter-pg16.dir.tar.gz.enc
            ${{ runner.temp }}/reviewrouter-pg17-backup/manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Replace PG16 with PG17 and restore
        id: cutover
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/reviewrouter-pg17-backup"
          encrypted_backup="$work/reviewrouter-pg16.dir.tar.gz.enc"
          plain_backup="$work/reviewrouter-pg16.dir.tar.gz"
          manifest="$work/manifest.json"
          source_deleted_marker="$RUNNER_TEMP/reviewrouter-pg16-deleted"
          connection_info="$work/pg17-connection-info.json"
          trap 'rm -f "$connection_info" "$plain_backup"' EXIT

          render_api() {
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 120 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }

          test "$(jq -r '.sourceDbId' "$manifest")" = "$SOURCE_DB_ID"
          (
            cd "$work"
            jq -r '.encryptedSha256 + "  reviewrouter-pg16.dir.tar.gz.enc"' manifest.json \
              | sha256sum -c -
          )
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted_backup" -out "$plain_backup" \
            -pass env:PG17_MIGRATION_BACKUP_KEY
          (
            cd "$work"
            jq -r '.plainSha256 + "  reviewrouter-pg16.dir.tar.gz"' manifest.json \
              | sha256sum -c -
          )
          gzip -t "$plain_backup"

          delete_status="$(
            curl --silent --show-error \
              --connect-timeout 15 --max-time 90 \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -X DELETE \
              --output /dev/null --write-out '%{http_code}' \
              "https://api.render.com/v1/postgres/$SOURCE_DB_ID" || true
          )"
          if [[ ! "$delete_status" =~ ^2[0-9]{2}$ && "$delete_status" != "404" ]]; then
            observed_status="$(
              curl --silent --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 15 --max-time 30 \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/postgres/$SOURCE_DB_ID" || true
            )"
            [[ "$observed_status" == "404" ]] || {
              echo "::error::source delete did not complete"
              exit 1
            }
          fi
          touch "$source_deleted_marker"
          for _ in $(seq 1 60); do
            status="$(
              curl --silent --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 15 --max-time 30 \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/postgres/$SOURCE_DB_ID"
            )"
            [[ "$status" == "404" ]] && break
            sleep 5
          done
          [[ "$status" == "404" ]]

          runner_ip="$(curl --fail --silent --show-error --max-time 30 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]
          jq -n \
            --arg ownerId "$RENDER_OWNER_ID" \
            --arg environmentId "$RENDER_ENVIRONMENT_ID" \
            --arg runnerCidr "$runner_ip/32" \
            '{
              name: "reviewrouter-db",
              databaseName: "review_router",
              databaseUser: "reviewrouter",
              ownerId: $ownerId,
              environmentId: $environmentId,
              plan: "basic_256mb",
              region: "frankfurt",
              version: "17",
              diskSizeGB: 15,
              enableHighAvailability: false,
              enableDiskAutoscaling: false,
              connectionPool: "none",
              ipAllowList: [{
                cidrBlock: $runnerCidr,
                description: "temporary GitHub PG17 maintenance migration"
              }]
            }' > "$work/create-pg17.json"
          create_status="$(
            curl --silent --show-error \
              --connect-timeout 15 --max-time 120 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              --data-binary @"$work/create-pg17.json" \
              --output "$work/created-pg17.json" --write-out '%{http_code}' \
              "https://api.render.com/v1/postgres" || true
          )"
          new_db_id=""
          if [[ "$create_status" == "201" ]]; then
            new_db_id="$(jq -er '.id // .postgres.id' "$work/created-pg17.json")"
          else
            for _ in $(seq 1 12); do
              render_api \
                "https://api.render.com/v1/postgres?ownerId=$RENDER_OWNER_ID&limit=100" \
                > "$work/postgres-list.json"
              new_db_id="$(
                jq -er --arg environmentId "$RENDER_ENVIRONMENT_ID" '
                  [
                    .[] | (.postgres // .) | select(
                      .name == "reviewrouter-db"
                      and .version == "17"
                      and .environmentId == $environmentId
                    )
                  ] | if length == 1 then .[0].id else empty end
                ' "$work/postgres-list.json" 2>/dev/null || true
              )"
              [[ -n "$new_db_id" ]] && break
              sleep 5
            done
          fi
          [[ "$new_db_id" =~ ^dpg-[a-z0-9-]+$ ]]

          new_status=""
          for _ in $(seq 1 180); do
            render_api "https://api.render.com/v1/postgres/$new_db_id" \
              > "$work/pg17-status.json"
            new_status="$(jq -r '.status' "$work/pg17-status.json")"
            [[ "$new_status" == "available" ]] && break
            [[ "$new_status" == "failed" ]] && exit 1
            sleep 10
          done
          [[ "$new_status" == "available" ]]
          test "$(jq -r '.version' "$work/pg17-status.json")" = "17"

          render_api \
            "https://api.render.com/v1/postgres/$new_db_id/connection-info" \
            > "$connection_info"
          external_url="$(jq -er '.externalConnectionString' "$connection_info")"
          internal_url="$(jq -er '.internalConnectionString' "$connection_info")"
          if [[ "$external_url" == *\?* ]]; then
            external_url="$external_url&sslmode=require&connect_timeout=15"
          else
            external_url="$external_url?sslmode=require&connect_timeout=15"
          fi
          export DATABASE_URL="$external_url"

          restore_root="$work/restore"
          mkdir -p "$restore_root"
          tar -xzf "$plain_backup" -C "$restore_root"
          restore_dir="$(find "$restore_root" -type f -name toc.dat -printf '%h\n')"
          test "$(printf '%s\n' "$restore_dir" | sed '/^$/d' | wc -l)" -eq 1
          restore_relative="${restore_dir#"$restore_root"/}"
          docker run --rm \
            -e DATABASE_URL \
            -v "$restore_root:/backup:ro" \
            postgres:17-alpine \
            sh -ceu '
              pg_restore \
                --dbname="$DATABASE_URL" \
                --verbose \
                --clean --if-exists \
                --no-owner --no-privileges \
                --jobs=2 \
                --format=directory \
                "$1"
            ' -- "/backup/$restore_relative"

          WORK="$work" node --input-type=module <<'NODE'
          import { chmodSync, readFileSync, writeFileSync } from "node:fs";

          const work = process.env.WORK;
          const connection = JSON.parse(readFileSync(`${work}/pg17-connection-info.json`, "utf8"));
          const secrets = JSON.parse(readFileSync(`${work}/runtime-role-secrets.json`, "utf8"));
          const project = (base, role) => {
            const url = new URL(base);
            url.username = role.username;
            url.password = role.password;
            return url.toString();
          };
          const urls = { roles: {} };
          for (const [name, role] of Object.entries(secrets.roles)) {
            urls.roles[name] = {
              external: project(connection.externalConnectionString, role),
              internal: project(connection.internalConnectionString, role),
            };
          }
          const target = `${work}/runtime-role-urls.json`;
          writeFileSync(target, `${JSON.stringify(urls)}\n`, { mode: 0o600 });
          chmodSync(target, 0o600);
          NODE

          cat > "$work/create-runtime-roles.sql" <<'SQL'
          \set ON_ERROR_STOP on
          \getenv api_password RR_API_PASSWORD
          \getenv web_password RR_WEB_PASSWORD
          \getenv worker_password RR_WORKER_PASSWORD
          \getenv effect_password RR_EFFECT_PASSWORD
          BEGIN;
          CREATE ROLE reviewrouter_release_schema_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
          CREATE ROLE reviewrouter_api LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'api_password';
          CREATE ROLE reviewrouter_web LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'web_password';
          CREATE ROLE reviewrouter_worker LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'worker_password';
          CREATE ROLE reviewrouter_codex_effect_authority LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'effect_password';
          SELECT current_user AS owner_role \gset
          GRANT reviewrouter_release_schema_owner TO :"owner_role" WITH ADMIN OPTION;
          COMMIT;
          SQL
          chmod 600 "$work/create-runtime-roles.sql"
          export RR_API_PASSWORD RR_WEB_PASSWORD RR_WORKER_PASSWORD RR_EFFECT_PASSWORD
          RR_API_PASSWORD="$(jq -er '.roles.api.password' "$work/runtime-role-secrets.json")"
          RR_WEB_PASSWORD="$(jq -er '.roles.web.password' "$work/runtime-role-secrets.json")"
          RR_WORKER_PASSWORD="$(jq -er '.roles.worker.password' "$work/runtime-role-secrets.json")"
          RR_EFFECT_PASSWORD="$(jq -er '.roles.effectAuthority.password' "$work/runtime-role-secrets.json")"
          docker run --rm \
            -e DATABASE_URL \
            -e RR_API_PASSWORD -e RR_WEB_PASSWORD -e RR_WORKER_PASSWORD -e RR_EFFECT_PASSWORD \
            -v "$work:/work:ro" \
            postgres:17-alpine \
            sh -ceu 'psql "$DATABASE_URL" --no-psqlrc --quiet --file=/work/create-runtime-roles.sql'
          unset RR_API_PASSWORD RR_WEB_PASSWORD RR_WORKER_PASSWORD RR_EFFECT_PASSWORD

          DATABASE_URL="$external_url" pnpm db:migrate:deploy
          node --import tsx --input-type=module <<'NODE' > "$work/runtime-grants.sql"
          import { runtimeGrantSql } from "./scripts/run-codex-rotating-release-migration.mjs";

          process.stdout.write(runtimeGrantSql({ roles: [
            { role: "api", username: "reviewrouter_api" },
            { role: "web", username: "reviewrouter_web" },
            { role: "worker", username: "reviewrouter_worker" },
            { role: "effect-authority", username: "reviewrouter_codex_effect_authority" },
          ] }));
          NODE
          chmod 600 "$work/runtime-grants.sql"
          docker run --rm \
            -e DATABASE_URL \
            -v "$work:/work:ro" \
            postgres:17-alpine \
            sh -ceu 'psql "$DATABASE_URL" --no-psqlrc --quiet --file=/work/runtime-grants.sql'
          docker run --rm -e DATABASE_URL postgres:17-alpine \
            sh -ceu 'psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atc "
              SELECT json_build_object(
                '\''serverMajor'\'', current_setting('\''server_version_num'\'')::integer / 10000,
                '\''databaseSizeBytes'\'', pg_database_size(current_database()),
                '\''publicTableCount'\'', (
                  SELECT count(*) FROM information_schema.tables
                  WHERE table_schema = '\''public'\'' AND table_type = '\''BASE TABLE'\''
                ),
                '\''appliedMigrationCount'\'', (
                  SELECT count(*) FROM \"_prisma_migrations\"
                  WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL
                ),
                '\''hasHostedPool'\'', to_regclass('\''public.\"HostedCodexPool\"'\'') IS NOT NULL,
                '\''hasRuntimeCanary'\'', to_regclass('\''public.\"RuntimeCanaryChallenge\"'\'') IS NOT NULL
              );
            "' > "$work/target-stats.json"
          jq -e '
            .serverMajor == 17
            and .hasHostedPool == true
            and .hasRuntimeCanary == true
          ' "$work/target-stats.json" >/dev/null

          jq -n --arg value "$(jq -er '.roles.api.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/api-database-env.json"
          jq -n --arg value "$(jq -er '.roles.web.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/web-database-env.json"
          jq -n --arg value "$(jq -er '.roles.worker.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/worker-database-env.json"
          jq -n --arg value "$(jq -er '.roles.effectAuthority.internal' "$work/runtime-role-urls.json")" \
            '{value: $value}' > "$work/effect-authority-env.json"
          render_api -X PUT -H "Content-Type: application/json" \
            --data-binary @"$work/api-database-env.json" \
            "https://api.render.com/v1/services/$API_SERVICE_ID/env-vars/DATABASE_URL" -o /dev/null
          render_api -X PUT -H "Content-Type: application/json" \
            --data-binary @"$work/web-database-env.json" \
            "https://api.render.com/v1/services/$WEB_SERVICE_ID/env-vars/DATABASE_URL" -o /dev/null
          render_api -X PUT -H "Content-Type: application/json" \
            --data-binary @"$work/worker-database-env.json" \
            "https://api.render.com/v1/services/$WORKER_SERVICE_ID/env-vars/DATABASE_URL" -o /dev/null
          for service_id in "$API_SERVICE_ID" "$WEB_SERVICE_ID"; do
            render_api -X PUT -H "Content-Type: application/json" \
              --data-binary @"$work/effect-authority-env.json" \
              "https://api.render.com/v1/services/$service_id/env-vars/REVIEW_ROUTER_CODEX_EFFECT_AUTHORITY_DATABASE_URL" \
              -o /dev/null
          done

          render_api -X PATCH \
            -H "Content-Type: application/json" \
            --data-binary '{"ipAllowList":[]}' \
            "https://api.render.com/v1/postgres/$new_db_id" \
            -o /dev/null

          jq -n \
            --arg sourceDbId "$SOURCE_DB_ID" \
            --arg targetDbId "$new_db_id" \
            --arg releaseCommitSha "$RELEASE_COMMIT_SHA" \
            --arg backupRunId "$GITHUB_RUN_ID" \
            --slurpfile targetStats "$work/target-stats.json" \
            '{
              sourceDbId: $sourceDbId,
              targetDbId: $targetDbId,
              targetVersion: 17,
              releaseCommitSha: $releaseCommitSha,
              backupRunId: $backupRunId,
              targetStats: $targetStats[0]
            }' > "$work/cutover-manifest.json"
          echo "new_db_id=$new_db_id" >> "$GITHUB_OUTPUT"
          unset DATABASE_URL external_url internal_url
          rm -f \
            "$plain_backup" "$connection_info" \
            "$work/runtime-role-secrets.json" "$work/runtime-role-urls.json" \
            "$work/create-runtime-roles.sql" "$work/runtime-grants.sql" \
            "$work/api-database-env.json" "$work/web-database-env.json" \
            "$work/worker-database-env.json" "$work/effect-authority-env.json"

      - name: Resume services after database cutover
        shell: bash
        run: |
          set -euo pipefail
          render_api() {
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 120 \
              -H "Accept: application/json" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "$@"
          }
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            state="$(render_api "https://api.render.com/v1/services/$service_id" | jq -r '.suspended')"
            if [[ "$state" == "suspended" ]]; then
              render_api -X POST \
                "https://api.render.com/v1/services/$service_id/resume" \
                -o /dev/null
            fi
          done

      - name: Upload cutover evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewrouter-pg17-cutover-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reviewrouter-pg17-backup/cutover-manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Resume original services after pre-delete failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/reviewrouter-pg16-deleted" ]]; then
            echo "Source PG16 was already deleted; services remain suspended for explicit recovery."
            exit 0
          fi
          for service_id in "$API_SERVICE_ID" "$WORKER_SERVICE_ID" "$WEB_SERVICE_ID"; do
            state="$(curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --retry-delay 3 \
              --connect-timeout 15 --max-time 90 \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$service_id" | jq -r '.suspended')"
            if [[ "$state" == "suspended" ]]; then
              curl --fail --silent --show-error \
                --retry 4 --retry-all-errors --retry-delay 3 \
                --connect-timeout 15 --max-time 90 \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -X POST \
                "https://api.render.com/v1/services/$service_id/resume" \
                -o /dev/null
            fi
          done
