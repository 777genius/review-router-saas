name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semver tag to publish, for example v1.0.39
        required: true
        type: string
      create_github_release:
        description: Create a GitHub Release for the exact tag
        required: true
        default: true
        type: boolean
      sync_production_action_ref:
        description: Sync production Action ref override after release
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Recheck Codex secret-write boundary
        run: node scripts/check-codex-secret-write-boundary.mjs

      - name: Validate release target
        id: release
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ACTION_REPOSITORY: 777genius/review-router
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.0.39"
            exit 1
          fi

          MAJOR_TAG="${VERSION%%.*}"

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::release workflow must run from main, got $GITHUB_REF"
            exit 1
          fi

          git fetch --force --tags origin main

          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::checked out commit must match origin/main"
            exit 1
          fi

          VERSION_TAG_EXISTS=false
          LOCAL_VERSION_SHA=""
          if git rev-parse --quiet --verify "refs/tags/$VERSION" >/dev/null; then
            LOCAL_VERSION_SHA="$(git rev-parse "refs/tags/$VERSION^{}")"
          fi

          REMOTE_VERSION_SHA="$(
            git ls-remote --tags origin "refs/tags/$VERSION^{}" | awk 'NR == 1 { print $1 }'
          )"
          if [[ -z "$REMOTE_VERSION_SHA" ]]; then
            REMOTE_VERSION_SHA="$(
              git ls-remote --tags origin "refs/tags/$VERSION" | awk 'NR == 1 { print $1 }'
            )"
          fi

          if [[ -n "$LOCAL_VERSION_SHA" && "$LOCAL_VERSION_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::local tag $VERSION already exists at $LOCAL_VERSION_SHA"
            exit 1
          fi
          if [[ -n "$REMOTE_VERSION_SHA" && "$REMOTE_VERSION_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::remote tag $VERSION already exists at $REMOTE_VERSION_SHA"
            exit 1
          fi
          if [[ -n "$LOCAL_VERSION_SHA$REMOTE_VERSION_SHA" ]]; then
            VERSION_TAG_EXISTS=true
          fi

          LATEST_TAG="$(git tag -l "$MAJOR_TAG.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)"
          if [[ -n "$LATEST_TAG" ]]; then
            HIGHEST_TAG="$(printf '%s\n%s\n' "$LATEST_TAG" "$VERSION" | sort -V | tail -n 1)"
            if [[ "$HIGHEST_TAG" != "$VERSION" ]]; then
              echo "::error::$VERSION is not newer than existing latest $LATEST_TAG"
              exit 1
            fi
          fi

          ACTION_TAG_REF="$(
            git ls-remote --tags "https://github.com/$ACTION_REPOSITORY.git" "refs/tags/$VERSION" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [[ -z "$ACTION_TAG_REF" ]]; then
            echo "::error::$ACTION_REPOSITORY tag $VERSION must exist before releasing the SaaS runtime"
            exit 1
          fi

          ACTION_SHA="$(
            git ls-remote --tags "https://github.com/$ACTION_REPOSITORY.git" "refs/tags/$VERSION^{}" \
              | awk 'NR == 1 { print $1 }'
          )"
          if [[ -z "$ACTION_SHA" ]]; then
            ACTION_SHA="$ACTION_TAG_REF"
          fi
          if [[ ! "$ACTION_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error::could not resolve $ACTION_REPOSITORY $VERSION to a commit SHA"
            exit 1
          fi
          ACTION_SHA="$(printf '%s' "$ACTION_SHA" | tr '[:upper:]' '[:lower:]')"

          {
            echo "version=$VERSION"
            echo "major_tag=$MAJOR_TAG"
            echo "action_sha=$ACTION_SHA"
            echo "action_ref=$ACTION_REPOSITORY@$ACTION_SHA"
            echo "version_tag_exists=$VERSION_TAG_EXISTS"
          } >> "$GITHUB_OUTPUT"

      - name: Require successful CI on this commit
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CI_RUN="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow CI \
              --branch main \
              --limit 50 \
              --json databaseId,headSha,status,conclusion,url \
              --jq ".[] | select(.headSha == \"$GITHUB_SHA\" and .status == \"completed\" and .conclusion == \"success\") | [.databaseId, .url] | @tsv" \
              | head -n 1
          )"

          if [[ -z "$CI_RUN" ]]; then
            echo "::error::CI must complete successfully on $GITHUB_SHA before release"
            exit 1
          fi

          CI_RUN_ID="${CI_RUN%%$'\t'*}"
          CI_URL="${CI_RUN#*$'\t'}"
          if [[ ! "$CI_RUN_ID" =~ ^[0-9]+$ || -z "$CI_URL" ]]; then
            echo "::error::could not resolve the successful CI run identity for $GITHUB_SHA"
            exit 1
          fi

          echo "run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using CI gate: $CI_URL"

      - name: Require Action tag tested by CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
          RELEASE_ACTION_SHA: ${{ steps.release.outputs.action_sha }}
        run: |
          set -euo pipefail

          gate_dir="$RUNNER_TEMP/paired-action-release-gate"
          mkdir -p "$gate_dir"
          gh run download "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name paired-action-release-gate \
            --dir "$gate_dir"

          node - "$gate_dir/paired-action-release-gate.json" "$GITHUB_SHA" "$RELEASE_ACTION_SHA" <<'NODE'
          const { readFileSync } = require("node:fs");
          const [evidencePath, expectedSaasSha, releaseActionSha] = process.argv.slice(2);
          const evidence = JSON.parse(readFileSync(evidencePath, "utf8"));
          const shaPattern = /^[a-f0-9]{40}$/u;

          if (evidence.schemaVersion !== "reviewrouter.paired-action-release-gate.v1") {
            throw new Error("paired Action CI evidence has an unsupported schema version");
          }
          if (!shaPattern.test(evidence.saasSha) || evidence.saasSha !== expectedSaasSha) {
            throw new Error(
              `paired Action CI evidence belongs to SaaS ${evidence.saasSha}, expected ${expectedSaasSha}`,
            );
          }
          if (!shaPattern.test(evidence.actionSha)) {
            throw new Error("paired Action CI evidence does not contain an immutable Action SHA");
          }
          if (evidence.actionSha !== releaseActionSha) {
            throw new Error(
              `Action tag resolves to ${releaseActionSha}, but CI tested ${evidence.actionSha}`,
            );
          }
          console.log(`Action tag and CI gate agree on ${evidence.actionSha}`);
          NODE

      - name: Prepare immutable rotating installer descriptor
        id: installer
        shell: bash
        env:
          ACTION_REPOSITORY: 777genius/review-router
          ACTION_SHA: ${{ steps.release.outputs.action_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          descriptor_dir="$RUNNER_TEMP/codex-rotating-installer-descriptor"
          mkdir -p "$descriptor_dir"
          seed_url="https://raw.githubusercontent.com/${ACTION_REPOSITORY}/${ACTION_SHA}/scripts/seed-codex-rotating-auth.sh"
          reseed_url="https://raw.githubusercontent.com/${ACTION_REPOSITORY}/${ACTION_SHA}/scripts/reseed-codex-rotating-auth.sh"
          curl --fail --silent --show-error --location --max-redirs 0 "$seed_url" -o "$descriptor_dir/seed.sh"
          curl --fail --silent --show-error --location --max-redirs 0 "$reseed_url" -o "$descriptor_dir/reseed.sh"
          cmp scripts/seed-codex-rotating-auth.sh "$descriptor_dir/seed.sh"
          cmp scripts/reseed-codex-rotating-auth.sh "$descriptor_dir/reseed.sh"
          seed_sha256="$(sha256sum "$descriptor_dir/seed.sh" | awk '{print $1}')"
          reseed_sha256="$(sha256sum "$descriptor_dir/reseed.sh" | awk '{print $1}')"
          descriptor_path="$descriptor_dir/reviewrouter-codex-rotating-installer-descriptor.json"
          node - "$descriptor_path" "$VERSION" "$ACTION_REPOSITORY" "$ACTION_SHA" "$seed_url" "$seed_sha256" "$reseed_url" "$reseed_sha256" <<'NODE'
          const { writeFileSync } = require("node:fs");
          const [path, version, repository, actionSha, url, sha256, reseedUrl, reseedSha256] = process.argv.slice(2);
          writeFileSync(path, `${JSON.stringify({
            schemaVersion: "reviewrouter.codex-rotating-installer-descriptor.v1",
            url,
            version,
            sha256,
            actionRef: `${repository}@${actionSha}`,
            reseed: { url: reseedUrl, sha256: reseedSha256 },
          }, null, 2)}\n`);
          NODE
          descriptor_sha256="$(sha256sum "$descriptor_path" | awk '{print $1}')"
          echo "path=$descriptor_path" >> "$GITHUB_OUTPUT"
          echo "url=$seed_url" >> "$GITHUB_OUTPUT"
          echo "sha256=$seed_sha256" >> "$GITHUB_OUTPUT"
          echo "descriptor_sha256=$descriptor_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload immutable rotating installer descriptor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-rotating-installer-descriptor-${{ steps.release.outputs.version }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 90

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish immutable hosted runtime image
        id: runtime_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: deploy/render-runtime/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          secrets: |
            subscription_runtime_deploy_key_b64=${{ secrets.SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64 }}
          tags: |
            ghcr.io/777genius/review-router-saas-runtime:${{ github.sha }}
            ghcr.io/777genius/review-router-saas-runtime:${{ steps.release.outputs.version }}

      - name: Verify immutable hosted runtime digest
        id: runtime_identity
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.runtime_image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Buildx did not return an immutable OCI image digest"
            exit 1
          fi
          image_url="ghcr.io/777genius/review-router-saas-runtime@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$image_url" >/dev/null
          echo "digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "url=$image_url" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";
          const identity = {
            schemaVersion: "reviewrouter.hosted-runtime-image.v1",
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            imageUrl: `ghcr.io/777genius/review-router-saas-runtime@${process.env.IMAGE_DIGEST}`,
            imageDigest: process.env.IMAGE_DIGEST,
          };
          writeFileSync("hosted-runtime-image.json", `${JSON.stringify(identity, null, 2)}\n`);
          NODE

      - name: Publish hosted runtime image for anonymous digest pulls
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_URL: ${{ steps.runtime_identity.outputs.url }}
        run: |
          set -euo pipefail
          gh api --method PATCH \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/orgs/777genius/packages/container/review-router-saas-runtime" \
            -f visibility=public >/dev/null
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$IMAGE_URL" >/dev/null

      - name: Upload immutable hosted runtime identity
        id: runtime_identity_artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-runtime-image-${{ steps.release.outputs.version }}
          path: hosted-runtime-image.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Attest immutable hosted runtime identity
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-path: hosted-runtime-image.json

      - name: Preflight production Action ref override sync
        if: ${{ inputs.sync_production_action_ref }}
        shell: bash
        env:
          ACTION_REF: ${{ steps.release.outputs.action_ref }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_API_KEY:-}" ]]; then
            echo "::error::RENDER_API_KEY secret is required when sync_production_action_ref override is enabled"
            exit 1
          fi

          node scripts/sync-render-action-ref.mjs \
            --action-ref "$ACTION_REF" \
            --dry-run \
            --no-deploy

      - name: Publish exact and stable tags
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MAJOR_TAG: ${{ steps.release.outputs.major_tag }}
          VERSION_TAG_EXISTS: ${{ steps.release.outputs.version_tag_exists }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$VERSION_TAG_EXISTS" == "true" ]]; then
            echo "Exact tag $VERSION already points to $GITHUB_SHA; reusing it"
          else
            git tag "$VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/$VERSION"
          fi
          git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$MAJOR_TAG"

      - name: Sync production Action ref override
        if: ${{ inputs.sync_production_action_ref }}
        shell: bash
        env:
          ACTION_REF: ${{ steps.release.outputs.action_ref }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail

          node scripts/sync-render-action-ref.mjs \
            --action-ref "$ACTION_REF" \
            --wait

      - name: Create GitHub Release
        if: ${{ inputs.create_github_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $VERSION already exists; leaving it unchanged"
          else
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "ReviewRouter SaaS Runtime $VERSION" \
              --generate-notes \
              --latest
          fi
          gh release upload "$VERSION" \
            "${{ steps.installer.outputs.path }}" hosted-runtime-image.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Summary
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          MAJOR_TAG: ${{ steps.release.outputs.major_tag }}
          ACTION_REF: ${{ steps.release.outputs.action_ref }}
          SYNC_PRODUCTION_ACTION_REF: ${{ inputs.sync_production_action_ref }}
          VERSION_TAG_EXISTS: ${{ steps.release.outputs.version_tag_exists }}
          INSTALLER_URL: ${{ steps.installer.outputs.url }}
          INSTALLER_SHA256: ${{ steps.installer.outputs.sha256 }}
          INSTALLER_DESCRIPTOR_SHA256: ${{ steps.installer.outputs.descriptor_sha256 }}
          RUNTIME_IMAGE_URL: ${{ steps.runtime_identity.outputs.url }}
          RUNTIME_IDENTITY_ARTIFACT_ID: ${{ steps.runtime_identity_artifact.outputs.artifact-id }}
        run: |
          {
            echo "Released $VERSION"
            echo ""
            echo "- Exact tag: $VERSION"
            echo "- Stable tag: $MAJOR_TAG"
            echo "- Target SHA: $GITHUB_SHA"
            echo "- Exact tag pre-existed on target SHA: $VERSION_TAG_EXISTS"
            echo "- Rotating installer URL: $INSTALLER_URL"
            echo "- Rotating installer version: $VERSION"
            echo "- Rotating installer SHA-256: $INSTALLER_SHA256"
            echo "- Rotating installer descriptor SHA-256: $INSTALLER_DESCRIPTOR_SHA256"
            echo "- Hosted runtime OCI image: $RUNTIME_IMAGE_URL"
            echo "- Hosted runtime identity artifact ID: $RUNTIME_IDENTITY_ARTIFACT_ID"
            echo "- Production Action ref override sync: $SYNC_PRODUCTION_ACTION_REF"
            if [[ "$SYNC_PRODUCTION_ACTION_REF" == "true" ]]; then
              echo "- Override Action ref: $ACTION_REF"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
