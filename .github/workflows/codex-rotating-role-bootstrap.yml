name: Codex rotating trusted role bootstrap (private rollout alias)
on:
  workflow_dispatch:
    inputs:
      bootstrap_id:
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  private-rollout:
    uses: ./.github/workflows/private-network-pg17-rollout.yml
    with:
      rollout_id: ${{ inputs.bootstrap_id }}
      expected_sha: ${{ github.sha }}
    secrets: inherit
