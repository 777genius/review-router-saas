name: Codex rotating trusted role bootstrap

on:
  workflow_dispatch:
    inputs:
      bootstrap_id:
        description: Unique non-reusable role-bootstrap identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codex-rotating-role-bootstrap-production
  cancel-in-progress: false

jobs:
  trusted-role-bootstrap:
    name: trusted-role-bootstrap
    environment: production-role-bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      REVIEW_ROUTER_RENDER_MIGRATION_SERVICE_ID: ${{ vars.REVIEW_ROUTER_RENDER_MIGRATION_SERVICE_ID }}
      REVIEW_ROUTER_RENDER_MIGRATION_DEPLOY_ID: ${{ vars.REVIEW_ROUTER_RENDER_MIGRATION_DEPLOY_ID }}
      REVIEW_ROUTER_RENDER_COMMIT_SHA: ${{ github.sha }}
      REVIEW_ROUTER_RENDER_IMAGE_DIGEST: ${{ vars.REVIEW_ROUTER_RENDER_IMAGE_DIGEST }}
      REVIEW_ROUTER_ROLE_BOOTSTRAP_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_ROLE_BOOTSTRAP_DATABASE_URL }}
      REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_RELEASE_MIGRATION_DATABASE_URL }}
      REVIEW_ROUTER_API_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_API_DATABASE_URL }}
      REVIEW_ROUTER_WEB_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_WEB_DATABASE_URL }}
      REVIEW_ROUTER_WORKER_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_WORKER_DATABASE_URL }}
      REVIEW_ROUTER_CODEX_EFFECT_AUTHORITY_DATABASE_URL: ${{ secrets.REVIEW_ROUTER_CODEX_EFFECT_AUTHORITY_DATABASE_URL }}
    steps:
      - name: Checkout immutable release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Run isolated role bootstrap
        run: |
          node scripts/run-render-codex-rotating-role-bootstrap-job.mjs > role-bootstrap-job.json
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const value = JSON.parse(readFileSync("role-bootstrap-job.json", "utf8"));
          if (value.status !== "succeeded") throw new Error("role bootstrap job did not succeed");
          if (value.deployId !== process.env.REVIEW_ROUTER_RENDER_MIGRATION_DEPLOY_ID)
            throw new Error("role bootstrap job did not use the pinned deploy");
          NODE

      - name: Upload role-bootstrap receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewrouter-role-bootstrap-${{ inputs.bootstrap_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: role-bootstrap-job.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
