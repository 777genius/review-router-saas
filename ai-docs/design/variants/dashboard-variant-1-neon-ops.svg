<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#02040b"/><stop offset="0.52" stop-color="#071428"/><stop offset="1" stop-color="#1a0520"/></linearGradient>
    <radialGradient id="cyan" cx="15%" cy="8%" r="55%"><stop stop-color="#00e5ff" stop-opacity=".34"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pink" cx="88%" cy="95%" r="62%"><stop stop-color="#ff2bd6" stop-opacity=".28"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#53eafd" stroke-opacity=".08"/></pattern>
    <style><![CDATA[
      .title{font:800 58px 'IBM Plex Sans',Arial,sans-serif;fill:#eaffff;letter-spacing:-1.5px}.sub{font:500 20px 'IBM Plex Sans',Arial,sans-serif;fill:#9eb8c8}.small{font:600 15px 'IBM Plex Mono',monospace;fill:#86f7ff;letter-spacing:.12em}.body{font:500 19px 'IBM Plex Sans',Arial,sans-serif;fill:#d7f8ff}.muted{font:500 16px 'IBM Plex Sans',Arial,sans-serif;fill:#8ca4b8}.mono{font:600 18px 'IBM Plex Mono',monospace;fill:#c9fbff}.card{fill:#071322;stroke:#6eefff;stroke-opacity:.2}.glass{fill:#081528;fill-opacity:.72;stroke:#7ff6ff;stroke-opacity:.26}.lime{fill:#b4ff37}.pink{fill:#ff2bd6}.cyan{fill:#00e5ff}
    ]]></style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#cyan)"/><rect width="1600" height="1000" fill="url(#pink)"/><rect width="1600" height="1000" fill="url(#grid)" opacity=".9"/>
  <rect x="34" y="34" width="1532" height="92" rx="28" class="glass"/><text x="72" y="92" class="small">REVIEWROUTER</text><text x="310" y="92" class="muted">Overview</text><text x="430" y="92" class="muted">Getting started</text><text x="615" y="92" class="body">Dashboard</text><text x="760" y="92" class="muted">Security</text><rect x="1320" y="56" width="185" height="48" rx="16" fill="#a6ff00" fill-opacity=".14" stroke="#a6ff00" stroke-opacity=".45"/><text x="1360" y="87" class="mono" fill="#d8ff99">API demo</text>
  <rect x="52" y="164" width="294" height="748" rx="34" fill="#050b14" stroke="#53eafd" stroke-opacity=".22"/><text x="86" y="218" class="small">INSTALL FLOW</text>
  <g transform="translate(84 260)"><circle r="18" class="cyan" filter="url(#glow)"/><text x="42" y="7" class="body">Sign in</text><line x1="0" y1="34" x2="0" y2="104" stroke="#53eafd" stroke-opacity=".35" stroke-width="2"/><circle cy="128" r="18" fill="#13283b" stroke="#53eafd"/><text x="42" y="135" class="body">Install App</text><line x1="0" y1="162" x2="0" y2="232" stroke="#53eafd" stroke-opacity=".35" stroke-width="2"/><circle cy="256" r="18" fill="#13283b" stroke="#a6ff00"/><text x="42" y="263" class="body">Create setup PR</text></g>
  <rect x="388" y="170" width="760" height="214" rx="38" fill="#06111f" stroke="#00e5ff" stroke-opacity=".24"/><text x="432" y="246" class="small">CONNECTED REPOSITORIES</text><text x="432" y="318" class="title">Start with one repo.</text><text x="434" y="352" class="sub">Credentials stay in GitHub Actions. ReviewRouter stores metadata only.</text>
  <rect x="1184" y="170" width="330" height="214" rx="38" class="glass"/><text x="1226" y="224" class="small">TRUST BOUNDARY</text><text x="1226" y="290" class="mono">No code custody</text><text x="1226" y="326" class="muted">No diffs, prompts, or Codex OAuth stored.</text>
  <g transform="translate(388 424)"><rect width="348" height="164" rx="30" class="card"/><text x="30" y="54" class="small">WORKSPACE</text><text x="30" y="104" class="body">No workspace yet</text><rect x="240" y="42" width="68" height="68" rx="22" fill="#00e5ff" fill-opacity=".12" stroke="#00e5ff"/><path d="M258 78h32M274 62v32" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/></g>
  <g transform="translate(772 424)"><rect width="348" height="164" rx="30" class="card"/><text x="30" y="54" class="small">APP STATUS</text><text x="30" y="104" class="body">Ready to install</text><rect x="238" y="48" width="72" height="48" rx="24" fill="#a6ff00" fill-opacity=".16" stroke="#a6ff00"/><circle cx="264" cy="72" r="10" class="lime"/><circle cx="288" cy="72" r="10" fill="#a6ff00" fill-opacity=".35"/></g>
  <g transform="translate(1156 424)"><rect width="358" height="164" rx="30" class="card"/><text x="30" y="54" class="small">RUNTIME</text><text x="30" y="104" class="body">Customer CI</text><text x="30" y="132" class="muted">Codex runs in GitHub Actions</text></g>
  <rect x="388" y="630" width="1126" height="228" rx="38" class="glass"/><text x="432" y="684" class="small">NEXT ACTION</text><text x="432" y="735" class="body">Install ReviewRouter on selected repositories</text><text x="432" y="772" class="muted">The dashboard should always show one obvious primary action, one secondary guide, and a visible security boundary.</text><rect x="432" y="808" width="204" height="52" rx="18" fill="#00e5ff"/><text x="466" y="841" font-family="IBM Plex Sans, Arial" font-size="18" font-weight="800" fill="#00141b">Install App</text><rect x="658" y="808" width="184" height="52" rx="18" fill="none" stroke="#53eafd" stroke-opacity=".5"/><text x="696" y="841" class="body">Setup guide</text>
  <text x="70" y="960" class="muted">Variant 1 - Neon Ops Cockpit: loud, app-like, strongest cyberpunk identity</text>
</svg>
