<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#070712"/><stop offset=".45" stop-color="#0b1028"/><stop offset="1" stop-color="#22051e"/></linearGradient>
    <radialGradient id="halo" cx="72%" cy="25%" r="55%"><stop stop-color="#7c3cff" stop-opacity=".26"/><stop offset=".45" stop-color="#00e5ff" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <style><![CDATA[
      .title{font:850 60px 'IBM Plex Sans',Arial,sans-serif;fill:#f1fbff;letter-spacing:-1.8px}.sub{font:500 21px 'IBM Plex Sans',Arial,sans-serif;fill:#aebbd5}.small{font:750 13px 'IBM Plex Mono',monospace;fill:#9adfff;letter-spacing:.16em}.body{font:620 19px 'IBM Plex Sans',Arial,sans-serif;fill:#eff8ff}.muted{font:500 16px 'IBM Plex Sans',Arial,sans-serif;fill:#8b98b8}.card{fill:#11172d;stroke:#ffffff;stroke-opacity:.08}.glass{fill:#0b1125;fill-opacity:.78;stroke:#91eaff;stroke-opacity:.18}.accent{fill:#00e5ff}.pink{fill:#ff4bd8}.violet{fill:#7c3cff}.lime{fill:#b8ff4d}
    ]]></style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#halo)"/>
  <rect x="40" y="32" width="320" height="896" rx="34" fill="#060914" stroke="#ffffff" stroke-opacity=".07"/><text x="78" y="92" class="small">REVIEWROUTER</text><rect x="70" y="142" width="250" height="54" rx="16" fill="#00e5ff" fill-opacity=".12" stroke="#00e5ff" stroke-opacity=".22"/><text x="98" y="176" class="body">Dashboard</text><text x="98" y="248" class="muted">Getting started</text><text x="98" y="308" class="muted">Security</text><text x="98" y="368" class="muted">Status</text><text x="98" y="428" class="muted">Support</text><rect x="72" y="780" width="248" height="82" rx="22" fill="#ff4bd8" fill-opacity=".10" stroke="#ff4bd8" stroke-opacity=".22"/><text x="98" y="817" class="small">PROVIDER</text><text x="98" y="846" class="body">Codex OAuth</text>
  <g><text x="420" y="114" class="small">METADATA CONTROL PLANE</text><text x="420" y="190" class="title">Connected repositories</text><text x="424" y="232" class="sub">A clean SaaS dashboard with cyberpunk accents and fewer visual distractions.</text>
  <rect x="420" y="282" width="340" height="146" rx="28" class="card"/><text x="454" y="330" class="small">WORKSPACES</text><text x="454" y="382" class="title" font-size="38">0</text><text x="540" y="382" class="muted">Start with one repo</text>
  <rect x="790" y="282" width="340" height="146" rx="28" class="card"/><text x="824" y="330" class="small">SECRETS</text><text x="824" y="382" class="body">Stored in GitHub</text><text x="824" y="408" class="muted">not in SaaS</text>
  <rect x="1160" y="282" width="330" height="146" rx="28" class="card"/><text x="1194" y="330" class="small">REVIEW RUNTIME</text><text x="1194" y="382" class="body">Customer CI</text><text x="1194" y="408" class="muted">OIDC config fetch</text>
  <rect x="420" y="470" width="1070" height="330" rx="34" class="glass"/><text x="462" y="530" class="small">ONBOARDING</text><text x="462" y="586" class="title" font-size="40">Start with one selected repository.</text><text x="462" y="630" class="sub">The page should tell the user exactly what happens next and why it is safe.</text>
  <g transform="translate(462 682)"><rect width="282" height="72" rx="22" fill="#00e5ff"/><text x="54" y="46" font-family="IBM Plex Sans,Arial" font-size="20" font-weight="850" fill="#06111a">Sign in with GitHub</text><rect x="306" width="250" height="72" rx="22" fill="none" stroke="#9adfff" stroke-opacity=".45"/><text x="362" y="46" class="body">Install App</text><rect x="580" width="250" height="72" rx="22" fill="none" stroke="#ff4bd8" stroke-opacity=".45"/><text x="630" y="46" class="body">Setup guide</text></g>
  <rect x="420" y="836" width="1070" height="74" rx="24" fill="#06101f" stroke="#ffffff" stroke-opacity=".08"/><circle cx="462" cy="873" r="10" class="lime"/><text x="490" y="881" class="muted">Read-only mode - sign in to request repository sync or setup PRs.</text></g>
  <text x="70" y="966" class="muted">Variant 3 - Cyber SaaS Console: most polished for public demo, balanced between SaaS clarity and future vibe</text>
</svg>
