<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050711"/><stop offset=".5" stop-color="#0a1a2c"/><stop offset="1" stop-color="#21071e"/></linearGradient>
    <radialGradient id="light" cx="70%" cy="10%" r="70%"><stop stop-color="#00e5ff" stop-opacity=".20"/><stop offset=".55" stop-color="#ff2bd6" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".42"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8defff" opacity=".08"/></pattern>
    <style><![CDATA[
      .title{font:850 56px 'IBM Plex Sans',Arial,sans-serif;fill:#f4fbff;letter-spacing:-1.6px}.sub{font:500 20px 'IBM Plex Sans',Arial,sans-serif;fill:#a9b8cf}.small{font:760 12px 'IBM Plex Mono',monospace;fill:#90eaff;letter-spacing:.18em}.body{font:650 19px 'IBM Plex Sans',Arial,sans-serif;fill:#eef8ff}.muted{font:500 15px 'IBM Plex Sans',Arial,sans-serif;fill:#8e9bb5}.panel{fill:#0b1226;fill-opacity:.84;stroke:#ffffff;stroke-opacity:.08}.cyan{fill:#00e5ff}.pink{fill:#ff3ed3}.lime{fill:#b8ff4d}
    ]]></style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#light)"/><rect width="1600" height="1000" fill="url(#dots)"/>
  <rect x="50" y="42" width="1500" height="84" rx="28" class="panel" filter="url(#shadow)"/><text x="88" y="94" class="small">REVIEWROUTER</text><text x="350" y="94" class="muted">Overview</text><text x="480" y="94" class="muted">Getting started</text><text x="678" y="94" class="body">Dashboard</text><text x="840" y="94" class="muted">Security</text><rect x="1312" y="60" width="176" height="48" rx="16" fill="#00e5ff" fill-opacity=".12" stroke="#00e5ff" stroke-opacity=".32"/><text x="1356" y="91" class="body">API demo</text>
  <text x="70" y="196" class="title">Connected repositories</text><text x="74" y="236" class="sub">The same SaaS clarity, but with detailed glass cards, internal sections, and visual texture.</text>
  <g filter="url(#shadow)">
    <rect x="70" y="288" width="460" height="548" rx="38" class="panel"/><text x="110" y="346" class="small">GET STARTED</text><text x="110" y="404" class="body">Start with one selected repository.</text><text x="110" y="438" class="muted">Guided flow, not generic empty state.</text><rect x="110" y="488" width="370" height="78" rx="24" fill="#101a36" stroke="#ffffff" stroke-opacity=".08"/><circle cx="146" cy="527" r="12" class="cyan"/><text x="174" y="534" class="body">Sign in with GitHub</text><rect x="110" y="586" width="370" height="78" rx="24" fill="#101a36" stroke="#ffffff" stroke-opacity=".08"/><circle cx="146" cy="625" r="12" class="pink"/><text x="174" y="632" class="body">Install on selected repos</text><rect x="110" y="684" width="370" height="78" rx="24" fill="#101a36" stroke="#ffffff" stroke-opacity=".08"/><circle cx="146" cy="723" r="12" class="lime"/><text x="174" y="730" class="body">Merge setup PR</text>
    <rect x="570" y="288" width="450" height="250" rx="38" class="panel"/><text x="610" y="344" class="small">SECRET BOUNDARY</text><text x="610" y="398" class="body">Credentials never enter SaaS</text><text x="610" y="430" class="muted">Provider setup is seeded into GitHub Actions.</text><path d="M910 366h64v64h-64z" fill="#00e5ff" fill-opacity=".08" stroke="#00e5ff" stroke-opacity=".38"/><path d="M926 400l14 14 28-36" fill="none" stroke="#b8ff4d" stroke-width="5" stroke-linecap="round"/>
    <rect x="1060" y="288" width="450" height="250" rx="38" class="panel"/><text x="1100" y="344" class="small">RUNTIME</text><text x="1100" y="398" class="body">Reviews run in customer CI</text><text x="1100" y="430" class="muted">OIDC session exchange, action config, health telemetry.</text><rect x="1100" y="466" width="168" height="38" rx="14" fill="#b8ff4d" fill-opacity=".12" stroke="#b8ff4d" stroke-opacity=".28"/><text x="1126" y="491" class="small">READ ONLY</text>
    <rect x="570" y="586" width="940" height="250" rx="38" class="panel"/><text x="610" y="642" class="small">REPOSITORY SURFACE</text><text x="610" y="700" font-family="IBM Plex Sans,Arial" font-size="42" font-weight="850" fill="#f4fbff">No workspace yet</text><text x="610" y="738" class="muted">Once connected, this area becomes a rich repository table with provider, model, effort, health, and setup PR state.</text><rect x="1188" y="666" width="236" height="58" rx="20" class="cyan"/><text x="1228" y="702" font-family="IBM Plex Sans,Arial" font-size="19" font-weight="850" fill="#031018">Install App</text>
  </g>
  <text x="70" y="948" class="muted">Variant 3C - Dense Glass Cards: keeps multi-card dashboard, but each card has inner structure and stronger material depth</text>
</svg>
