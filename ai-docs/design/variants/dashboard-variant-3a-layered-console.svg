<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#050511"/><stop offset=".42" stop-color="#08192a"/><stop offset="1" stop-color="#26041f"/></linearGradient>
    <radialGradient id="cyanHalo" cx="58%" cy="16%" r="58%"><stop stop-color="#00e5ff" stop-opacity=".25"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="pinkHalo" cx="84%" cy="78%" r="62%"><stop stop-color="#ff2bd6" stop-opacity=".23"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity=".42"/></filter>
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00e5ff" flood-opacity=".42"/></filter>
    <pattern id="microGrid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8df7ff" stroke-opacity=".045"/></pattern>
    <style><![CDATA[
      .title{font:850 58px 'IBM Plex Sans',Arial,sans-serif;fill:#f2fbff;letter-spacing:-1.8px}.h2{font:800 38px 'IBM Plex Sans',Arial,sans-serif;fill:#f2fbff;letter-spacing:-.8px}.sub{font:500 20px 'IBM Plex Sans',Arial,sans-serif;fill:#aebbd5}.small{font:760 13px 'IBM Plex Mono',monospace;fill:#98eaff;letter-spacing:.17em}.body{font:650 19px 'IBM Plex Sans',Arial,sans-serif;fill:#eff8ff}.muted{font:500 16px 'IBM Plex Sans',Arial,sans-serif;fill:#8c9ab9}.mono{font:700 17px 'IBM Plex Mono',monospace;fill:#d8faff}.panel{fill:#0b1125;stroke:#ffffff;stroke-opacity:.08}.glass{fill:#0b1328;fill-opacity:.82;stroke:#92edff;stroke-opacity:.18}.inner{fill:#081024;stroke:#80eaff;stroke-opacity:.12}.cyan{fill:#00e5ff}.pink{fill:#ff4bd8}.lime{fill:#b8ff4d}.amber{fill:#ffbd38}
    ]]></style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#cyanHalo)"/><rect width="1600" height="1000" fill="url(#pinkHalo)"/><rect width="1600" height="1000" fill="url(#microGrid)"/>
  <rect x="38" y="30" width="322" height="910" rx="36" fill="#050814" stroke="#ffffff" stroke-opacity=".08" filter="url(#softShadow)"/>
  <text x="76" y="92" class="small">REVIEWROUTER</text><rect x="70" y="138" width="250" height="58" rx="18" fill="#00e5ff" fill-opacity=".13" stroke="#00e5ff" stroke-opacity=".35"/><text x="98" y="174" class="body">Dashboard</text><text x="98" y="248" class="muted">Getting started</text><text x="98" y="308" class="muted">Security</text><text x="98" y="368" class="muted">Status</text><text x="98" y="428" class="muted">Support</text>
  <rect x="70" y="744" width="250" height="132" rx="26" fill="#180b25" stroke="#ff4bd8" stroke-opacity=".22"/><text x="98" y="792" class="small">ACTIVE PROVIDER</text><text x="98" y="828" class="body">Codex OAuth</text><text x="98" y="856" class="muted">gpt-5.5 - medium</text>
  <text x="420" y="104" class="small">METADATA CONTROL PLANE</text><text x="420" y="178" class="title">Connected repositories</text><text x="424" y="220" class="sub">Polished cyber SaaS layout with layered depth, richer cards, and one obvious next action.</text>
  <g filter="url(#softShadow)">
    <rect x="420" y="270" width="312" height="150" rx="30" class="glass"/><rect x="446" y="330" width="260" height="54" rx="18" class="inner"/><text x="452" y="318" class="small">WORKSPACES</text><text x="458" y="372" font-family="IBM Plex Sans,Arial" font-size="54" font-weight="850" fill="#f2fbff">0</text><text x="540" y="364" class="muted">Selected repos</text><circle cx="674" cy="312" r="11" class="cyan" filter="url(#cyanGlow)"/>
    <rect x="760" y="270" width="336" height="150" rx="30" class="glass"/><text x="794" y="318" class="small">SECRET BOUNDARY</text><text x="794" y="366" class="body">GitHub Actions only</text><text x="794" y="394" class="muted">No OAuth custody in SaaS</text><path d="M1032 314l22 22 40-48" fill="none" stroke="#b8ff4d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1124" y="270" width="366" height="150" rx="30" class="glass"/><text x="1158" y="318" class="small">RUNTIME</text><text x="1158" y="366" class="body">Customer CI</text><text x="1158" y="394" class="muted">OIDC config fetch</text><rect x="1340" y="330" width="96" height="34" rx="17" fill="#00e5ff" fill-opacity=".12" stroke="#00e5ff" stroke-opacity=".35"/><text x="1360" y="352" class="mono">READ</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="420" y="470" width="740" height="340" rx="38" class="glass"/><rect x="456" y="520" width="668" height="96" rx="28" fill="#101a36" stroke="#ffffff" stroke-opacity=".08"/><text x="462" y="544" class="small">ONBOARDING SEQUENCE</text><text x="462" y="594" class="h2">Start with one selected repository.</text><text x="462" y="652" class="sub">Credentials stay in GitHub Actions. SaaS keeps install metadata only.</text>
    <rect x="462" y="692" width="214" height="58" rx="19" class="cyan"/><text x="504" y="728" font-family="IBM Plex Sans,Arial" font-size="19" font-weight="850" fill="#031018">Sign in</text><rect x="696" y="692" width="190" height="58" rx="19" fill="none" stroke="#91eaff" stroke-opacity=".45"/><text x="742" y="728" class="body">Install App</text><rect x="906" y="692" width="178" height="58" rx="19" fill="none" stroke="#ff4bd8" stroke-opacity=".42"/><text x="952" y="728" class="body">Setup PR</text>
    <rect x="1200" y="470" width="290" height="340" rx="38" fill="#081123" stroke="#ffffff" stroke-opacity=".1"/><text x="1234" y="526" class="small">WHY SAFE</text><line x1="1234" y1="560" x2="1450" y2="560" stroke="#ffffff" stroke-opacity=".12"/><circle cx="1250" cy="602" r="8" class="lime"/><text x="1274" y="608" class="muted">No code storage</text><circle cx="1250" cy="650" r="8" class="cyan"/><text x="1274" y="656" class="muted">No diff storage</text><circle cx="1250" cy="698" r="8" class="pink"/><text x="1274" y="704" class="muted">No Codex auth custody</text><rect x="1234" y="738" width="216" height="42" rx="15" fill="#b8ff4d" fill-opacity=".12" stroke="#b8ff4d" stroke-opacity=".28"/><text x="1260" y="765" class="mono">Metadata only</text>
  </g>
  <rect x="420" y="844" width="1070" height="76" rx="24" fill="#071122" stroke="#00e5ff" stroke-opacity=".16"/><circle cx="462" cy="882" r="10" class="lime"/><text x="490" y="889" class="muted">Read-only mode - sign in to request repository sync, setup PRs, and provider setup guidance.</text>
  <text x="70" y="972" class="muted">Variant 3A - Layered Cyber SaaS Console: same direction as variant 3, but cards have depth, inner layers, status chips, and richer hierarchy</text>
</svg>
