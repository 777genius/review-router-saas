name: reviewrouter-self-hosted

x-reviewrouter-t0-environment: &reviewrouter-t0-environment
  REVIEW_ROUTER_CODEX_ROTATING_ACTION_REF: ${REVIEW_ROUTER_CODEX_ROTATING_ACTION_REF:?REVIEW_ROUTER_CODEX_ROTATING_ACTION_REF is required}
  REVIEW_ROUTER_CODEX_ROTATING_ALLOWED_ACTION_REFS: ${REVIEW_ROUTER_CODEX_ROTATING_ALLOWED_ACTION_REFS:-}
  REVIEW_ROUTER_DATABASE_RECOVERY_WITNESS: ${REVIEW_ROUTER_DATABASE_RECOVERY_WITNESS:?REVIEW_ROUTER_DATABASE_RECOVERY_WITNESS is required}
  REVIEW_ROUTER_REVIEW_V2_DIRECT_INITIALIZATION_ENABLED: ${REVIEW_ROUTER_REVIEW_V2_DIRECT_INITIALIZATION_ENABLED:?REVIEW_ROUTER_REVIEW_V2_DIRECT_INITIALIZATION_ENABLED is required}
  REVIEW_ROUTER_REVIEW_V2_WORKFLOW_PROVISIONING_MODE: ${REVIEW_ROUTER_REVIEW_V2_WORKFLOW_PROVISIONING_MODE:?REVIEW_ROUTER_REVIEW_V2_WORKFLOW_PROVISIONING_MODE is required}
  REVIEW_ROUTER_REVIEW_V2_INTENT_ADMISSION_REQUIRED: ${REVIEW_ROUTER_REVIEW_V2_INTENT_ADMISSION_REQUIRED:?REVIEW_ROUTER_REVIEW_V2_INTENT_ADMISSION_REQUIRED is required}
  REVIEW_ROUTER_REVIEW_V2_INTENT_INGRESS_ENABLED: ${REVIEW_ROUTER_REVIEW_V2_INTENT_INGRESS_ENABLED:?REVIEW_ROUTER_REVIEW_V2_INTENT_INGRESS_ENABLED is required}
  REVIEW_ROUTER_REVIEW_V2_WORKFLOW_DISPATCH_READY: ${REVIEW_ROUTER_REVIEW_V2_WORKFLOW_DISPATCH_READY:?REVIEW_ROUTER_REVIEW_V2_WORKFLOW_DISPATCH_READY is required}

x-reviewrouter-service: &reviewrouter-service
  image: reviewrouter-self-hosted:${REVIEW_ROUTER_IMAGE_TAG:-local}
  build:
    context: ../..
    dockerfile: deploy/self-hosted/Dockerfile
    args:
      REVIEW_ROUTER_WEB_URL: ${REVIEW_ROUTER_WEB_URL:?REVIEW_ROUTER_WEB_URL is required}
      REVIEW_ROUTER_API_URL: ${REVIEW_ROUTER_API_URL:?REVIEW_ROUTER_API_URL is required}
      REVIEW_ROUTER_PUBLIC_WEB_URL: ${REVIEW_ROUTER_PUBLIC_WEB_URL:?REVIEW_ROUTER_PUBLIC_WEB_URL is required}
      REVIEW_ROUTER_PUBLIC_API_URL: ${REVIEW_ROUTER_PUBLIC_API_URL:?REVIEW_ROUTER_PUBLIC_API_URL is required}
  env_file:
    - ${REVIEW_ROUTER_SELF_HOSTED_ENV_FILE:-./.env}
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-review_router}
      POSTGRES_USER: ${POSTGRES_USER:-reviewrouter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${REVIEW_ROUTER_POSTGRES_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - reviewrouter-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    <<: *reviewrouter-service
    restart: "no"
    environment:
      <<: *reviewrouter-t0-environment
    command:
      [
        "sh",
        "-lc",
        "pnpm --filter @reviewrouter/platform-db db:migrate:deploy && node scripts/review-v2-migrate.mjs --apply --actor=self-hosted-compose",
      ]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *reviewrouter-service
    command:
      [
        "pnpm",
        "--filter",
        "@reviewrouter/web",
        "exec",
        "next",
        "start",
        "--hostname",
        "0.0.0.0",
      ]
    environment:
      <<: *reviewrouter-t0-environment
      PORT: "3000"
    ports:
      - "${REVIEW_ROUTER_WEB_BIND:-127.0.0.1:3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/health'',{redirect:''manual''}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    <<: *reviewrouter-service
    command: ["node", "--conditions=production", "apps/api/dist/server.js"]
    environment:
      <<: *reviewrouter-t0-environment
      HOST: "0.0.0.0"
      PORT: "4000"
    ports:
      - "${REVIEW_ROUTER_API_BIND:-127.0.0.1:4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:4000/health'',{redirect:''manual''}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *reviewrouter-service
    command: ["node", "--conditions=production", "apps/worker/dist/worker.js"]
    environment:
      <<: *reviewrouter-t0-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  reviewrouter-postgres-data:
