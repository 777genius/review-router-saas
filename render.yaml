# ReviewRouter hosted beta Blueprint.
# Customer code review still runs inside customer GitHub Actions. These services
# are the SaaS control plane only: dashboard, webhooks, config/OIDC, health, jobs.

services:
  - type: web
    name: reviewrouter-web
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pnpm --version && NODE_ENV=development node scripts/install-private-dependencies.mjs --frozen-lockfile && pnpm db:generate && pnpm build
    startCommand: env -u SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64 pnpm web:start
    healthCheckPath: /
    # Runtime deploys are explicit and follow the exclusive migration evidence gate.
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: reviewrouter-hosted-beta
      - key: NODE_VERSION
        value: 24
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        # Provision reviewrouter_web as a non-owner runtime role, then enter
        # its private URL during Blueprint sync. Never use the database owner.
        sync: false

  - type: web
    name: reviewrouter-api
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pnpm --version && NODE_ENV=development node scripts/install-private-dependencies.mjs --frozen-lockfile && pnpm db:generate && pnpm build
    startCommand: env -u SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64 HOST=0.0.0.0 pnpm api:start
    healthCheckPath: /health
    # Runtime deploys are explicit and follow the exclusive migration evidence gate.
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: reviewrouter-hosted-beta
      - key: NODE_VERSION
        value: 24
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        # Provision reviewrouter_api as a non-owner runtime role.
        sync: false
      # GitLab integration is API-only. Runtime/model credentials still stay in
      # the user's GitLab CI/CD variables.
      - key: REVIEW_ROUTER_GITLAB_API_TOKEN
        sync: false
      - key: REVIEW_ROUTER_GITLAB_API_BASE_URL
        sync: false
      - key: REVIEW_ROUTER_GITLAB_INSTALLER_TOKEN
        sync: false
      - key: REVIEW_ROUTER_GITLAB_INSTALLER_ADMIN_TOKEN
        sync: false
      - key: REVIEW_ROUTER_GITLAB_STATIC_REPOSITORIES_JSON
        sync: false
      - key: REVIEW_ROUTER_GITLAB_OIDC_ISSUER
        sync: false
      - key: REVIEW_ROUTER_GITLAB_OIDC_JWKS_URL
        sync: false
      - key: REVIEW_ROUTER_GITLAB_OIDC_AUDIENCE
        value: reviewrouter
      - key: REVIEW_ROUTER_GITLAB_RUNTIME_IMAGE
        value: ghcr.io/777genius/review-router-gitlab-runtime:v1

  - type: worker
    name: reviewrouter-worker
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: pnpm --version && NODE_ENV=development node scripts/install-private-dependencies.mjs --frozen-lockfile && pnpm db:generate && pnpm build
    startCommand: env -u SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64 pnpm worker:start
    # Runtime deploys are explicit and follow the exclusive migration evidence gate.
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: reviewrouter-hosted-beta
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        # Provision reviewrouter_worker as a non-owner runtime role.
        sync: false

databases:
  - name: reviewrouter-db
    postgresMajorVersion: "17"
    databaseName: review_router
    # This owner credential is reserved for the exclusive release-migration
    # job and must never be supplied to web, API, or worker services.
    user: reviewrouter_release_migration
    region: frankfurt
    plan: basic-256mb
    ipAllowList: []

envVarGroups:
  - name: reviewrouter-hosted-beta
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: REVIEW_ROUTER_ACTION_SESSION_SECRET
        generateValue: true
      - key: SUBSCRIPTION_RUNTIME_DEPLOY_KEY_B64
        sync: false
      - key: REVIEW_ROUTER_ENABLE_DASHBOARD_MUTATIONS
        value: "1"
      - key: REVIEW_ROUTER_ENABLE_WORKFLOW_PROVISIONING
        value: "1"
      - key: REVIEW_ROUTER_DISABLE_WORKFLOW_PROVISIONING
        value: "0"
      - key: REVIEW_ROUTER_DISABLE_ACTION_CONTROL_PLANE
        value: "0"
      - key: REVIEW_ROUTER_ACTION_REF
        sync: false
      # Rotating workflows are durably attested to an immutable Action release.
      # Keep the primary and bounded A -> B overlap separate from the mutable
      # general workflow channel above.
      - key: REVIEW_ROUTER_CODEX_ROTATING_ACTION_REF
        sync: false
      - key: REVIEW_ROUTER_CODEX_ROTATING_ALLOWED_ACTION_REFS
        sync: false
      # One operator-managed value is shared by every database writer. It is
      # fingerprinted at runtime and must never be emitted to logs.
      - key: REVIEW_ROUTER_DATABASE_RECOVERY_WITNESS
        sync: false
      - key: REVIEW_ROUTER_ACTION_OIDC_AUDIENCE
        value: reviewrouter
      - key: REVIEW_ROUTER_ENABLE_CODEX_ROTATING_OAUTH
        value: "0"
      - key: REVIEW_ROUTER_CODEX_ROTATING_NEW_WORK_ADMISSION_ENABLED
        value: "0"
      - key: REVIEW_ROUTER_CODEX_ROTATING_SETUP_ISSUANCE_ENABLED
        value: "0"
      # Revision-aware review v2 deploys additively. Writer capabilities are
      # enabled only after release attestation and an explicit cohort cutover.
      - key: REVIEW_ROUTER_REVIEW_V2_RUN_CONTROL_ENABLED
        value: "0"
      - key: REVIEW_ROUTER_REVIEW_V2_WORKER_ENABLED
        value: "0"
      - key: REVIEW_ROUTER_REVIEW_V2_CAPABILITY_ACTIVE_KEY_ID
        sync: false
      - key: REVIEW_ROUTER_REVIEW_V2_CAPABILITY_KEYS_JSON
        sync: false
      - key: REVIEW_ROUTER_REVIEW_RUN_AUTHORIZATION_ACTIVE_KEY_ID
        sync: false
      - key: REVIEW_ROUTER_REVIEW_RUN_AUTHORIZATION_KEYS_JSON
        sync: false
      - key: REVIEW_ROUTER_REVIEW_V2_PRODUCER_RELEASE_ATTESTATIONS_JSON
        sync: false
      - key: REVIEW_ROUTER_REVIEW_V2_PROVIDER_VOTE_LANES_JSON
        sync: false
      - key: REVIEW_ROUTER_REVIEW_V2_PROJECTION_POLICY_VERSION
        value: "review-projection-policy.v5-t0"
      # Cross-revision context reuse is fail-closed. Session and replay keys are
      # API-only; gateway identity is bound to each immutable producer release.
      - key: REVIEW_ROUTER_REVIEW_V2_CONTEXT_SESSION_SECRET_BASE64
        sync: false
      - key: REVIEW_ROUTER_REVIEW_V2_CONTEXT_REPLAY_ACTIVE_KEY_ID
        sync: false
      - key: REVIEW_ROUTER_REVIEW_V2_CONTEXT_REPLAY_KEYS_JSON
        sync: false
      - key: REVIEW_ROUTER_REVIEW_V2_OPERATOR_CREDENTIAL_SHA256
        sync: false
      - key: REVIEW_ROUTER_REVIEW_CONFIG_OPERATOR_CREDENTIAL_SHA256
        sync: false
      - key: REVIEW_ROUTER_DEFAULT_MODEL
        value: gpt-5.5
      - key: REVIEW_ROUTER_DEFAULT_EFFORT
        value: xhigh
      - key: REVIEW_ROUTER_OUTBOX_BATCH_SIZE
        value: "25"
      - key: REVIEW_ROUTER_OUTBOX_PROCESSING_STALE_MS
        value: "900000"
      - key: REVIEW_ROUTER_WORKER_IDLE_MS
        value: "5000"
      - key: REVIEW_ROUTER_WORKER_BUSY_MS
        value: "250"
      - key: REVIEW_ROUTER_WORKER_ERROR_MS
        value: "5000"
      - key: REVIEW_ROUTER_MAX_REPOSITORIES_PER_SYNC
        value: "250"
      - key: REVIEW_ROUTER_WEB_URL
        value: https://reviewrouter.site
      - key: REVIEW_ROUTER_API_URL
        value: https://api.reviewrouter.site
      - key: REVIEW_ROUTER_PUBLIC_API_URL
        value: https://api.reviewrouter.site
      - key: REVIEW_ROUTER_PUBLIC_WEB_URL
        value: https://reviewrouter.site
      - key: REVIEW_ROUTER_HOSTED_WEB_URL
        value: https://reviewrouter.site
      - key: REVIEW_ROUTER_HOSTED_API_URL
        value: https://api.reviewrouter.site
      - key: NEXTAUTH_URL
        value: https://reviewrouter.site
      # GitHub App OAuth/client/webhook credentials. Do not commit real values.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # Compatibility aliases kept for hosted readiness checks and future split
      # GitHub OAuth support.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
