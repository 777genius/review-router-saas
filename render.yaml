# ReviewRouter hosted beta Blueprint.
# Customer code review still runs inside customer GitHub Actions. These services
# are the SaaS control plane only: dashboard, webhooks, config/OIDC, health, jobs.

services:
  - type: web
    name: reviewrouter-web
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm db:generate && pnpm build
    preDeployCommand: pnpm db:migrate:deploy
    startCommand: pnpm web:start
    healthCheckPath: /
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: reviewrouter-hosted-beta
      - key: NODE_VERSION
        value: 24
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reviewrouter-db
          property: connectionString

  - type: web
    name: reviewrouter-api
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm db:generate && pnpm build
    preDeployCommand: pnpm db:migrate:deploy
    startCommand: HOST=0.0.0.0 pnpm api:start
    healthCheckPath: /health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: reviewrouter-hosted-beta
      - key: NODE_VERSION
        value: 24
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reviewrouter-db
          property: connectionString

  - type: worker
    name: reviewrouter-worker
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm db:generate && pnpm build
    preDeployCommand: pnpm db:migrate:deploy
    startCommand: pnpm worker:start
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 120
    envVars:
      - fromGroup: reviewrouter-hosted-beta
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: reviewrouter-db
          property: connectionString

databases:
  - name: reviewrouter-db
    databaseName: review_router
    user: reviewrouter
    region: frankfurt
    plan: basic-256mb
    ipAllowList: []

envVarGroups:
  - name: reviewrouter-hosted-beta
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: REVIEW_ROUTER_ACTION_SESSION_SECRET
        generateValue: true
      - key: REVIEW_ROUTER_ENABLE_DASHBOARD_MUTATIONS
        value: "1"
      - key: REVIEW_ROUTER_ENABLE_WORKFLOW_PROVISIONING
        value: "1"
      - key: REVIEW_ROUTER_DISABLE_WORKFLOW_PROVISIONING
        value: "0"
      - key: REVIEW_ROUTER_DISABLE_ACTION_CONTROL_PLANE
        value: "0"
      - key: REVIEW_ROUTER_ACTION_VERSION
        value: main
      - key: REVIEW_ROUTER_ACTION_OIDC_AUDIENCE
        value: reviewrouter
      - key: REVIEW_ROUTER_DEFAULT_MODEL
        value: gpt-5.5
      - key: REVIEW_ROUTER_DEFAULT_EFFORT
        value: medium
      - key: REVIEW_ROUTER_OUTBOX_BATCH_SIZE
        value: "25"
      - key: REVIEW_ROUTER_OUTBOX_PROCESSING_STALE_MS
        value: "900000"
      - key: REVIEW_ROUTER_WORKER_IDLE_MS
        value: "5000"
      - key: REVIEW_ROUTER_WORKER_BUSY_MS
        value: "250"
      - key: REVIEW_ROUTER_WORKER_ERROR_MS
        value: "5000"
      - key: REVIEW_ROUTER_MAX_REPOSITORIES_PER_SYNC
        value: "250"
      - key: REVIEW_ROUTER_WEB_URL
        value: https://reviewrouter.site
      - key: REVIEW_ROUTER_API_URL
        value: https://api.reviewrouter.site
      - key: REVIEW_ROUTER_PUBLIC_API_URL
        value: https://api.reviewrouter.site
      - key: REVIEW_ROUTER_PUBLIC_WEB_URL
        value: https://reviewrouter.site
      - key: REVIEW_ROUTER_HOSTED_WEB_URL
        value: https://reviewrouter.site
      - key: REVIEW_ROUTER_HOSTED_API_URL
        value: https://api.reviewrouter.site
      - key: NEXTAUTH_URL
        value: https://reviewrouter.site
      # GitHub App OAuth/client/webhook credentials. Do not commit real values.
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_CLIENT_ID
        sync: false
      - key: GITHUB_APP_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      # Compatibility aliases kept for hosted readiness checks and future split
      # GitHub OAuth support.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
