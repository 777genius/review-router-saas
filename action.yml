name: ReviewRouter
description: ReviewRouter pull request review runtime.
inputs:
  mode:
    description: Runtime mode, including hosted pool and repository-owned review strategies.
    required: false
  api-url:
    description: ReviewRouter API URL.
    required: false
  control-plane-url:
    description: ReviewRouter control plane URL. Overrides api-url when set.
    required: false
  provider-instance-id:
    description: ReviewRouter provider instance id.
    required: false
  workflow-schema-version:
    description: ReviewRouter workflow schema version.
    required: false
    default: "1"
  session-binding-id:
    description: Exact hosted pool repository binding identity.
    required: false
  session-binding-version:
    description: Exact hosted pool repository binding revision.
    required: false
  review-drafts:
    description: Allow same-repository draft review from pull_request_target.
    required: false
    default: "false"
  max-changed-lines:
    description: Skip review when additions plus deletions exceed this value. Zero disables the limit.
    required: false
    default: "0"
  review-timeout-minutes:
    description: Full review job timeout. The runtime reserves five minutes for cleanup.
    required: false
    default: "60"
  auth-json:
    description: Codex OAuth auth JSON.
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token for hybrid reviews.
    required: false
  openrouter-api-key:
    description: OpenRouter API key for hybrid reviews.
    required: false
runs:
  using: node24
  main: action-dist/index.cjs
